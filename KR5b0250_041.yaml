front:
  text: 靈寶玉鑑卷之四十三蓋九
  hash: sha256:18fd4608d58841574d9ad4ed049b216b4e5b089dea6577eb2edd173227573209
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_041-001a, image: hfl/0311/0311-099.png}
body:
  text: 錬度更生門五芽錬符青帝護魂符書符呪五行之主九氣司方青陽造化赫赫生精飛雲結篆風馬髙馴靈烟蕩瑞育化陽春木宫大惠鎮護肝魂謹召肝為青宫無英制魔君木精歲星之氣納化身中以生肝三魂處之木神九人神吏九千衆速降真氣營衛皮膚主其毛髮誦青帝歌曰東望重拜手蒼帝玉皇君靈風鼓槖籥育物布元春雲龍轡嚴駕玉衛擁瓊輪枯萌泛霑及大惠無不均萬仙歌以道委曲戒天人心根自固體拱跽戴洪仁白帝侍魄符書符呪白氣混沌三氣之神吐清入玄洞逹我身隂魂反陽朝晷蜉蝣七尸澡錬萬神侍迎金氣散輝全我清靈謹召肺為素宫白元營魄君少隂金精太白之氣納化身中以生肺七魄處之金神七人從吏七千衆治其身營衛筋骨主其牙齒誦白帝歌曰六甲抱金闕七政守靈壇流鈴擲火化威劒巨龍蟠邈彼素靈真明憲孰敢干束制妖鬼魔凜落霄風寒冷氣既巳息萬天俄而安真儔荷大芘抵顙相歌歡赤帝養氣符書符呪五氣運度泉脉貫通日運玄珠光透華峯三宮升降往來無窮赫赫陽晶萬物發生紫房混合九魂鍊純披朱始丹蕭仞劫臺謹召心為絳宮太一司命君太陽火精熒惑之氣納化身中以生左心左有玉童右有玉女䖍之火神三人從吏三千衆主治其中營䘙宫府主其魂魄誦赤帝歌曰太景開玉樞洞堂啓金除騫林䕃瑶砌丹鸞踏瓊株寶房名曲麗明璫神所居飛遊豁雲道引目盻真都天日永不夕重烟鎖清廬太上勑印開帕几羅簡書禆風𣗳玄化殷辛諒有餘黑帝通血符書符呪玄象變通結氣洪濛真元汗漫通徹三宫黑奕玉帝控馭飛龍沖妙元質至道難終謹召腎為玄宮桃康合精君太隂水精辰星之氣納化身中以生腎左有玉童右有玉女處之水神五人從吏五千衆主治其中營衛血骨主其生精誦黑帝歌曰無質統有物淵兮上帝心不啓不發道藴妙化機深恐是漏未盡隂想忽浸淫轉輪無滻波苦道長迷尋萬年嘗謹約一旦自湮沉無沖落鬼境殃譴不可任黃帝中主符書符呪渾沉冥始萬梵開張三天大有總制土中圎象黃官帝祚無窮三陽發生逸豫萬春謹召脾為黃庭常化靈君土精之氣納化身中以生脾處之土神一百人百神混合內外蓊冥返胎復嬰上朝帝君急急如律令誦黃帝歌曰萬天拱中晨控駕玉化根翹機貫億曆洞朗闢四門大有混皇真糾制星宿魂非帝道不運有方賴之存威忿即霜秋和豫為陽春生成握元紀仰荷戴無垠右五帝符焚訖念大梵隱語一遍取五方氣吹之次取玄元始三氣吹之次九天真氣定體次明亡者宿命因緣即當愛其形保其神貴其氣固其根終無死壞而得神仙骨肉同飛上登三清是與三氣㑹得九氣齊并也五府全形章先搯左手卯文云都功成東氣吹彈次搯辰文云興生轉西氣吹彈次搯三塗訣云可韓明南方氣吹彈獨𨽻遷北氣吹彈對魂聚魂公都聚魂攝中央氣吹彈焚玉諱畢即吹鬼門氣却東南氣吹亡魂即剔訣次再輪訣默念五帝真形作用氣訣搯辰文云紅杏存吹東方青氣九道在口運自己肝氣九道入口運肝氣交連訣吹彈搯坎文云墨黑存吸北方黑氣五道在口運自己腎氣五道入口相交連訣吹彈搯兊文云摩真存吸西方白氣七道在口運自巳肺氣七道入口相交連訣吹彈搯離文云櫗臘存吸南方赤氣三道在口運自己心氣三道入口相交連訣吹彈搯中指中云靈寶存吸中黃氣十三道在口運自己脾氣十二道入口相交連訣吹彈五道混合符禮氣五方訣歸中上元太一中元司命下元桃康守居泥丸安坐絳宮生官把籍無英公子玉符一告白元尊神五神合并呪曰太乙司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宮中理五氣混合百神急急如玉清上帝勑錬身返質符天上三竒離坎辰日月氣日月星本命訣孤魂子地有三竒辰午未本方氣乙丙丁訣人有三竒離中丑三神氣精田氣胎光爽本方氣三魂入符召靈幽精亡人名青帝合甲乙卯肝氣合護魂東氣吁赤帝合丙丁干心氣養氣合南氣呵黃帝合戊巳中脾氣中土合坤氣呼白帝合庚辛酉肺氣侍魄合西氣呬黑帝合壬癸子五氣周流通皿成人腎氣合北氣吹男形面左目曰魂呪右目月魄呪見前入陽符于內男形背女人背入隂符于內女形面右男符入十二經絡陽符女符入十二經絡隂符存用合氣聚魂於內焚于聚氣爐中勑呪六甲六乙錬汝我肝經生汝威力保養魂靈六丙六丁錬汝我心經生汝神氣保命長生六庚六辛錬汝我肺經大腸小腸萬氣潛冥六壬六癸錬汝我腎經精華盈溢骨髓安寧六戊六已錬汝我脾胃骨輕肉清長生久視急急如律令甲乙丙丁却穢生神戊巳庚辛正氣聚形壬癸生精復汝真形元始符命上升朱陵急急如律令天地冥靈天地同生五行所運甲乙丙丁乾坤坎離八卦凝神錬胎返初戊巳庚辛壬癸甲庚變易元身六甲六天符應萌明六乙𩀱曜六丙八焚六丁七晃戊巳中呈六庚三茁六辛四升六壬九氣六癸一成真王受命聚體成人全身九訣水火𩀱扃天陽地隂五氣成真道氣一變疾見真形吾奉玉清勑速降元氣成子丑寅卯辰巳午未申酉戌亥神甲乙丙丁戊已庚辛壬癸神十二真氣成十數全氣結變化五行降速逹玉清闕吾奉玉清勑速降元氣成錬身呪上元一真守固泥丸中元一真安神絳宫下元一真守衛命門三元齊景保命長存招靈致真坐降自然變形錬髓骨化成仙毛羽飛騰翺翔帝庭正錬呪亡魂首相具體全人是男是女骸變通神流火丹宮朱𨹧錬身玉眸南水黃華蕩形我身上告十萬神兵飛騰玉府升入帝庭又呪天地造化結氣為人左眼為日右眼為月耳鼻喉舌音聲上徹脾肝膽神常居五穴五行分主保衛形軀甲乙丙丁戊已庚辛壬癸神將速䘙速守急急如律令九錬符火錬丹界天尊流水之精錬而為胞符呪曰炎炎之精變而為英受錬亡魂升入無英九幽拔罪天尊昭火之精錬而為胎符呪曰九幽開度破滅三尸神魂受錬登升太微十方救苦天尊乘木之精錬而為魂符呪曰十方之氣聚而為靈亡魂受錬捨妄皈真逍遙快樂天尊柔金之精錬而為魄符呪曰寒池苦趣回景生蓮亡魂錬化快樂生天朱陵度命天尊合土之精錬而為臟符呪曰南閻洞浮流火之英亡魂受錬上升朱陵法橋大度天尊致坎之靈錬而為腑符呪曰虹橋架空接引昏蒙亡魂受錬天袂生風急急如律令轉輪聖王天尊昭離之晶錬而為竅符呪曰玉帝化仙氣聚為乾亡魂受錬玉景洞玄太乙救苦天尊激震之聲錬而為景符呪曰救苦慈尊拔度幽魂承茲錬化劫劫長存寶華圎滿天尊利兊之榮錬而為神符呪曰形神俱妙合景成仙功滿德就飛升九天師曰黃籙齊儀用符奏九道以黃𥿄朱書符墨書告文外用函如式符各隨天尊換九符奏式式內流水之精錬而為胞隨符換易具法位臣姓某謹據某開建無上黃籙普度大齊拔度某等魂出離隂府超證生方今則恭請三清臨御萬聖監觀依按沖科奉行治錬以今遵依法式啓録奏符仰冀流水之精錬而為胞所有真符須至頒告者空符右臣謹謹隨符上奏火錬丹界天尊几前恭望道慈特垂矜宥曲賜生氣灌溉某魂即得死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清臣下情無任戰栗之至謹奏太歲年月日具位臣姓某符奏日魂月魄水火變仙合同等符各隨水火錬後一一用訖錬至此巳遂更生無相法身不必再泥水火也所有朱陵度命等符並見給付不在重宣宣育魂呪神真無垠妙化之元左挾七魄右結三魂二十四真返復陽精流火受錬純化玉英上升南宫逍遙朱陵朝飲日暉夕奔月精灌沐東井足履丹雲上朝金闕遊宴玉京以神俱契與道合真玉嬰神變符玉訣祖氣玉嬰胎化玄元始氣乾靈坤母太乙天尊三寶帝君坤蠡乾寧虛皇符命九氣映明九天元氣玉胎分形混合生成孕結成真天清地寧神靈谷盈冲開九天現出具形三魂聚神七魄守靈上明三天下入九泉事訖歸元急急如元始虛皇律令披黃受道寶誥祖氣玉文靈寶玄壇今月日據齊主某祗建無上盟真玉匱黃籙普度大齊幾晝夜依按玄科作諸功德乞為開度某魂超升仙界以今冶錬亡魂所有披黃受道寶誥謹為告下者元始開運太玄肇靈虛極無象一氣流形化生二景五緯凝精混合自然怛除結嬰總真布景煥赫九清炎持廓奕七紀齊并祈師盧浩丹天耀晶朱光錬度赤藹散明三華欎秀輝映帝晨一如靈寶無量度人告命年歲次月日告下具法位臣姓某奉行右符五尺黃𥿄朱書束封焚於聚氣爐中知磬舉金闕化身天尊衆宣大呪飛玄紫氣凝靈根綱維玉虛總萬神空中欎勃浩自然上有楞層十二傳玉樓嵯峨耀景雲流精紫闕帶金軒瓊堂瑋鑠繞八騫中有青金九靈仙丹黃真母號精延飛青羽䙱晨嬰冠手持玉節握靈幡五色命魔對帝尊把持符籍當生門咀日嚼月吸醴泉離羅吐輝錬五魂內充外溢絳府欣金光煥煥形正圎從青入玄色純純唯有開明曉此言日五月十精北元刻見華蓋領仙君紫氣左回與斗運歷度四七入金門正是丹皇校萬仙有明此訣加精勤披形密思每令分妙景感㑹得要文三年當守保長存九年乘空躡景雲鳯衣輕翔升龍山俯仰九靈謁玉晨得為靈寶大真人仙化成人符𩀱乎玉訣祖氣宣三十天大劵別具於給符受籙門再入科髙功行升度之法內誦玉經告長生簡道衆宣呪死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清舉逍遙快樂天尊玉清生化保度天門寶符玉訣祖氣呪曰元始玉文保度亡魂上升朱府徑上天門魔王敬禮萬聖護迎玉清元命逍遙上清急急如元始速度律令生天度命法橋符右符引青黃白三氣於送亡時焚於橋前呪曰天尊大威靈八方開光道引領上亡魂升度此法橋右存二目交接紫光丹霞上應天尊寶珠之光下接亡魂上升天境師搯三五提魂訣發去次凝神太漠非色非空若有若無了無所著自然冥惠洞清大量玄玄也次送亡焚燎回向錬度壇式靈寶玉鑑卷之四十三
