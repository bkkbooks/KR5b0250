front:
  text: 靈寶玉鑑卷之四十一蓋七
  hash: sha256:55c5f8bcb7209173d1fd043816831916f9235fdaae205f848caf98b2a5281e92
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_039-001a, image: hfl/0310/0310-196.png}
body:
  text: 錬度更生門太隂混元化形錬法師曰混元合氣聚而成靈三元九氣周分十二在天則十二宫分野在人則十二經絡臟腑以應夫一身六隂六陽之形數也及其身謝之後魂魄汨喪形氣未完須假十二大將軍攝氣聚靈錬生真景全形復性洞徹陽光不墮幽隂徑登仙域矣召混元一十二氣大將軍符子文北氣謹召混元一氣六元運陽化隂大將軍楊元虎飛空變化攝召生氣奉為亡魂化生腎生精氣使精氣以通真午文南氣謹召混元二氣七變混景大將軍丁忠飛空變化攝召生氣奉為亡魂化生心生神生榮生志使神志以安寧震文東氣謹召混元三氣八徊合元大將軍丁遷善飛空變化攝召生氣奉為亡魂化生肝生魂生筋生血使筋血以流行酉文西氣謹召混元四氣九光㑹靈大將軍陳志元飛空變化攝召生氣奉為亡魂化生肺生魄生衛生皮毛使皮毛以合真申文中氣謹召混元五氣十合隂陽大將軍王先之飛空變化攝召生氣奉為亡魂化生脾生肌肉生意使四肢以固寧寅文東北氣謹石混元六氣十一變靈大將軍張固飛空變化攝召生氣奉為亡魂化生膀胱生水胞俾水胞以媾精巽文東南氣謹召混元七氣十二運化大將軍李淵飛空變化攝召生氣奉為亡魂化生小腸生水道使水道以通真坤文西南氣謹召混元八氣十三陽光大將軍申孚飛空變化攝召生氣奉為亡魂化生膽生津生汗使津汗以生成亥文西北氣謹召混元九氣十四運度大將軍周自然飛空變化攝召生氣奉為亡魂化生大腸生谷道使谷道以成形中文中天氣謹召混元十氣十五成隂變陽大將軍章修飛空變化攝召生氣奉為亡魂化生胃生水源使胃管以生津巳文東南氣謹召混元十一氣十六三景混成大將軍王卓立飛空變化攝召生氣奉為亡魂化生三焦生三宫使三景以達靈八卦氣訣謹召混元十二氣十七隂陽合靈大將軍鄭明飛空變化攝召生氣奉為亡魂化生胞絡總祝呪九天梵氣為之結形中有大帝慈悲惠生甚妙靈符魂魄返都千變萬化自有入無身心湛寂俱契玄珠萬劫難遇開關幽途受此隂錬魂登太虛急急如上帝律令混元十二經絡隂符入女返質符內化生腎符子文北氣玄色化生心符午文南氣赤色化生肝符卯文東氣青色化生肺符酉文西氣白色化生脾符中文中氣黃色化生膀胱符寅文東北氣墨色化生小腸符戍文西北氣玄色化生膽符巳文巽氣緑色化生大腸符酉文西氣白色化生胃符中文中氣芬色化生三焦符巳文東南氣青赤色化生胞絡符八卦氣訣混元十二經絡陽符入男返質符內化生腎符子文腎氣祝呪一氣之化神以通靈千神左衛神氣混心以氣之聚神之最靈混合六神以生腎經身自運水大道生明亡魂受錬返故復生急急如玉清上帝𠡠唵三慕哆之化生心符午文心氣祝呪萬火為主急木魔王一之而定𠡠下無當赤宫之帝聚氣為王散亂無動百神歸降千神守護一體定康亡靈受錬上升玉堂急急如玉清上帝勑唵嗏輪西那尼化生肝符卯文肝氣祝呪水官之德脉氣如泉魄氣結聚魂精相連青氣葱秀仁道歸乾百骸之首肝腸為先神凝精聚氣化成仙亡靈受錬時刻升遷急急如玉清上帝𠡠唵囉咬囉哆呢化生肺符酉文肺氣祝呪魂精魄靈肺腑之生百丞之轉萬魔不干一白之氣混合肺房長衛生氣真道勿忘玉樓相貫金室通光亡魂受錬升入天堂急急如玉清上帝𠡠唵你剌般唎哆化生脾符中文脾氣祝呪上帝有勑百魔敬聽飛神御化一氣之生帝君有命𠡠下中黃安鎮榮衛肢體光鮮魂魄受錬五臟生光亡魂變化升入福鄉急急如玉清上帝勑唵曳都翳曇化生膀胱符寅文膀胱氣祝呪隂陽二氣四聚接靈魂魄歸府一真湛凝青黑之氣交結膀胱鎮於靈府毫竅混康玉清接景混丸附陽亡魂升度鍊質南昌三魂安泰大道生光急急如玉淸上帝勑唵叱地叱陀尼化生小腸符戊文小腸氣祝呪三皇之天主氣小腸通流府內真氣混康赤白之氣二氣交從結成腸府與胄相通大小合度纒絡和中亡魂鍊化變體易容急急如玉清上帝勑唵莬㘕懴囉呢化生膽符巳文瞻氣祝呪三氣合景三皇附身通徹表裏百神安寧靈光所聚神氣混常鎮於膽府赤文交光精魄自度魂形堂堂錬化表裏玉眸垂芒急急如玉淸上常勑唵離波那哆耶化生大腸符酉丈大腸氣祝呪人命人氣人精合凝中皇之靈日月天生上帝有令永鎮腸經黑白二氣回生大腸混合表裏一體同堂光燦萬域六盤五陽亡魂受鍊易景反容急急如玉清上帝勑唵婆含羅吽尼化生胃符中文胃氣祝呪三官朝拱太一守房六府俱㑹遍體流光黃演之氣胃管生津安神鎮宅一體生明魂神歸伏神真納靈開通胃管大道混成急急如玉淸上帝勑唵嚧吽叱唎哆生三焦符巳文三焦氣祝呪三焦列布五神共歸赤天有命升降無為淡白之氣化神無藏咽液生津往來溫昌重樓通景百節順張亡魂受錬俱得更生急急如玉清上帝勑唵嚧吽吽唎吒化生胞絡符辰文胞絡氣祝呪帝君勑下飛攝大魔神精氣聚急鍊陽和黃白之氣胞絡成形五行所運一體光明神寧魄靜靈氣聚英亡魂受鍊與道合并急急如玉清上帝勑唵呼聚吽離叱右十二符運一氣梵語書成小樣入返質符內用默呪曰唵琴尼勑地喃嚧知磬舉回形轉化天尊髙功入科回骸起死符玉訣光氣萬文一氣成符神霄十八大洞玉符生胞符子文存天中黃霧之氣化生胞元紅地白書謹召神霄生胞元常君字秋夫從官符吏飛空變化攝召生氣奉為亡魂化生胞吾奉玉清勑速降元氣成次存寶珠一顆飛入胞元結成胎中有青衣將軍二人真王有命鍊化重泉胞元宣通與道自然死根斷絶下鎮靈淵真氣化生與天齊年生胎符午文天中玉華之氣白地朱書謹召神霄生胎含生君字寅和從官符吏飛空變化攝召生氣奉為亡魂化生胎吾奉玉清勑速降元氣成存真氣如月透明中有一真人執芙蓉五帝宣符鍊化胎元洞陽妙氣永鎮靈仙混一變化柴戶升仙生結符寅文天中瑤光之氣黃地丹書謹召神霄生結九華君字彥遐從官符吏飛空變化攝召生氣奉為亡魂化生結吾奉玉清勑速降元氣成存胞胎脉絡纒結中有繡衣將軍一人玉清元化冥應十天保度隂户去結解纒靈光下注映煥無邊生節符卯文天中玉光之氣黃地白書謹召神霄生節香浩君字空猷從官符吏飛空變化攝召生氣奉為亡魂化生節吾奉玉淸勑速降元氣成存白衣將軍一人化生其中靈寶妙氣融節通真三十二天演化無垠體洞玉光內固真精鍊化自然與天齊年生腎符子文北方黑霄之氣白地黑書謹召神霄生腎大淵君字求都從官符吏飛空變化攝召生氣奉為亡魂化生腎生耳生膀胱吾奉玉清勑速降元氣成存胞胎中化生兩腎津水盈溢中有黑龍黑龜上有一嬰兒大明萬寶鍊化生身死魂受化腎神太淵合命對生求都萬全有粹凝精上步玄天生目符卯酉大日月光氣白地青書謹召神霄生左目通光君字玄真生右目神嬰君字隂精從官符吏飛空變化攝召生氣奉為亡魂化生兩目吾奉玉淸勑速降元氣成存胞胎中日月煥明中有朱衣童子素衣少女各一人真王有命日月無停帝君宣化錬生萬神光澄六合交映合明混生自然上升玉庭生心符午文天中絳霞之氣謹召神霄生心玄珠君字玄玄從官符吏飛空變化攝召生氣奉為亡魂生心生榮生志生小腸生水道吾奉玉清勑速降元氣成存童子三人披朱衣跨赤龍虛明應體大象具靈應感無方示見杳冥神光自生真淵朗澄洞景長生天君泰亨生舌符寅文天中絳雲之氣黃地朱書謹召神霄生舌騰陽君字正生從官符吏飛空變化攝召生氣奉為亡魂化生舌吾奉玉清勑速降元氣成存華池淨泓內生金蓮一朵蓮上金光真人玉清靈景普化真元舌神騰陽萬寶普宣養神通命上生金蓮紫氣育根浚發靈源生肝符卯文天中清霞之光謹召神霄生肝青帝君字孟光從官符吏飛空變化攝召生氣奉為亡魂化生肝生魂生膽生智吾奉玉淸勑速降元氣成存青玉宫中有九人前一人乘蒼龍玉淸玉符化生自然魂藏肝腑上生九天升度鍊真億劫無邊公子執符天地合仙生肺符酉文天中黃雲之氣黑地白書謹召神霄生肺皓洞君字季成從官符吏飛空變化攝召生氣奉為亡魂化生肺生魄生鼻生大腸生皮毛吾奉玉淸勑速降無氣成存素衣玉女七人前一人騎白虎玉天無翳兌象孕明華蓋七蓮真人素成白無受符下覆黃寧金景洞化仰餐流晶生脾符申文天中玉光之氣白地黃書謹召神霄生脾紫庭君字延年從官符吏飛空變化攝召生氣奉為亡魂化生脾生胃生意生肌肉生四肢生津生谷道吾奉玉清勑速降元氣成存黃元老母白首黃衣立金光中高上玉文化生紫庭表裏洞徹黃中固真玉符宣召混合百神錬化空景度魂王京生腦符申文上天寶光之氣白地赤書謹召神霄生腦泥丸赤文混洞君字噓噓從官符吏飛空變化攝石生氣奉為亡魂生腦吾奉玉清勑速降元氣成存泥丸玉房中光明洞照中有三人玉貌天衣空梵聚真萬神㑹靈洞煥晨景八窗啓明混合周流䇿虛紫庭建性空朗飛神上京生隂符子文天中黑雲之氣黑地朱書謹召神霄生隂續命君字伯强從官符吏飛空變化攝召生氣奉為亡魂化生隂吾奉玉清勑速降元氣成存水波中瑩然下有一人玄衣緋裳淵淵湛玉分配隂陽玄光映月靜景凝霜洞化有神厥字伯强亡靈蒙度上生天堂生命符子文天中月光之氣白地青書謹召神霄生命正中君字長生從官符吏飛空變化攝召生氣奉為亡魂化生命吾奉玉淸勑速降元氣成存胞胎潤澤秀孕轉動中有朱衣真官一人執筆簿髙上帝命玉符生成天景良賦受命長生保固天根回隂起陽太乙守元玉梵生光生血符寅文天中赤雲之氣青地朱書謹召神霄生血中幽君字良弻從官符吏飛空變化攝召生氣奉為亡魂化生血生毫毛吾奉玉淸勑速降元氣成存火雲中有赤衣一人將軍真王玉文化景生尸黑帝通血流行四肢歷功日久變赤凝脂鍊質南宫登升太微生精符子文天中黃白雲氣青地朱書謹召神霄生精元除君字祝祝從官符吏飛空變化攝召生氣奉為亡魂化生精生汗吾奉玉清勑速降光氣成存玉殿中金鼎白光中有素衣將軍一人立中玉淸洞陽生化元除內外充溢表裏洞虛永劫長存安鎮帝居神升朗逹榮固天符生氣符酉文天中三色之氣謹召神霄生氣無央君字毳毳從官符吏飛空變化攝召生氣奉為亡魂化生氣生三焦生百脉吾奉玉清勑速降元氣成存素衣玉女乘白氣光充滿天地髙上大道妙化生三氣形神具天地咸寧梵景長存祖氣流行功成道備上升玉清生神符寅文天中白光之氣青地朱書謹召神霄生神天生君字靈父從官符吏飛空變化攝石生氣奉為亡魂化生神吾奉玉淸勑速降元氣成存胞胎中嬰兒完備上升頂上赤府百神擁出現太空中形相端嚴玉清寶符混合百神生成妙體守真㑹靈變化自然上升帝庭師行九轉生神之道知磬舉回靈養素天尊靈寶玉鑑卷之四十一
