front:
  text: 靈寶玉鑑卷之二賴三
  hash: sha256:8fc2adf4f3c6360e4e51008e05075ecc589159e0b0b214c2d6063c8e1ea269c0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_002-001a, image: hfl/0302/0302-047.png}
body:
  text: 齊修節次門夫道妙淵微無文不度既明師㫖道不虛行況靈寶祖氣統應萬天普資群品古今弘化生死依憑其於垂教度世之科則有條緒必先致詞于髙功法靖投命主行蒙師允從剋日修建宜先飛奏三天告盟十極次第請立章奏符籙等局及內外與盟之士齊戒沐浴嚴潔衣冠秉志同誠整儀備物一月以前預奏天省關告攸司㸃檢奏章作用符籙此後輪集道衆接濟幽冥設像敷壇誦經禮懴或十回經法或九轉生神正發奏申啓聞穹昊隨其功力次第舉行大凡修建善緣實由主職務要正心誠意通玄究微外著威儀內明性道庶得人天仰賴幽顯瞻依有感必通無逺弗届若夫道法精微之妙豈易量哉原自溟涬大梵寥廓無光一氣肇分玄黃有象故天輪地輿以象之二儀定位三景開明日月星辰運行天紀故分燈列炬以次之五行列布萬範開張陽降隂升合和有道故鳴金振玉以次之將迎輦輅用潔氛葩風伯清塵雨師掃灑故敕水禁壇以次之四氣清朗萬天圓明感格神祇通達誠悃故啓聖祝白以次之輔翼壇陛各有攸司是用慰安庶便召役故建立諸司以次之十類孤魂九泉滯爽設其方域奠厥攸居故寒林茭郭以次之神龍驛吏可達重泉玉簡金符必資驛傳故祭祝龍吏以次之恢弘道德開化人天主善為師惟德是輔故建幕啓玄以次之修齊行道謁帝朝真陟降有嚴進止無怠故設官分職以次之各恭乃事母曠厥官約誓三官結盟五帝故列職結盟以次之防非止惡間邪存誠不愆不忘是彛是訓故演道十戒以次之威儀抑抑為德之隅動用周旋勉其母忽故科禁罰簡以次之將行宿啓靡不有初啓告師真導達忱敬故啓奏師幕以次之捲簾趨陛禮聖朝元禮具君臣敬存內外故捲簾化境以次之三壇同墠萬神所崇環拱虛皇總朝上帝故建壇宿啓以次之飛神謁帝達悃通誠請氣降光拔亡赦罪故進拜章表以次之一真凝篆梵氣成文普告十方開光長夜故頒告符簡以次之羅酆岱嶽拘制死魂隂府冥關實由主者故進供冥官以次之元始祖氣靈寶妙光化度幽冥停囚罷對故然燈破獄以次之以氣合氣以神㑹神洞煥一真普攝諸有故追攝魂魄以次之魂來格宿念猶存滌垢蕩形全神復相故列幕敷化以次之三光妙氣五香蘭湯灌溉形神宣明妙本故沐浴淨穢以次之未忘有相宜服真衣禮貌端莊躬朝三境故更衣朝參以次之五廚妙饌八味珍羞變化無方充足有念故呪食獻供以次之聞經聽法滯魄沉魂悟道登真旋資濟度故施食接濟以次之建齊云始循序而行翌日朝修厥有常典夫朝修者一日有三從三至九九詞九表九懴九符外則合其威儀內則盡夫誠敬修齊進膳說戒傳符證果登真斬尸度户天神納庫大洞回靈衆誦玉章髙功內用次立水池火沼上合日精月華監真度生制魔保舉生成之鍊合九既濟之呪惟三蛻質生仙更生再造孕聖胎於虛谷升陽氣於玄關受道披黃超凡入聖然後解壇散席進簡投龍謝玄送師還官納職酬恩設醮贖命放生是宜酌古準今通前繼後由內逹外推巳濟人倘或缺違尚資葺補凡我同志可不勉哉大齊資次齊官先致詞投禮髙功法師壇下髙功備詞飛奏三天門下省請立章奏局符籙局普度局再飛奏三天門下敷奏金闕帝師頒下合屬知㑹第三飛奏三天門下定拜章日期停風止雨次發預奏文檄一宗繳發甲帳揚立四境神幡立神虎堂里域司接濟孤魂啓發奏狀一宗揚立告盟幡回黃幡遷神幡或禮朝天懴九幽懴誦念十回度人九轉生神關祝開通五路神燈建茭郭資次道衆雲集建茭郭所知磬舉尋聲救苦天尊衆和四聲表白吟水偈次吟香偈祝白啓聖再吟開光偈知磬舉玉寶皇上天尊髙功衆官至東門表白宣白文吟偈次至南門知磬舉玄真萬福天尊表白宣白文次吟偈次至西門知磬舉太妙至極天尊表白宣白文次吟偈次至北門知磬舉玄上玉晨天尊表白宣白文次吟偈次至中央知磬舉超凌仙界天尊表白總白文髙功持呪衆和上生天堂道衆旋繞誦救苦經華夏引至道場所揚立青玄寶蓋回耀幡開啓分燈制器立壇祝龍吏道衆雲集師堂掌禮引齊官上香三拜歸位侍爐引班至壇前侍爐引班左旋天輪燈壇匝繞知磬舉度人無量天尊和一聲髙功舉宣偈曰元始洞玄靈寶本章開演至教十回度人每句一和次懸下三十二天幡蓋黃幡一首知磬舉隨方救苦天尊和一聲髙功舉宣偈曰太上道君敕付昆崘神符一下拔度死魂每一句一和次懸下二十四獄幡蓋中紅幡一首髙功至地户立變神步罡灑水次召四靈君及本法官將表白宣借地牒髙功誓將噀水下令掌禮引齊官至東方上香髙功詣東方下本方借地符并壇令知磬舉志心皈依信禮和東方九氣天君表白宣東方借地符髙功宣東方壇令次詣南西北中並同東方髙功上洞案香歸位各官皆歸位知磬舉三光朗照天尊髙功致詞拜請光表侍燈宣分燈科道衆宣明燈頌次㸃燈侍經宣制鍾磬科召將如式知磬舉玉清蕩穢天尊和一聲掌禮引齊官上香髙功跪奏拜解穢表詞懴宣表髙功遣伏如法舉焚表頌都講變神步罡召將表白宣解穢牒都講敕水淨壇結界如後用立壇儀此處不必禁壇若不立壇髙功就此行禁壇法知磬舉啓堂頌髙功上洞案香掌禮引齊官上香三拜知磬舉按人各恭敬次知磬舉皈依三寶頌次舉道場衆等執簡當心開啓如法表白祝香開啓宣白齊意掌禮引齊官上香三拜至此如建虛皇壇節次見立壇科知磬舉唱道侍爐引班華夏繞廊燒香都講舉各禮師入科如式即立虛皇壇儀請三寶髙功召將步斗禁壇上各門榜額依科行事如不立虛皇壇止於祝白開啓後侍爐引班出建監壇外六幕次懸九天寶蓋揚立建壇幡或於此祝龍吏亦可次侍爐引班回道場所知磬舉小出堂頌舉向來回向引至師堂掌禮引齊官三拜知磬白開啓事畢衆官復位次起圓揖發神虎玉札道衆雲集神虎壇髙功灑淨變神步神虎罡關召神虎諸將表白念玉札三獻文宣玉札告文關牒髙功噀水步斗遣玉札官將次以新扇扇玉札數扇灰隨扇飛揚見北斗靈光洞照十方三界髙功存用誦經向來回向建壇資次道衆雲集師堂掌禮引齊官上香三拜次髙功詣師前上香復位知磬舉按人各恭敬表白出班上香至髙功前展拜就跪侍職亦可代齊官致詞或疏請師升壇髙功答允表白致詞謝允次壇歸位知磬舉修齊請真師次舉雲輿頌知磬舉香林說法天四聲髙功拈香圓揖髙功次指座法語升座祝香演道衆坐聽敘謝下座知磬舉玉清蕩穢天尊和一聲都講舉蕩穢呪知磬舉金真演教天尊和四聲侍爐引班詣二師幕前序立知磬舉按人各恭信髙功跪奏請二師知磬舉修齊頌雲輿頌次請二師頌髙功再致詞啓玄表白宣表次請五老幕三官幕靈寶三師幕正一三師幕監齊幕各幕知磬舉修齊頌次舉雲與頌請頌表白宣表知磬舉總焚表頌侍爐引班至二師幕前序立髙功致詞補職表白宣補職科列職拜跪直壇分職簡列職各受簡三拜歸班序立詣三官幕表白宣結盟狀次歸二師幕序立都講舉衆官各各首體投地默禮十方方各一拜從北為始禮足周回十方𧆛誠受戒次髙功正面鳴尺說十戒科知磬舉智慧頌髙功說戒畢奉戒頌都講唱衆官平坐宣禁威儀科髙功宣科禁罰簡監齊致詞掌禮請齊官上香髙功建壇啓奏知磬舉唱道侍爐舉華夏贊次引班燒外廊香至簾前髙功齊官上簾前香三拜跪奏拜通真表次表白宣表髙功致詞告化境符詞懴宣符髙功祝符呪次白捲簾文知磬舉稽首虛皇法事直壇捲簾髙功齊官三拜知磬舉金容玉相天尊次至三清前髙功上三境香知磬舉信禮三清號侍爐知磬引髙功向前次都講依次入都門至地戶入髙功入戶呪並依次第升壇至立定班序次上十方香知磬舉信禮髙上九氣天和東方太上靈寶天尊次舉東南南方西南西方西北北方東北上方下方知磬次舉燒香頌髙功至洞案三上香三祝呪存用歸壇跪爐祝呪焚符都講舉各禮師髙功宣衛靈呪都講唱鳴法鼓二十四通髙功發爐都講舉髙功檢閲吏兵出官如法髙功出官都講舉各稱法位髙功入建壇科知磬知爐交舉志心皈命十方天尊號日間自東始夜則自北始知磬次舉禮足各䖍誠悔懴都講攝十方天尊坐懴次知磬舉步虛三啓三禮知磬舉真文安鎮天尊髙功跪奏請真文掌禮引齊官詣東方上香跪拜侍爐引髙功詣東方知磬隨行舉東方九氣天君和一聲知磬次舉東方真丈請師安鎮髙功宣東方安鎮真文呪次詣南方西方北方中央並同前次舉金龍安鎮四聲或於此拜章都講舉再稱法位髙功再入科詞懺宣詞髙功拜伏焚詞知磬焚詞頌髙功伏詞起再入科代謝知磬知鍾交擊金玉知磬舉玉符赦罪天尊掌禮引齊官上香髙功奏請符告行救苦符九龍符破地獄符拔幽魂符流光符勑赦籙巳上諸符乃拔度幽冥者必合於此頒告九朝諸符皆升度之義必合在朝奏時告詞懴跪宣前件符籙髙功宣各符祝呪髙功次召將宣符關髙功執水盂面外默遣存用知磬舉遣符呪衆和掌禮請齊官面外拜直壇焚簡符化龍童知磬舉逍遙快樂天尊回身朝內次舉十二願都講舉存神攝香髙功復爐知磬舉出堂頌旋繞下壇侍爐引班詣二幕髙功奏謝表白回向都講舉監齊彈紏監齊詣幕跪奏知磬舉道經師寶天尊次詣正附列幕開啓諷經次歸師堂掌禮請齊官上香三拜知磬舉皈依正道頌次舉建壇事竟衆官圓揖拜章資次如不另拜不必豹此道衆雲集師堂髙功上香掌禮引齊官上香三拜歸位知磬舉玉清蕩穢天尊都講舉蕩穢呪清道灑淨知磬舉金真演教天尊章表二人捧章案迎出侍爐舉華夏引班迎章同行至祭章所髙功上香掌禮引齊官上香三拜次知磬舉步虛法事法師一員祭章三獻知磬舉三獻法事詞懴宣疏次引班至壇前髙功於地戶上序立髙功灑淨變神步斗髙功仗劒至天門向東南西立表白隨髙功至天門宣結界呪侍職隨方焚結界符髙功表白侍職次第至天門地戶人門鬼路方噀水焚符宣呪次歸位序立知磬舉唱道侍爐舉華夏引旋繞燒香髙功至洞案三上香髙功歸位跪爐三拜侍者取章度與髙功四方心拜存用髙功以章付侍者歸案上都講舉各禮師存念如法髙功宣衛靈呪都講舉嗚法鼓二十四通髙功發爐都講舉重鳴法鼓髙功出官都講舉具稱法位髙功稱職啓聖入科表白詣髙功前跪受副本詣帝前宣章髙功捧章拜露章意至宣章畢作用封章髙功次捧章就跪遣官捧章詣爐熏章髙功念五色之烟呪一舉一和召將宣關道衆迎章出焚髙功運神步九靈罡法拜伏知磬舉焚章頌舉五帝大魔呪道衆伺立待髙功拜興以聞次舉和寶章以聞三聲知磬舉旋步雲罡上髙功納官若拜章在建壇前於此頒告虛皇十二符若建壇在拜章之前則拔度諸符亦合在此頒告知磬舉玉符赦罪天尊髙功跪奏請符詞懴宣符髙功宣祝符呪知磬舉遣符呪次舉十二願都講舉存神燒香髙功復爐知磬舉出堂頌次舉向來表白回向侍爐引班歸師堂知磬舉道經師寶天尊知磬舉皈依至道云掌禮引齊官上香三拜次舉進章事畢衆官復位衆官序揖供慈尊二帝十王聖齊資次或開啓後供道衆雲集青華堂知磬舉步虛監齊攝行進供科至謹當奉請次道衆各一員分左右班逐一位請十王自下而上志心奉請酆都宫泰素妙廣真君惟願暫離冥府來赴凡筵鑒享齊羞慈悲開度和風馬雲車來臨法會髙功跪請地府次東嶽太乙依式髙功白云向伸奏請慈尊二帝十王真君既沐聖慈降臨齊座專誠上香謹伸進供知磬舉散花法事道衆旋繞簇爐知磬舉人各恭敬志心稽