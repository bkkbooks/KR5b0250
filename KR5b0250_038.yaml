front:
  text: 靈寶玊鑑卷之四十蓋六
  hash: sha256:6f6999ebc6db2fd491444f400162ce3bd58bf465b975c2d925103da9eb6e43c0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_038-001a, image: hfl/0310/0310-164.png}
body:
  text: 召主火大將軍內錬符午文南氣髙功再入火錬科知磬舉玉眸錬質天尊謹召主火大將軍趙仲明速至壇所合氣錬魂右神紅袍金介胄緑仙帶自南方乘雲而至師吸氣歸中化作金字以陽斗訣發此字於火沼中光明洞煥如天邊曉日之狀受錬衆魂俱入日中玉眸錬質呪曰陽晶隂耀洞煥五行䢫符降氣冶錬隂魂知磬舉玉眸錬質天尊髙功鳴召主火大將軍立降真火冶錬亡魂立降真火符三天內諱左右天府天相天梁天北帝敕行日月同天樞天機君度長生大君度金鳥紫氣日景注生大帝度騰耀流晶圓明高奔停午融和鮮吁欎儀居中萬象育童內明正化流鈴八衝右符寅加卯卯交寅風火交午文出南氣三息存日中丹華金光化為流火神庭冶錬亡魂衆和玉眸錬質天尊宣主火呪南方主火神駕景擲火鈴奔飛耀南樞交氣媾生津炎晶流金光冶錬隂死魂復歸元始氣再返天地根流金以滅奸邪穢悉然焚洞觀無礙法自得保真身玉符召主將急急速來臨太玄妙氣主掌炎烟造化玄爐真魂陶埏主火成胎景象自然變錬隂户準令上天急急如律令入火沼正錬移幡於火沼邊火錬正符午文南呪曰南閭洞浮流火之庭玉眸詵詵流火之膏刀利禪猷婆尼靈童流火之質玊眸真容升入福堂洞陽之宫太陽火錬符午文離氣三景流輝招搖炳煥九氣列正台真洞明魑𩲕熒熒隂陽混凝光彩合璧景耀玄衢乾象回靈萬氣齊并呪曰南方之君赤氣之精熒惑使者丙丁將軍朱雀炎神赫赫陽晶五行造化萬類發生天帝有勑光徹幽冥急急如太陽帝君律令火錬血尸符午文南氣呪曰玉眸錬質拔度幽冥玉文一下氣魂飛升玉眸錬質符呪曰太一錬質九步八魁行罡七轉內外合成三台子午絳官受真符錬萬靈赤火降心辟除惡毒往來俱榮圵都曲府離合上清大洞自然風火無停日光錬神符太陽氣訣右符存合童陽君日光紫色叩齒二十四通呪曰陽晶巳通飛光巳新皇芝流溢䕃注內纒仰餐流晶芳華未臻宫宅開張蕩洗囂塵體映玉光面發金真雲飛禹步上造日門急急如太陽帝君律令勑火九錬返生符九道一符午文四光呪曰真王元命勑下九天火錬神魂天一舍生太陽洞照體合自然急急如律令二符未大日光呪曰九天真景元府錬魂火降帝勑出離幽隂三氣合德五緯回靈生尸鑄魄永劫無傾三符申文日光呪曰司命聖真帝君受靈三皇有道錬魄錬魂上生南斗落死圵陵真光煥發面禮玉晨急急如律令四符酉文日光呪曰四象咸㑹九陽生成太玄流光日曜易形空乘太霞受錬生神急急如律令五符戍文日光呪曰南宫流晶真火變靈五行畢備萬象通明魂魄合錬神化玉瓊飄飄太霞升入無形六符亥文日光蓋六六呪曰皇天真命九度元明上道玄育陽和太靈六氣互發速錬死魂神飛玄景與道合并急急如律令七符子文日光呪曰天地大化七氣兆成三光返質幽滯咸升光達無垠急急如律令八符丑文四光呪曰靈寶符命普化幽冥八景交映氣體輕清魂魄受錬隂陽混凝解結散滯十轉回靈九符寅文日光呪曰九光統化萬象滋榮受錬太陽魂淨魄寧以道為體與日同明髙奔泥丸升入帝庭急急如律令知磬舉玉眸錬質天尊次舉偈云南上朱陵府丹天流火庭玉眸錬形質魂魄即返生和玉眸錬質天尊火錬合同符右符左手自午順巡至寅蓋火錬九符自午旺處歷未申至寅長生處九位合同錬魂呪曰天帝命章陽光日行璇璣運轉八極齊臨合同大錬玉眸上生急急如好生大帝律令火錬變仙符午文南氣存太陽流晶灌錬亡魄內合大德火鈴火鈴五星星君將軍童子真君九氣五方五嶽天火熒惑太上犬人五帝大文地火將軍符命南昌火府上仙普度䢫願大神錬度靈童沉淪往生上帝火錬符命真形呪曰火池炎精錬質成真五臟經絡返生其身徑升三天面禮玉晨金液錬形符祖氣玉訣右符咽液一口過肺流金之鄉意納中宫灌錬呪曰金液錬形與道合真開明三景是為天根無幽無極無始無終元皇九醜靈魔絳宫紫氣飛天身乘六龍水上火下流入三宫神歸陽明大道自通急急如律令天罡玉字本呪訣呪曰罡星正氣纏筋貫骨上透泥丸開陽𡺚崒右符左手飛斗一座杓指前光芒閃爍即吸氣咽下元宫過尾閭上升迸頂門出合氣書符䢫斗所轉陶鑄隂陽萬化莫能外比錬度時焚於聚氣爐中上清九斗陽芒火鈴炎精真符太陽訣先書南方朱陵帝君次書符於上炎神炎神上通紫極下徹黃泉火鈴火鈴却妖錬魄赤帝之靈炎精二神錬形易質魄返魂昌三台流光萬妖殂落乘烟飛揚上元天官中元地官下元水官天蓬大元帥天猷副元帥黑煞翊聖真君真武佑聖子丑寅卯辰巳午未申酉戍亥真君十二時辰主者鍊度亡魂急攝精神一得洞入火鄉吳天有勑混合九氣總契虛皇流金震芒九天焕落天府天相天梁離㫖火天貞利無疆天同天樞天機尊勝掐訣以陽錬隂急急形神不凋急呪曰炎精二神化身流火錬體變形乘烟飛揚混合九氣洞入火鄉誅絶妖精殺滅不祥聞我火鈴魔鬼消亡按五合度保命延昌上帝有勑返形太陽急急如上帝勑祖道玄真隱呪祖道玄真烜赫正神欎儀錬質熒惑操形赤明和陽理禁威靈耀明宗飄帝重光明戊巳之英中央鎮星排蕩邪氣破滅媱精海達之沸木逢之燼火逢之空金逢之鎔長離之主統攝飛行迷尼奴那唵唵吽吽東海青童總括張羅迷尼奴那唵唵吽吽急急如律令右符先存中氣上透泥丸次書符引太陽氣吹布丹砂筆硯精思上宫赤氣中有赤帝吐絳光三道入兆頂中灌神府洞明如日三台蓋頭存日中炎精二神長三寸丹衣赤金冠以兩目晴光相合作火光二道吸引入符焚符時念前隱呪存兩眉之間直入三寸分為二路左有絳臺青房右有黃闕紫户左神名正心右神名平靜狀如嬰兒從泥九透出漸長丹衣赤金冠各執流金火鈴洞煥流火冶錬亡魂太上梵氣符玉訣祖氣師執幡行交錬法呪曰天一生水亥入子地二生火巳入午水火交錬子午至子自然成真玉文內應凡三遍作用念呪第三遍接後呪真中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙焚幡换變仙幡見幡蓋門師舌拄上腭自中運祖氣下丹田過尾閭上透泥丸化成元始上帝內誦中篇一遍心腎二氣相交水池火沼錬化形神清淨俱入洞陽流火之中焚錬有生以來有為之身悉為灰燼存性次存灰燼中微有一縷真氣如露珠即是太極以前一㸃靈明中和之性密呪曰大行梵氣周回十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人呪曰次搯訣天一地六水德為精坎離訣氣地二天七火出為神離坎訣氣天三地八返魂育嬰震兌訣氣月精地四天九再生魄靈兌震訣氣月華天五地十五行生成中中黃氣天一地六水德為精子地二天七火出為神午天三地八木德為魂卯地四天九金為魄靈酉中黃正氣五生十成中天地造化自然成形水火既濟五行合并死魂受錬仙化成人天一地二水火既濟天三地四精神交㑹金木交氣魂魄隨至天五地十土旺四季五行畢備受錬更生陽升隂墜各從其類南昌度魂注生録事九天監生萬神復位急急如靈寶度人律令默呪元始符命受錬更生日月交感隂陽生成禀金之英膺木之靈以水為精以火為神以土為體返胎育嬰萬氣混康五臟分明與道合德與神契真火急遷度受錬更生急急如靈寶度人律令師曰錬至此矣當滅水火有形之相返其清淨自然之質庶得更生再造聚氣回靈次第而行不失於次序矣靈寶玉鑑卷之四十
