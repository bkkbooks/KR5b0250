front:
  text: 靈寳玉鑑卷之三十六盖二
  hash: sha256:d2b97f376ed02cc6a5e6bb18c8bb5b59fa6c6fe7002574d64710c4218f8edc55
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_034-100386c, image: sjb/10/100386c.png}
body:
  text: 變化法食門夫一切萬法皆從心起亦從心滅所謂生我者神殺我者心故甞詳味妙義然後知心之爲用其爲利與害殆有不可勝言者也原夫人生之𥘉特一神之寓耳未甞有此心也及其四大假合神凝爲心心以神寓則漸離其本矣心爲離本而念即隨起一念旣著則百爲以生百爲旣生則萬縁由是萌矣是以斯念之起適於善者則爲天仙人倫神衹適於不善者則爲地獄餓鬼畜生此無他良由一念之所致也況茫茫大塊中凡有形有相者莫不皆以飢寒之念爲切至死亦不能忘也是以靈寳大法有濟度幽㝠之科仰體道慈開悟諸有所以因食施法因法明心心法旣明飢渴何有故令滿足此念捨妄歸眞所謂八會五厨醍醐甘露蘭餚珍饌玉液瓊槳皆法身中固有之物也此性具足奚假外求外或可求皆是虚妄所冝灼識大本深味無爲永出輪迴證無上道倘明此理豈止超度幽㝠而巳哉變食存用變食之法師存爲救苦天尊壇衆爲諸大眞人法筵爲三層寳壇解中紅光紫炁上衝天際三寳上帝太一慈尊十方救苦眞人日月星斗三界眞宰在空玄之中爲作證明天門金光道炁百千萬重綿綿而降灌注已身及斛食水盂之中内外映徹次存五色光明現於東十圓象如月暈之狀遍照天上地下十方世界無不洞明中有太一天尊俯仰碧玉冠衣飛青翠羽離羅之帔左手擎碧霞琉璃鍾右手執空青羽枝坐九頭獅子金色蓮花之座獅子口中各吐火𤔵圍繞慈尊天尊於光𤔵中别有九色圓象如日頂出白毫光光芒外射如千萬鎗劒蓮花座上又有三十六小蓮花乗天尊二足金容玉相慈尊慧日左有救苦眞人右有大惠眞人侍從天尊八十一位神君五方太一吏兵青玄功曹黃籙童子玉女金童神王力士現於東方五色靈光天尊光明遍照天上地下十方世界無不洞明天尊灑甘露灌注法食光明瑞炁流注無窮天尊同兆眞人及官君等皆誦甘露眞言其斛攝化無礙香氣馥郁充塞虛空廣大無量靈書存變一徧結三途五苦印每一方畢存本方炁東九南三西七北五灌注法食及吸吹水盂中再一徧存黄炁自五方來日月星光上引三十二天之炁交映羅絡灌注法食再誦三遍存四方紅光罩壇良乆混成五色虹蜺下注兆身口五臟之間混爲大圓象廣覆遍滿虛空兆身如在日宫其斛自一生二二生三三生九九九之數攝化無窮自地至天十方遍滿廣大無量天神地祗六道四生無不歆享充滿飽足也斛盤供養諸符東方斛盤符卯文東炁南方斛面符午文南炁西方斛盤符酉文西炁北方斛盤符子文北炁上方斛盤符亥文西北炁下方斛盤符巳文東南炁攝魂享斛符右念唵吽吒唎一炁三十六徧吸五方炁合自巳金光玉訣寳漿瓊瑛符呪曰中虛無迹應化有常金漿玉液充溢生光形神合妙與道俱昌急急如上帝律令存七寳芝英之液流注焚符於水盂内供養召享之啓請通眞符合明天帝日呪曰稽首明慧虛無尊稽首皈命重玄主裁成天地無德稱悉爲衆生作恃怙慈悲五道轉輪廻哀救三途地獄苦歸命金闕天中尊歸命六道慈悲父歸命玉清元始尊巳離生死長綿綿出有入虛無所待能令枯朽變成仙千劫萬劫難一遇爲衆廣說業因縁回骸起死永長存使其形神無變遷淨酆都破獄符呪曰茫茫酆都中重重金剛山靈寳無量光洞照炎池煩七祖諸幽魂身隨香雲旙定慧清蓮花上生神永安念唵俱知衹帝阿勒薩曇婆伽婁代耶婆叱吒吽呵開業道通眞符呪曰功德金色光微微開幽關華池流眞香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寳㫖自在天堂遊唵縳羅拱帝三縛達多縳羅䭾吽吽娑訶離寒庭符呪曰寒庭多悲苦回首禮元皇女青靈寳符中山眞帝書一念昇太清黙誦觀太無功歸九幽下旋旋生紫虛唵吒唎娑訶唵吽唎吟唎吒唎娑訶離怖畏符呪曰自從多劫來出没不暫停一入地獄内舉動心飛驚當令離怖畏隨聲誦仙經共乗無上道同班朝玉清急急如律令唵離息吒謾多喃娑訶生魂育魄符呪曰靈芝無根衆妙之原中凝七魄上結三魂二十四眞出入無門杳㝠之内恍愡元精隨劫存亡逐炁而生外凝混朴内養七眞五神植華三台敷榮紫闕素童反胎歸嬰騰雲而昇跨霧浮空中有玉眞號曰神公左挾無英右衞白元玄獸遏後丹禽擁前工浮翠蓋下擁金蓮香雲凝空甘露無窮用之無盡㝷源不終唵吽縳韈囉薩娑訶灑甘露符呪曰悲夫長夜苦熱惱三塗中猛火出咽喉長生飢渴念一灑甘露兩如熱得清涼幽魂生大羅潤及於一切唵酥酥㗶㖡酥娑訶甘露玉符呪曰泠泠甘露漿法味難思議騫香流七眞㝠㝠何生疑受此法食者生天登紫微自然天厨食普及於一切沉魂飢渴者盡沾甘露味化爲靈寳漿返隂生陽炁惟願沉滯魂上昇清都治唵吽吒唎㗩縳羅娑加持法食符呪曰回首仰元羅合景挹靈芒拘魂制七魄思臍定中央行住履虛無𥨊息宴玄房飢飡黄碧華渴飲瓊林漿神旌命太魔合體錬眞光復照觀太空長在空中遊圓通泯波際眞花靡終期杳杳無終始行者當明知寂寥空裏散應運藏弘䂓降道不自超要當先所施會歸無二處隨心自合離唵噠唎摩尼吽吹耶帝呵娑薩娑訶變香糜符呪曰酆都夜壑忽以光輝照燭幽魂來沾香糜靈寳錬符百骸自飛得見妙會仙歧知歸急急如上帝律令唵吒唎吒唎哆唎哆唎娑訶濟慧法食符呪曰萬劫難遇功德可崇開闢幽趣全假眞風梯航彼岸濟慧無窮念念生因駕景飛空急急如上帝律令酆都羅嚮離羅涅多迓多同登上清溟涬大梵符呪曰玉山金闕上元天一化生靈泉六龍負軿七眞珍果妙絶芳馨上靈火鈴變神仙火鈴變大行梵炁周廻十方唵嗡囉哩長參陀尼尼陀耶多伽耶彌羅多伽耶彌陀九變法食符右符用九天生神章作用又於符内一字上存帝尊自頂門出現太空面部三竅出霐三字作玉金銀三光吸歸三田合青黄白三炁混一昇泥丸化爲本末元始内外合一内誦結空成梵呪誦畢布炁入符倐見天上珍饈充滿法界諸天諸地一切眞仙歡喜享食運筆書勑字蓋之三字上存玉帝儼然口吐金符調引炁入中成合上昇與外一同内誦玉皇誥金光呪誦畢布炁入符存化金飯玉漿十方法界一切鬼神咸來享受運筆以書勑字蓋之九字上存日月星書日月天罡諱訣念日月天罡呪混合三光正炁歸合元宫入下丹田合景過尾閭上透頂門迸出分爲青黃赤白黑五炁漫空各分方所變化法食爲滿空白雪之狀十方三界六道四生享之無盡内誦天然眞味妙用難量食之一粒變化無方誦畢吸炁入符運筆以勑字蓋之又於符下魅字上作用東方南方西方北方廣度玉寳玄眞太妙玄上況淪九幽太上變化無窮急如拔罪符命太一天尊律令言魁至金木水火土壘魒書取五方炁入唵吽吒唎勑召黃某加合明天帝日呪曰九天勑命東極頒符下臨壇所廣濟群苦稽首玉晨尊存太一在頭元皇大敕主存我身有百寳光宻念玉清書梵竒玉訣唵嘸呔咄咄呟𠮵吓吙嗔嚌噧嘸㖟吣喠嗿吩一統急如元始上帝律令又曰結空成梵眞炁自生赤書玉字八威龍文制魔宣化雲上九昌玄皇帝命立降壇場上帝有勑太陽威光急急疾疾謹請大變神王大梵靈官法力無窮充滿法界唵吽吒唎勑召黄某願汝不思議神功妙濟力變比清淨食化爲甘露漿二甘露味三甘露食變食呪隂陽炁𦔳彚物于靈變化多方普變法界急急如五方眞老律令宻呪嗉嚧嗉噓哆婆耶噠多耶嗉嘘㗶囉嗉嚧嘙呵芒角森龍鳯威光叱十方太清傳宻勑離㫖化元光唵吽吒唎娑訶唵叶嚩囉娑訶唵𠯜㖿啼娑訶唵嗡囉哩陀他呢陀野他彌囉哩囉哩嚮囉哩逹多拽多同登太清一二三四五老君來救苦東王公西王母太一天尊降甘露次念太上神光九變無方上窮大羅下極泉郷無窮法味甘露難量變千億萬上朝玉皇女青書正文道一法二妙隱之玄天書八角光芒九天律召三界上中下元河沙十類罷對消愆三塗五夜女青詔前巳托未化承命太玄元皇之一光現無邊一三成炁四八合全炁合成玄玉景飛仙玄玄之一一一之玄秘書一召萬神奉宣急急如玉清元始女青詔書律令無量法食符呪曰三天無量食充滿法界中濟汝飢渇者清淨無極身三麽三麽雷麽帝麽帝叱帝叱無極三天叱叱麽叱麽三天咈三天咈唵勑吽功德不思議行者因福報施汝法食饌永生安樂處普變法食符諸符並玉清訣天門炁呪曰元皇玉清尊太極金帝令九丹無量味八瓊神溢津餌之至不死飢渴長㝠㝠此食變恒沙飫飽及有情仗此加持力共成無上道唵呼噣囉娑訶自然八會靈章三光流晶法食符呪曰妙道生一炁炁中分隂陽凝化日月星燦然流三光九華合九道八色怡八房煥爛洞眞體流晶歸大芒下生淵泉宫上列無何郷縱體復非迹歘然都相忘七寳流精結混沌雜華房嚥服九霞散安和樂未央三光澤嬰法食符呪曰玄絶九氣中澤嬰生太無欎儀煥暘谷結璘耀天衢五星流寳光斗極回乾樞飛氣欎勃散燕御方踟蹰超跡天寳階煉芝服華敷炁布萬眞備舉形昇太虛三光法炁法食符呪曰浩晶生法氣氤氲凝天中兩曜共澄徹五緯交相通三光煥巳明寳炁盈三宫帝郷會九老咽服百骸豐金華照光景身與日月同念道上帝前億劫壽無窮三光玉陽法食符呪曰玉陽正眞炁妙道三景分玄和唱靈音八會敷瓊文五老㝠丹宅飄飄乗景雲大聖諸天衆駕龍飲玉津三五定生籍遊戯太上賔華景朗無際携手朝玉宸三炁雲華法食符呪曰引炁欎羅外九芒結雲華七神髙上道三景耀朱霞捧香服晨精功滿解世羅煉化塵劫盡億齡不爲多落籍三界庭結友太上家御景控玄斗八極何足賖三光導仙法食符呪曰自然至眞道妙極玄中玄萬天朝玉陸九老參華軒三光有靈炁取度惟聖賢勤行導仙業嚥御吞華房神形合三象渺渺歸本元皇鳥翔十天飛舉不顧還三光瑶炁法食符呪曰迢迢三天上落落九玄臺金童採芝集玉女持花回天賔挹仙客俯仰昇瑶階天河灌東井寳炁縈空來嚥納嗽瓊津兆劫不復衰矯首三清路振衣何樂哉三光定光法食符呪曰至哉上眞道妙哉靈寳章吸景導五星嚥御存華芒流精灌百體皎晶凝雪霜洞達照内外塵滓都消亡豐肌不復老契此名定光永宴太平舘斯爲不夜郷攝跡歸本根九轉凝玄常靈寳玉鑑卷之三十六
