front:
  text: 靈寳玉鑑卷之四十一蓋七
  hash: sha256:f32fcc114d4d92788d01a8cd9f34cb09141176dc93bb71684fcc23f6d890c4ee
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_039-100415b, image: sjb/10/100415b.png}
body:
  text: 錬度更生門太隂混元化形錬法師曰混元合炁聚而成靈三元九炁周分十二在天則十二宫分野在人則十二經絡臟腑以應夫一身六隂六陽之形數也及其身謝之後魂魄汨喪形氣未完須假十二大將軍攝炁聚靈錬生眞景全形復性洞徹陽光不墮幽隂徑登仙域矣召混元一十二炁大將軍符子文北炁謹召混元一炁六元運陽化隂大將軍楊元虎飛空變化攝召生炁奉爲亡魂化生腎生精炁使精炁以通眞午文南炁謹召混元二炁七變混景大將軍丁忠飛空變化攝召生炁奉爲亡魂化生心生神生榮生志使神志以安寧震文東炁謹召混元三炁八徊合元大將軍丁遷善飛空變化攝召生炁奉爲亡魂化生肝生魂生筋生血使筋血以流行酉文西炁謹召混元四炁九光㑹靈大將軍陳志元飛空變化攝召生炁奉爲亡魂化生肺生魄生衞生皮毛使皮毛以合眞申文中炁謹召混元五炁十合隂陽大將軍王先之飛空變化攝召生炁奉爲亡魂化生脾生肌肉生意使四肢以固寜寅文東北炁謹石混元六炁十一變靈大將軍張固飛空變化攝召生炁奉爲亡魂化生膀胱生水胞俾水胞以媾精巽文東南炁謹召混元七炁十二運化大將軍李淵飛空變化攝召生炁奉爲亡魂化生小腸生水道使水道以通眞坤文西南炁謹召混元八炁十三陽光大將軍申孚飛空變化攝召生炁奉爲亡魂化生膽生津生汗使津汗以生成亥文西北炁謹召混元九炁十四運度大將軍周自然飛空變化攝召生炁奉爲亡魂化生大腸生谷道使谷道以成形中文中天炁謹召混元十炁十五成隂變陽大將軍章脩飛空變化攝召生炁奉爲亡魂化生胃生水源使胃管以生津巳文東南炁謹召混元十一炁十六三景混成大將軍王卓立飛空變化攝召生炁奉爲亡魂化生三焦生三宫使三景以達靈八卦炁訣謹召混元十二炁十七隂陽合靈大將軍鄭明飛空變化攝召生炁奉爲亡魂化生胞絡緫祝呪九天梵炁爲之結形中有大帝慈悲惠生甚妙靈符魂魄返都千變萬化自有入無身心湛寂俱契玄珠萬劫難遇開關幽途受此隂錬魂登太虚急急如上帝律令混元十二經絡隂符入女返質符内化生腎符子文北炁玄色化生心符午文南炁赤色化生肝符卯文東炁青色化生肺符酉文西炁白色化生脾符中文中炁黄色化生膀胱符寅文東北炁墨色化生小腸符戍文西北炁玄色化生膽符巳文巽炁緑色化生大腸符酉文西炁白色化生胃符中文中炁芬色化生三焦符巳文東南炁青赤色化生胞絡符八卦炁訣混元十二經絡陽符入男返質符内化生腎符子文腎炁祝呪一炁之化神以通靈千神左衞神炁混心以炁之聚神之最靈混合六神以生腎經身自運水大道生明亡魂受錬返故復生急急如玉清上帝𠡠唵三慕哆之化生心符午文心炁祝呪萬火爲主急木魔王一之而定𠡠下無當赤宫之帝聚炁爲王散亂無動百神歸降千神守䕶一體定康亡靈受錬上昇玉堂急急如玉清上帝勑唵嗏輪西那尼化生肝符卯文肝炁祝呪水官之德脉炁如泉魄炁結聚魂精相連青炁葱秀仁道歸乾百骸之首肝腸爲先神凝精聚炁化成仙亡靈受錬時刻昇遷急急如玉清上帝𠡠唵囉咬囉哆呢化生肺符酉文肺炁祝呪魂精魄靈肺腑之生百丞之轉萬魔不干一白之炁混合肺房長衞生炁眞道勿忘玉樓相貫金室通光亡魂受錬昇入天堂急急如玉清上帝𠡠唵你剌般唎哆化生脾符中文脾炁祝呪上帝有勑百魔敬聽飛神御化一炁之生帝君有命𠡠下中黄安鎭榮衞肢體光鮮魂魄受錬五臓生光亡魂變化昇入福鄕急急如玉清上帝勑唵曳都翳曇化生膀胱符寅文膀胱炁祝呪隂陽二炁四聚接靈魂魄歸府一眞湛凝青黒之炁交結膀胱鎭於靈府毫竅混康玉清接景混丸附陽亡魂昇度鍊質南昌三魂安泰大道生光急急如玉淸上帝勑唵叱地叱陁尼化生小腸符戊文小腸炁祝呪三皇之天主炁小腸通流府内眞炁混康赤白之炁二氣交從結成腸府與胄相通大小合度纒絡和中亡魂鍊化變體易容急急如玉清上帝勑唵莬㘕懴囉呢化生膽符巳文瞻炁祝呪三炁合景三皇附身通徹表裏百神安寧靈光所聚神炁混常鎭於膽府赤文交光精魄自度魂形堂堂錬化表裏玉眸垂芒急急如玉淸上常勑唵離波那哆耶化生大腸符酉丈大腸炁祝呪人命人炁人精合凝中皇之靈日月天生上帝有令永鎭腸經黒白二炁廻生大腸混合表裏一體同堂光燦萬域六盤五陽亡魂受鍊易景反容急急如玉清上帝勑唵婆含羅吽尼化生胃符中文胃炁祝呪三官朝拱太一守房六府俱㑹徧體流光黃演之炁胃管生津安神鎭宅一體生明魂神歸伏神眞納靈開通胃管大道混成急急如玉淸上帝勑唵嚧吽叱唎哆生三焦符巳文三焦炁祝呪三焦列布五神共歸赤天有命升降無爲淡白之炁化神無藏咽液生津徃來温昌重樓通景百節順張亡魂受錬俱得更生急急如玉清上帝勑唵嚧吽吽唎吒化生胞絡符辰文胞絡炁祝呪帝君勑下飛攝大魔神精炁聚急鍊陽和黃白之炁胞絡成形五行所運一體光明神寧魄静靈炁聚英亡魂受鍊與道合并急急如玉清上帝勑唵呼聚吽離叱右十二符運一炁梵語書成小樣入返質符內用黙呪曰唵琴尼勑地喃嚧知磬舉回形轉化天尊髙功入科廻骸起死符玉訣光炁萬文一炁成符神霄十八大洞玉符生胞符子文存天中黄霧之炁化生胞元紅地白書謹召神霄生胞元常君字秋夫從官符吏飛空變化攝召生炁奉爲亡魂化生胞吾奉玉清勑速降元炁成次存寳珠一顆飛入胞元結成胎中有青衣將軍二人眞王有命鍊化重泉胞元宣通與道自然死根斷絶下鎭靈淵眞炁化生與天齊年生胎符午文天中玉華之炁白地朱書謹召神霄生胎含生君字寅和從官符吏飛空變化攝召生炁奉爲亡魂化生胎吾奉玉清勑速降元炁成存眞炁如月透明中有一眞人執芙蓉五帝宣符鍊化胎元洞陽妙炁永鎭靈仙混一變化柴戸昇仙生結符寅文天中瑤光之炁黄地丹書謹召神霄生結九華君字彦遐從官符吏飛空變化攝召生炁奉爲亡魂化生結吾奉玉清勑速降元炁成存胞胎脉絡纒結中有綉衣將軍一人玉清元化㝠應十天保度隂户去結解纒靈光下注映煥無邊生節符卯文天中玉光之炁黄地白書謹召神霄生節香浩君字空猷從官符吏飛空變化攝召生炁奉爲亡魂化生節吾奉玉淸勑速降元炁成存白衣將軍一人化生其中靈寳妙炁融節通眞三十二天演化無垠體洞玉光内固眞精鍊化自然與天齊年生腎符子文北方黑霄之炁白地黑書謹召神霄生腎大淵君字求都從官符吏飛空變化攝召生炁奉爲亡魂化生腎生耳生膀胱吾奉玉清勑速降元炁成存胞胎中化生兩腎津水盈溢中有黒龍黒龜上有一嬰兒大明萬寳鍊化生身死魂受化腎神太淵合命對生求都萬全有粹凝精上歩玄天生目符卯酉大日月光炁白地青書謹召神霄生左目通光君字玄眞生右目神嬰君字隂精從官符吏飛空變化攝召生炁奉爲亡魂化生兩目吾奉玉淸勑速降元炁成存胞胎中日月煥明中有朱衣童子素衣少女各一人眞王有命日月無停帝君宣化錬生萬神光澄六合交映合明混生自然上昇玉庭生心符午文天中絳霞之炁謹召神霄生心玄珠君字玄玄從官符吏飛空變化攝召生炁奉爲亡魂生心生榮生志生小腸生水道吾奉玉清勑速降元炁成存童子三人披朱衣跨赤龍虛明應體大象具靈應感無方示見杳㝠神光自生眞淵朗澄洞景長生天君泰亨生舌符寅文天中絳雲之炁黄地朱書謹召神霄生舌騰陽君字正生從官符吏飛空變化攝召生炁奉爲亡魂化生舌吾奉玉清勑速降元炁成存華池淨泓内生金蓮一朶蓮上金光眞人玉清靈景普化眞元舌神騰陽萬寳普宣養神通命上生金蓮紫炁育根浚發靈源生肝符卯文天中清霞之光謹召神霄生肝青帝君字孟光從官符吏飛空變化攝召生炁奉爲亡魂化生肝生魂生膽生智吾奉玉淸勑速降元炁成存青玉宫中有九人前一人乗蒼龍玉淸玉符化生自然魂藏肝腑上生九天昇度鍊眞億劫無邊公子執符天地合仙生肺符酉文天中黄雲之炁黑地白書謹召神霄生肺皓洞君字季成從官符吏飛空變化攝召生炁奉爲亡魂化生肺生魄生鼻生大腸生皮毛吾奉玉淸勑速降无炁成存素衣玉女七人前一人騎白虎玉天無翳兌象孕明華蓋七蓮眞人素成白无受符下覆黄寧金景洞化仰飡流晶生脾符申文天中玉光之炁白地黄書謹召神霄生脾紫庭君字延年從官符吏飛空變化攝召生炁奉爲亡魂化生脾生胃生意生肌肉生四肢生津生谷道吾奉玉清勑速降元炁成存黄元老母白首黃衣立金光中高上玉文化生紫庭表裏洞徹黄中固眞玉符宣召混合百神錬化空景度魂王京生腦符申文上天寳光之炁白地赤書謹召神霄生腦泥丸赤文混洞君字嘘嘘從官符吏飛空變化攝石生炁奉爲亡魂生腦吾奉玉清勑速降元炁成存泥丸玉房中光明洞照中有三人玉貌天衣空梵聚眞萬神㑹靈洞煥晨景八牎啓明混合周流䇿虚紫庭建性空朗飛神上京生隂符子文天中黑雲之炁黑地朱書謹召神霄生隂續命君字伯强從官符吏飛空變化攝召生炁奉爲亡魂化生隂吾奉玉清勑速降元炁成存水波中瑩然下有一人玄衣緋裳淵淵湛玉分配隂陽玄光映月静景凝霜洞化有神厥字伯强亡靈蒙度上生天堂生命符子文天中月光之炁白地青書謹召神霄生命正中君字長生從官符吏飛空變化攝召生炁奉爲亡魂化生命吾奉玉淸勑速降元炁成存胞胎潤澤秀孕轉動中有朱衣眞官一人執筆簿髙上帝命玉符生成天景良賦受命長生保固天根廻隂起陽太乙守元玉梵生光生血符寅文天中赤雲之炁青地朱書謹召神霄生血中幽君字良弻從官符吏飛空變化攝召生炁奉爲亡魂化生血生毫毛吾奉玉淸勑速降元炁成存火雲中有赤衣一人將軍眞王玉文化景生尸黒帝通血流行四肢歴功日乆變赤凝脂鍊質南宫登昇太微生精符子文天中黄白雲炁青地朱書謹召神霄生精元除君字祝祝從官符吏飛空變化攝召生炁奉爲亡魂化生精生汗吾奉玉清勑速降光炁成存玉殿中金鼎白光中有素衣將軍一人立中玉淸洞陽生化元除内外充溢表裏洞虛永劫長存安鎭帝居神昇朗逹榮固天符生炁符酉文天中三色之炁謹召神霄生炁无央君字毳毳從官符吏飛空變化攝召生炁奉爲亡魂化生炁生三焦生百脉吾奉玉清勑速降元炁成存素衣玉女乗白炁光充滿天地髙上大道妙化生三炁形神具天地咸寧梵景長存祖炁流行功成道備上昇玉清生神符寅文天中白光之炁青地朱書謹召神霄生神天生君字靈父從官符吏飛空變化攝石生炁奉爲亡魂化生神吾奉玉淸勑速降元炁成存胞胎中嬰兒完備上升頂上赤府百神擁出現太空中形相端嚴玉清寳符混合百神生成妙體守眞㑹靈變化自然上昇帝庭師行九轉生神之道知磬舉回靈養素天尊靈寳玉鑑卷之四十一
