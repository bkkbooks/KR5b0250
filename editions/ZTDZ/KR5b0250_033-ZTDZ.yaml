front:
  text: 靈寳玉鑑卷之三十五蓋一
  hash: sha256:18e11334bea3afd73f40fdf41b68613edf074668f153d8d8966656d7335e42ec
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_033-100376b, image: sjb/10/100376b.png}
body:
  text: 敷化解釋門普度大齋用追負財火命𡨚結不解幽魂符呪曰靈寳垂慈追度幽魂解除𡨚結削罪北𡨋眞符和釋超入朱陵急急如律令追仇讎執對幽魂符呪曰隂靈隂靈執對寒庭宿世𡨚讎負𡨚幽㝠累劫無化伸告難平眞符超濟和釋上生急急如律令追㗸𡨚負債累劫相纒幽魂符呪曰靈寳眞符降付幽都解釋纒對消却黑書帝勑到處獄吏聽符急急如律令追被繫牢獄死魂符呪曰靈符普告昇濟幽㝠諸獄囚魂各釋消氷𡨚随善念業報分輕慈尊救苦悉消雪扄急急如律令追僧道師尼亡魂符呪曰靈寳垂文遷㧞慈魂下降幽户上度儀神解除宿業削退魔群慈魂昇度煉質朱陵神皈太陽道德自生急急如律令追奴婢横亡符呪曰玉淸寳芨文追度横亡魂開度長夜府昇濟九幽況眞符罷執對和順出幽㝠急急如律令召五嶽吏兵追呪咀亡魂符呪曰五極靈章下至酆都五嶽神吏追取亡魂解釋和順遞相爲良呪咀消蕩同昇天堂嶽庭將吏承符尋訪急急如律令和釋呪咀上昇符呪曰玉淸降符命頒付九幽行㧞救執滯魄濟度呪咀魂承符各和順爲友結爲朋消除負㗸語昇濟入天門急急如律令追犯王法死魂符呪曰靈寳眞符頒降幽㝠犯法滯魄執對寒庭㗸𡨚負債解釋無門凖今符命釋對超生同爲善友煉質朱陵急急如律令追盜賊殺害身亡符呪曰靈符降下遍告㝠途穿窬夜魄被害之徒𡨚𡨚報對劫劫相呼準今符命超度南都形體完全快樂無爲急急如律令追飄況大海幽魂符呪曰元始降符命大法濟飄況昇度長夜府開度受生魂急急如律令追虎狼蟲蛇所害亡魂符呪曰靈寳符命開度幽隂虎狼喪魄來詣家庭宿縁罷對積倩消輕凖今符命昇度朱陵急急如律令追末學道淺亡魂符呪曰玉清寳籙降付幽關地獄摧毀鐵城開宣末學亡者使令神全凖今符命再及人天修心不退道備昇天急急如律令追被廟神攝喪符呪曰靈寳符命急降廟庭搜㝷横喪來詣家庭廟神藏匿束送酆城檢此律令滅亡其形放出魂魄煉質朱陵魂神變煉受化更生急急如律令追因水火喪亡符呪曰靈寳眞符下㧞㝠途水火焚溺魂魄昭甦形神罷苦淨魄還故準今符命速離幽途煉質朱府上生南都急急如律令追爲商仕路身亡符呪曰太上寳籙玉篆靈章超度官賈㧞出地廂獄戸罷對關鎖開張魂神受鍊昇度太陽急急如律令追凍餒流離亡魂符呪曰玉清眞符頒降三途凍饑滯魄散蕩枵虚賜之靈篆超出㝠途各生飽腹骨肉昭甦煉質朱府昇上南都急急如律令追諸軍陣闘亡符呪曰太白運行太一運兵下臨分野照彼諸軍對敵身没魂魄幽迷眞符降下罷對削威和爲師友昇度太微急急如律令度嬰童在㓜身亡未解脫符呪曰靈寳大慈尊昇度㓜亡魂超度三界難托仙貴人身解釋前縁債變煉化成眞急急如上帝律令解釋自縊魂符呪曰滯魄靈靈上應天庭𡨚縊自害身没幽㝠準此符命和釋超昇急急如律令度殺傷死魂符呪曰帝君有命解釋前非𡨚對自纒和釋咸皈亡人今世宿業㧞時凖今符命超度天倪急急如律令度溺水死魂符呪曰江海之神河瀆之君昇度水魂超出幽沉準今符命火急奉行急急如律令度伏連古疰亡魂符呪曰三尸之靈九疰亂神喪神魂魄傳疰敗眞玉清符命追㧞幽扄捨惡從善飛昇紫庭急急如律令度中毒藥身死亡魂符呪曰靈寳符命告下幽㝠㗸𡨚苦爽執對寒庭承符解釋超上朱陵急急如律令和𡨚釋對符解穢符右符仍用前解穢品中九鳯破穢符神水清明符兼用之召天醫符呪曰玉帝玉眞三皇上君太一司命桃康大神呼毒猛虎擲火天丁驅兵將士破鬼滅形五臟神君各保安寧酆都曲府明立鬼營大千魔王統領吏兵神聖工巧敷藥靈童天醫下降拯救亡靈急急如上帝律令請天醫召萬神符呪曰天醫大聖地醫元神靈丹仙藥漙救亡魂降臨眞炁聞召速臨急急如律令北極上書掌執樞機千靈萬聖召出天醫衆病摧滅名達帝知急急如律令紫微欎秀輔翼萬仙仙源顯道普救民愆是病除瘥是惡須蠲天醫靈官地醫神官仙聖功曹速降壇前五元眞炁攝藥濟縁急急如上帝律令麒麟降藥符書鶴上呪曰上台一黄却去不样中台二白䕶身鎭心下台三青治病安神南極長生大帝勑天醫靈天醫聖天火降地火飛縳尸鬼斬妖精治病魂降眞炁施藥靈玉帝有勑速赴符來麒麟使者速駕醫王準南極長生今璇璣玉帝勑降醫藥呪五臟元君緫領大神香錬汝體制汝魂神心肝脾肺腎齒且靈元皇正炁流注汝身邪氣速去正氣在身四百四病咸得痊平功歸神化元亨利貞急急如律令應書敷化諸符除本呪外念隱語書之續頭符安舌續脛符玉清訣東南炁青地朱書七畫斗諱六圏南斗諱接肢體符又名具形全體呪曰玉清元始尊勑下天醫神完全枯朽骨普濟度天人急急如律令生頭舌手足符呪曰太上聖教託物通靈今化手足續頭通名賜汝幽魂速得全形聽吾功勛立獲超升巳枯復榮巳滅復生得生手足更禀太靈急急如律令續肱首符呪曰太上大慈死者能完神形得妙上朝玉宸急急如律令救療牢獄杻械死亡符呪曰巳枯復榮巳死復生得脫囹圄永離狴牢急急如上帝律令救療火燒焦悶之衆符呪曰劫火當身罪累纒形借我天醫付汝之神竭磨大神速速奉行急急如律令救療刀兵殺戮之衆符救療軍陣死亡之衆符呪曰太白連天太一運兵下臨分野照彼諸軍對敵身殁魂魄無歸眞符降下罷對削威和爲善友升度太微急急如上帝律令救鰥寡孤獨之衆符呪曰隂陽混合二炁交并鰥寡孤獨異骨成親貧窮困苦咸得興隆急急如律令救療𥌒目符呪曰日月隂陽二氣生精令蒙太上法速爲開光明急急如上帝律令救療聾聵符呪曰東鳴西鳴不得不行入耳耳聞疾速得行急急如律令救療瘖啞符呪曰大音小音一切音聲一切通心立便生音急急如律令救療傳尸符呪曰三尸之靈喪人魂神玉清符命追㧞幽扄捨惡從善魂升紫庭急急如律令救療墓注癆療符呪曰天圓地方日月星光左青龍右白虎乆病傳屍飛注消亡天丁救苦何病不康急急如律令救療冡訟符救療伏連符呪曰金木水火土疼痛得消止冡訟𡨚尤苦符命速驅除急急如律令救療風癎癲癩符呪曰天㓙神地㐫神遣癲神回元辰急急如上帝律令救療蠱毒符呪曰玉清符命下入幽庭普度沉識上登朱陵急急如律令救療藥死符呪曰天醫使者尚藥靈童驅除萬病魂魄和同藥死幽魂混合玄功急急如上帝律令金刀符斷索符呪曰玄靈大神聖力斷繩降下鋒刃以神全形太上有勑普救群生金刀斷索保固全形魑𩲕𩲓急急如律令救投河落井之魂符呪曰太上符命溟泠大神幽魂溺水下入黃泉沙泥灌塞不通語言開通五臟七竅流宣速令清淨出辭深淵急急如洞淵律令沉溺邪魂滯魄昏蒙五臟湧漲呪以魁罡準吾法令疾速始通急急如上帝律令元始降符命大法濟漂沉昇度長夜府開度受生魂急急如律令救度一切倚草附木伏尸符呪曰天聰地明萬物開通三光煥照善惡悉分返邪皈正㧞死超生急急如律令救度一切死亡未得超適符呪曰天醫使者治病功曹尚藥靈童盧扁神王消除萬病魂魄和同眞炁内灌喜炁交通急急如律令救度孤滯困窮羽毛鱗甲沉溺之符呪曰隂陽炁𦔳彚物通靈孤魂困苦羽甲消除變化無方普周法界急急如律令生成五臟符上帝訣天門炁右符搯子午卯酉中指書之用五色𥿄呪曰青帝護魂白帝侍魄赤帝養炁黒帝通血黃帝中主萬神無越五臟百關萬神通徹急急如律令返形復故符生形育質符沐浴冠帶門夫華池之水源自東井太隂之精侯應海潮蓋源深而流長無徃不資於水令夫人形旣亡矣氣旣散矣所沐浴者果何物哉良由情欲漸染業垢昏蒙生有所染死亦未浄者亦平日念頭不斷故也是以靈寳大法沐浴之科内以運天一之眞水外以備五香之蘭湯赤龍奮白石之源太玄導黃華之氣啓沃舊染開厥故天故五藴空則五濁皆清一心悟則萬縁俱淨然後衣無染之衣服不壞之服其一眞於非相之相禮三寳於天中之天妙道玄功不可而擬議者也符法黃素朱書太玄神水符左手玉清訣呪曰沐浴亡魂體淨身輕歸依大道仙化成人急急如律令右取東方炁吸入符中侯沐浴時焚水盂中念後太玄神水呪灑之太玄神水五行之首生民育物洗新除故開清揚明死魂難遇若非大慈何以濟度變男女浴室符祖炁中篇書之存浴室爲清淨玉壺内外瑩潔中有淨泓温泉銀波浩𣻌亡魂皆浣濯形神游浗太和之津悟明宿性次剔子文化月中白光之華如雨沾沛次以水灑存童子玉女各執香巾長帛引亡人乗寳光而人湯中有三光煥明于内體相光明完潔召魂赴浴香符呪曰元始玉文呼召靈魂速赴蘭湯濯質蕩形急急如上帝律令引魂沐浴符子文北炁呪曰玉泉瓊液煉浴飛昇快樂自在玄明玄明急急如律令男堂沐浴符女室沐浴符右二符誦大梵隱語成符焚時想太玄玉女下降手執寳瓶灌注浴室澡錬魂皆清淨男堂門上符女室門上符右符念天澄地清呪取東方生炁入符化衣符呪曰九曜扶衰眞炁化衣四神合衛五緯交輝炁分羅綺採集空威六合扶挾三炁玄微玉眞煥爛仙女齊飛負景素明元始慈悲急急如律令右面南丁罡三歩叩齒三通左手握天皇訣取東方生炁變錬呪曰唵吽吽呼嗚伐夷明帝都變錬有形攝變天衣符卯文東炁六銖仙衣自天而下亡魂服著無盡皆體相端嚴衣上有五色流霞之彩煥映仙童玉女引朝三寳次第歆享雲厨妙膳變衣香符玉訣呪曰天衣墜空流火飛霞服著無盡躋神帝家急急如律令右符嘘東炁布于衣中靈寳玉鑑卷之三十五
