front:
  text: 靈寳玉鑑卷之二十萬四
  hash: sha256:9dbd65482729c565c0867d88a3f4585c827d2b2e5325d5f4eb6578ba3450aa73
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_018-100289a, image: sjb/10/100289a.png}
body:
  text: 飛神謁帝門九靈飛歩登壇品目次序師於建齋一月之前依法修鍊臨事之際於靖内佩服諸符次焚香合備刀筆朱墨色線黄蠟鎭信印章等物同齋官眼同㸃校章書庶臨事得免倉皇有忤神色光庭曰人間進表章上聞帝王尤在肅整禮容望方設拜稍有𧇊常典即謂不恭況太上崇嚴天衢遼夐苟非志誠不能達御必在精專誠念恪謹禮儀悉按科條母或違怠即可助國濟人宣弘道化上遵天㫖永懋善階次道具威儀法師登壇行事齋官道衆雲集思眞堂知磬舉香林說法天尊次舉按人各恭敬舉修齋請師表白設禮代齋官致詞請師髙功陞座祝香演說䇿空歩虚馳神御景之道知磬舉玉清蕩穢天尊次舉蕩穢呪清道法師灑淨知磬舉金眞演教天尊知爐引班詣壇所次舉唱道髙功結界旋繞燒香侍職焚入户符入户符巳文亥炁早午入戸呪曰四明功曹通眞使者傳言玉童侍靖玉女道室正神爲臣通達上元生炁入臣身中靜夜入户呪曰四明功曹龍虎使者侍靖玉女開明童子上元少女夜有啓請願得上聞正一生炁入臣身中想金童玉女乗五炁雲自左右耳出立侍于前侍職次焚招眞召靈二符招眞靈符玉文天門炁降靈眞符玉文天門炁二符緫祝呪玉華散景九炁凝烟香雲宻羅逕衝九天侍香金童傳言玉女爲臣通奏上聞帝前令臣所奏咸賜如言髙功入壇三拜執手爐黙呪平身捧章于手存五藏炁出爲五色雲靈官玉女森列左右日月合明五星北斗混爲金光洞煥内外自北恭身存天師次面西存道德宗師面南存三師次面東存諸君丈人又面南存三將軍次面北存太上老君衆眞混同於青黄白三色雲中次放章于案上都講舉各禮師存念如法髙功宣衞靈呪侍職焚符宻呪曰虚无眞聖髙空湛然傾誠所告祕心奉傳並時上達感應幽玄天朗氣清三光洞明金房玉室五芝瑩生玄靈紫蓋映照我身玉童玉女爲我致靈五帝齊景三神同軿得乘飛蓋升入紫庭衞靈符取方五方衛靈符炁訣見朝醮門召五帝大魔符東方卯文束炁祝呪九天煥明天地同靈通幽達明萬神雲臻斬馘六天収捕魔精乗氣捕非掃蕩妖精南方午文南炁祝呪朱闕巍峩離明應輝負天擔石横身飲風火鈴擲節鎭守三宫玉帝勑命飛昇太空急急如律令西方酉文西炁祝呪皓靈太空七炁素天六目反山赫然飛仙金門皇老變化自然白元守房乗炁玄元北方子文北炁祝呪徘徊五炁玄靈散飊巨天後矢按轡神翹斷絶死户啓生幽寥捧符執節飛歩太霄急急如律令中央中文黄炁祝呪一炁分元黄中太微龍篆虎符檢精却非斬馘六鋒神化流輝天帝有命萬神咸知召通章校章呈章從事符辰文天門炁召監章按章齎章從事符玄都正一太妙華精眞官上靈監按章文齎執上奏萬神招眞北酆鬼律不得稽停召呈章上章判章從事符呪曰靈寳符命下召諸靈帝君奉受天帝齊并呈帝上達判别分明感格玄造飛升紫庭急急如律令召天丁力士符呪曰玉清神府中有天丁力士捧侍禀命咸遵帝君有勑使者須聽護送章文俓趨玉庭召天騶甲卒吏符呪曰天帝之神龍符虎文飛行八極馳節玉京吾召速至奉命雲奔乗我玄告俓詣太清急急如律令召建節監功大將軍符呪曰玉帝之臣建節監功飛雲羽蓋上入玄宫赤帝三五受命元宗奉承正道飛歩太空召罡風騎置吏符呪曰擲火萬里流鈴八衝都官僕射前誅禦凶罡風騎置飛騎六龍拱護章文俓達玄宫急急如律令召四部監功謁者察奸勾騎符呪曰察奸勾騎四部神兵統制隊仗掃蕩妖氛監功使者翼從雲奔通達上願感應帝靈召左右官使者隂陽決吏符呪曰天地二炁隂陽肇分日月水火中有大神前導後從齊登雲天左右吏兵速詣帝前急急如律令通眞達靈符自玉清訣次搯丑文順至成亥仍歸玉文呪曰勑吾身中胎光幽精爽靈萬化飛行上清驅神攝鬼洞徹杳㝠吉凶禍福如影隨形急急如律令都講舉各稱法位髙功宣拜章科都講舉衆官各長跪出官如法髙功想五體眞官等從玉堂宫領萬神並嚴裝冠帶騰三素之雲出列于左右前後呪曰内有所明外有所臨開之朗然了無影象髙功依科出官侍職焚出官符緫呪中理五炁混合百神運出官曹侍衞逕升上徹帝前與道契靈形神俱妙守一洞明玄朗太虚朝謁玉清出官訣五體眞官功曹吏卯上仙上靈二官直使酉正一功曹子左右官使者午隂陽神決吏丑寅科車赤符使辰巳罡風騎置吏未中驛馬上章吏戌飛龍騎吏等官亥狼吏虎賁坎察奸鈎騎艮天騶甲卒艮天丁力士巽離坤兌監察考召甲子諸官君子輪至亥彈夫三籙齋發爐並用洞元朝儀吏兵若髙功别受經籙即當隨所受法職於發爐時關出吏兵矣出官符七道天帝命靈合景杳𡨋大梵流布三光合明洞達萬化超神澄澄景曜㑹英平虛華明開闢元始神光洞眞一炁御形自然化生開圖始青御景太靈玄度萬化洞達杳𡨋生炁流布合虚乗輕自然至眞理應帝靈雲乗三素上升玉庭洞朗無際感悟玄明飛空素靈出幽入𡨋神游太漠玄覆黄寧通達至誠内外俱榮深玄紫精眞中之神敷榮神室㝠御華英保固生炁洞朗太溟萬炁之宗眞中㑹靈保制大劫固恃玄精四象發華諸福畢臻出官緫符天皇訣北斗炁黙呪曰體虚集何出何入此爲之儀呼出呼入宣章符出官畢表白三禮髙功前跪受章副宣章叩齒二十四通存飛天神王五色祥雲金甲朱衣天丁力士佩帶寳劒手執玉函自天門至壇所宣章宻呪無上玄元洞玄洞先太一佐使御炁飛煙雍雍侃侃褒服飛仙一瞬十極緫統萬天阿濫那易婆歩曇延達落那顧厥淪索連乗命玉宸傳令侍壇爲宣化度如律如編右呪黙念七遍望天門長引鼻炁七遍即見神王恭聽齋意開函小吏符呪曰玉章瓊文上達三清飛跡升進神詣謁眞開函小吏四司眞君玉律元帥監進將軍急急如律令髙功存金光道炁自天門而降捧章跪念開函呪四明功曹開函小吏手執書刀開發函軌奏章上聞通達玄理臣得長生事獲終始取章呪臣章靈靈敷以上清仙童玉女開發龍函臣今聞奏俓達帝庭取刀筆呪臣筆靈靈改死注生硃爲百藥筆爲利刀邪神㫁絶魔魅消亡五行正炁何鬼敢當髙功留章於案拜伏念霐不計數至宣章了再捧章念封章呪太上科禁青素朱章隨吾心意俓造玄關眞炁封閉玉女捧函呈章從事驅滅穢奸眞元混結直透天關去來無礙出幽入間日月齊輝天地循環髙功存六金字在章次取章在手剔隂陽二斗二十八宿訣次搯開天門亥塞鬼路寅留人門申破地户巳次一轉六神藏丑二轉日月明寅三轉四煞没卯四轉動魁罡辰五轉雷火騰巳六轉霹靂發午七轉山鬼死未八轉収攝一切邪魔付五雷之下入地萬丈無動無作急急如雷祖大帝律令自未順至子結雷局運章五轉畢留案上道衆迎至祭章所祭科中召出官將一法先祭章次第入壇髙功就遣官遣官符呪曰杳杳𡨋𡨋五體之神吾今發遣受事叮嚀隨吾所指侍衞眞人通達章奏速詣玉宸急急如律令遣四直符本日辰訣辰方炁呪曰年直月直日直時辰天上地下去去如雲功曹將吏布炁分靈傳令執符心爲於民達吾誠意道力咸并弟子持用一心執眞唵窣追婆加訶速曵娑訶遣將符勑呪天元軸軖軑轅䡠勑軒軿𨌩𩵄魁攝玉府雷吏豁落衆神三元洞治七震八靈六丁六甲威劒大神守壇直使龍虎元君北極大帥四聖眞君奉元始勑急速通靈髙功遣官畢次歩罡飛步蒼𡨋符祝曰勑吾身中科車赤符剛風騎置驛馬上章飛龍騎吏火急通靈乗飈御氣䇿景升虚上朝玉帝六甲吏兵隨吾所使急急如律令一法用隂陽二斗加二十八宿并豁落斗一法用交泰罡加豁落斗恐太簡不合古法如用之悉見召使發遣門靈寳玉鑑卷之二十
