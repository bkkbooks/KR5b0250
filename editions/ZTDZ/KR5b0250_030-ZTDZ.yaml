front:
  text: 靈寳玉鑑卷之三十二方六
  hash: sha256:03977b4d0e2ff20d312c47880f9a496d145a361f6a833269f71be50d8c6a1854
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_030-100361c, image: sjb/10/100361c.png}
body:
  text: 玉元追度門夫道之所以彌綸宇宙發育萬物者皆自然之妙運也曷甞有施報哉故物則不然凡氣之所以寓於形者猶衮衮之容塵耳自其善不善之念一萌則必有施報也是以靈寳大法玉元追度之科專度血尸産魂況其宿業旣縈報縁隨至愛河慾海汨喪元眞乃至墮孕落胎傷身殞命血腥汚穢可勝言哉形體雖亡宿念未滅則必以森羅浄霐之源濯其舊染之汚以眞陽至善之光以覺其本然之性紫英以明其道玉符以遷其神俾其妄縁幻影如落地之花妙體眞身若當天之月了無滓礙等一虛空何不利有哉師曰硤石之獄在鐵圍東南有一大石上大下尖石之中間開一眼縫其鬼入之自然百藥毒汁灌其身心獄之北號血湖大獄穢汚第一其獄中産死婦人動經億劫受苦難勝深可悲哀凡度血尸産魂須當先下符命專産將吏蕩滌穢惡變化血湖始可專赦赦須三曰前奏行赦了方可行持攝召旣至道塲法師先與蕩除垢穢申請天醫醫療畢方可次第受食受戒若只一例追度殊不知有符所不到處切宜詳鑒行事流光眞符呪曰元始上帝虛皇天尊無極大道太上老君玄元始炁九天眞文鬱儀孕珠結璘含輝三光朗耀七元流珠恩覃泉曲澤及血湖胞元散結穢累蕩除慧光接上上昇天衢告文靈寳玄壇今月日恭奉道㫖頒降靈寳符命流光眞符拔度産死女魂上昇天堂者符右奉符命告下十方無極世界九幽地獄太小鐵圍有間無間溟泠北隂之府符命所到摧破幽扄火山息熖寒池消冰刃爲寳樹劔化騫林拔度産亡某靈魂普度則云産死女魂乗兹符命時刻昇遷一如告命風火驛傳年歳次月日時告下具法位臣姓某承誥奉行祝符呪靈寳玉籙拔度眞符流光普照蕩滌穢一天符吿下徑上南都急急如元皇律令太乙救苦天尊勑三十三天帝君勑十方無極飛天神王勑又呪隂陽正炁三炁流輝下映幽關上徹玄都血湖北獄覩見光明眞符在手永赦血湖巳徃𡨚僨一錬消除急急如元皇律令勑靈寳玉元蕩滌血湖眞符曲赦前用呪曰玉帝告律脫釋㝠關赤天佐助昇眞紫府九隂九地俱來合隂上帝勑命普度幽塗救苦眞人拯濟元君神眞俱集三台下臨九陽俱照廣布南宫天眞捧令排列帝庭元始勑命玉皇降宫乾坤撫育速離幽獄衆眞拱布免滯幽塗玉音振響萬劫求離鬼魂滅爽神英自扶急急如元皇上帝勑祝符呪元皇勑命普濟幽途靈寳内篆度脫血湖神清保護徑上南都急急如律令告文靈寳玄壇今月日恭奉道㫖頒降靈寳玉元蕩滌血湖眞符拔度産死女魂滌除尸穢上生天堂者符右奉符命普濟幽途告下翻體大神擲尸神王食心噉腦鬼王牛頭獄卒牢檻大神仰體元皇上帝好生之德下副拯救幽㝠之誠承兹勑命不得拘留拔度亡過某及在會因産身死女魂出離地獄或云幽暗覩見光明領茲薦悼免滯血湖錬質清神逕上南都一如告命風火驛傳年𡻕次月日告下具法位臣姓某承誥奉行度無間血湖罪魂符告文靈寳玄壇今月日恭奉太上符命拔度産死女魂出離汚濁上生福堂者符右奉符命追取血湖之内生産落胎墮子一切女魂徑出地獄洗滌形神前詣玄壇祗受功德時刻超度仙化成人遵奉太上度人律令風火無停一如告命年𡻕次月日告下具法位臣姓某承誥奉行玉籙度血湖解𡨚符取天門炁吹呪曰梵炁彌羅周回十方五苦罷對三途消滅𡨚纏和平惡根斷絶前縁宿債業根解結秘呪唵檀哪兜嘍哪勑帝喃娑訶此呪宻念係三天梵語能解一切𡨚業告文靈寳玄壇今月日恭奉符命拔度産死女魂解釋𡨚憎上登福堂者符右奉玉籙度血湖解𡨚符命告下十方世界幽牢地獄㝠局曹案主者北溟血湖主者解釋亡某三業六根仇讎執對出離長夜各覩光明萬罪蕩除積𡨚未釋一如告命風火驛傳年歳次月日告下具法位臣姓某承誥奉行玉籙金書破血湖大赦眞符呪曰玉清輝映金碧流光日精散耀五方五斗上帝眞師玄元正炁沖破幽關酆都煞氣六洞鬼王遵依勑命三途九隂流光朗照苦海停輪水精淨穢七星洞明火精焚尸妖惡俱蠲五老啓途九靈飛仙萬神秉命風火驛傳又呪元始勑下救苦眞人承受符命下達幽隂陽光所照黒暗生明萬罪蕩除六根澄清急急如玉清元皇上帝勑元皇上帝拔度血湖産亡罪魂赦文運眞含靈會寳勑召諸神六天壘重隂酆都九幽獄典吏部㝠洞三官執𡨚府曹治神吏衆一切主罪録拔度産死魂免罹諸荼毒流光玉元符照破血湖獄爐炭生青蓮刀劒化騫林火池變温泉鑊湯爲春浦超度長夜魂徃生極樂國玉籙度血湖破穢開光寳籙呪曰無極太上至眞天尊玉虛勑命遍達泉扄天丁甲卒百二十人前祛腥穢徑沖幽㝠日光童子百二十人月光童子百二十人無間地獄光徹分明冰寒融和穢氣消平尸血臭穢消蕩不停南丹眞火洞徹杳㝠死魂出離得覩光明飛令下速萬神皈依勑䇿呪圓光五彩素輝三晨結根純瑩光華九清三洞符命徑沖幽隂斷絶罪源消解迷津玉符到處萬神咸聽右符書之粘破穢牒前用青紙朱書三光呪勑符唯是血湖臭穢幽暗難入雖官吏承帝令有神通能入亦不能徑逹血湖之所若得此符用檄付沖血湖解穢破暗天丁則能通逹此符一百二十里暗晦穢惡自消光明通徹不可不祕玉元虎文符牒用呪曰唵哪吒唎三遍燒符不出聲念右法黄𥿄朱書粘牒北炁子文至鬼字吹山字訣於符上發遣功曹將吏用之元始清神神化變靈眞符右符用青𥿄丹書關引白素黒書用太清印印之或都天大法主印印之關後列五師名位係齋壇五師非天省五師關式如常書了同符用靈寳經内魔王靈篇祝之玉清訣中天炁吹符關分付地道功曹遣發師曰凡血湖罪人雖沐浴煉形穢惡之根難絶其炁凡煉度畢臨送靈時以䄂化符以關付亡人収執則近生方諸眞之處自然快樂矣元皇蕩淨血尸符呪曰天帝有勑曲赦幽魂蕩除血穢舉令通眞流光洞照體合自然陶魂煉魄受化更生形神完復面禮慈尊急急如玉清元皇上帝勑右符黃紙朱書先書存神爲太乙天尊頂出炁灌注罪魂告文靈寳玄壇今月日恭奉道㫖頒行玉清元皇蕩淨血尸符命拔度産死衆魂蕩除滓穢入道成眞者符右符告下無間地獄硤石血湖地獄主者翻體大神擲尸神王食心啖腦鬼王拔度亡過某及血湖罪爽速離穢惡覩見光明赦除罪業澡煉身形上昇南宫受煉更生一如告命年歳次月日告下具法位臣姓某承誥奉行血湖將吏服色蓬丁面藍靛髮青狀似金剛黃衣白帶腰下青色手執戈㦸部領兵將一百人凡存召以中指中文黃確面深朱色狀似天丁披白袍脚赤白帶手執降魔杵舉歩指呼髙聲部領百萬人凡存召以酉文凡建産室沐浴之處申天樞院及牒二將軍具說因依行遣存二將叱出死胎其出胎蕩胎等符巳具敷化品追毋喪子存二節無義斷恩収鬼攝精解釋追攝大神王志中追母存子喪神將震鼓喧雷閃目生靈聚體長肌大神胡敬追母子俱喪神將正精火目攝炁聚英解對釋愆大神陸茂以上三將青綉頭巾緋袍各持三色器黒雲中降追未産毋子俱亡神將直性梗靈淨穢濁破穢生精大神徐立威靈感通眷義全形洗浣大神周免解釋𡨚愆致魂全形復體大神李興解釋𡨚對正魂生形致影長津復體大神馮遵以上四將並褁紅綉巾著四色袍各持符而下圊樓使者符東炁呪曰左德右輔圊樓衆神吾行蘇魯化濁爲清蠲除邪儻急速著靈急急如太上律令又呪太上炎靈流火之精上帝勑下不得乆停左祛六丁右使六壬手持符命攝起山神圊樓使者急攝急攝火急勑行左青龍將軍右白虎將軍開眼則萬丈火光爍散精魔之炁急急如太上勑呪曰諦讜諦讜法水解蕩圊樓有將攝起壇塲若攝産葆去除禍殃急急如太上律令右用金錢一分茶一盞令婦人厠上燒或書粘在使者牒前亦可靈寳玉鑑卷之三十二
