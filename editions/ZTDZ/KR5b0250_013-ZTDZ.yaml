front:
  text: 靈寳玉鑑卷之十三及五
  hash: sha256:7f28a8653f4ea6d861dbae0758dc718b59b0536f3779daff304399e9b34423dc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_013-100228b, image: sjb/10/100228b.png}
body:
  text: 宿啓朝醮門法曰天地之化聖人之道在乎無爲自然而巳矣蓋無爲自然者乃不勉不思之謂也其不勉不思之中淵乎似萬物之宗者實天人之大本也然而能體誠敬會天人而一致於道者故科教有朝修之道焉其朝修者日有三時建壇行道禮謝朝元以取夫畫夜三接日宣三德之義至於三日而九朝亦法其九陽之數則九頓九奏之誠備矣其㫖有之曰寳珠神化太一含眞五炁朝元三花聚頂此内景之謂也飛章列符行科演道謄詞進表懴謝禮方此外景之謂也故凡外景之設實本乎内景之妙自非深明夫内外之道者其孰能究其體用哉今以即夫道之體其小無内萬殊而一本也以極夫道之用其大無外一本而萬殊也然則又當明其所以爲體者存於有而無迹其爲用者本於無而有爲由此觀之則將致廣大而盡精微合内外而兼體用而言之者亦莫非無爲自然之妙矣則朝修祗對之際其可忽諸奚有間哉靈寳自然思神儀訣夫宿啓者正齋前一日取吉時建壇設席補職說戒宣科勵衆關聞三界即是啓告之夕非正齋行道之日也師曰明晨行道續更啓聞至日行道方入清旦初朝乃知宿啓關奏不在正齋行道之限應齋者並在前一日沐浴宿齋所至日吉時率衆具威儀引髙功法師詣師前立定請齋官燒香授齋詞與髙功然後髙功於師前關白齋意夫齋法精嚴諸天上聖並降監臨毎事須合法度廼至都講讃唱詠誦亦須緩急得冝不得遲留稽延凡髙功啓奏之時東向平立執簡曲躬調聲正炁直詞小語朴略典素不得過有繁飾凡諸祈禱先有悔過然後請事凡髙功行道登壇皆香水盥漱名曰蕩穢出亦盥漱名曰閉眞炁平旦寅時當思青炁從肝出如雲之陞帀繞壇殿青龍獅子備守前後仙童玉女天仙地仙日月星宿五帝兵馬監齋直使三界官屬羅列左右即宣五星都呪正中午時當思赤炁從心出如雲之陞帀繞壇殿朱雀鳳凰守備前後仙童玉女三界眞仙日月星宿五帝大魔十方神仙兵馬監齋直事萬靈官屬羅列左右即宣命魔神呪人定亥時當思白炁從肺出如雲之陞帀繞壇殿麒麟白虎備守四方仙童玉女天地眞仙日月星宿五帝兵馬監齋香官三界官屬羅列左右再宣五星都呪閉目内思五嶽五眞五帝備守身中金華映蓋一體作金色從肺出頂後圓光如日之像使照明十方内外玄同獅子鳯凰麒麟白鶴四靈八卦隨方列布祥雲瑞氣帀繞壇場諸天衆眞森羅慶㑹仰觀太上三尊居天寳之臺左有三十六部尊經右有玄中大法師恍如黍米之天萬神備守次運自已一炁上朝泥九自一生三從三化九作九光圓像煥映萬天自已眞人上朝至尊心奏所陳依科行事無不孚感者矣各朝行道俱用此法夜夜禮十方皆從北方而起次東北方東方南順至上下方蓋衆星拱北之義故先朝禮於北方也入壇淨穢符上帝訣天門炁勑蕩穢呪洞中玄虚晃朗太無三清下勑光映九衢八方威神使我自然靈寳符命普告九天乾羅答那洞罡太玄斬妖縳邪煞鬼萬千中山神呪元始玉文玄水洗穢郤鬼延年按行五嶽八海之文魔王束首侍䘙我軒𠒋穢消蕩道炁長存捲簾髙功道衆詣簾前跪奏拜通眞表次宣表焚化金樓玉陛符師存壇殿之中五色祥雲彌羅混合運自巳一炁上泥九化爲元始乗百寳光須㬰見天尊下降混合爲一天眞大聖日月星辰三界十方千眞萬聖皆乗妙光俱會壇所兆自已元神如眞人狀與三界衆眞陞壇朝謁隨事依科行事化金樓玉室符已文神霄炁呪曰合明天帝日月合明瑞炁氤氲祥雲宻布三華離便五明豁開玉軒梵音瓊房妙韻森羅淨霐霐池無鏡金城環固玉洞回靈急急如律令告行金樓玉陛符式三天炁五文奏表後焚於簾前靈寳大法司今月日謹奉道㫖頒降太上化境玉符須至告下者欎羅蕭臺玉山上京上極无上大羅玉清渺渺刼仞若亡若存金樓蒨偉玉殿森明光梵巍峨降眞啓靈駐景龍輿玄晃仙居隂陽凝室萬炁齊居一如告命風火驛傳太歳年月日告下具法位臣姓某奉行玉清上相大羅無極神公在天祝呪三界之上渺渺大羅上無色根雲層峨峨唯有元始浩刼之家部制我界統乗玄都有過我界身入玉虚入户符上帝訣取天門炁髙功於地戸上存四明功曹一人通眞使者一人傳言玉女二人侍靖玉女二人早午二朝念宻呪曰四明功曹通眞使者傳言玉女侍靖玉女道室正神爲神通逹上元生炁入臣身中靜夜朝眞宻念呪曰四上功曹龍虎使者侍靖玉女開明童子上元少女夜有侍靖願得上聞正一生炁降入臣身都匠符五方炁訣合明符玉文祖炁十方謁簡燒香符東方震文東炁呪曰廣生髙映覺元洞虚應元九眞化肇靈圖靈文運搆宗範元都感變緫括威招自成緑岑遷景皇道合明天森耀權炁精育魂融羅負立圎映隱旻期臣神色洪綱告寧與道合眞南方離文南炁呪曰章炎通泛堅敷澄榮虚象玄華龍陽儛穹微正霄艶太淵凝沖元關三紐大梵飛空隱覺隆蓋天倫慶呈神戸纒絡眞元散精淨握明照徊合升玄導騫宴雲靈應騰天與道合眞西方兊文西炁呪曰剛澤微控隂峻孤儀貫炁㝠素宸洞開微周化幽應澄輝帝臺平遐挹虚恢茂童池結飈臨育麗無散開陽通百六沉芒隱階幽廓㝠黙眞峰㑹靈堅丕順道告命騫林與道合眞北方坎文北炁呪曰龍安洞變純陽隱玄返本還炁象㐲髙圓神變惠𠃔解鍊靈根赤精成道純號威尊利雲有常億刃中丘欎城瓊壘瑶音慶流受位王室大憲通幽玄章煥落綱輪廼周與道合眞東北方艮文東北炁呪曰觀覺欎繿大明紫虚九神度魂開闢玉眞阿奕煒燁飛天流音輪景帝常都靈頥臻豁落大宥慶雲啓靈七曜輝魔恬懀敷榮虚無上首天紀彌宸四吁育象濯耀清明與道合眞東南方巽文東南炁呪曰煥赫洞陽淨景五光七靈謡歌世元紫堂羅英散景曜明玉房八晨緫獸韶主攝精九都蹇欎飛生上靈宻羅淨境馥育寳輪灌沃黄華霐運玄明神宮開廓延宛丹庭與道合眞西南方坤文西南炁呪曰大猷浮景眞定化元蜒蜿素眇玉梁澄煙蕭峙結隅景羅七纒秀盤三府流輝九玄寂然虚邈飛華拂軿晨濫録籍大漠由延阿丘九度六龍負轅蓊藹浮羅紫精復淵與道合眞西北方乾文天門炁呪曰溟涬太育九機化乾覆形厚德元河淪精育英明陀景艮眇云大醜緫監秀樂禁天紫虚陀丘刼量交前碧霞韻梵眇眇游元元變運量馘絶惡𠎝恢冠玄漠萬度成仙與道合眞上方亥文西北炁呪曰元始開運太玄肇靈虚極無象一炁流形化生二景五緯凝精混合自然坦除結嬰緫眞布景煥赫九清炎持廣變七紀齊并析師慮浩丹天耀精朱光鍊度赤藹散明三華𣡡秀輝映帝晨與道合眞下方已文東南炁呪曰眞陽開化梵炁流通金闕在上玉府居東欎結五文煥散九空妙炁自然藴奥難窮三靈共貫萬聖攸宗參稽學行摽紀眞功以神俱契與道合同安鎭帝録億刼無終與道合眞右十符當朝奏時髙功執謁簡詣各方黙具職衘恭詣各方天尊侍從服色隨方存感炁訣各按方位降眞召靈章師曰天皇降眞靈符虚皇召靈眞符乃三天飛玄正炁自然之章以召三元衆眞萬靈兆司清宫仙階位治靈虚眞品欲降百眞後召千靈以青綺七尺二寸絶朱丹書降眞靈符飛黄篆召靈符安於靖中以黄錦作席或黄繒亦得用醮禮祭之百神降眞召靈使者玉女金童各十二人隨祭降下直䘙眞文所召千眞萬靈立降于室學不篤信五嶽試人輕露祕宻所召不神凡諸三天仙眞靈神遵符而屇前無神文乃爲妄召雖精思若徹萬無一報或有降者多作魔試受者依玄都憲格齎三素繒隨年尺詣有系之師以畫空而心記不載於文章恐鬼神禽畜竊視漏泄矣師曰仙曹玄司脩用隨事並有髙聖眞仙主宰曹局靈官典者一一治局無致妄召並隨虚皇萬應降眞符元皇緫章召靈符下降罡式上洞案香先進左足雙歩星珠熠燿罡立主爐前行罡呪左手中文午岀雙目微閉以存三境玉清赤素大梵分靈元綱流演星珠貫周急急如律令三上香呪臣今𥘉捻上香願逹玉清境供養元始天尊九聖之衆臣今二捻上香願逹上清境供養靈寳天尊九眞之衆臣今三捻上香願逹太清境洪養道德天尊九仙之衆呪曰靈光梵炁下注臣身飛香進御合眞帝庭急急如律令左手剔三官訣瞑目存壇墠上通天門黄雲紫炁日月光明星斗交映混浹玄壇左右芝蓋華旛森然列侍運心府作金蓮迸開一景居中金光獨懸次剔玉訣見七寳金臺玉殿内外瑩然中有至尊端坐其中兆以一炁引接祖炁次布十方仙凡交合上清靈寳玉虚召靈紫英符玉訣取天門炁呪曰開明三景是爲天根玉山上京大羅玉清三華離便大有妙庭大行梵炁無無上眞與道合眞上清靈寳元皇降眞青華符呪曰天中之天眇𦕈刼仞混沌之中無幽無㝠無形無影無極無窮梵炁彌羅萬範開張泛景太霞十轉回靈契本合眞二符緫勑呪玉華散景九炁凝煙香雲宻羅徑衝九天侍香金童傳言玉女爲臣通奏上聞帝前今臣所啓咸賜如言急急如玉清靈寳無量度人律令存左右二君金童玉女自兩耳目出服色如常乗五素雲爲我通誠逹意招眞召靈赫奕仙曹章師曰此玉清天大將天神皆遶屬玉清神公太玄上相也與諸天大帥髙靈齊功自號玉清靈寳赫奕司輔翼玉清刼運改更滅魔掃災昇度學仙之子檢校三界驅除妖惡嚴攝北酆制御鬼爽明檢鬼營肅清道境以備後世種民期見太平聖君皆符衞掃蕩之神也神公即地皇之臣馬祖太帝之嗣角龍辰宿之父位爲玉清神公太玄上相號馬祖龍氏諱郭奕師左手玉文右手上清訣化身爲玉清神公念後呪一遍目篆三天眞符於天門上吸三色自頂門下注三田合青黃白三炁化爲三尊上升泥丸與壇中三尊混接爲一自已眞人與十方三界一切神明緫朝上帝次搯五方訣合五方炁内外相應以目左𣊬三周吹炁布滿十方揖禮歸拜壇三拜召仙曹呪髙天之上玉清爲主元綱大魁太玄生府中有帝君靈虚王母繞制嘯咏玉文金符司制仙禁金童玉女校精辦魔緫御百史上逹三天形成司舉傳奏教令蠲災救苦備衞護道囚縛鬼侮流浪諸天濟生度死解厄摧恠通逹紫府十方告命召其所主急急如上清靈命元始上帝勑右呪廼玉清靈寳宮靈寳天仙内院有仙曹分降以給宫中仙官凡招眞召靈必資此呪也招眞靈符玉帝訣祖炁呪曰玉清勑召千眞萬神虚皇寳册宣告無停眞靈遵誥奉命而行急急如律令降眞靈符祖玉炁帝訣呪曰玉清聖命告下三界天皇之勑普告三元無極聖衆浮空而來急急如律令跪爐符玉帝訣天門炁呪曰道由心學信假香傳手執玉爐心存九天令臣所奏上聞帝前各禮師訣先存經師形相名諱心禮三拜呪曰願師得仙道上登髙靈爲我超㧞一切皆成道眞我身昇度次存籍師形相名諱心禮三拜呪曰願師得飛仙上登髙眞爲我開度七祖父母早生天堂我得眞道昇入無形存真師形相名諱心禮三拜呪曰願師得昇度上登髙仙爲我開度王苦八難名入仙籍永爲眞人師曰脩行之道本在存師師之不存道從何得所爲師者曰度師度師之師曰籍師籍師之師曰經師以上人間三師也别有天上三師者太上老君爲度師虚皇大道君爲籍師元始天尊爲經師也次存天上三師乗青黃白三炁下降心禮三拜次五方衞靈訣隨方搯卯午酉子中内思五臟五嶽五星五帝各統從官兵馬備衞身中四靈列侍五色慶雲滿身直射五方罩覆壇所脗合内外之境無感不通五方䘙靈東方衞靈叔英妙炁之符卯文東炁呪曰蕭仞扶桑方諸欎霞元皇列眞凝雲芽明耀九芒合炁三華钁天振劒神虎辟邪安陽大帝攝禦群魔二昇神霄濯形天河急急如律令南方衞靈洞惠妙梵之