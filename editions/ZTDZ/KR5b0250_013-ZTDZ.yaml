妙炁結成眞文實大道之本根諸天之𣑽炁也可以上朝三景䇿役萬靈隨事所行克臻玄感也又三捻香符初捻香符誦無色界魔王章祝之玉淸訣上天炁二捻香符誦色界魔王之章祝之上淸訣上天炁三捻香符誦欲界魔王之章祝之太淸訣上天炁右三捻香符合於發奏之時焚之此乃道香德香等符古法於朝修中止有前三天眞契符爲三捻香中用理亦通也髙功面天門立叩齒三通咽液三過存左目有日光紫色九芒去面九寸右目有月光白黄色十芒去面一尺存日從左鼻入月從右鼻入于洞房透九官合九天炁降身中自下昇上至腦後發出項上化九色玄像法身即木來元始也心境眞人乘光而出步玄珠星斗繞帀玉京天寳妙臺緫朝虛㴧次叩齒咽液持宻呪焚命魔符步虚丁罡存五帝大魔敬聽受事諸天皆朝天丁前驅大帥仗旛天雨寳華繽紛而下三天之陽炁旣明六天之隂魔自滅苟能一眞澄湛萬法圓通道合自然功霑幽顯豈非賢者之能事哉亦讃美之嘉言也故内魔不生即外魔自滅者矣九宫九炁圖乙庚合成緑丁壬合成蒼戊癸合成紫丙辛合成淡紅玄元始炁遍體生光三炁化形而演三洞始爲青光上生於天元爲白光中生於人玄爲黄光下生於地元始天尊於此一色合爲九光遍起法身光明洞耀始於混沌混爲蒼光混生於洞洞爲赤光洞生於浩浩爲青光元生於昊昊爲緑光異生於景景爲黃光景生於遯遯爲白光玄生於融融爲紫光融生於炎炎爲碧光炎生於演演爲黑光九色光耀瑩徹法身並出開天龍角經太上消魔前驅煞鬼眞符書符呪玉清慧光上清寳光太清玄光七元星光照開道路白元尊神輪轉無色太一洞章上遊上淸出入華房十轉回靈萬炁齊仙宻呪曰黄中䇿炁斬滅妖宗制伏强魔斷絶邪蹤太上有勑付我身中急召北帝朝謁玄宫山林杜鬼形狀悉同奉承威令宣告魔兇五炁蓊欝與符命衝袐藏玉文方就圓隆三天運明六天運終一如告命風火驛傳太上制魔前驅煞鬼眞符書符呪神霄玉清王勑三天大魔王欲界色界無色界三界大魔王秉勑奉行巴元醜伯負天擔石反山六目監醜朗馥横天擔力萬神之宗飛行太空管攝北酆異道妖鬼善惡潛蹤南于正炁敢不直忠千千截首萬萬剪形中山告下南北西東拒逆之者火滅雷嗔收攝魔神東送北酆元始符命神霄總領萬神敬聽急急如玉清眞王律令勑呪曰圓光五彩照我身中黄治炁剪妖祟制纒狂精斷邪蹤太上有勑付吾行急召北帝詣玄宫山林杜稷諸鬼神奉承威令宣魔王攝錄故炁歸太具五色蓊欎以飛衝祕藏玉文方就隆三天告下六天終一如告命髙上神霄命魔前驅煞鬼眞符書符曰神霄勑天魔青帝勑地魔南陵勑鬼魔青天魔王巴元醜伯勑躶魔赤天魔王負天擔石勑獸魔黑天魔王監醜朗馥勑鱗魔白天魔王反山六目勑禽魔黄天魔王横天擔力勑精魔太上勑酆都大洞大魔君勑動天兵萬魔奉行三十六天神將吏兵飛戈飄㦸逢者斬身六洞鬼妖不敢前衝風雷火烈斬鬼碎身奉命天府符到奉行急急奉髙上神霄玉清眞王律令呪曰黃中合景萬炁中藏三一順化五緯明常桃康把籍合延保生功圓道備神契虚皇玄斗豁落千妖滅亡與天同慶我道隆昌告命篆文式神霄玉勑眞符命魔奔火前導開通合虚三皇欽崇威制群魔一如告命右三朝消魔制魔命魔符作三時早午晚吿行用黄紙朱書符後告篆文三朝同各用圓封逐朝告行復爐緫符傾光廻駕符念傾光𢌞駕四字不以遍數成符玉訣祖炁出戸符上帝訣天門炁早午二朝出戸呪出隂入陽萬神開張開啓事畢請閉黃房侍靖玉女明備神室急急如律令晚朝出戸呪玄上太隂八窻開明向有所啓少女通靈事畢復位萬神潛寧急急如律令存神復爐訣香官使者至在此香火爐前二指根十方仙童玉女中指根逕詣中中御前右叩齒三通咽夜三過存千眞萬聖道炁金光自頂門而入咽下元宫黙呪臣朝奏事畢所有功曹使者一切官君並還臣身中從衆妙門而入在左還左在右還右直使功曹主領監押復還本治後召即到一如故事復爐者復我本身神明也存髙眞上聖各回天闕自然生金液丹碧芝英者乃我靈寶妙炁與十方正眞生炁混合結爲丹故有丹碧芝英妙化也此丹廼我靈寳妙光旣復元宫自然金碧交映則此香此誠無有不感通矣敷黄道符舒黄道呪天衢邈邈靈風飄然星河耿耿神風飛煙玉殿瑶光洞徹三天蒼天欎欎丹耀玄玄三天鳯輦九帝龍軒寳旛羽蓋碧輿瓊軿金鸞泛泛靈鶴翩翩玉童玉女霞衣雲肩五帝大魔九眞飛仙龍裙虎服雲冠飄綖悉臨黃道瑞炁流旋清都列聖紫府群仙森羅萬象俯降芳莚歩虚玉韻空音璚篇九霄蕩蕩八景乾乾洪恩施品彚恵澤遍山川與道合真請聖三符收黃道呪寂寂無宗倐有倐無紫雲擁蓋函返清都升壇瑞炁請捲黄敷神眞降格福慶增餘上天回駕地府參輿諸天復位五老啓途稽首瞻仰戀和氣滿霄虚靈寳玉鑑卷之十三
