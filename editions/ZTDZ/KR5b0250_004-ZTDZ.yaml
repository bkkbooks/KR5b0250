front:
  text: 靈寳玉鑑卷之四頼五
  hash: sha256:b74877eb926a537445e1bb05df077a50fb7dc865f8796d71ac0d04348c96ff30
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_004-100159b, image: sjb/10/100159b.png}
body:
  text: 靈旛寳蓋門夫盟天告地招眞召靈耀景命魔九光十絶皆所以按儀立像具體肖形傑立虚空耀靈法界開通㝠漠化度天人者也以至裁雲颺錦展綺明霞䇿景乘虚凝神合炁故得諸天遥唱萬聖臨軒長夜開光九幽罷對功赤宏矣故我靈寳大法旛節幢蓋具有成儀九當運祖炁而合神光盡精微而致廣大隨機變現應念感通作生死之津共具顯幽之標凖及其結空成梵雲篆太虚化形十方超神八極普資有識廣度沉淪實道法之指歸齋修之儀矩也洋洋在上其可忽諸存用凡立旛蓋當凝神存此方如大海水府銀波湛天了無翳礙化所立之旛爲絳節霓旌芝幢寳蓋日月星光煥明其上祥風鼓舞影泛金蓮梵炁彌羅勢崇臺閣次存自己元官一炁混接内外玄同天寳乗百寳光引照十方普濟諸有天眞大聖三十二天上聖髙尊俱來慶㑹此乃崇德建功招眞召靈之實效也四境旛右旛四首黄絹爲之各長四十九尺於預告時立於郡城四門或離城一里十里爲則朱書玉皇寳號于旛肚中篆文見頒告符簡門告盟旛右旛以黄絹四十九尺造旛一首頂書臣謹謹上奏旛身書太上旡極大道至眞旡上三十六部尊經眞文寳符太上三尊十方衆聖玄中大法師三界官屬一切威靈伏望恩光鑒臨齋事旛兩手足分書法師職衘臣姓某今據郷貫入意臣領詞難抑謹集道士一壇依下元黄籙簡文眞仙品格建立靈旛擇日修崇旡上黄籙大齋幾晝夜某時行道謹依次第宣演沖科拜奏章書頒行符命遷抜罪爽開赦幽沉然燈續明請光破暗普施斛食攝召亡魂沐浴更衣朝眞聽法傳符授戒鍊度起生滿散拜表言功投龍進簡祗設清醮一座上謝洪恩所集善功緫資升度仰祈睿澤普濟存亡謹露齋誠遍申奏告建壇旛右用緋絹四十九尺制造於建壇之日標於壇前故得告盟三界開度九幽標紀善功注名黄籙至夜於旛竿上懸綵毬燈一椀使光徹十方幽㝠開泰依科修舉庶合古儀九天寳蓋右以九色綵旛九首各長九尺肚中篆九炁符各一道背面書九天帝號手足句書各天生神章八角垂八首中央懸一首寳蓋中層間垂九色綵帶九條以像九炁登齋之始立於壇左旛中九炁符此符九巵燈牌并錬度九天旛通用右九符搯九天訣合九天炁用九天生神章祝之九天寳蓋者三天開化九炁生神萬聖瞻依百神敬仰故可慎終追逺崇德建功關啓之初依科懸立精誠不怠感應自然大齋中不可缺此青玄寳蓋式一名寳憧旛肚九龍符右旛用碧綵製之大旛一首用白粉篆九龍符于旛肚中符下篆太乙號手足或書齋意主冩符誥上以寳蓋十角每垂角卦小旛一首各長四尺並用碧綵爲之中間大旛長二丈四尺有一法作綵幢模様製之亦通此義小旛十首冩十方救苦天尊號東方玉寳皇上天尊南方玄眞福福天尊西方太妙至極天尊北方玄上玉晨天尊東北方度仙上聖天尊東南方好生度命天尊西南方太靈虚皇天尊西北方无量大華天尊上方玉虚明皇天尊下方眞皇洞神天尊右青玄寳幢於正奏時髙懸空際故太上慈悲闡教化形十方罷對停因㝷聲救苦遷抜亡爽招眞召靈无間邇遐同沾妙果回耀旛式正面背面右旛用絳綵四十九尺製之以朱砂雄黄合色書篆於開啓時立於壇前故能回景曜於重昏度神䰟於霄極聞見之者俱沐善恩大慈寳旛式用黄絹四十旛肚中書後十字一本書九龍符譯文太一大慈命開度長夜魂旛左手書茫茫酆都中重重金剛山靈寳無量光洞照炎池煩七祖諸幽魂身隨香雲繙定慧青蓮花上生神永安旛右手書功德金色光暉輝開闇幽華池流眞香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寳㫖自在天堂遊旛左脚書元始符命時刻升遷北都寒池部衞形魂旛右脚書制魔保舉度品南宫死魂受鍊仙化成人太乙救苦靈旛式旛肚中篆金闕梵行王字譯文東極宫中大慈仁者㝷聲赴感太乙救苦天尊青玄上帝旛兩手書十方救苦天尊名號見前每首書五名旛兩足書大慈大慈救苦眞人大慈大悲救度眞人大慈大悲大惠眞人大慈大悲妙行眞人右用青繒四十九尺變之此旛乃三天自然内音金闕梵行玉字隨方救苦應念垂慈開化南宫遷神北府旛形指處幽滯俱超度品之功莫先於此遷神寳旛式右用絳綵製造長四十九尺以睢黄書篆兩手篆文譯文符命通溟漠靈旛颺曉風遷神超北府飛舄上南宫旛髙懸空中使亡者削名北府遷神南宫迴黄寳旛式即命靈旛兩手篆文譯文太微迴黄旗無英命靈旛攝召長夜府開度受主魂右以黄絹製造長四十九尺以朱書篆文與遷神旛相合凡建齋當須兩首前後懸掛不可有彼而無此别法有以無英命靈旛爲標目者然玉章故有太微迴黄旗無英命靈旛之句殊不知無英乃神名也命靈者召用之義也靈旛者乃神靈之旛也謂無英之神命此旛以攝召長夜之魂也却以命靈爲旛之名大失本㫖若以度人經云天丁前驅大帥仗旛言之終不有大帥旛也理宜究之龍童旛符火府齎簡童子通天玉符地府齎簡童子啓地王符二符並玉文祖炁火府童旛背書元始符命時刻升遷地府童旛背書元始符命下達重泉鐵跡臺字旛符寳光章字旛符右二旛用雄黄和朱砂書之同亡人旛等立於八門之内如陽人以鐵跡旛召之隂人以寳光旛召之並搯玉皇訣招眞旛召靈旛以上二符並見陞壇朝奏門茭郭八門旛符人道旛符釋道旛符仙道旛符地獄道旛符業道旛符神道旛符鬼道旛符畜生道旛符已上八門報應靈符並用和釋罪魂上生仙境右存神搯太上升天普度訣祖炁靈書篆之卯午酉子中剔上出鐵跡臺光牌符見神虎門甘露旛符二符並文祖炁寳漿旛符念甘露通眞呪祝之即啓請頌見施食門右二旛用黄絹各長六尺造之篆符于中立於斛前普召亡魂旛式旛頂符太一召魂旛面符旛背符太乙召魂旛式右旛頂上書人形召魂符符見神虎門旛後書前背符兩手書三魂七魄名二足書生死年甲又一法以白繒七尺二寸作夾旛長三尺六寸以新竹長五尺五寸繫旛於竿梢一面上書玄㝠太乙召魂符下書亡人名字生死年甲三魂七魄名分書兩手一面書玄㝠七眞内諱用神虎印印之令親人執之召魂立至也五方五炁衞靈旛式東方衞靈旛符青地朱書南方衞靈紅地黄書西方衞靈白地黒書北方衞靈黒地白書中央衞靈黄地青書此五旛符即五靈五炁之文於建壇之時隨方懸於壇上故能感召諸天降伏魔試壇塲内外二十四旛篆文每首旛六符譯文每旛六字符引魂明光之旛威靈㧋度之旛垂光慈䕃之旛梵炁彌羅之旛明霞通智之旛法燈朗照之旛靈曜八景之旛玄明定眞之旛慧日流光之旛金映洞神之旛惠覃幽顯之旛流輝素景之旛五劫開化之旛通光普照之旛混化辯生之旛靈光皓映之旛垂芒流照之旛神光廣被之旛度名玉簡之旛思神玄感之旛龍威梵度之旛霞光朗映之旛育魄洞照之旛玉皇赦罪之旛五方壇旛如前旛式五方玉字篆文譯文東方九炁天君九陽梵華之炁譯文南方三炁天君三陽梵靈之炁譯文西方七炁天君七陽梵英之炁譯文北方五炁天君五陽梵寳之炁譯文中央一炁天君一陽梵混之炁右五方王字篆文各方一十二字於旛身上作一行書下書符用各方炁訣綵用各方顔色繒帛製造各長七尺㸃筆取顔色相稱者不拘方位靈寳玉鑑卷之四
