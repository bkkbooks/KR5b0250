front:
  text: 靈寳玉鑑卷之二十二萬六
  hash: sha256:28c598060a70202206e11878adddbf62c682e4f8cf50f5f7d6afdbc2573ed00e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_020-100303b, image: sjb/10/100303b.png}
body:
  text: 告給符籙門道一變而爲法蓋法爲道之用也然道爲法之體者亦無在而不在也乃日用而不知耳經不云乎譬道之在天下猶川谷之與江海蓋祖炁亦然而萬法之中何莫由斯也是故靈寳大法有符籙簡誥者而義亦有所自來矣在昔皇人按筆八角垂芒曰鳯篆龍章曰金書玉字皆上古天人之法製也所謂符者以合其妙籙者以紀其功簡者以格其言誥者以出其令是皆法元始之祖炁合靈寳之妙光以㑹神著靈於竹帛金玉朱墨楮札之間而微顯闡幽開光長夜執符把籙監眞度生亦體夫自然神化玄通之妙也宣行之士宜静虛守一注念凝神洞徹幽明混融内外則我之法性元神即是本來眞身元始其一㸃一畫悉是道炁金光誠如是則无所不通无所不度者矣道法體用豈有他哉請降諸符啓奏具仕臣恭焚寳香重誠上奏三清大道十極髙眞啓教宗師三界官屬伏望道慈俯垂洞鋻伏以開壇蕆事聿嚴靈寳之科章濟苦度亡須假玄元之光炁臣退慚蒙昧未造精微然書篆恐未合於玄䂓故施用當力祈於眞命伏望勑侍仙而啓藴付小兆以承宣普告萬方俾遵行而無滯開度群品即時刻以昇遷臣干冐天威下情无任激切俟命之至稽首再拜謹言書符行持存用凡書篆諸品符須依法入靖香燈紙札筆硯之屬一一備具先行內錬十轉回靈之道法師靜座調息神氣澄虚存下丹田淵泉宫靈寳先天祖炁自中而歷二十四節直透泥丸頂門又復降下元宫復升周迴十過畢次存三田中有三尊乗三色雲氣上升端坐泥丸之中次有天上三色雲氣中三尊降自泥丸混合爲一如此分明自已丹元君上朝心奏所陳之事須㬰慈顔允奏勑命左右侍眞金童玉女捧琅函玉笈在百寳光中降付容臣奉行即宻謝畢自己眞人頂出寳光混合神炁内外洞明鳯篆龍章徘徊于几案之上叩齒十二通執筆呪曰溟涬大梵寥廓無光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存右玉訣天門炁布之念合明天帝日三遍勑朱墨呪玉音攝炁靈風聚煙紫虚鬰秀輔翼萬仙千和萬合自然成眞右搯子丑順至亥歸中吸巽炁旺炁布其上玉清大梵呪三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隠韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清右玉文祖炁勑諸符等用押字呪疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷勑印呪億曽萬祖幽魂苦爽皆即受度上昇南宫存太一天尊三十二天帝三光大聖並降金光道炁灌注無窮次取日精之光合東方生炁九息布于筆硯之上右執筆調朱左搯震文呪曰玉誕長桑栢空度仙丹華曜水度魂升天炁暎白簡金光自然永劫長存安鎭寒泉幽魂開度長保劫年存我本來眞性神光即是天尊運筆書篆救苦簡正面符書符呪帝眞混合鍊神溉胞左右奉令司馬洞謡九壘土皇空洞九朝紫户定錄神府升霄開度長夜隂貫陽標三張緫御合慶幽寥六炁咸通明梵演招司命司錄司功司殺緫統三靈明示都府玉皇上帝降勑開幽中理五炁混合百神曇誦延越承命三清九陽司化百神應朝覆雲育靈拔度況㝠太明合曰隂境承輝天覆之精下䕃地靈赫奕玉帝威振火鈴北酆受籙九幽齊升㝠曹合同準勑遷神神筆一下明檢鬼營三官五帝放大光明牛頭獄卒咸皆聽命周回萬里罪苦咸停急急如律令勑呪元始上聖玉帝髙靈玉文告命濟死度生金籙妙戒拯護幽㝠白簡寳文九眞玄經解消罪咎𡨚債和平救苦眞人削罪除刑察命童子注上生名護戒威神引詣福庭超離五苦乗戒雲駢轉輪得道飛升上清祝呪曰元始符命茭龍驛傳隂關夜府罪苦咸原通幽達信魚龍告宣魂魄受鍊永離鬼關乗功遷化上升三天一如告命下入重泉救苦符簡背告文元始符命金籙白簡救苦眞符告下十方无極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔拔度某等魂出離地獄永辤長夜覩見光明萬罪消除𡨚仇和𥼶乗此九眞妙戒拔度功德上生天堂一如告命年歳次月日於黄籙齋壇告下預修告文改曰元始符命金籙白簡救苦眞符告下十方无極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔覆護預修弟子某隨所救度出離幽沉覩見光明因縁輪轉衣食自然得爲初學天人一如告命年歳次月日於齋壇告下右符栢梓木長九寸闊二寸四分厚二分朱篆時如前符命作用面東長跪取生炁九口爲日華之光吹布簡文用震文念後呪如普度亡魂於几上九吹於簡上存日華周圓無邉方始書之用玉帝訣簡袋式救告眞符告下十方無極世界具位姓某謹封預修書符呪天寳君靈寳君神寳君朱明景化保素通眞后𡈽九壘俱㑹帝庭五炁混合日月停輪魔王保舉諸天紀名三元合慶中監五嶽下統人倫注生注福司命司勲南辰北極陶魂鑄魄六紀齊并金輿玉輦朝謁三清九霄斡運紫户生神陀羅育邈渺炁合雲九府安鎭幽爽完形華都曲麗禀勑奉行長生簡正面符中訣祖炁仰首取南斗炁書符呪元始上帝炁灌胞元玉皇上帝玄化照臨左陽眞神右隂靈神無上七元九幽罪魂神珠曜日晝夜華明天帝合明地神合精黃雲欎單氣象交并左司天府君形九隂右司天府上生君胎三元校録九夜升騰覃赦五嶽八獄惡根太一司命桃康奉令司録諦迎司非敬聽太極都治八天元君太玄司方召八靈君天合地合日月合明三元四始隂陽混凝朱陵火府王帝華京朱陵帝君爍煌炳煥煜𤊞煴上元天帝君命急行元皇下覆三官奉迎九地九水九隂關津道路開通送護神庭太上老君千眞監臨泰山之府承命咸遵天勑宣行黄光洞明司命元一執符把籙尾毫爲使飛逵帝宸度名南斗更生上清勑呪元始上帝赤書玉文解消隂結以證超眞刀利南極浮閻之神流火受鍊禪猷保生婆泥靈童與滌隂穢表裏瑩徹玉嬰之形飛歩禪黎洞陽之庭一如告命金龍驛傳祝呪日中赤帝號曰丹靈眞符命仙玉籍保生虹映玉華焕落上清七世父母累命重寜越此宿對禍滅幽㝠公子執吾符太一居紫房三合地戸下拔命上玉宫急急如律令又呪司命受錬相火成罡梁爲天牢同感陽光樞機輔弼星列玄章育精太明赤車凌芒鍊化神府表裏俱昌急急如上帝律令白簡緫呪太上開明元始監眞五老上帝赤書玉文拔贖一切宿對罪根皆蒙解脱考對俱停魂升九天魄度朱陵今日大願萬神咸聽龍負白簡關告眞靈气如所願風火驛傳長生符簡背告文元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司錄延夀益筭度厄尊神回骸起死監生大神超度某等靈魂上登朱宫流火之庭玉眸錬質黄華蕩形書名紫策受化更生乗此金籙度命功德時刻升遷一如告命年歲次月日於黃籙齋壇告下預修告文改曰元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司録延壽益筭度厄尊神回骸起死監生大神覆護預修弟子某生身受度劫劫長存随劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清一如告命年歳次月日於齋壇告下簡袋式長生靈符告下南方丹天世界具位姓某謹封金龍驛吏符掐玉訣西北望太微尊星引黄光内合布炁玄都金龍驛吏二人承誥頒符馳信天道達命朱宫鍊度亡魂受錬更生一如告命右符黄地丹書冩兩邉告文粘於長生符關中茭龍驛吏符北一星居斗中即北辰也在天皇之右引光書符玄都茭龍驛吏二人承誥傳命告下隂府泉宫開光赦罪拔度亡魂上生天堂一如告命右符青地朱書并寫兩邊告文玄都茭龍金龍驛吏傳命泉曲開光赦罪凡告頒救苦長生二符必須關聞驛吏以二符粘於關中救苦簡内符子文北炁紅素黑書入於簡袋内長生簡内符午文南炁黄素朱書入於簡袋内東極青玄救苦九龍符書符呪稽首三境尊紫陽開玉匱重昏遇朗日長樂天宫啓金光降仁惠大慈仁者勑九龍使者青玄童子救苦眞人青玄靈官乗龍降世法雨慈雲吹灑地獄永除酸辛九幽罷對六道停輪承兹天澤幽魂飛昇十方天尊應化沙塵随念升降拯拔亡靈執符奉行上生福庭急急如青玄天尊勑右符再入大九龍符存太乙慈尊御九頭獅子金蓮之座眞仙侍衛放百寳光洞照天地師即黙奏請符仍念睿號八十一聲感天尊恩命左右侍眞開紫陽九光寳藴出授前符師即拜授次執丹筆再念睿號九聲引東炁入筆然後書符訖再念睿號九聲取炁吹符用玉清訣九龍符告文用碧紙朱書東極青玄救苦九龍符命告下三官九署五嶽九州酆都六洞十宫九幽河源泉曲五道都府城隍社令㝠關幽扃一切主者咸領符命拔度某神魂及九州分野病死横亡沉魂滯魄囚苦罪魂俓出隂翳永離幽㝠地獄消苦開泰泉扃火翳滅熖刃毒摧傾下明黑暗上生朱陵超度三塗宿對停輪一如告命風火驛傳年歳次月日時告下具法位臣姓某承誥奉行東極宫中大慈仁者尋聲赴感太一救苦天尊内封東極青玄救苦九龍符具法位臣姓某謹内封方函式東極青玄救苦九龍符命告下三界十方九野地司隂曹萬神具法位臣姓某謹重封東華青宫生德開光寳符告文簡髙一尺二寸闊三寸二分用粉粧朱書封題如常式上東青林太皇萬福道君生德開光寳符告下十方無極世界三宫九府百二十曹五帝考宫酆都嶽府泉曲九幽溟泠五道大神河源水官㝠關主者拔度某出離㝠府地獄解釋愆尤上生東方太皇之悟明正道逍遥自然一如告命年歲次月日時告下簡袋式生德開光寳符告下三官九府五嶽九州冥曹具位臣姓某謹封三炁流光救苦眞符上帝訣東南炁書符呪元始上帝虚皇天尊无極大道太上老君玄元始炁九天眞文鬱儀孕殊結璘合輝三光朗耀七元流珠恩覃泉曲澤流血湖胎元散結穢累蕩除慧光接引上升天衢勑符呪靈寳玉書拔度眞符流光普照蕩滌穢軀天符告下俓上南都急急如元皇上帝律令判符呪眞符在手永救血湖巳徃𡨚業一鍊消除急急如元皇上帝律令祝符都呪大慈二眞人能救産死苦放光照世界地獄悉停住刀山髙巍巍鑊湯沸炎炎至心念眞人罪縁宿𡨚解晝夜心不離解脫全爾身歸心發回向同上七寳林急急如元皇上帝律令三炁流光救苦符告文靈寳符命三炁流光救苦眞符告下十方無極世界九幽地獄大小鐵圍有間無間溟泠北隂之府符光所照摧破幽隂火山息燄寒池摧冰刃爲寳樹劒作騫林乗此符命拔度某洎血湖産死一切罪魂出離北府俓上南宫靈寳符命時刻升遷年歳次月日時告下簡袋式三炁流光救苦眞符告下無間血湖諸大地獄主者具位臣姓某謹封盪滌血湖符元皇淨尸符並見玉元追度門玉清寳籙拔幽魂眞符西北炁吹筆東炁吹符上拔出羅酆九幽泉曲之府勑赦火鈴呪曰三天大羅髙上玉清元始靈書太上眞文玄元天道勑降玉晨天洞天眞主領魂神九幽主者六洞眞靈禀受眞符拔度沉淪天王律令隂曹奉行勑呪玉清布命普拔幽魂天光一照罪源蕩清急急如髙上神霄玉清眞王律令書符呪元始符命緫炁上元普告三界歷關諸天風澤洞虚萬炁齊仙元洞玉曆玄化重宣九泉幽爽斬絶地根回骸起死時刻昇遷三官九署衆惡咸原拔出地户九祖升玄急急如靈寳天尊无量度人律令勑呪幽魂多悲苦當思神霄君玉清眞金符煥赫破泉扃釋汝解幽閉拔度出沉淪上升刀利天錬化升丹庭急急如神霄玉清眞王律令緫勑符呪神霄符命勑下九幽諸天卒吏符到奉行一切罪魂赦之生天急急如玉清眞王律令天獄靈官司命救生眞符到處破獄生天急急如玉清眞王律令拔幽魂符告文黄紙朱書髙上眞王玉清寳籙拔幽魂眞符告下十方三界無極神鄉三官九府百二十曹水火罪録五帝考官酆都内外洞宫五嶽九幽泉曲九壘十二河源九州社令地水萬神拔度亡過某等魂疾除罪簿落滅惡根不得拘留囚苦罪魂乗此眞符救苦功德時刻升遷萬神護送俓詣丹天隨品受化更生福郷一如告命風火驛傳年歳次月日時告下具法位臣姓某承誥奉行可漏式玉清寳籙拔度九州分野一切幽魂具位臣姓某謹封方封式玉清寳籙拔幽魂眞符告下三界十方㝠曹主者具位臣姓某謹重封玉清寳籙破地獄眞符西北炁玉清寳符開破九幽北酆憲壘勑攝火令通誠敷奏呪曰至聖神人已成天眞三皇之裔太上之孫億曽萬祖苦爽幽精天尊大法十轉回靈赤書成章告下泉㝠玉文一下摧滅鐵城符光洞煥赫奕重隂刀化玉樹劔變騫林炎化生蓮冰消雪扃三塗五苦八難超凌魔王隂官稽首送迎玉清元命一如奉行勑呪三天寳誥勑汝諸鬼關鎻速開鐵城摧毀拔度罪魂速離鬼軌急急如玉清真王律令書符呪九泉寒夜期劫綸塗幽隂夜壑忽覩光輝照破九壘何敢不隨禀遵帝命金剛折摧風雷消散火翳化池溟泠温和普掠無施火車息燄鑊湯罷吹銅柱摧毀屠割停錐元始有勑符到速追魂離酆岱魄出鐵圍有罪無罪急赦無違三界侍衞萬神敬依勑呪玉清天尊告下幽隂元始勑命火急奉行九幽冥府酆都大神冥司考校水府職庭十方合屬一切有刑亡魂罪犯天命赦行急急如髙上神霄玉清眞王律令破地獄符告文用七尺黄紙朱書髙上眞王玉清寳籙破地獄眞符告下北隂酆都内外六洞天宫三十六獄無間地獄泉曲水獄大小鐵圍山地獄長夜考掠隂關冥司主職萬神咸領符命眞文煥發照耀隂冥塗炭罷對考掠俱停炎火息燄冰雪消凝刀化玉樹劔變騫林疾除亡過某罪簿落滅惡根不得拘留囚苦罪魂乗此眞符救苦功徳速令出離覩見光明上升南宫受化更生一如告命風火驛傳年歳次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應眞君泰玄知省天君天樞右相天樞左相天樞上相天機内相天機上相玉清神公無極上相可漏式玉清寳籙照破地獄救苦度魂具位臣姓某謹封青函式玉清寶籙破地獄眞符告下九幽酆都天牢地獄主者具法位臣姓某謹重封靈寳玉鑑卷之二十二
