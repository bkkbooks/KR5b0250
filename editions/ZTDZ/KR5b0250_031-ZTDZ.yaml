front:
  text: 靈寳玉鑑卷之三十三方七
  hash: sha256:54206a88b0b14a200724adfd47040047c343718c03fec57a886913b0d194185f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_031-100366c, image: sjb/10/100366c.png}
body:
  text: 召攝幽靈門夫法性平等廣大無礙增之不益損之不𧇊近之不邇逺之不遐聚而爲一不爲不足散而爲萬不爲有餘曰天曰人曰聖曰凡𥘉未甞有以異也奈何衆生業識漸染離本去原毫釐之差千里之謬是以崇卑頓異凡聖逈殊彼此相速億萬有間是故靈寳犬法有召攝幽靈之㫖蓋以神通威力普度天人猶恐諸趣尚或沉滯未究法性之玄故以清淨自然靈寳妙光普攝普度使十方無礙萬境圓融則心内聖凡性中天地洪纎一致無欠無餘此眞一不二之妙義也豈易異哉淨穢天目符子文北炁呪曰天目神君急速降臨流布眞炁助吾眼明立見神鬼役召六丁鬼神受命不得隱形右符焚於水盂中以太玄神水頌灑之不可念淨天地等呪天地尚淨何鬼敢當切宜愼之呪食夜齋香符上天炁玉缺呪曰食滿十方通開百飽食之無盡飛升玉都急急如上帝律令攝見爽靈符卯文青玄炁吹壇下祝曰謹請無上救苦眞人左玄眞人右玄眞人摇金精動玉户照見天上天下攝見亡某及六道四生幽靈滯爽速現大身急急如玉帝勑開通道路符散形天門地戶人門鬼路天地清寧開扄長生和平所生日月角至十方太乙九幽所成軫救苦天尊拔罪天玉皇上帝勑開天門通地戶留人尊門容鬼路攝召亡某幽靈等衆來詣壇所以受生九幽八獄天曹吏方不得久停五道開通兵送某魂天網開通日月星到死魂釋脫三景明呪曰元始登引天眞大神上聖髙尊妙行眞人十方無極至眞大神傾光回駕監眞度生諸天丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄕泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷急急如元始無量度人律令右符焚存灰於手中合玉訣念前呪吹灰於壇之座下存大行梵炁周回十方遍滿壇塲内外洞明並無遮礙左手艮文右手劒訣面鬼戶丁罡三歩以劒訣虛書攝召長夜府五字祝曰引領鬼魂使者地道鬼道當界土地五道神祇疾速與吾監引所薦亡魂及六道幽爽赴壇受度吾奉玉清勑再以劒訣向鬼户畫開字存黍珠妙光照破黒暗左瞬目三次定神覺悲風悽慘髣髴見幽魂自艮户出俱集壇前召六道二十四類孤魂等文並見科範門召六道訣天仙道子文存自天門乗寳光飛雲而至于上神明道丑文存自地户乗梵炁駕風馬至于左人倫道寅文存自人門乗寳光而至于右地獄道申文餓鬼道酉文畜生道戌文念三官北酆呪運目出慧光飛斗雙手搯玉清訣引炁如河路鼻出二炁融合運太一圓象之光自天而下燭破幽隂衆魂皆隨光赴壇召六道符天仙道符子文寳光炁呪曰元始攝召汝符命吿十方咸聞大法音天道應福堂急急如律令又呪玉清梵炁普告天仙參馭飛雲咸赴法筵急急如上帝勑神道符丑文梵炁呪曰功成利萬物妙化應諸天含符攝召汝方七五神道合自然急急如律令又呪玉清大獻廣布酥酡髙際九霄香環十極咸令度化普受法食急急如上帝勑人道符寅文白光炁呪曰三界法元主應物享無邊聞會上眞語人道俱成仙急急如上帝勑又呪玉清大化梵炁氤氲普遍攝召接引人倫急急如上帝令地道符申文玄炁呪曰符命應三界攝召萬靈分法音弘妙㫖地獄開光明急急如上帝勑又呪玉清大化洞徹幽都地獄開泰罪魂無拘急急如上帝令鬼道符酉文空炁呪曰飢渴由念業罪累分重輕元始告符命鬼道成仙形急急如上帝勑又呪玉清大化慈悲生神飢虛焦枯咸享豐珍急急如上帝令業道符戍文濁炁呪曰浩劫迷本眞苦汨於四生東華垂惠力業報獲淸寧急急如上帝勑又呪玉淸大化普濟含靈四生情𩔖來赴壇庭急急如上帝令召四生符胎生符子文乾炁卵生符酉文兌炁濕生符坎文艮炁化生符亥文巽炁呪曰太素玉神駕車赤龍上通無極下入幽㝠追攝三界十方六道四生男女千品萬𩔖滯魄孤魂等衆疾速降臨化形㗶吒吒普急急如上帝勑召孤魂符卯文東北炁召祖先符玉文祖炁普攝符卯文東炁追攝赴斛就食現形符玉訣祖炁呪曰元始符命速現眞形朱陵度命孰敢隱形急急如律令右念呪七次焚於斛前緫祝呪玉清大梵輝耀三塗提濟六道陶毓萬殊雲章寳篆紫府丹書咸承拔度上生清都急急如元始上帝律令靈寳玉鑑卷之三十三
