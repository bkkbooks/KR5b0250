front:
  text: 靈寳玉鑑卷之十九萬三
  hash: sha256:91d7a299ccd069c31b5a82615b477d741ca65cb3510d9a7bd65994745eb809e3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_017-100283c, image: sjb/10/100283c.png}
body:
  text: 飛神謁帝門九靈章奏拜壇式此壇式當法三級之義内一級或以中黃内篆符之其二級以八卦書之其三級即以青龍白虎朱雀玄武列於四方臨祭壇時更以度罡風符加於下想之天地造化合運于中於上拜伏無不感應者也驅使罡風符劒訣天門炁右符想從官力士天仙兵馬萬衆升度罡風此符朱書鋪於拜壇下分神詣職變神眞炁淨穢符子文北炁呪曰天地穢氣尸氣却隂玄水蕩穢香湯吐精玄光豁蕩甲庚錬形急急如律令右符念淨天地呪祝之想霐三字金光目運於水次有九首火鳯於前太玄玉女注水下降灑淨謁帝變神符玉清訣祖炁朱書清木化服或焚之呪曰吾乃元皇之子太上之孫玄通無上妙達三清五藏神君百神萬靈九靈之炁三天之精玄眞極應萬象咸成太玄神符分明上京豁落流鈴㝠㝠澄澄徃來金闕出入芝英急急如律令五神寳符玉清訣五神炁右符念眞中有神至萬炁齊仙以合明天帝日祝之爲小九棗湯服出神符玉帝訣祖炁呪曰太上神丹光耀三田能令冬熱即使夏寒我身思念變化自然出入五内百邪不干念呪畢凝神洞見五藏百神調於棗湯送下祝呪魄居華蓋金之神肝元魂神青帝君心主南方赤帝君脾中黄庭秀方眞賢中烈女秀夫人玉府三千兵吏分祛邪殺鬼奔雷雲五炁朝元天地人頂上泥九蒼子春左右童子護吾身吾奉天帝得安神急急如火光勑攝圭上朝眞符用金鏤文圭上玉帝訣存元始一炁金光成符呪曰元始祖炁眞靈下降升度罡風截除魔試準令奉行勿犯吾制急急如元皇律令冠内升眞符斗訣天門炁入符於冠中頂上呪曰三天允賜立玄頂冠九玄七祖保度忻顔名達玉京神相金光急急如律令左肩通眞符右肩通眞符二符祝呪兜祁伊姪呼嚕呼囉只只憂吼耶摩哪僧伽劣澀澀呵呵羅耶備抜須留抜抜須攝留須吸吸攝急急如太上老君律令旋斗符隂日震文東炁右左足足歴箕符陽日震文東炁右左足足四符祝呪六丁捧足神魂利貞剛風無阻黄道潜升乗空歩虛朝謁帝君急急如律令三天玉契符四寳組炁道玉清訣左上右下右符四道各念三天妙諱存金光入符焚於左右上下臨壇用次念上清天寳呪魁靈元輝上景紫沖蕭羅大梵元漠奎婁陽光流火照日洞陽急急如紫微律令熏章符捲章符印章符入章符章函四則上符四道下符左符右符章函面符玉文祖炁金光萬重覆映于上書符呪三台流輝斗星眞炁上開八門混沌陽光結炁成形通炁萬化三宫朝元二妙回合輪轉成眞玄罡合璧透徹三天玄元始敕八衆妙門章函底符書符呪三炁陽光洞煥眞星玉清有勑衝破隂罡天眞天令回度五常九轉九炁束制中央天元天元雷神雷神魁罡激指風迅雷庭九陽交圖玄感三辰炁應天運三景通眞衝破剛風浩氣無停神霄炁衝廻反權衡運通中急魔王保迎袋上符書符呪太極未分陽炁混淪上極无上大羅玉清元始祖劫三景開明始陽九炁停華育魂勑開八門洞朗啓扃玉符告命金馬驛程火鈴前擲雷激電奔急告上景俓上紫清奔飛日月合景三辰玄光煥發衝罡驛程三靈九炁混合我身天靈節榮性返歸眞靈寳心呪祝之和元陽炁降集三靈拘魂制魄内外洞明玄景眞苗道貫始青三部八景炁周杳㝠心寧南北坎雜自清眞羅鬰絶上開八門飛度三界合制乾坤通天符版師取本命日用棗木長五寸闊二寸半刋符於上作一穴穿五色線帶肘後隂日右陽日左以絳紗袋之露星月二十一日遇本命用香花茶果十二分請北斗九晨并通天符使降炁于符佩符呪天輔無私乾象通微無幽無㝠無感不知佩帶符圖神兵任呼我佐上王身登仙都急急如天君紫微上道律令勑三天合同契劵念靈書中篇搯玉訣取五方炁入符師臨登壇時以黄紗袋之佩帶之升入天門則萬神侍衛五帝司迎庶寳章上逹也章袱四角符東西南北袱中符玉文祖炁書符呪梵炁彌羅出隂入陽倐忽萬程風馬雲奔去來無礙直造天門捧齋玉章與道合并章關前符右仰日直功曹符使火急準太上勑命疾速進呈取伺報應火急奉行法師押字書符呪上台一黃中台二白下台三青並降真靈北帝勑玉帝勑太隂皇君太陽帝君角至軫搯二十八宿南斗煞童隨吾後行隂陽決吏疾速奉行魁至魒炁訣一轉太乙尊勅除鬼賊二轉起星光千妖盡伏藏三轉三天勑除災降吉祥四轉四天降何鬼輒敢當五轉五帝眞疾病永無侵六轉六神定天神斬妖佞七轉収邪鬼助國救生命急急如太上律令祭章召將符存諸將如本法搯玉文祖炁結界四維髙功仗劒執水盂詣天門地户人門鬼路各方噀水作用表白宣呪侍職焚符表白至天門宣呪呪曰天門開張鬼道消亡今日安壇臣欲奏章西北之維戌玄中央萬神於此執戮不祥髙功噀水擲劒次至地户表白至地户宣呪曰生炁流通不與眞同今日奏章乃立壇塲東南之維辰巳中央地户於此収戮凶殃髙功至地户作用畢次至人門表白至人門呪曰出隂入陽五内開張天神聞之皆整嚴裝太上使我今日奏章西南之維未申中央収戮百鬼何有敢當高功至人門作用次至鬼路表白至鬼路宣呪曰陽炁流晶百邪不生今日奏章先立壇塲東北之維丑寅中央鬼門考鬼剪滅邪精急急如律令右呪臨壇焚後四符次第宣呪天門結界符地户結界符人門結界符鬼路結界符飛章火鈴符右符左手執章右手執符想心火從頂門出内有金甲緋衣大將軍擲火鈴直衝罡風至天門呪曰炎神炎神火鈴金精通天開道速達帝庭六天九醜無敢輒干上帝有勑風火不停急急如律令靈寳玉鑑卷之十九
