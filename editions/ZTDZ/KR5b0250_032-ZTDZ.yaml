front:
  text: 靈寳玉鑑卷之三十四方八
  hash: sha256:d3d3ee49adb834db434c23bf9a6f3eb4751cf37ece582f284ca081abf995a402
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_032-100370b, image: sjb/10/100370b.png}
body:
  text: 列幙敷化門夫道體若虚空然無所不容無所不化也豈限以一隅而成哉且知月出于天凡有水處影無不在也雷震于地凡得聞處聲無不應也法性亦然静虚則能應物也苟推常善救人救物之心而無所不被其化也故衆生障翳本來元明眼根依物乃轉種種染著造諸業縁生前爲疾病所侵以至毀傷夭折形體不完皆不得其正命而死也身雖滅度妄念猶存故以靈寳大法敷化一科以元始妙化而復其本然之性天庶業識斷除善根滋長復何疾病困苦之有哉經不云乎吾有大患爲吾有身及吾無身吾有何患今旣身空幻滅雲散月明不著於色相之塵不落於萬縁之化豈語言文字所可議哉九天監生眞文呪曰飛玄之氣結成眞文死骸開度萬品生根右九天監生眞文一十六字作眞文立於監生司中鬼神見之自然百骸流光辟却尸穢血光之氣九天監生司謹請九天監生司馬大神衞房聖母元君天醫列職仙衆只今引過血湖未分娩産魂約入幕次俾令分娩托化人天召天醫符卯文東炁誦隱語書之呪曰太上九光眞華之炁流光下臨洞徹九幽上帝有勑普救幽魂出離苦爽速離寒庭急急如律令天醫尚藥符斗叩天門炁呪曰天醫大聖地醫元神靈丹仙藥普救群生降臨眞炁聞召速臨吾奉南極好生大帝律令又曰天醫天醫速降天門拯救群生治病消危上帝有勑風火急行急急如律令次想亡魂入幕分娩符中文靈寳炁謹請加保之母速賜眞炁救死魂生天衆念靈書三徧東南炁想魂入幕念巳生未生皆得生成一法四句並誦又念三十二徧每三徧一取靈寳炁吹去亡魂母子分解又呪三徧呪曰元始洞玄靈寳本章胎化生根斷除邪穢百神定命離合自然雌一變魄雄一變魂混洞變化中有帝尊和陽召隂鍊精正胞昇降明堂暉映景霄内結流珠融結萬方紫煙青雲玉嬰金光産亡之鬼胎根解散母子速分太素生五臟七魄入泥丸急急如上帝勑監生符卯文長生訣呪曰天帝合明下付幽𡨋眞炁成象隂陽附行宿愆𡨚纏解結開明監生速降衞房急生玉眞靈書救拔産清大道有令天醫全形急急如律令唵嗚輪尼哆嗏全形符呪曰太上大慈死者能完神形得妙上朝玉房急急如玉淸上帝勑出胎符二指下節蕩胎符二指中節呪曰元始符命時刻升遷胎根生化返靈向眞斷除邪穢變化形營死魂受符仙化成人蓬丁中文黃確酉文天中之靈日月俱通甲乙炁令五行旺尅八景玉音守符眞形招靈致眞攝魔符使速降通靈承符奉令輒莫容情急急如律令迴骸起死符衆誦靈書三徧存一炁金光洞徹十方永度三塗符卯文東炁蕩穢所謹召本司壇下官君將吏請同運穢神君收穢神君却穢神君除穢神君斷穢神君滅穢神君洗穢神君破穢神君盪穢神君東西南北四靈解穢神君將見今巳産亡魂及幽魂中巳生未淨衆魂同入室中滌除穢炁使得受生汝等衆魂巳沐生成之恩仰再入室滌盪穢炁元皇淨血尸沐浴眞符呪曰天河神水洗滌凡軀普濯膻穢消罪蕩除玉籙符命徑上南都急急如元皇上帝勑元皇蕩血尸清神眞符呪曰神淸炁化鍊質形軀内符所受保舉帝書經絡存布徑上南都急急如上帝勑元皇蕩血尸通靈淨魄呪五行之炁周流三光之炁飛浮神魂澄正歸上天㑹合萬神玉亰遊師爲慈尊頂出震炁注血尸皆令淸淨托水孟掐卯文東炁入幕遍灑滌血穢通神淨魄符卯文東炁呪曰天帝有勑曲赦生靈蕩涂血穢舉令通眞流光洞照體合自然急急如上帝勑又呪太華神水浩渺無窮能令穢濁悉變清涼玉華流注魂魄生光符與眞人俱㑹玉房急急如律令子文北炁焚符入孟想内外光明解穢通眞符呪曰天地成章光射三宫三魂守固七魄守中解穢除惡道炁無窮令魂通炁上逹陽光急急如上帝勑又曰隂尸九轉化成神尸水火之炁變入玄玄三化九鍊升入無爲九天之劫鍊度身魂受化更生得爲眞人急急如上帝勑水鍊血尸符子文北炁呪曰元始符命拔度幽靈血尸臭穢兇惡潜寧七液得注五臟光生急急如上帝勑建天醫院臣謹䖍誠上啓聖祖神農皇帝天醫大聖九天髙明大使神功妙濟眞君胗脉奠師尚藥靈童治病功曹握針童子盧扁神王五官醫吏六職治官五行典吏驗疾慱士審疾眞人九天司馬衞房聖母監生大神胎生君護生君分生君速生君加保之母浣濯夫人靈寳局中主産功曹下死胎功曹天醫合屬仙㬰臣聞二炁運行尚有否終之理群生處世寧無故誤之愆疾恙旣纏死生難愈臣今攝召六道四生孤魂滯魄等衆切慮生前妄想夙世貪求智巧紛紜利名纏縳神虧精散氣耗形凋生時爲病苦所侵死後乃随魂受疾復有一切傷亡及諸横夭雖爲鬼爽晝夜呻吟杳杳沉魂滔滔滯魄若非經由於拯濟亦難臨與於法筵仰體道慈依科拯療謹請天醫列職官君尚藥治病仙吏於鳯凰宫中取太清五色神藥散布亡魂拯療生前一切疾病分頭拯治木官散藥火官主灸金官持針水官主湯土官和劑五官醫吏恊力同心全形復性如有拳攣跛躃病者請針灸神將治之或有瘡癤膿血病者請外科使者治之或瘖啞未疾死者請活人天醫治之或證候不明而死者請拯候功曹治之或胎産横死者請玉仙聖母治之或驚悸霍亂而死者請安魂定魄童子治之或飲藥食毒而死者請續命放生眞人治之或患傷寒時氣而死者請發汗神將治之或首體不完而死者請續頭功曹治之或身狀不完而死者請聚形功曹治之或肢體不具而死者請返魂功曹治之或喪亂眞炁而死者請全形聚炁功曹治之其余該說不盡者請列職仙眞察證候而治之俾令首斷爲續筋斷爲聮骨傷爲𥙷身碎爲全水腹爲去縊縳爲釋枷鎖爲脫泥沙爲除蠱癩爲剥膿血爲淨胎孕爲下蓐損爲育仇讎爲解執對爲和盲者開視聾者發聦啞者能言跛者能履攣者能伸悲辛惱亂者應時解釋飲渇焦勞者即得淸凉胞胎散滯者結節踈通炁體平安形神整具克期超化受鍊更生臣干冒聖威無任懇禱之至謹言五帝全形符青帝護魂符卯文紅杏九聲呪曰太華木司九炁元君閉固神炁青色周溢色自初胎息經千息青色俱充内自凝結急急如上帝勑右符東方青炁九道入口運肝炁相合自左目嘘出彈訣存木官降藥拯療衆魂白帝侍魄符酉文磨眞七勞呪曰金華金生七炁老君西方庚辛太微玄眞内應六府化爲肺神見於無上遊於丹田先護我命用之必仙急急如上帝勑右存西方白炁七道入口肺經白炁相交自鼻呬出弹訣金官持針療魂赤帝養炁符午文襪臘三聲呪曰衡霍火官三炁元君南方丙丁赤龍君停隂神避位陽官下迎思之必至用之必靈急急如上帝勑右存南方赤炁三道入口運心炁相交呵出彈訣火官灼艾拯療衆魂黒帝通血符千文墨黑五道呪曰恒山水帝五炁元君乾坤妙用隂陽降升周運崐崘炁返周天超凡入聖莫非炁神出入玄牝徃來變形五藏欲見黒色通靈金木間隔隂陽混成急急如上帝勑右存北方黒炁五道入口運腎炁相交吹出彈訣水官煑湯拯療亡魂黃帝中主萬神無越符玉訣靈寳十二聲呪曰一炁天君嵩山土帝中央戊己内藏元炁黄色力堅運之可治丹陽莫辭朱書共儀得達四肢黄雲大起急急如上帝勑右符存中央黃炁十二道入口運脾炁相交呼出彈訣土官和劑拯療亡魂各方中金童玉女擁輔五帝握三塗五苦訣念後呪七遍金城孕秀玉洞凝神眞氣内養以成眞人今日受鍊上登朱陵魂魄受鍊與日同明急急如上帝勑五帝全形升度符聚魂復形全體呪興生卯獨𨽻辰可韓已興生轉下辰獨𨽻遷卯可韓明寅功都成切角正聚魂對魂攝寅至已出灌漑飛魂魄今復見全形急急如上帝勑太一返眞符中文祖炁呪曰一生萬化運行不息玄機自然紀度潜歴虚景合明妙宗湛寂有無二致咸契中極急急如律令引五炁入符存五炁歸一作用玄元始炁呪玄元始炁孕育三元肧胎肇始二景回旋隂陽藴秀凝結胞元形容世壤積業無邊五宫六府結塞三田百關九竅累滓成愆形消炁散魂繫九泉隨魂受疾求脫何縁天醫尚藥拯療痾纏首斷爲續筋斷爲䏈蠱癩爲剥水腹爲寛胎留爲下孕育發生拳攣伸縮喑啞能言手足不具俱得完全盲聾視聴顛狂復完老者返壯執對和𡨚饑饉充實沉痾悉蠲風勞凍絶咸得醫痊魄户閉關魂門鍊仙與道合眞靈寳聚形返眞符日月五星五炁周流五行生成全其身形貪至破其冀秋冬閏覺長口誦手書斗至票觜參危室餘炎勑急急如五帝上帝勑聚形呪曰紅杏持到卯墨黒庚同子磨眞計力酉襪臈聚成午靈寳萬物中消利六合正一成法知一可具取驛令下攝六合訣逐方炁吹彈通流五炁落滅惡根呪紅杏持左癱攣者伸震墨黒尚上耳目聦明坎磨眞佑右緩癈者平兌臘襪下下跛痾起行離靈寳沖中身强體輕中青帝護魂肝木長榮卯赤帝養炁心火光亨午白帝侍魄肺金生成酉黒帝通血腎水淸停子黃帝中主脾土安寧中梵炁彌羅自然成眞中指中午炁回尸起死白骨成人子至亥天門炁濟度垂死絶而得生坎至離火炁九和十合變化上淸急急如律令向來所召靈官功曹天醫聖衆奉爲亡靈全形復體一一如法莫不體乾坤造化之功運隂陽和合之數宻行匹配靡有乖違尚慮亡人相貌雖全形神未淨更爲汝等念玉淸神霄太一含隂育陽神呪呪見科範門灑淨引魂赴室人間不潔世物膻腥仗此妙音悉令淸淨臣謹重誠上啓神農皇帝天醫聖賢列幕高眞承行官吏仰蒙拯濟皆得生全無任瞻依謹當奉送如尋常齋醮止用前三幕拯療符法如普度大齋必須用後敷化門符法靈寳玉鑑卷之三十四
