front:
  text: 靈寳玊鑑卷之四十盖六
  hash: sha256:1c5202678f3b1f1bb686b8f657e0c7b1721464a74ef6be07a3507d8a9a311591
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_038-100410a, image: sjb/10/100410a.png}
body:
  text: 召主火大將軍内錬符午文南炁髙功再入火錬科知磬舉玉眸錬質天尊謹召主火大將軍趙仲明速至壇所合炁錬魂右神紅袍金介胄緑仙帯自南方乘雲而至師吸炁歸中化作金字以陽斗訣𤼵此字於火沼中光明洞煥如天邊曉日之狀受錬衆魂俱入日中玉眸錬質呪曰陽晶隂耀洞煥五行䢫符降炁冶錬隂魂知磬舉玉眸錬質天尊髙功鳴召主火大將軍立降眞火冶錬亡魂立降眞火符三天内諱左右天府天相天梁天北帝勅行日月同天樞天機君度長生大君度金鳥紫炁日景注生大帝度騰耀流晶圓明高奔停午融和鮮吁欎儀居中萬象育童内明正化流鈴八衝右符寅加卯卯交寅風火交午文出南炁三息存日中丹華金光化爲流火神庭冶錬亡魂衆和玉眸錬質天尊宣主火呪南方主火神駕景擲火鈴奔飛耀南樞交炁媾生津炎晶流金光冶錬隂死魂復歸元始炁再返天地根流金以滅奸邪穢悉然焚洞觀無礙法自得保眞身玉符召主將急急速來臨太玄妙炁主掌炎烟造化玄爐眞魂陶埏主火成胎景象自然變錬隂户準令上天急急如律令入火沼正錬移旛於火沼邊火錬正符午文南呪曰南閭洞浮流火之庭玉眸詵詵流火之膏刀利禪猷婆尼靈童流火之質玊眸眞容升入福堂洞陽之宫太陽火錬符午文離炁三景流輝招搖炳煥九炁列正台眞洞明魑𩲕熒熒隂陽混凝光彩合璧景耀玄衢乾象回靈萬炁齊并呪曰南方之君赤炁之精熒惑使者丙丁將軍朱雀炎神赫赫陽晶五行造化萬類發生天帝有勑光徹幽㝠急急如太陽帝君律令火錬血尸符午文南炁呪曰玉眸錬質㧞度幽㝠玉文一下炁魂飛昇玉眸錬質符呪曰太一錬質九歩八魁行罡七轉内外合成三台子午絳官受眞符錬萬靈赤火降心辟除惡毒徃來俱榮圵都曲府離合上清大洞自然風火無停日光錬神符太陽炁訣右符存合童陽君日光紫色叩齒二十四通呪曰陽晶巳通飛光巳新皇芝流溢䕃注内纒仰湌流晶芳華未臻宫宅開張蕩洗囂塵體映玉光面發金眞雲飛禹歩上造日門急急如太陽帝君律令勑火九錬返生符九道一符午文四光呪曰眞王元命勑下九天火錬神魂天一舍生太陽洞照體合自然急急如律令二符未大日光呪曰九天眞景元府錬魂火降帝勑岀離幽隂三炁合德五緯回靈生尸鑄魄永劫無傾三符申文日光呪曰司命聖眞帝君受靈三皇有道錬魄錬魂上生南斗落死圵陵眞光煥發面禮玉晨急急如律令四符酉文日光呪曰四象咸㑹九陽生成太玄流光日曜易形空乗太霞受錬生神急急如律令五符戍文日光呪曰南宫流晶眞火變靈五行畢備萬象通明魂魄合錬神化玉瓊飄飄太霞升入無形六符亥文日光盖六六呪曰皇天眞命九度元明上道玄育陽和太靈六炁互𤼵速錬死魂神飛玄景與道合并急急如律令七符子文日光呪曰天地大化七炁兆成三光返質幽滯咸昇光達無垠急急如律令八符丑文四光呪曰靈寳符命普化幽㝠八景交映炁體輕清魂魄受錬隂陽混凝解結散滯十轉回靈九符寅文日光呪曰九光統化萬象滋榮受錬太陽魂淨魄寧以道爲體與日同明髙奔泥丸昇入帝庭急急如律令知磬舉玉眸錬質天尊次舉偈云南上朱陵府丹天流火庭玉眸錬形質魂魄即返生和玉眸錬質天尊火錬合同符右符左手自午順巡至寅蓋火錬九符自午旺處歷未申至寅長生處九位合同錬魂呪曰天帝命章陽光日行璇璣運轉八極齊臨合同大錬玉眸上生急急如好生大帝律令火錬變仙符午文南炁存太陽流晶灌錬亡魄内合大德火鈴火鈴五星星君將軍童子真君九炁五方五嶽天火熒惑太上犬人五帝大文地火將軍符命南昌火府上仙普度䢫願大神錬度靈童沉淪往生上帝火錬符命真形呪曰火池炎精錬質成眞五臓經絡返生其身徑昇三天面禮玉晨金液錬形符祖炁玉訣右符咽液一口過肺流金之鄉意納中宫灌錬呪曰金液錬形與道合眞開明三景是爲天根無幽无極無始無終元皇九醜靈魔絳宫紫炁飛天身乗六龍水上火下流入三宫神歸陽明大道自通急急如律令天罡玉字本呪訣呪曰罡星正炁纏筋貫骨上透泥丸開陽𡺚崪右符左手飛斗一座杓指前光芒閃爍即吸炁嚥下元宫過尾閭上升迸頂門出合炁書符䢫斗所轉陶鑄隂陽萬化莫能外比錬度時焚於聚炁爐中上清九斗陽芒火鈴炎精眞符太陽訣先書南方朱陵帝君次書符於上炎神炎神上通紫極下徹黄泉火鈴火鈴却妖錬魄赤帝之靈炎精二神錬形易質魄返魂昌三台流光萬妖殂落乘烟飛揚上元天官中元地官下元水官天蓬大元帥天猷副元帥黑煞翊聖眞君眞武佑聖子丑寅卯辰巳午未申酉戍亥眞君十二時辰主者鍊度亡䰟急攝精神一得洞入火鄉吴天有勑混合九炁總契虚皇流金震芒九天焕落天府天相天梁离㫖火天貞利無疆天同天樞天機尊勝掐訣以陽錬隂急急形神不凋急呪曰炎精二神化身流火錬體變形乗烟飛揚混合九炁洞入火鄉誅絶妖精殺滅不祥聞我火鈴魔鬼消亡按五合度保命延昌上帝有勑返形太陽急急如上帝勑祖道玄眞隱呪祖道玄眞烜赫正神欎儀錬質熒惑操形赤明和陽理禁威靈耀明宗飄帝重光明戊巳之英中央鎭星排蕩邪炁破滅媱精海達之沸木逢之燼火逢之空金逢之鎔長離之主統攝飛行迷尼奴那唵唵吽吽東海青童緫括張羅迷尼奴那唵唵吽吽急急如律令右符先存中炁上透泥丸次書符引太陽炁吹布丹砂筆硯精思上宫赤炁中有赤帝吐絳光三道入兆頂中灌神府洞明如日三台蓋頭存日中炎精二神長三寸丹衣赤金冠以兩目晴光相合作火光二道吸引入符焚符時念前隱呪存兩眉之間直入三寸分爲二路左有絳臺青房右有黄闕紫户左神名正心右神名平静狀如嬰兒從泥九透岀漸長丹衣赤金冠各執流金火鈴洞煥流火冶錬亡魂太上梵炁符玉訣祖炁師執旛行交錬法呪曰天一生水亥入子地二生火巳入午水火交錬子午至子自然成眞玉文内應凡三遍作用念呪第三遍接後呪眞中有神長生大君无英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八㝠之内細微之中下鎭人身泥丸絳宫中理五炁混合百神十轉回靈萬炁齊仙焚旛换變仙旛見旛蓋門師舌拄上腭自中運祖炁下丹田過尾閭上透泥丸化成元始上帝内誦中篇一遍心腎二炁相交水池火沼錬化形神清淨俱入洞陽流火之中焚錬有生以來有爲之身悉爲灰燼存性次存灰燼中微有一縷眞炁如露珠即是太極以前一㸃靈明中和之性宻呪曰大行梵炁周廻十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神廻骸起死無量度人呪曰次搯訣天一地六水德爲精坎離訣炁地二天七火出爲神離坎訣炁天三地八返魂育嬰震兌訣炁月精地四天九再生魄靈兌震訣炁月華天五地十五行生成中中黃炁天一地六水徳爲精子地二天七火出爲神午天三地八木德爲魂卯地四天九金爲魄靈酉中黄正炁五生十成中天地造化自然成形水火旣濟五行合并死魂受錬仙化成人天一地二水火旣濟天三地四精神交㑹金木交炁魂魄隨至天五地十土旺四季五行畢備受錬更生陽升隂墜各從其𩔖南昌度魂注生録事九天監生萬神復位急急如靈寳度人律令黙呪元始符命受錬更生日月交感隂陽生成禀金之英膺木之靈以水爲精以火爲神以土爲體返胎育嬰萬炁混康五臓分明與道合德與神契眞火急遷度受錬更生急急如靈寳度人律令師曰錬至此矣當滅水火有形之相返其清淨自然之質庶得更生再造聚炁回靈次第而行不失於次序矣靈寳玉鑑卷之四十
