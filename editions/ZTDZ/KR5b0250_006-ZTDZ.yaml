front:
  text: 靈寳玉鑑卷之六頼七
  hash: sha256:be5a1998a4edcffc615d931c6211b77b3596f8dba088f7f93cc4dadb4ee8b436
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_006-100176c, image: sjb/10/100176c.png}
body:
  text: 靈旛寳蓋門旛見前血湖燈旛符九道救抜血溋地獄之符九符並卯文束炁救抜血汙地獄之符救抜血資地獄之符救抜血泠地獄之符救抜硤石地獄之符救抜無間地獄之符救抜大鐵圍山地獄之符救拔小鐵圍山地獄之符救抜血湖地獄之符勑符呪梵炁彌羅散透幽牢燈光所臨上聖祥華血湖摧毀地獄停休苦魂受慶脫離具途急急如律令右旛如常式製之符下書天尊號流光救苦天尊景光普照天尊慈光洞映天尊太光常寂天尊容光廣被天尊晨光啓道天尊含光明湛天尊慧光通逺天尊瑞光玄應天尊某血湖燈或以五獄者即用流光符五道用破獄符於各獄焚之回曜燈旛符落滅色欲之符八符並五訣祖炁落滅愛欲之符落滅貪欲之符落滅色累之符落滅愛累之符落滅貪累之符落滅華競之符落滅身累之符緫勑符呪玉清寳符元始洞章隱玄幽象妙達群陽變隂作晝廓翳停殃滅除五累飛度南昌右符下書天尊號八難燈旛聖號上尸道威光寳除天尊中尸道虛皇普濟天尊下尸道普度無邊天尊色累户慈光弘濟天尊愛累户法輪開化天尊貪累户神光廣被天尊華競户慈恩萬善天尊身累户玄明梵行天尊天輪旛如前式旛肚内篆文譯文元始洞玄靈寳本章開演至教十迴度人右黃絹七尺製之前十六符作一行篆于旛肚上初登壇時詣天燈壇宣呪懸之天輪燈旛用作一圓蓋周圍懸三十二旛中懸天輪旛一首三十二天旛符太皇黄曽天符太明玉完天符清明何童天符玄胎平育天符元明文舉天符上明七曜摩夷天符虚無越衡天符太極濛翳天符赤明和陽天符玄明恭華天符曜明宗飄天符竺落皇笳天符虚明堂曜天符觀明端靜天符玄明恭慶天符太煥極謡天符元載孔昇天符太安皇崖天符顯定極風天符始皇孝芒天符太皇翁重浮容天符無思江由天符上揲阮樂天符无極曇誓天符皓庭霄度天符淵通元洞天符太文翰寵妙成天符太素秀樂禁上天符太虚旡上常容天符太釋玉隆騰勝天符龍變梵度天符太極平育賈奕天符右符先誦靈寳本章取祖炁入筆書符畢再誦靈書中篇祝之並玉訣祖炁符下各書三十二天聖號懸於燈壇之上地輿旛如前式旛肚篆文譯文太上道君勑付崑崙神符一下抜度死魂右用紅絹七尺制之前十六字作一行篆旛肚上𥘉登壇時誦呪懸於獄燈壇中地輿燈旛作一方輿周帀懸二十四獄旛中懸地輿旛一首破二十四獄旛符旛如前式釘身符鎖身符銅柱符鎔銅符毒蛇符剉身符鋸解符鐵犂符鐵杖符刀山符寒冰符鑊湯符鐵輪符爐炭符鐡九符劒樹符惡汁符食炭符石壓符鐵錐符鐵牀符碎形符抜舌符培山符右符先念救苦天尊八十一聲取東方青炁入筆書符普用玉訣祖炁符下書後二十四天尊聖號緫祝前符呪玉清大化流布寒庭青玄太一分散眞形照燭酆都牢狴幽精三天有令魔王敬聽隂官鬼吏息猛停刑冰泉爐炭皆得清寧鑊湯劒㦸永免凌兢鐵錐巨石蕩蕩銷平銅柱鐵牀化作雲輕諸獄滅考萬類俱升超凌三界逍遥上清急急如律令二十四獄燈旛天尊號慈光抜度天尊大明圓極天尊知炬赫奕天尊圓鑒洞明天尊光接萬有天尊舒光抜難天尊妙智圓明天尊無量光明天尊德光常曜天尊靈光炳曜天尊神光煒燁天尊宣化廣明天尊赤明大有天尊明眞光輝天尊流光返照天尊光明至人天尊三光鍊度天尊金光玉華天尊慈光朱耀天尊大光廣照天尊日月普明天尊破暗燭幽天尊洞明法界天尊金精定照天尊十方聖境燈牌書十方聖境見關明幽暗門十方聖境燈旛書十方救苦天尊號見前靈寶玉鑑卷之六
