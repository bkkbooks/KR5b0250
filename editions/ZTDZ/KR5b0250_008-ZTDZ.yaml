front:
  text: 靈寳玉鑑卷之八頼九
  hash: sha256:6ad828277812d6eedf93ceb2d0792ce143e7c801227ee6dd1e39d934a3cf04ec
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_SJB_008-100192a, image: sjb/10/100192a.png}
body:
  text: 申牒頭連門玉清緫召萬靈符師凝虚守一目篆三天諱於空中倐見霐三字分明以鼻引歸三宫爲青黄白三炁内外混合爲一至下丹田上透泥丸化爲嬰兒左有日光俓九分右有月光俓一寸洞煥六合之中内誦結空成梵眞炁自生赤書玉字八威龍文保制劫運使天長存金符玉篆普召萬靈唵吽唎吽唎吽唎吒誦畢存嬰兒化爲元始懸一寳珠三十二天諸天諸帝俱㑹寳珠之中次存二神自兩目出如龍虎君之狀黙呪謹請元始殿前招眞召靈大夫武卿崔文子發放三界功曹所金闕上佐史珪璋急奉元始上帝勑臣身中官童將吏星飛電轉風激火馳金龍驛傳不得稽遲違令者斬疾速奉行忽見寳珠化金符䚴金光燦爛洞照十方帝降此符吸入歸元宫合炁書符凡召役諸神崔君捧此金符史君執節普召萬靈無所不至如坐召策役止用寳珠妙光行持發遣用金符玉字金光梵炁交映無窮一念所通萬天感應矣散形上三星即玄元始三炁奉三清四方刀利玉帝上帝勑拱極尊天臨御日月皇天降命太上治職詔光全玉璽急宣召萬神靈官玉女輒萬神萬鬼敢稽延符到擎拳日字内念日君呪訣運筆九轉書晅字蓋之出筆月字内念月君呪訣運筆十轉書朒字蓋之出筆中央玉字内念結空成梵呪唵吽唎吽唎吽唎吒搯玉訣運筆十二轉書䚴字蓋之出筆向下次書勑字於鬼字下念玉清始青呪運筆召將至仰行萬程急急如玉清緫召靈符命律令隨事祝之次念唵咮咈囉唎娑哆薩訶勑符呪玉清寳璽勑付仙卿秉符執節召集天眞三界齊到萬神同欽天皇上帝梵炁流晶金光四集曷敢不臨違符逆命上有憲刑速奉元始勑女青詔書律令聚形焚符存用帥握固凝神天地未分萬有俱空惟存一㸃先天元陽祖炁在空玄之中即本來元始黍珠妙光良乆自一生三三生萬化混合萬神緫朝元始也遣符呪玉皇勑命急召萬靈上窮大羅下徹泉㝠應時感召速詣玉庭一切靈府不得留停急急如律令符檄式玉清緫召萬靈符命空符玉清始青玉符告盟告命三界統攝萬靈符到速追符到速行女青詔書如玉帝親行上元天魔中元地妖下元水怪三界神眞敢有不順拒逆張鱗萬神斬首不得留停符召入將位速隨符來立現眞形玉帝勑書仰行萬程玉帝勑命守待報應急急如元始勑女青詔書律令太歳年月日告行具法位臣臣姓某奉行右符以束腰封之於召功曹後發此符檄勑遣呪在前宣畢焚之依本法存召諸將存召靈寳萬司如意大將軍符先布祖炁一口在頭上化爲金光次用玉訣剔上見元帥分明勑呪靈寳赫奕統攝萬司帝君有令威掌群都飛攝神吏衞護玄爐守精定志校定圖書老君預勑道君後除元始主者道炁之餘帝命一下萬司咸符唵勑宣尼吒嚄唵哆唎吒萬司如意大將軍温仲宣紺髮童顔金介胄仙帶左手玉清訣右手仗劒朱履立黒雲中若行靈寳法用此將後可檄召諸神内祕下圏中先書温某次加𡙎泓澄众明祖炁玉訣入符召役行持存上三字化爲寳珠在我手中運轉心誦三字萬天皆聞䇿役遣將以此寳珠與天君乗雲去隨事指揮一將靈則百神皆靈召靈寳天君諸將緫符呪曰空洞靈章變化無量歷關普告諸神咸仰隨符所召立至壇場急急如上帝律令召赫奕仙曹緫符呪曰髙天之上玉清爲主元綱大魁太玄生府中有帝君靈虚玉母統制嘯咏玉文金符司制仙禁金童玉女校精辯魔緫御百史上逹三天形成司舉傳奏教令蠲災救苦備衛護道囚縛鬼侮流浪諸天濟生度死觧厄摧怪通達紫府十方告命召其所主急急如上清靈命元始上帝勑右符師化身爲神公左手玉文右手上清訣存祖炁歸中混合百神運目吹布十方諸將乗金光道炁森列于前召流金火鈴大將軍符午文南炁呪曰謹召流金火鈴大將宋某晶炁靈靈迅雷烈風炎火眞炁燒滅鬼形急急如律令法曰凡發遣章奏有一等六天妖魔山靈鬼魅於半空中攔截奏文不能上達者神霄霹靂摧魔部流金火鈴大將軍其司一百二十人金甲頭兜鍪緑靴丹袍左手仗劒右手火鈴面赤怒色圓眼威猛相又有殺伐大將軍一百二十人服相一同執㦸仗劒此二將善禦魔試大祟等邪用此防護即章奏上達也召殺伐大將軍符已文巽炁呪曰通化靈章丹天眞陽萬生祖炁見化眞王統御神霄掌握雷光飛擲火鈴伐惡除殃天丁斬尸収付魁罡煞伐將軍急急奉行急急如律令召六丁大將符本炁訣召六甲大將符本炁訣二符祝曰六甲六丁隂陽之神天符急召速降威靈急急如上帝律令召神霄緫監大將軍符三符並辰文巽炁文宣召神霄統兵大將軍符丁仲珪召神霄發放大將軍符焉温緫召呪神霄玉府霹靂緫眞結炁之眞九陽成文上領雷將下攝吏兵無幽不伏無成不遵驅雷役電緫制萬神駕車萬乗從法天丁玉清雷長左右統兵火猪黒犬四聖四神㝷龍捉魔聞召降臨急急如律令召上奏靈官符卯文東炁呪曰靈寳大法炁化生神勑命靈官飛奏帝庭承符奉令俓升玉清急急如上帝律令召承受玉女符酉文西炁呪曰柔和之隂九靈九炁命曰玉女鳯衣龍裙真王有令召赴神庭急急如律令召諸天承受玉女符玉文天門炁呪曰諸天之上隂精聚陽霞明玉㓗眞洞流光急急如上帝律令召天界直符亥文天門炁驛馬驛吏星奔火衝謹召天界直符焦公奴急至召地界直符玉文東南炁呪曰翻山撼地直符威兵謹召地界直符鄭元喜急至召水界直符子文北炁呪曰帝靈勑命神靈捷水謹召水界直符張元伯急至召年直功曹飛天將李煥本年訣炁召月直功曹震天將郭炬本月訣炁召日直功曹驅雷將趙濛本日訣炁召時直功曹炎搯將張炳本時訣炁勑四直符呪炎帝勑行玄君禀令急降聖力合炁四正李煥郭炬趙濛張炳允契眞符翕然奉令急急如律令召風神威毒天君符寅辰文隂陽炁召雲神猛烈天君符已文巽炁召炁神變化天君符卯文東炁召雨神迅速天君符坎文北炁四直䄂符緫呪太蒼光芒威臨十方風炁雲雨逐念而生隂陽濟合正直感降急急如上帝律令召三界十方嶽瀆吏兵緫符玉文中炁呪曰玉清有命告下三元十方曹治禀命所宣各統部屬立至壇前轉揚大化開濟人天急急如律令召神虎諸司將符進初虎門召社令土地緫符已文中炁呪曰靈寳符命立召無停社令里域土地等神急速奉令鎭衞壇庭剪伐不祥延格正眞急急如律令存神念緫召呪三清三境統神上元八景㝠合萬神侍軒中有五靈輔賛太玄緫制火兵八萬四千神變莫測威鎭羅天聞令關召速赴壇前急急如律令師存諸將俱㑹金光道炁之中聽令誓將呪吾奉眞玉勑命玉帝金符告天立壇法像驅神遣鬼左契龍文豁落右佩神霄玉律夕誦玉清羽章朝謁大帝下統山川洞淵水陸神秪上列神霄眞卿誦詠大洞玄機一勑召九天司命七轉召九天眞仙吾爲仙王太上丈人五嶽主者受命在吾心呼風吸雨布電驅雲大怒雷部前行威鎭霹靂崩摧元天有令風火四維天地萬神並令知委急急泰髙上神霄玉清眞王律令勑次入三獻白文見科儀門飛章火鈴符午文南炁緋紙朱齒師左手執筆奏右手執符想心火從頂門出内有流金火鈴大將赤髪天丁冠金甲緋衣手執流金火鈴直衝罡風至天門呪曰炎神炎神火鈴金精通天開道速逹帝庭六天九醜斬馘滅形上帝勑命風火不停急急如律令開天符散形三天帝勑天洞火眞上開八門速降威靈上通天闕三部使者隂陽決吏開道無窮王女靈童持火蕩冗衝除浩炁大破罡風䚴奉王皇上帝勑符下作用塗呪一轉六神藏二轉四殺没三轉動魁罡四轉雷火騰五轉霹靂發六轉山鬼死七轉収攝罡風浩氣六天外魔無道之鬼攝付都雷之下受死無動無作四縱五横天賜吾行順爲正道逆爲背亡違勑者滅奉勑者亨急急如律令入祝貪巨禄文廉武破魁𩲃𩵄䰢魓𩳐魒中宫大聖飛天捷疾聚形玉文天門炁呪曰玉皇有命勑下罡風萬仞摧毀九天潜通承符奉令黄道無窮天門四明黄道正卑承符奉令敢有稽停符中將吏速逞威靈罡風浩氣金馬驛程急急奉玉皇上帝勑黄中理炁馘滅邪宗罡風九醜浩炁群兇開天符命九天俓衝倘道章奏束送羅酆流金火鈴照徹黄中龍虎騎更執奏雲官普天同慶萬劫無終一如告命風火驛傳符檄式套封束之太上開天符命符右仰歘火律令開道鄧天君流金火鈴宋元帥通眞使者玉女靈官齎捧章詞表奏文俓詣天廷所過罡風浩炁母致攔截速達御前急急如律令太歳年月日時檄具法位臣姓某奉行三天大聖師泰玄上相眞君在天上達符上更炁開天訣右符念合明天帝日不拘遍數而成符昇眞度火符午文南炁下三火作用呪曰一火傳音擲火流金寅二火勝光八門飛世午二火從魁轉刀破骸戌天火雷神地火雷神五雷降臨鎖鬼關精樞機二星猛將速臨三千六百雷公部從一齊發聲雷震雷局呪曰符使昇眞速降威靈擲火萬里使我通眞升霞散空五雷備鳴前行大道掃穢除氛急急如律令師噀水歩斗一座兩手握雷局運五轉存流金火鈴大將歘火大將開道前行左手剔斗一座其咢天丁飛雲芳存諸將乗金光道炁捧奏右手別斗一座靈素天丁空降京遣將呪吾奉皇天睿命玉帝金符賜吾九錫十八威之䇿丹霄之輿流金鳯輦紫素之書千靈萬神孰敢干吾五嶽四瀆隨吾指呼謹勑上奏靈官承受玉女諸司雷將當處土地里域等神齎持奏申速逹天廷所過雲路之中或有六天妖魔妄來攔截即便攝付近司依律治罪以明玄憲須仰奔風火急不得停車千妖萬魅違命速誅明回報應言功玉虚三界之内孰敢干吾五嶽四瀆隨吾指呼威劒屠戮神兵疾驅吾在壇前早劒相待急急奉髙上神霄玉清眞王律令勑靈寳玉鑑卷之八
