front:
  text: 靈寳玉鑑卷之二十六二十七同卷方一
  hash: sha256:7b960fc7f004748dbb8c468649ea9a1627c4f325d6689826040fb3cc701cb07a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_024-001a, image: hfl/0307/0307-138.png}
body:
  text: 告給符籙門上生黄籙式玉清靈寳无量度人上生黄籙據本貫姓某伏爲追度某魂超升取今月某日就某祇建無上盟眞玉匱大齋道塲幾晝夜請行科典作諸善因設醮謝恩仰祈開度投乞給授玉清靈寳旡量度人上生黄籙一階付某魂収執照驗生天者元始符命金籙白簡救苦眞符告下十方無極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔拔度某神魂出離地獄永辤長夜覩見光明萬罪蕩除𡨚仇和釋乗此九眞妙戒拔度功德上生天堂一如告命元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司録延壽益筭度厄尊神迴骸起死監生大神超度某神魂上登朱官流火之庭玉眸錬質黄華蕩形書名紫䇿受化更生承此金籙度命功德時刻昇遷一如告命上帝玉符九天紫府内音宣告三宫九府百二十曹天牢地獄主司大神拔度某神魂永辤長夜覩見光明咸領符命部衞形魂上朝帝庭罪咎和釋𡨚債消沉與道合眞神登玉闕受錬長存一如告命太上靈寳超生金籙官君功曹使者度盟眞玉匱度魂韓君變錬監生眞籙官君功曹使者度洞眞太上青帝黄籙青龍將軍九千萬人青兵騎吏百億萬衆度洞眞太上赤帝黄籙朱雀將軍八千萬人赤兵騎吏百億萬衆度洞眞太上白帝黄籙白虎將軍六千萬人白兵騎吏百億萬衆度洞眞太上黒帝黄籙玄武將軍五千萬人黒兵騎吏百億萬衆度洞其太上黄帝黄籙麟鳯將軍三千萬人黄兵騎吏百億萬衆度五文開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神廻骸起死旡量度人某受度之後七炁成眞六儀運虚五靈續絶二曜扶衰旋罡躡空飛歩雲宫胚胎有始塵劫無終金城孕質玉洞凝神眞炁内養以成眞人上入太虚下洞幽泉雲宫寳闕中有眞魂出入福郷周旋生門咀嚼靈芝灌漱金泉甘露川流懸澍丹田紫霞朝暎三炁凝煙瓊室化仙安坐金蓮眞儀掩日塵劫如年一如告命年歳次月日時給具法位臣姓某承誥奉行泰玄省三正一靜應眞君泰玄知省天君天樞右相天樞左相天樞上相天機内相天機上相玉清神公旡極上相勑制地祇劵符右用碧絹背造方闊一尺二寸正面書告文于二邊劵中間空道君印地位止冩受度某一名以道君玉印印之勑制地祇劵式劵文闊狹雙面製造勑制地祇侍衞送迎亡過某魂拔出地户五苦八難七祖升遷永離鬼官魂度朱陵受化更生一如告命年歳次月日時告下具法位臣姓某承誥奉行書勑制地祇劵符于此具法位臣姓某承誥奉行年歳次月日時告下告命更生一如苦八難七祖升遷永離鬼官魂度朱陵受化勑制地祇侍衞送迎亡過某魂抜出地戶五歷關諸天劵符歷關諸天劵式今日某魂欣慶受度歷關諸天請滅三惡斬絶地根飛度五户名列太玄魔王監舉無拘天門一如告命年歳次月日時關告具法位臣姓某承誥奉行書歴關諸天劵于此具法位臣姓某承誥奉行年歳次月日時關告天門一如告命玄魔王監舉無拘諸天請滅三惡斬絶地根飛度五戶名列太今日某魂欣慶受度歷關右以黄絹爲之方闊九寸符篆告文並用朱書至錬度時二劵裂爲兩邊以歷關諸天劵繫於正度旛左手地祇劵繫於右手各以二劵左邊同入於四保舉方封内先燒去候錬度了焚旛升度合劵靈寳玉鑑卷之二十六
