  text: 靈寳王鑑卷之十七萬一
  hash: sha256:10e9a3aca70e8c114f23e7330396b417c79c4812c87c69962baeba3d2a8fd8fc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_015-001a, image: hfl/0305/0305-187.png}
body:
  text: 飛神謁帝門夫道之妙性之明寂然不動之謂也神之化法之靈感而遂通之謂也蓋寂感之理體用具焉故不可得而致誥也自非明夫出入無間離合自然者疇克爾哉故我靈寳大法有飛神謁帝之道在乎平日存養丹元赤子日漸圓熟飛行太空出入自然者然後可以拜表上章謄詞進奏矣其六甲九靈飛歩之法當於本日甲時所在方位起歩青龍即沽天門也次歷蒿星過明堂登太隂召六丁玉女次升天門召本直門神之名至地户飛遁天藏囬歩六庚呼召玉女入内天門自杓至魁謁文昌履三台轉拜天皇回歩橫列五星次躡九靈拜伏馳神朝元謁帝庶合生旺之吉隱景遁形俓升黄道其壇之名曰九靈飛歩章奏玊壇其主宰之神曰丹元君即自已元神也其靈有九曰遊光曰天路曰玉堂曰虚梵曰元黃曰紫光曰榮神曰天幽曰神全九者法天氣之純陽靈者妙神明之變化始於運神㑹道終於忘形養虚性道混同隨機通感其或未造深妙切在治心心法兼明自然合道所以人能弘道道不逺人乆而行之旋臻至妙飛歩之道可不愼歟天師儀注注曰啓章有道上二玄三元四始甲子諸官君四野五野七野九野是何神也曰道上是無爲大道君居三才之先故云道上也二玄者天也三元者人也四始者地也此天地人三才之稱也甲子諸宫君即十二支千之神諸野即土地草木山川藪澤之神也科曰世中章本習而成風皆有伏須告報四字蓋縁傳寫舛誤豈有臣子邀君之命伏須告伏願字也當宜攺之科曰書章正一科法有用十二小印印於太𡻕年辰章中首尾稱爲合用縁其章草本於年終或季終用都章繳天曹方下此十二印按漢天師章儀其章皆不曽燒篕其章拜時神魂上達天曹候事効用此十二印繳天曹尋常應係章文誠不當用之亦有考貴流例如此學士當叅詳之科曰世間上章之語合造文起頭今來只以謹按文書四字古人於此四六語引言章意然後方入齋意後人不曉遽意古本此四字甚失本意科曰書章太歳後空三行者謂章至天曹署直日上章詞表三疊銜及天師職太清銜後空三行者謂斗中靈妃直日進章承太上道㫖於此書其下再拜去以聞三行者上宫掌寳天官玉皇日用萬化之寳以聞在臣姓三行者爲此書拜章法師有十惡五逆過愆天曹四司保舉此四事皆天曹常儀太眞玄範曰凡家有死亡無論大小婦人生産殗一百日入産婦室殗三日小兒及奴婢死殗一月六畜死殗一日在外即無殗朞喪四十日大功絲麻月内殗出月即解徃喪家哭泣其日殗乆喪無殗喪家祭食産婦三日及滿月之食並不可與食巳上諸殗不可設齋建醮拜表上章如在别處者以符解之科曰上章醮主人不得殺生違者減筭一紀章醮信物不得假借於人昔赤松子問天門主事左平長曰某前日巳日未時上某章一通何不獲報應對曰前日見扶香玉女齎來值天門閉便去以此不獲報應赤松子復問曰一日夜十二時辰門閉之法可得聞之平長曰陽日隂時隂日陽時是開時也陽日陽時上章妨六畜隂日隂時上章殺人妨逺人天門閉故也六甲支干忌法甲乙日忌寅卯時丙丁日忌辰巳時戊已日忌午未時庚辛日忌申酉時壬癸日忌戌亥時右上章及病人家所忌也建日上忌晡時斗加申除日上忌日入斗加酉滿日上忌黄昏斗加戌平日上忌人定斗加亥定日上忌夜半斗加子執日上忌雞鳴斗加丑破日上忌平旦斗加寅危日上忌日出斗加卯成日上忌食時斗加辰収日上忌日直斗加巳開日上忌日中斗加牛閉日上忌日胅斗加未解官事昇度亡不用巳日巳時家長病不用亥日亥時家母病不用申日申時長子病不用卯日卯時長婦病不用酉日酉時子生人不用午日午時科曰毎月十五日此日一日官朝天門勿得拜章犯之主人有罪不福也正月初二日二月初二日三月初十日五月十一日六月初十日七月十二日八月十三日九月十三日十月初八日十一月初五日十二月十二日右爲月忌不可上章奏得罪譴也甲子日丙子日壬子日丁丑日壬寅日癸卯日右六日上章益人年命大吉上章擇天醫法子年卯丑年戌卯年子辰年未巳年寅子年酉未年辰寅年巳申年亥酉年子戌年丑亥年申逐日拜章牒天醫利鬼訣正月天醫巳鬼在午二月天醫卯鬼在酉三月天醫未鬼在辰四月天醫午鬼在巳五月天醫甲鬼在酉六月天醫辰鬼在申七月天醫辰鬼在申八月天醫戌鬼在卯九月天醫丑鬼在卯十月天醫寅鬼在卯十一月天醫酉鬼在卯十二月天醫酉鬼在丑右依前牒坐天醫面向鬼方救病大吉上章用天罡加臨時正月庚二月坤三月丁四月丙五月巽六月乙七月辛八月艮九月癸十月乾十一月十二月辛六甲旬天門開日甲子旬辰時甲戌旬寅時甲申旬展時甲午旬戌時甲辰旬申時甲寅旬巳時上章吉日甲午申戌甲申乙未乙亥丙午丁丑丁已戊子已亥已卯已未庚午庚子庚辰庚戌庚申辛巳辛卯壬午壬子壬辰癸卯癸未癸丑正月十一日二月二十八日三月十九日四月十五日五月二十五日六月二十三日七月十七日八月十八日二十八日十月初五日十一月初四日十六日十二月二十一日五德日甲辰日丙辰日甲午日以上三日可上章大醮天地天願日巳丑皆求善願如心甲辰乙巳皆可上章醮醮章日已酉壬申庚辰壬子辛未甲寅戊子癸丑乙丑丙申壬辰甲午乙亥丁酉庚子丙子丙辰庚申甲子乙丑庚午癸酉甲戌乙亥已卯辛已甲申乙酉丁亥丙午乙未甲辰丁未庚戌戊申戊午乙未辛酉癸亥丁卯壬午已丑辛卯丁巳七星章奏日建滿平定成収開三㑹上章日正月初五日上㑹七月初七日中㑹十月初五日下㑹已上三㑹日宜上章百無忌也天官朝禮天門日正月初二日二月初九日三月十四日四月初一日六月十七日十二月十六日