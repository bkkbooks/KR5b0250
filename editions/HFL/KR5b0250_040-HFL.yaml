front:
  text: 靈寳玉鑑卷之四十二蓋八
  hash: sha256:f3e579a811af8ca0e706d030b8133e6bbf4e8775b81b430a785e528f35cd785e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_040-001a, image: hfl/0311/0311-049.png}
body:
  text: 鍊度更生門隂尸九錬生神玉符師曰此符乃髙上空洞混沌九天元父道君降而結爲雲篆付九天金籙無量壽生神尊君行之以鍊隂尸也此符九炁齊并日月合明百骸流火更無隂滓自然仙化成人矣此符用黄素朱書粘於表前上奏九天故得九天稱慶太一執符帝君品命主録勒籍司命定筭五帝監生欎單無量天符子文掐九霄訣取九霄正炁書符呪三才肇分九曜順行心王虚寂陽滿隂盈神光下映救苦幽隂自然合道日月同明右符存帝眞胞命无元一黄演之炁蒼色下入胞元使胞元宣通帝諱𩃇上上禪善無量壽天符丑之書符呪道本澄廓運化隂陽合眞悟道了心無心右符存洞㝠紫户之炁下入胎元使胎結解根帝諱𩃇梵監須延天符寅文書符呪等觀應化靈寳玄光照徹諸天三十二帝興隆教化救度存亡丹禁靈符盡獲更生右符存長靈明仙之炁青色下繼三魂使魂門鍊仙以逹靈帝諱寂然兜術天符卯文書符呪靈符火鍊百骸自飛炁變明陽神造玄微九天化度天地皆歸右符存魄命元碭尸㝠演由之炁緑色下纒七魄使魄尸開關天王降仙以安寧帝諱波羅尼宻不驕樂天符辰文書符呪三炁勃烟日中眞精魄返魂超天清地寧右符存五仙中靈之炁黄色下纒五臟使臟腑淸涼帝諱𩅺霍洞玄化應聲天符巳文書符呪三變九鍊易容返顔體合玄光永享長生右符存髙眞沖融之炁白色下纒六府使胃管生津帝諱靈化梵輔天符午大書符呪梵上玄邈幽微禦金飛歩雲霄逹爽倩存受炁玄玄俱守黄庭右符存髙仙洞笈之炁紫色下纒七竅使七竅開聦帝諱霧𩅺髙虚淸明天符未文書符呪三陽煥發七炁成眞五行俱備合鎭丹臺日月同輝包光芒垂右符存眞靈化凝之炁碧色下纒三部使三部八景整具形神帝諱霐无想元結无愛天符中文書符呪玄黄應運炁貫天中至妙眞靈匹配元宗右符存自然玄照之炁黒色下纒三關五臟六腑九官根原本始一時生神帝諱靈生神九章符止是口誦九章手攥九符自然合妙不必泥於旁曲欎單無量天魂精祕音内諱玉佩開明上符混合空洞炁飛爽浮幽寥延康無期劫渺渺離本條苦魂沉九夜乗晨希陽翹大有通玄户欎單降神霄黃雲凝靈府隂陽炁象交胞元結長命惡根應化消桃康合精延二帝秀玉飄灌溉胞命門精練神不凋九天命靈章生神神自超元君遏死路司馬誦洞謡一唱萬眞和九遍諸天朝稽首恭劫年慶此榮舊苖右謹上請帝眞胞命元元一黄演之炁九重爲亡過某纒其胞元宣通上徹於天以生成一如告命風火驛傳年歳次月日時告下具法位臣姓某告行上上禪善無量壽天魂精祕音内諱玉佩開明上符無量結紫户炁尊天中王開度飛玄爽凝化輪空洞故根離昔愛縁本思舊宗幽夜淪遐劫對盡大運通帝眞始明精號曰字元陽嬰兒史伯華結胎守黄房斬根斷死户熈頥養嬰童禪善導靈炁玄哺飛天芳華景秀玉質精練自成容務玄育尚生羅列備明堂太虚感靈㑹命我生神章一唱動九玄二誦天地通混合自相和九徧成人功大聖慶元吉散花禮太空諸天並歡恱一切稽首恭右謹上請帝眞胎命元洞㝠紫户之炁九重爲亡過某纒其胎使胎結解根下響於地以固靈一如告命風火驛傳年歲次月日時告下具法位臣姓某告行梵監須延天魂精祕音内諱玉佩開明上符須延緫三雲玄元始炁分落落大梵布華景翠玉尊明梵飛玄景開度長夜魂遊爽赴期歸炁炁返故根大帝號陽堂字曰八靈君九關廻禄道胎炁生上元陵梵度命籍太一輔精延泥丸敷帝席三部八景分魂生攝遊炁九轉自成仙琅琅九天音玉章生萬神三徧列正位炁參八辰門玄關遏死户靈鎭津液源應㑹感靈數明道潛廻輪慶此嬰兒蛻稽首讃洞文右謹上請帝眞魂命元長靈明仙之炁九重爲亡過某纒其三魂使魂門通神以達靈一如告命風火驛傳年歲次月日時告下具法位臣姓某告行寂然兠術天魂精祕音内諱玉佩開明上符寂然無色宗兜術抗大羅靈化四景分萬條翠朱霞遊魄不顧反一逝洞群魔神公攝遊炁飄飄練素華榮秀椿劫期乗運應靈圖空洞生神章瓊音逸九霞一唱萬眞㑹騫爽合成家九轉景靈備𣡡欎曜玉葩兜術開大有一慶享祚多上聖廻帝駕嬰兒歘以歌不勝良晨㑹一切稽首和右謹上請帝眞魄命元碭尸㝠演由之炁九重爲亡過某纒其七魄使魄户閉關天王降仙以安寧一如告命風火驛傳年歳次月日時告下具法位臣姓某告行波羅尼宻不驕樂天魂精祕音内諱玉佩開明上符翻翻五帝駕飄飄玄上門遊歩黄華野廻靈驕樂端採集飛空景舊爽多不存太微廻黃旗無英命靈旛攝召長夜府開度受生魂公子輔黄寧緫録具形神玉章洞幽虚五轉天地分炁練元臟腑紫户自生仙數周衆眞㑹啓陽應感繁玉女灌五香聖母慶萬年三界並歡樂稽首禮天尊右謹上請帝眞臟腑命元五仙中靈之炁九重奉爲亡過某纒其五臟使五臟清和五帝朝眞以存神一如告命風火驛傳年歳次月日時告下具法位臣姓某告行洞元化應聲天魂精袐音内諱玉佩開明上符應聲無色界霄映冠十方廻化輪無影㝠期趣道場靈駕不待轡朗然生神章空洞諒無崖玄爽亦爲彊練胎返本𥘉長乗飛玄梁蘄畜喪天眞散思𠉀履常斬伐胞𣗳滯心遊超上京願㑹旣玄玄悟我理兼忘介福九天端交禮地辰良混化歸元一髙結元始正稽首儔靈運長謝囂塵張右謹上請帝眞靈府命元高眞沖融之炁九重奉爲亡過某纒其六腑使胃脘生津以納靈一如告命風火驛傳年歳次月日時告下具法位臣姓某告行靈化梵輔天魂精祕音内諱玉佩開明上符玄㑹統無崖混炁歸梵輔務猷運靈化潛推無寒暑乗數構貞條振袂拂輕羽瓊房有妙韻汎登高神所圓輪無停映眞仙參列序上上霄衢邈洞元深萬巨秀葉翳翠霞停䕃清泠渚遨翫怡五神繁想嘯明侣五難縁理去沖心自怡處爽魂隨本根亹亹空中佇七誦重關開豁滯非神武運通由中發髙唱稽首舉右謹上請帝眞元府命元髙仙洞笈之炁九重奉爲亡過某纒其七竅使孔竅開聦星辰朗明以開通一如告命風火驛傳年歲次月日時告下具法位臣姓某告行髙虚清明天魂精祕音内諱玉佩開明上符清明重霄上合期慶雲際玉章散沖心孤景要靈㑹煥落景霞布神衿靡不邁玉條流逸響從容虚妙話靈音振空洞九玄離幽裔感爽無凝滯去留如解帶明識生神章髙遊無終敗玄景曜雲衢跡超神方外應感無方圓聊以運四大研心稽首誦衆聖共稱快右謹上請帝眞華府命元眞靈化凝之炁九重奉爲亡過某纒其八景使三部八景整具形神幽夜開光以防身一如告命風火驛傳年歳次月日時告下具法位臣姓某告行無想無結無愛天魂精祕音内諱玉佩開明上符無結固無情玄玄虚中澄輪化無方序數來亦巨乗誰云無色平峩峩多立陵㝠心縱一徃髙期淸神徵良遇非年歲劫數安可稱浮爽縁故條返胎自有𢘆靈感洞太虚飛歩霄上冰津趣鼓萬流潛凝眞神登無愛故無憂髙觀稽首昇右謹上請帝眞神府命元自然玄照之炁九重奉爲亡過某纒其身使三關五臟六腑九宮金樓玉室十二重門紫户玉閤三萬六千關節根源本始一時生神令神布炁滿聲尚神具三界舉名五帝友别諸天下臨以得其生一如告命風火驛傳年歳次月日時告下具法位臣姓某告行九炁生神符九道並神霄文祖炁九章函上用混元生胞符並用青紙朱書勑呪眞王大帝勑下九天火錬胞神天一含生太光俱照滯魄易形急急如九天帝君勑錬胎成形符勑呪九天眞宰元符錬胎火降帝勑鬼群出離天眞皇人速降威靈生尸生影觸向利貞魂門錬仙符勑呪司馬聖眞帝命光靈上皇有命錬魄錬魂度死度生北都落名三炁始分陽炁生津魄户閉關符勑呪九天大玄帝都運旋陽明錬魄尸濯成形四炁隂布錬度神庭保命生根符勑呪南閻浮土流火大神玉輝尊星八威洞明魂魄保命死返成眞五炁普化自得長生靈炁守堅符勑呪皇天眞帝九度九明上覆玄育陽和大通錬魄度魂與道合眞六炁普化靈炁生根元炁自分符勑呪九天符命普錬魂魄隂尸上度超脱北扃七炁元化幽滯咸升華景聚一符勑呪靈寳符命普攝魂靈天眞化道救濟無邊酆都開釋六道咸臻八炁普錬魂魄返生急急如律令嶽結體全符勑呪九玄統攝八威吐精元靈降炁並度罪魂北都咸赦滯爽無停急急如九天好生帝君勑緫勑符呪日景耀羅綺合玄阿流火洋洋萬津滹波空林欎青金趐婆娑八錬朱丹芝房栝和金闕四張皇人之家雲輝吐精仰啜飛華左攀玄上右䇿命魔身登髙臺遊盻緑羅八景翼霄紫瓊丹霞炁聞玉眞命齊靈柯長晏九玄路無傾嗟九錬生化玉眞寳符八生自然靈空飛符第一天章祝之九符並祖炁玉文至眞虚生混成靈仙符第二天章祝之三炁龍胎玉寳神水化生自然符第三天章祝之道眞虚無九微鳴水素元符第四天章祝之九靈玄生天水飛空玄精玉符第五天章祝之玉寳洞微左契理命保眞玉符第六天章祝之靈明三洞古契神化通眞玉符第七天章祝之上玄三炁化生自然玉符第八天章祝之五元化身二景精微飛空玉符第九天章祝之玉清神霄九陽眞符一陽混溟𤥭瑝之炁眞符子文北炁呪曰一陽生形幽壑開明四象合體分配五行二陽泛華紫微之炁眞符丑文艮炁呪曰二陽毓質會合五神靈帝含輝玉女侍形三陽天婁鳳車之炁眞符寅文震炁呪曰三陽受仙受福東華金門離合披闡四和四陽中女辟邪之炁眞符卯文巽炁呪曰四陽蒼臺赤帝丹靈保生虹暎敕拔命神五陽太皇微延之炁眞符辰文南炁呪曰五陽玉華太皇重寧公子執符太一㑹靈金童鼓鳴鳯嘯龍吟六陽化眞白灝之炁眞符巳文坤炁呪曰六陽錬眞造化玄元白炁灌漑死户生根七陽絳實紫光之炁眞符午文北炁呪曰七陽運布平會百川身度始青返胎朱庭八陽天眞命仙之炁眞符未文北炁呪曰八陽爍爏形合精延内外瑩潔身外身内九陽太皇寂玄之炁眞符五指甲木陽炁呪曰九陽九炁雲騰雨凝結秀黄華冠帶流金青雲玄玄離合上清靈寳玉鑑卷之四十二
