front:
  text: 靈寳玉鑑卷之二十九方三
  hash: sha256:e557793b91a08013e4e4485e8e8e1a553c235c8709b0133334f0187e9582aa27
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_027-001a, image: hfl/0308/0308-020.png}
body:
  text: 開明幽暗門夫一炁肇分二儀定位隂則爲重濁之炁凝于地陽則爲輕清之炁浮于天隂陽混凝則爲中和之炁鍾于人是故亭毒三才發育萬化者莫非一炁流行之妙況夫人性本來清淨明妙虚徹靈通地獄天堂了無所有因其性習之異人欲滋萌由念縁情因情積業觸境應現隨報湮沉故善之類則爲陽惡之類則爲隂所以天堂地獄之事實由善惡一念之所致也故我靈寳大法有燃燈破獄拯滯拔幽之義則必先内發玄照以明天本然妙無之慧燈然後以發明衆生固有之覺性使燈燈相續内外洞明俾其開釋無辜遷善逺罪則一旦超然攝化於髙明正大之域頓悟本來清淨自然之道前之所謂罪根惡業安所有哉地獄天堂等歸空寂然而善不善之念可不慎歟造䇿杖式法曰凡造䇿杖須擇名山福地淨域靈墟用吉日取向陽甘竹一枝長五尺五寸通有九節者安奉淨處選甲午丙午丁卯或三月三日七月七日九月九日其第二節左微曲一曲於第三節下四面開竅以納五嶽内形符又實以靈書中篇各以黄蠟封固專意佩持者用黄繒袋之行事之際以小黄旛一首長七寸中篆十天玄化符背書青玄威章懸於第二節下受持之乆以杖指天則天神設禮指地則地祇奉迎指四方八表則萬鬼束形指地獄幽牢則罪魂昇度乆則解衣覆竹可以隱形行持之時當叩齒三十六通存五帝直符金童玉女各一人侍衞策杖乆則自然有五色流光煥明于上矣呪曰泰山之陽元始上精開張天地甘竹通靈眞符守吏部衞形神五色流光朱衣金纓輔翼上眞出入幽㝠靈竹神䇿與天齊齡合我以生契我以成萬化之外以代我形五解同機三景合明天上地下靡不通靈急急如律令右呪畢引五方眞炁各三十六咽於三元八節本命生辰合炁行持存神誦呪精誠不怠與道合眞乆則與我同昇矣五靈破獄䇿杖内符呪曰金闕化身眞炁周流慧光煥景金虎破幽急急如律令右符混合五炁書入䇿杖内五嶽内諱符東方卯文青炁用五色紙書之于杖内南方午文赤炁西方酉文白炁北方子文黒炁中央玉文中炁旛式用黄繒製正面肚中書十天方化符十方玄化符呪曰天地之先妙化無垠磅礴二氣萬彚肇形凝景合妙返胎復嬰慧光無礙洞朗八𡨋普受開度十轉回靈急急如青玄天尊律令肚面中書後救苦天尊符十方救苦天尊符祖炁中文存天尊放百寳祥光照明天地呪曰天尊寳誥勑汝諸鬼關鎻速開鐵城摧毁拔度幽魂速離關軌急急如律令背面頂中書右式製造䇿杖平時収侍呪祝合炁存神隨事行用如燃燈破獄先置玄師前臨時髙功道衆法事跪奏請迎帀繞燈壇隨方依法勑破諸獄燃燈畢迎杖歸壇跪謝而退䇿杖旛形請䇿杖作用存太一儼然端坐九頭獅座侍眞左右環列圓光照映十方兆身一炁歷肝府上合天尊爲一分吐慧光注于杖上化爲龍勢口㘅金旛靈風慶雲流晶玉光徘徊于上次存天尊金口勑命玉女金童捧出寳函出示符命金光道炁煥照諸天付兆宣行開泰亡爽兆引炁歸元宫合妙依次行持左手玉訣右手執杖就獄畫一勑字作八字分開存燈光皆是金蓮玉相朗照隂府悉爲天境呪曰玉清道炁開破幽泉隂關苦爽離苦昇天又念三天諱霐唵吽吒唎現光明開通幽關符玉文祖炁呪曰元始登引天眞大神上聖髙尊妙行眞人十方無極至眞大神傾光迴駕監眞度生諸天丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神郷泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷急急如靈寳無量度人律令右存天門寳光交映十方梵炁接引亡魂五道大神東方飛道大神南方横道大神西方直道大神北方遏道大神中央都道大神五神並如方相氏即開路神形狀各服本方色衣東華元陽開道眞符告文司額本司據入意本司領詞難抑除已按法奉行外以今然燭神燈開通幽路所有東華元陽開道眞符須至告下者符右符告下東方飛道大神請準眞符統青衣之神兵開東方之道路普攝幽爽來詣靈壇祇領薦修克諧超度一如告命年歳次月日告下具法位臣姓某押右四方告文皆依前式止換某方某衣神兵開某道路拘攝亡魂赴壇受度南方赤衣神兵西方白衣神兵北方黒衣神兵中央黄衣神兵命魔前祛符告文玉清神霄命魔前祛眞符符右奉符命告下五帝大魔萬神之宗飛行鼓從緫領鬼兵上天度人嚴攝北酆擲火萬里流鈴八衝三官北酆明撿鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清一如告命年歳次月日告下具法位臣姓某承誥奉行太一救苦天尊青玄上帝太上靈寳開通五路眞符告文太上靈寳開通五路眞符符右符告下十方三界五嶽九州東夷西戎南蠻北狄中央三秦境土五方諸道水陸關津黄泉蒿里社令城隍阡陌道路一切主者㝠關幽路主執神祇咸凖符命疾速開通道路釋放亡過某等及六道幽爽徑離幽暗得覩光明齊赴玄壇普霑睿澤乗茲妙果上生天堂一如告命年歳次月日告下具位職臣姓某承誥奉行此符係亡者他郷逺郡死者用此符給之三炁陽光符玉文天門炁右符一樣書五道焚於五方燈中存五天魔王並乗飛雲丹輿緑輦奉元始勑召東夷西戎南蠻北狄中央三秦君并五方開道大神領從官將吏開通五方𡨋路接引亡靈外道妖魔母得攔阻東方勑符呪元精混沌青炁分散神童十二保鎮肝魂二七四五變化雲營九竈九社老木不停神威吐毒劒擲火焚掃滅精蛀光景妖氛䜟不馳妄安保帝君一如告命南方勑符呪赤明開圖炎精扇颷三童一咤煥赫浮飃司命得失萬神緫朝朱鳯吐火石化流消鈴飛電馘驅剪赤妖束縳九醜誅蕩精魈肅清道路得道逍遥西方勑符呪金精一炁太白七分帝君靈符流飄赤雲召龍負水殺滅邪精千妖殂落劒㦸紛紜長牙巨獸討捕凶群延年度世身飛紫庭百靈安鎭我得自然北方勑符呪玄光豁落五炁流行雙闕上帝萬神化生安惠守志啗食炎精蒼龍吐電摧破黄兵輝晶鎭劒奔火飛星三千力士收滅萬精保安家國道治昇平中央勑符呪混沌元一黄象分馳蓋覆眞老變化嬰兒養育九炁胎生二儀日月髙奔星辰下垂風火交激雷電亂施六天九醜膽破心離太上符告何敢不隨有生安樂入道無爲旛符東方東方青天魔王九夷甲乙大將軍東方開道大神南方南方赤天魔王八蠻丙丁大將軍南方開道大神西方西方白天魔王六戎庚辛大將軍西方開道大神北方北方黒天魔王五蠻壬癸大將軍北方開道大神中央中央黄天魔王三秦戊巳大將軍中央開道大神右五方刋牌各以供物牒文符命逐方告五路燈圖諸項燈幡符式見燈旙門關祝諸燈髙功詣玄師前跪奏清策杖道衆迎出燈壇匝繞次舉三清樂入懴九天燈告行九陽梵炁元皇破獄眞符告文靈寶玄壇今據某投詞入意以今恭準道㫖告下九陽梵炁元皇破暗眞符開光長夜拔度亡魂來詣齋壇承功超化須至吿下者符髙上神霄九天眞文光映泉扄照破寒庭隂洞𡨋關紂絶帝城三塗苦爽九夜沉魂眞輝洞燭萬獄摧傾羅酆九壘咸覩光明皆蒙解脱考掠俱停眞皇符命萬神咸聽一如告命年歳次月日告下具法位臣姓某承誥奉行束封九天梵炁元皇破暗眞符具位臣姓某謹封方函九天元皇破暗眞符告下十方三界地獄𡨋曹主者具位臣姓某謹封玉清慧光符請光用師玉訣祖炁呪曰九陽至精三天尊明日月星斗晨光合明三華寳耀混合群晶三寳發華惠光發神長吐飛空下燭幽𡨋慈光一照遍徹隂扄三塗罷對五苦停刑火山息熖寒池摧冰刀化玉樹劒變騫林鐵城摧毁魂昇玉清臣今上告願賜開明日月靈妃星光眞人一十二員稽首奉行分燈散輝照破重隂一如告命依式入九天燈科右誦各天生神章請泰玄本際仙府一百二十童子衆宣童子牒十二本靈寳自然九天金字玉文生神陽符九道見燈旛門靈寳自然九天金字玉文生神隂符九道鬱單無量天一隂之符子文北炁呪曰三炁尊神合生九炁出乎太空隱乎空洞仍誦本天章上上禪善無量壽天二隂之符丑文艮炁呪曰無光無像無形無名無色無緒無音無聲仍誦本天章梵監須延天生神三隂之符寅文震炁呪曰開闢玄通三色混沌天地合徳乍存乍亡仍誦本天章寂然兜術天四隂之符卯文震炁呪曰炁清髙澄炁結凝滓九氣列正並受生成仍誦本天章波羅尼宻不驕樂天五隂之符辰文南炁呪曰三元所育九炁所導還生人道濯形太陽仍誦本天章洞元化應聲天六隂之符已文坤炁呪曰三元養育九炁結形九月神布炁滿能聲仍誦本天章靈化梵輔天七隂之符午文北炁呪曰太一執符帝君品會司命定算五帝監生仍誦本天章髙虚清明天八隂之符未文北炁呪曰萬神唱恭萬神唱奉靈音振空感爽無滯仍誦本天章無想無結無愛天九隂之符中文太陽炁呪曰司命敬諾司命敬順玄虚中澄反胎有恒仍誦本天章右九符於九天燈壇中按天焚之牌面篆文背書炁宫帝眞胞命元元一黃演之炁太霄宫帝眞胎命元洞明紫户之炁青霄宫帝眞魂命元長靈明仙之炁碧霄宫帝眞魄命元碭尸明演由之炁丹霄宫帝眞藏府命元五仙中靈之炁景霄宫帝眞靈府命元髙眞沖融之炁玉霄宫帝眞元府命元髙仙洞笈之炁琅霄宫帝眞華府命元眞靈化凝之炁紫霄宫帝眞嶽府命元自然玄照之炁神霄宫九天燈圖師曰九天燈即九巵燈也若不用燈樹未免就地鋪之蓋洞經中以第一天居中正在頭上第二天在南第三天在東南第四天在西第五天在東北第六天在西北第七天在北第八天在西南第九天在東是也亦隨方立九炁牌上懸九天旛當依此圖如式鋪設今人以東北方起第一天甚悖其理也當細考而詳之南北九壘燈符第一壘洞淵澤地土皇君符第二壘金剛澤地土皇君符第三壘石脂色澤地土皇君符第四壘潤色澤地土皇君符第五壘金粟澤地土皇君符第六壘金剛鐡色澤地土皇君符第七壘水制澤地土皇君符第八壘大風澤地土皇君符第九壘洞淵無色綱維澤地土皇君右九巵九壘燈圖以梓木作一燈樹上分九卮毎一巵安一燈下用淨土作壇三級上圓下方上層安燈燈樹上懸九旛巵中層立九炁牌安燈九盞下層安九壘皇君牌安燈九盞三層共燈二十七盞外方列八卦八門燈八盞使上照九天中照九野下照九地九壘通光九道周回十方通計燈三十五盞合三十五分緫契上玄九巵九壘燈圖靈寶玉鑑卷之二十九
