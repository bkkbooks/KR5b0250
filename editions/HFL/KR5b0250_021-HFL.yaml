front:
  text: 靈寶玉鑑卷之二十三萬七
  hash: sha256:c964b721c48bcf67281bf38fe92a1f359cb7035185f3a5512241e312d912e91b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_021-001a, image: hfl/0307/0307-046.png}
body:
  text: 告給符籙門太上勑赦生天寳籙南斗六星三天隱諱呪語炁訣書符呪玉清上帝勑慧光一到幽牢罷對速生天界上清上帝勑慧光一到幽牢罷對速生天界太清上帝勑慧光一到幽牢罷對速生天界青玄救苦勑命告下大慈憫救九夜咸原分形散影隨念㝷聲三光眞精普度罪魂玄炁神君救拔爽靈太乙救苦普度幽㝠玄元祖炁灌漑身形丹天三炁北府消名二象回傾紫炁覆身亡魂秉籙時刻超升寳籙赦文式無上玄元勑赦生天寳籙赦文告下三元十方酆都五嶽諸獄㝠司今月日奉太上玉晨元皇大道君靈寳天尊勑降下據法師某奏爲某入意乞頒太上生天寳籙勑赦開光長夜原赦罪魂今奉太上勑命告下者符檄依前右奉太上勑赦生天寳籙赦文告下十方三界九幽主者仰遵依太上勑命原赦亡過某洎六道四生九州分野孤魂男女幽靈及獄中受罪無極苦爽自昔劫以來至于今日三業六根無邊重罪或不孝二親或誹謗大道背眞就僞或殘傷兄弟謀叛師尊或六親通同婬犯骨肉或劫殺害人或屠割衆生自饒一身或以强凌弱以貴虐賤或浮好三寶執心不專或輕慢法師穢賤靈文或心懷隂賊安忍嫉妬或惡口兩舌闘亂善人或殺生淫祀裸露三光或心生或口語或自作或教他積劫以來所有諸罪無量無邊量其輕重並與隨令救拔咸赦除之出離地獄覩見光明萬罪蕩除𡨚仇和釋來詣道塲用承度化即使所薦亡魂及諸幽爽七炁成眞六儀運虚五靈續絶二曜扶衰旋罡躡空飛歩雲宫胚胎有始塵劫無終金城孕質玉㓊凝神眞炁内養以成眞人上入太虚下洞幽泉雲宫寶闕中有眞魂出入福郷周旋生門咀嚼靈芝灌𠻳金泉甘露川流懸澍丹田紫霞朝暎三炁凝煙瓊室化仙安座金蓮眞儀掩日塵劫爲年一如告命風火驛傳年歳次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應眞君泰玄知省天君天樞右相天樞左相天樞上相天機内相天機上相玉清神公無極上相可漏面可漏背右用黄紙朱書符併檄墨書赦誥可漏亦用黄紙墨書如只作寳籙告行却用前面簡短誥文並用朱書却不寫赦文二字當用後方函可漏式可漏式方函式天皇寳誥眞符誦隱書一炁金光入符五方炁訣混合歸中告文元始符命普告十方三官九府五嶽山川河伯水府九幽無邊超度六道四生九州分野孤魂滯魄横死夭亡等衆已化未化受苦綿綿今日大化天地長年元皇廣度大施福田生化普濟萬罪盡蠲今日受鍊脫苦升遷天皇符命速詔奉行一如告命年歳次月日告下金闕玉皇寳誥式靈寶大法司今月日恭奉玉皇睿勑降下玄文寳誥度脫罪魂超度玉京者右奉金闕仙籙玉皇睿誥伏請靈寳至眞十方上聖欽靈寳度人之典施迴骸起死之功敕下九幽俾苦魂而開泰誥行諸獄令滯爽以霑恩主者奉行一如玉皇上帝律令年歳次月日告下具法位臣姓某承誥奉行太上金闕昊天至尊玉皇上帝東極青玄寳誥式靈寳大法司今月日恭奉天尊睿命頒下青玄寳誥靈文合行開度亡魂上生霄極者右奉青玄寳誥上請救苦眞人青玄靈官開慈悲普濟之法門度幽壞重昏之滯爽悟明眞性證道自然遵禀誥文一如契令年歳次月日告下具法位臣姓某承誥奉行東極天中太乙元皇救苦天尊青玄上帝在天靈寳酆都拔罪眞誥式於建壇之次告行靈寳大法司恭奉玄都眞誥拔贖罪魂上生南宫者右奉太上玉文酆都寳誥拔除罪愆贖命幽都萬神敬從永無執繫乗天尊之惠命出地獄之拘囚託質仙都常居樂境準此奉行年歳次月日告下具位臣姓某承誥奉行靈寶玉鑑卷之二十三
