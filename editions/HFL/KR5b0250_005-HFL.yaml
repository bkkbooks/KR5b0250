front:
  text: 靈寳玉鑑卷之五頼六
  hash: sha256:9b112b2c318690f8977346ca799ad43d03dba8238fb31d40f10a056c2a57296c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_005-001a, image: hfl/0303/0303-004.png}
body:
  text: 靈旛寳篕門命魔靈旛告文元始玉勑眞符命魔奔火前道通開合虛三皇欽從威制群魔吿命篆文右用綵製旛長七尺立於壇中遇命魔之時令一童子執旛引導法師旋繞行道或有寳幢相對以全旛幢導引之義也鍊度水池旛背書譯文天河東井君右皂絹爲旛長七尺粉書符立于水盆側錬度火沼旛背書譯文朱陵火府君右用緋絹爲之立於火沼之側披黄受道旛旛背書後符前符下書受度某人成眞右旛用黄絹製造長七尺凡於鍊度之時於文錬旣濟之後焚去魂旛易以此旛即披黃受適也火鍊變仙旛符右旛如前式用紅絹七尺造之書前符于肚中下半截冩錬度某人魂神成仙兩手分書死魂受鍊仙化成人生身受度劫劫長存開導旛符譯文六甲使者持旛開導空洞通幽呪符旛毎首分書二句譯文靈音振空洞九玄離幽裔感爽無凝滯去留如解帯右旛用黃絹七尺製之斛前救苦旛四首如前式金書度魂呪毎首旛書一句譯文妙戒怡五靈金書警萬神察命定録籍靈符度苦魂右旛黃絹製四首各長三尺度橋陽暉旛如前陽暉符呪譯文明哉太陽暉神光洞三清炁散玄漠内靈煙生紫庭控御乘風霞飄飄凌無形返根呪符譯文明梵飛玄景開度長夜魂遊爽赴期歸炁炁这故根右旛用黃絹長二丈四尺旛身書陽暉呪兩手分書故根呪背書飛升太空天尊號立於升仙橋前九錬天尊旛符旛如前式錬度壇中用十方救苦天尊符九幽抜罪天尊符朱陵度命天尊符轉輪聖王天尊符法橋大度天尊符火鍊丹界天尊符金闕化身天尊符逍遥快樂天尊符寳華圓滿天尊符玉文祖炁呪曰九炁錬神三景合成生神火鍊返復歸眞急急奉玉清勑右九旛用黃絹製之篆符于中一面書天尊號於錬度壇上列之五方五靈童子旛東方旛身符東方青靈童子南方符南方丹靈童子西方符西方浩靈童子北方符北方五靈童子中央符中央黄靈童子右旛用黄絹製五首書各方符於肚中符下書各方童子燈旛一宗諸獄燈符並見朋明幽暗門旛如前式開通五路燈旛符東方符卯文青炁南方符午文紅炁西方符酉文白炁北方符子文黑炁中央符中文祖炁右符篆於旛上下截書天尊號大慈接引天尊開通道路天尊靈光普化天尊神威廣攝天尊隨方救苦天尊九天燈旛一陽混溟𤥭瑝之炁符子文北炁右誦鬰單旡量天生神章祝之呪曰一陽生形幽壑開明四象合體分配五行急急如律令二陽泛華紫微之炁符丑文艮炁右誦上上禪善旡量壽天生神章祝之呪曰二陽毓質㑹合五神靈帝合輝玉女侍形三陽天婁鳯車之炁符寅文震炁右誦梵監須延天生神章祝之呪曰三陽受仙受福東華金門離合披闡四和紫戸胎光三秀鬰羅四陽中女辟邪之炁符卯文巽炁右誦寂然兜術天生神章祝之呪曰四陽蒼臺赤帝丹靈葆仙虹影勑抜命神五陽太至微延之炁符辰文南炁右誦波羅尼宻不驕樂天生神章祝之呪曰五陽玉華太皇重寧公子執符太乙命靈金童鼓吹鳯嘯龍吟六陽化眞白灝之炁符已文坤炁右誦洞玄化應聲天生神章祝之呪曰六陽鍊眞造化玄元白炁灌漑死户生根七陽絳實紫光之炁符北文午炁右誦靈化梵輔天生神章祝之呪曰七陽運布平㑹百川身度始青返胎朱庭急急如律令八陽天眞命仙之炁符未文北炁右誦髙虛清明天生神章祝之呪曰八陽爍爏形合精延内外瑩潔外身身存九陽太皇寂玄之炁符五指甲太陽炁右誦旡想旡結旡愛天生神章祝之呪曰九陽九炁雲騰露凝結秀黃華冠帯流金帝霄玄玄離合上清急急如九天上帝律令右旛如式造九首旛身書各天符符下書九天寳號九巵燈旛天尊聖號三光錬度天尊太光廣照天尊重光返照天尊寳光虛靖天尊流光梵現天尊三光朗元天尊道光智神天尊金光玉華天尊慈光普施天尊九獄旛符東方華林淨境之符用卯文東炁呪曰九炁青華光耀風雷玉寳慈尊㦸毀戈摧扶晨通照魂升太微神識受度享福無期南方丹天眞老之符用午文南炁呪曰三炁丹華光徹火翳萬福慈尊蠲消火池化成青圃甘涼瑩肌苦魂承思逍遥無爲西方金光法寳之符用酉文西炁呪曰七炁素華照耀金剛太妙慈尊摧鋒毀芒刀化騫林劔變扶桑魂魄受錬與日同光北方定眞救苦之符用子文北炁呪曰五炁蒼華光徹溟泠王晨慈尊冰消雪城温生寒廓毒汁清澄魂獲妙果飛升王京東北方長樂妙音之符呪曰梵炁晨華徹照鑊湯度仙慈尊威感無方沸湧停息化爲寳漿亡爽生神俓升天堂東南方碧霞眞寂之符呪曰生炁之華下照幽關好生慈尊普濟無門沛灑法兩銅柱停酸苦魂解脫升度南丹西南方耀眞瓊光之符呪曰黄華月耀透降坤維盧皇慈尊保度浮黎靈晶洞徹屠割停威罪魂登甦劫仞携持西北方妙道濟苦之符呪曰天光景色祥華敷光無量慈尊除釋鋒芒火車摧毀塗炭消亡亡魂快樂上生福堂中央無欲妙行之符呪曰名光金眞流精降輝眞皇慈尊廣度無遺普掠幽牢悉變成灰魂升仙都受福巍巍緫勑呪三晨慧光錬魄度魂幽𡨋夜壑咸覩光輝鐵城摧毀獄卒停刑陽精赫赫隂翳煥明隂陽交㑹空洞混元三清玉勑曲赦苦因一如告命曲水重泉急急如律令右符下各按方位書十方救苦天尊號王寳皇上天尊玄眞萬福天尊太妙至極天尊玄上玉晨天尊頼六十八度仙上聖天尊好生度命天尊太靈虛皇天尊無量太華天尊玉虛明皇天尊眞皇洞神天尊靈寳玉鑑卷之五
