front:
  text: 靈寳玉鑑卷之十一及三
  hash: sha256:de482a8607aff69840d8ddc7fb11f5e5744e08ebc2671dd6b76ff05afe3eb267
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_011-001a, image: hfl/0304/0304-062.png}
body:
  text: 分燈制器門經曰開明三景是謂天根故玄元始三炁乃萬化之根宗天人之大本也由是溟涬大梵三炁開光而生天地日月星辰焉故靈寳大法開壇之初以法像乎洪濛初判之義故分燈列炬以開三炁之光而生三景鳴金根玉以和合隂陽而生萬化皆法其天運之自然也當知無形之炁爲祖炁無色之光爲慧光自一而三從三至九九九變化而生萬光煥映萬天照明九地内外朗徹以襲其明然後應無聲之聲於金玉之中運不化之化於隂陽之表與道爲體則含靈蠢動永有依歸矣此造道通玄之妙而幽明髙厚豈有間哉分燈存用先以慧光符捲封爲蠟炬候日中以取陽燧念陽暉呪明哉太陽暉神光洞三清炁散玄漠内靈煙生紫庭控御乗風霞飄飄淩無形急急如律令右一法取太陽正炁然一燈於元始上帝之前登壇時師存此燈金光如日流金之色混合兆身光結作日輪透明内外次運一炁自泥丸出上接元始寳光混同一體次以符炬自中燈分明自一生二由二生三三化萬光普明八極天眞上聖三界衆聖皆合寳光同登壇陛陽庭幽治悉變天堂分燈畢以餘炬納於主爐中黙呪曰太上降慧光華燈通精神諸天悉開耀地府皆朗明兆身亦光徹五藏生華榮炎景照太元遐想通玉京急急如三天道主律令分布慧光呪慈悲寳篆玉笈飛煙燈華散景煥映諸天朗明三界照徹重泉幽㝠開悟惠及無邊今日大慶咸得升遷道生一炁萬化純全元始威章應度自然急急如律令玉清慧光符請光用書符呪曰玉訣根炁日月星光照破重泉元始一炁演化三元混合空洞梵炁之先玉帝有命告下十天陽暉晅赫隂景清圓虛明洞映朗照壇乾光澄萬慮景合妙玄廓清人極應化自然急急如元始上帝勑勑呪大道一炁肇生二儀五行之祖斡運璇幾三才並立陽耀分輝天尊惠澤蕆大慈悲今日穪慶三元録儀臣今上啓開發天機上生陽光下洞幽微普朗重隂幽魂永離急急如律令呪畢引玉清慧光與自己性光混合自一生二二生三三化萬光燈燈相續照微十方玄炁寳光符玉清燈青炁王清訣書符呪玉清無上大羅至尊玄炁初露化生諸天混合眞一妙應自然勑令萬神齊到帝前勑呪玄元始青紫虛妙庭三十二天天帝帝君混合三炁流霞散晶眞文到處萬神敬聽拱禮玄奧洞開天門上通八極下徹幽㝠傳言引奏龍虎二君四司五帝俱妙神精急急如元始天尊勑元炁寳光符上清燈黃炁上清訣書符呪玄虛中澄三景開明無極大道太上道君眞元布化品物流形三元合德九炁齊并勑呪玉晨道境虛皇昊天炁化成象妙合玄元龍翔鳳翥億萬雲軿無極衆聖護法眞仙自然祖炁運合俱全中虛大聖三天洞玄引進天使玉女傳言天門開闢上升奏傳急急如靈寳天尊勑始炁寳光符太清燈白炁太清訣書符呪九陽開化八極生明左玄眞人統御三靈右玄眞人營衞萬神一炁普化萬物育形勑呪太清太極三景開明中理五炁混合百神道合徳備萬行圓成玄元妙化洞朗八門日月普照下徹幽㝠一切苦爽咸覩光明急急如道德天尊勑右三天三炁符自元始三炁開光化生天地日月星辰今以三炁混合三田由自巳性光發明外景次以後符分布混接三光森列燈炬使天地朗明隂陽開泰後舉明燈頌道衆各執燈炬遶壇分燈至然燈畢各歸班次髙功作用如法運燈分燈慧光符三光炁訣合祖炁書符呪九日之光停午朗照六隂之炁圓極廻陽玉清上清太清慧光五星正炁列曜熒煌月爲黃華炁貫七元日爲欝儀瑞應樞機玉虛玉晨玉皇之炁三台垂芒中天尊仰幽幽㝠㝠酆都沉淪零没三途輪轉無停天尊慧光燭破重隂翳昏清廓如日光明沐此宸恩上生天堂急急如律令呪曰九陽至精三天道明日月晨華星光合明三華寳耀混合群精三寳發華慧光發神長虹飛空下燭幽㝠慧光一遍照徹十方三途罷對五苦停輪火山息熖氷雪消扃刀化玉𣗳劒變騫林鐵城摧毀魂升玉清臣今上告願賜開澄日月靈妃星光眞人一十二貟稽首奉行分燈散輝照徹寒庭急急如律令右符呪畢爲紙撚道衆分燈餘炬焚於主爐中分燈儀明燈頌并諸呪見科教門制鐘磬論法曰以金鑄鐘擊其聲先當召陽神以玉造磬扣其韻先當召隂神此召合隂陽之良器也師當左叩齒以發金鐘二十五下可召威兵右叩齒以發玉磬三十下可集眞靈中叩齒以鳴法皷二十四通可聞上帝皆内按天地隂陽之數外敷九和十合之音必先關召辟非禁壇二將焚符宣牒扣玉鳴金然後可以格降於神明矣辟非大將軍楮飛卯文禁壇大將軍楊福酉文二神並天丁冠淡紅袍緑仙衣如虎龍狀陽神九和君盧會之字炎靈身長八尺戴三梁冠服赭紅袍左手仗劒能淨天地穢驅百木精自左目出立于左隂神十合君陸同字永夫身長八尺戴三梁冠服白花袍右手仗劒能絶隂府考掠塵世𡨚尤自右目出立于右次運耳鼻舌祥風瑞炁交接天景如月光吹布十方召辟非大將軍符玉訣祖炁召禁壇大將軍符玉訣祖炁呪曰虛皇勑命降自玄明召神攝鬼通眞會靈合和二炁洞朗玉晨聞今令召速赴壇庭急急如律令召陽神九和君符慈玉文祖炁二符貼鍾磬架上召隂神十合君符以二道焚召二神呪曰隂神陽神急速通靈吾今朝眞上謁帝君欲使神人閉債封形舉雲即去袐訣靈靈使我攝炁即得通神急急如律令又曰生神内列威兵外張二景八眸吐納靈芒頭戴七星足躡玄綱萬精永滅千妖自亡急急如律令王方壇令符東方卯文東炁呪曰九炁萌陽玉暦金章八卦外列一德中藏生化自我絶死爲祥急急如青靈始老律令南方午文南炁呪曰南陵三炁陽光九芒以養以正邪莫能當朱炎外烈爲吾所將急急如丹靈眞老律令西方酉文西炁及三九呪曰太白流晶七星守靈乾德内養金光莫刑生無不化白元用明急急如皓靈素老律令北方子文北炁呪曰玄德五靈度命一元胞精命魔内七合乾洞化無礙眞景洞然急急如五靈玄老律令中央中文祖炁呪曰中主萬神十二元眞緫統四大元始玉晨上天下地達貫無垠急急如黄靈皇老律令五方壇令背文式奉玄都省今月日㨿齋主投詞就某處祗建黃籙普度大齋道塲幾晝夜伏乞開度某魂超昇所合依律借地建壇右仰百神主者符到奉行太歳年月曰告下具位臣姓某承誥奉行右告文分作七行五方壇今用梓木或栢木作簡長九寸闕或寸四分厚二分書篆畢俟建壇之先到於壇之五方宣前呪安鎭如法五方借地符即玉字靈文右法用黃紙各一張篆符於前冩告于後隨方宣告粘於五方卓前今旣有壇令止有篆符隨方焚之五方玉字靈文東方玉字靈文震文噓炁南方玉字靈文離文可炁西方玉字靈文兌文呬炁北方玉字靈文坎文吹炁中央玉字靈文中文嘻炁總祝曰元皇一炁肇應五方順天廣化流演元綱太玄妙感空洞凝常帝命所至㝠合景光急急如五老天君律令十方鎭壇符東方南方西方北方東北東南西南西北上方下方右十符取各方炁内合入符念結空成梵呪用栢簡十片各長一尺二寸闊三寸厚一分朱篆符以紫羅囊袋之鎭於壇十方故能安鎭壇場辟除魔試也靈寳玉鑑卷之十一
