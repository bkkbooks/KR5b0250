front:
  text: 靈寳玉鑑卷之十二及四
  hash: sha256:cf3384801338dfc95274975d034e6210445f7a35e641637bf7b396b3c49aa418
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_012-001a, image: hfl/0304/0304-096.png}
body:
  text: 勑水禁壇門法曰道體至虛非虛則不能應物也人性至善非善則不能明道也水性亦然故善則能利於物靈寳大法有勑水禁壇之科引三光之正炁運九鳳之眞精䇿役萬神吐納二炁躡罡履斗結界禁壇小則清肅方隅大則淨明天地飾嚴内外之儀則格降上下之神祇是以齋潔爲先誠明爲本蓋邪則能干正非正炁則不能辟其非穢則能敗眞非眞炁則無以滌其穢故正眞生炁變化流行之妙也今旣内外貞白性道兼明萬境俱清一塵不染非集虛凝神之效歟勑壇思存章夫勑壇之法先以水劒安地戸上選有威儀道士具壇簡詣劒水處地户者天地之炁所以𥘉生凡物之類所出入也是以東南爲極陽而生隂故東南爲地戸西北爲極隂而生陽故西北爲天門故修行朝眞之法皆去隂而就陽者矣先瞑目存經籍度三師在西面次存上仙蔽身大將軍姓唐名宏字文明戴朱陽赤幘通天大冠絳章丹衣帶龍頭玉劒左手持金符次存上仙隱影大將軍姓葛名雍字文度戴朱陽青幘通天之冠絳紈丹衣手持玉載次存上神藏形大將軍姓周名武字文剛戴朱陽赤幘通天之冠絳章丹衣手執玉陽之節次存有眞官絳衣乗九鳳次歩破穢斗存北斗七星覆巳頭上斗柄指前不得遮耳目次方稱法位關白齋意畢三禮收壇簡垂手握固召四靈四靈者青龍白虎朱雀玄武四靈神也左手搯十二訣存肝心二炁化形出立於前左次右手搯酉子二訣肺腎二炁化形出立於後右次兩手捧心足履丁字立誦召三官呪次歩三官丁罡三歩向劒水所然後搯五方訣召五龍畢執劒水相向持呪次臨壇洒淨畢即於人門歩禹歩罡至鬼户煞劔退次三拜却搯中指中存諸神復化眞炁再還兆身中勑水禁壇文見科範門九鳳破穢罡淨穢符破穢訣罡炁呪曰天玄地黃六律九章焚蕩厭穢辟邪不祥急急如律令依式勑水淨壇宣解穢牒緫召四靈符用四訣合炁出四靈于左右前後呪曰吾召四靈君四靈畢集臨辟除諸厭穢並引降眞靈萬神俱侍衞八卦護吾身承今符命召火急赴壇庭急急如律令讀借地牒即建壇牒開壇符玉文祖炁呪曰大明洞煥三炁開光彌羅𣑽炁金闕玉房體仁合化合景中黃入極所致即道眞常急急如律令勑壇四靈符東方卯文千炁謹召東方青龍角亢之精吐霧欝氣雷發聲飛騰八極周遊四溟有大威德來侍于左西方酉文肺炁謹召西方白虎上應觜參英英素質肅肅清音威攝衆獸嘯動山林有大威德來侍于右南方午文心炁謹召南方朱雀衆禽之長丹穴化生碧霄流響其彩五色神儀六象有大威德來導于前北方子文腎炁謹召北方玄武太隂化生虛危應質龜蛇合形蟠遊九地威攝衆靈有大威德來從于後召三元唐葛周三將軍符上元唐宏卯文用左腎炁中元葛雍酉文用右腎炁下元周武中文用元黃炁緫勑呪混合三炁上中下元神超無象道運先天應體常寂變化自然聞召立至黙契壇乾急急如三天元降律令召監壇符呪曰三天有命四聖咸欽威鎭壇陛内外輯寜仗衞森列神祗效靈王符一召與道合并急急如律令洞逹神靈符斗訣用元皇炁呪曰神景合成萬炁齊并洞逹無礙變化窅㝠飛行十天逍遥紫清倐忽隱景眞陽混凝急急如元始上帝律令六府鎭壇符師曰六府眞符可召役諸天從官兵馬凢行科誦呪存金光道炁洞煥太空天帝髙眞乗空而降或以版篆鎭掛齋壇或用黃素朱書於禁壇之時隨方焚召始陽元精九靈妙景眞符卯文震炁召東方諸天從官兵吏丹靈炎上洞靈大梵眞符午文離炁名南方諸天從官兵吏皓靈靜陽七炁素靈眞符酉文兊炁召西方諸天從官兵吏玄光靜景妙寳虛梵眞符子文坎炁召北方諸天從官兵吏虛皇洞眞梵炁寳光眞符王文中炁召五方天帝從官兵吏髙晨太一妙極無上眞符天皇訣震炁召十方天帝從官兵吏緫祝呪太虛溟涬寥廓無光大梵流布六炁生陽飛雲結篆赤書垂芒諸天應感萬象咸彰急急如元始上帝勑天皇君召十方飛天神王符王文祖炁召六甲符呪曰玉清大將六甲宣行眞符速召徃赴壇埸召六丁符呪曰九天召命六丁奉行玉女神化速降神光三天減魔祕章北帝大魔王受事帝君前泉曲之鬼四明酆山千妖混形九首同身神虎放毒馘滅雷震神公吐呪所戮無親太微有命攝録山川鳴鈴交擲流煥九天風火征伐神鋒十陳㓙穢伏滅萬精梟殘妖毒敢起受閉亡關請依洞法莫不如言大洞滅魔神惠玉清隱書玄景散天湄清漢薄雲回妙炁煥三晨丹霞耀紫微諸天舒靈彩流霄何霏霏神燈朗長夜離羅吐明輝回嶺帶髙雲懸精䕃八垂三素啓髙虛蘭蘭披重扉金墉映玉清靈秀表天畿風生八㑹宫猛獸騁雲馳紛紛三洞府眞人互參差上有千景精㝠德髙巍巍太一務猷收執命握神麾正一履昌靈攝召萬神歸公子翼寂轅洞陽衞玄機明初合道康龍輿正徘徊七景恊神王飈輪萬杪階矯首玄津上飛歩絶嶺梯紋錦入神丘燦爛振羽衣㝠攄交雲㑹飛景承靈通清峰無毫薈綺合生絶空金華帶靈軒翼翼髙仙翁萬轡乗虚散蓊藹玄上䆫中生合景君九帝昌上皇明輪映黃寧羽珠曜玄陽天晶元素炁中五號養光結朗始生章九眞合成雙妙景啓㝠敷順感摽神宗泥丸洞元先運珠正絳官元陽部命門三神携紫童拘制召上歸夾闕侍明䆫翳欝對啓明圓華煥三冲方盈引接生返老回嬰蒙飈粲麗九天緑轅遶丹房蕭蕭纒藹表曲降𥨊華堂遊宴盻萬刼歸㑹神霄王仙道樂子生鬼道樂子㐫但聞貴生道不聞鬼道隆遥歌參天炁賈生元正章神惠命朱兵五帝符寒鄉仗旙攝萬魔瓊文檢北酆體解自然道妖滅非爾功汎景鼓長扇合虛慶霄峰俯盻回謝飛天刼永難終妙中生眞景回輦若遲遲意合在㝠感提携髙上埼翔翅期妙會洞觀情轉悲嘯咤咄嗟頃倐忽歷九圍攝炁反交初併景幽玄棲於是七星停矅重關洞開石陽激電五星奔移握節命靈是炁悉追鐵羆羅遮猛虎變威六師斬妖銅頭捕非玃天啖毒晶消摧萬精滅種六天崩頺三道正行何炁不回山河爲之傾倒日月爲之掩暉靈獸爲之墮領金翅爲之落飛五帝束帶於神宇萬靈受封於太微髙上汎蓋於丹崖八景策駕於霄扉洞觀元之妙化欣我道以坦懷右二章於禁壇之時宣白此呪遶壇三帀畢次結界行事各方結界用五方制邪玉文見建壇安鎭門靈寳王鑑卷之十二
