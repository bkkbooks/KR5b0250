front:
  text: 靈寶玉鑑卷之十及二
  hash: sha256:124c851c1318916a1add626ea21f186133075389afde285526d53210223dc3c3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_010-001a, image: hfl/0304/0304-004.png}
body:
  text: 神虎追攝門遣玉札三獻畢左手執玉札右手仗劔祝曰神虎追魂大聖三部追魂使者七真玉女仙衆神府七道功曹金闕玄都內臺追魂攝魄官君聖衆諸司將吏土地等神須仰齎此太上玄冥混元神虎玉札遍詣十方三界無極神鄉洞府仙宫冥關幽治盡覩昭昭之慧日俱離杳杳之重泉追取所薦亡魂來赴玄壇受度明彰報應毋輒故違急凖太上北斗玄冥律令攝召役神虎罡呪天一北祚太一紫元北魁玄範神虎玄冥斗中大聖玉女追魂十方精光隨我呼靈一呼一吸入我符中隨氣而出隨氣而行變化千億元亨利貞急急如中斗大魁攝左神虎印按心右劔訣義腰存身為青元玉相步此罡發遣遣將罡式總遣將呪金輝斡旋齊七衡飛罡神虎開幽關回度天常履玄綱抱素扶嬰定淑蘭泓遐扶盈映帝阿陵昌乘光盤兆羅和㑹七神作一家離合自然有玉葩玄範圵魁掌死生至道呼吸根蒂昌我奉玉札金虎文萬神敬聽靡不從如有逆吾大道者汝須黜陟道不成急急如圵魁紫微夫人律令行肅命風雷符在前卷呪畢雙手隂陽斗噀水遣去想官將持玉札徑入重泉取攝亡魂次焚玉札右手以扇搧灰飛左手二指搯大指根大指却搯中文餘三開闊勢曲向後如斗魒前指存斗口二星役神攝鬼皆由此也又呪曰天一圵祚令太一紫元勑神虎㦸飛運招搖一統隨玉札所至處十方精光都一吸急急如律令七遍又呪曰黃老三寶君紫雲上天氣攝制九幽魂太玄無邊際皆成自然人地獄無拘閉普開衆妙門悟道生智惠急急太上律令以舌運目閃呼吸十方之氣歸元吹布幕中并魂幡上太上混元玉札追魂鐵劵扶無量扶蓋嬰神嬰自官兆飛生自鶱盤業覩盤基蘭翠字九蘭定婆尼咎通淑易邈無寂碧落形攝總監浮黎上玄上天惡奕景蔚飛天無品蕭嵎大醜幽寂念隂陽諱度人掐隂陽斗譯文四十二字太上混元玉札急追劵章符文中合度一切苦魂幽爽生方死府咸從帝命神虎官將攝到如令不得怠縱勑鐵券式天一此祚太一紫元圵斗玄冥混元神虎追魂鐵券維太歲年月日奉為某入意云備録申奏天廷關聞合屬照應外今依禀太上元降太一混元追魂鐵券仰神虎官將如律追攝亡某等魂赴壇受度合契超升須至告下者書斗形并下符於此右奉天一址祚太一紫兀圵斗玄冥混元神虎鐡劵符命徑下十方三界生司死府逮取上件亡魂來赴齊壇朝謁上帝祗受天恩主者萬神開關啓路疾遠奉行母輒稽延一如契令太歲年月日時告下具法位臣姓某奉行右鐵劵以皂綃七尺髙一尺二寸前符諸篆並以朱砂雄黃書之題頭告文並以白粉書之可漏青地白書方函白地朱書餘並同玉札魏侯張三使者形見茭郭龍吏門三元都部符三官上帝部領將奉軍魁至玉帝𠡠準符奉行魒準三官大帝令行遍諸方三界無極神鄉泉曲之府北都羅酆五嶽城隍咸聽命令北魁玉文布真氣玉文上結五星聚五行午文東斗召魂功都成卯南辰攝魄切角正離西靈記命興生轉兌圵極召魂獨隸遷坎中黃運大可韓明中紅杏墨黑生鬼魂召將磨真襪臘從坤現默召將靈寶中藏五斗櫕中氣聚魂攝魄速現形墜幡太乙真人歌斗章斗訣急急召魂如閃電存玉帝即兆法身是也付勑與三官三官奉勑付與圵斗圵斗傳命差役某將開破地獄攝召亡魂存此符作金符此符專一追攝亡魂先念淨天地呪淨身口呪灑淨焚香平坐定氣以鼻引清氣入身激轉運元氣出泥丸直衝太空之中化為五氣布三十六氣混合祖氣存見氣中金樓玉殿金光閃爍中見三清玉帝金容玉相分明三官圵斗三界十方萬神同至兆稱法位默奏齊意請降勑命存金光中慈顔俞𠃔玉帝眉間金光一道灌注兆眉間金光相合化為玉字隨即開目執筆書玉帝諱存此字金光閃爍䢫筆流下書勑字成符召將入符想三官圵斗傅勑付諸將諸將禀勑告下五嶽酆都一時禀命拔度幽魂念三官圵酆至列言上清一遍見地獄摧毁化為清淨境界俱為天男地女之相䢫筆乘光扳出地户來赴齊壇再念幽魂多悲苦當思神霄君玉清真金符煥爀破重隂為汝釋𡨚結拔度出沉淪上升刀利天鍊化升丹庭急急如律令呪畢奏謝想上帝回軿納金光復神符式符不用封皮三元都部符使司本司今月日奉為某投乞開度某魂除巳具奏天廷頒降玉帝金符拔度亡魂須至告下者符右符檄上三元唐葛周三真君神虎何喬二主帥六真玉女七道功曹六甲使者諸司官將泰山下城隍司下沿路土地等神只今恭準玉帝金符攝上所薦某魂及三界十類六道四生孤魂滯魄男女幽靈等衆齊赴齊壇享食聽法符至準勑三官圵酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清急急如元始上帝度人律令太歲年月日時檄具法位臣姓某押遣檄髙功執水孟念三官圵酆呪一遍兆存思玉帝三官圵斗五嶽酆都並乘雲馭氣禀命聽令再念一遍萬神捧符而去再念一遍存酆都地獄摧毁化為清涼境界諸幽魂俱為天男天女之相並乘金光拔出地戶咸諸齊壇再念幽魂多悲苦呪一遍神虎隂陽二壇論師曰凡建大齊先期書下混元玉札併以黃素九尺裁為三假於左畔綵畫三使者真形服色繪像於真形之左以朱書三使者符神虎關牒亡魂申狀一一完具於艮戶上立一聚魂堂向南設神虎官將几案設茶酒果饌之儀先次如法變神步罡召將關發玉札關等次以淨土於堂中左右建立壇式左曰陽耀通關壇右曰隂靈攝魄壇打土令平方圓各方三尺六寸法師行持依壇式就土上畫之壇心安雌雄二印立左右監獄使者位牌於一室周回以白素作幕使分毫無露几案上然一炬明燈并安監魂童子符及神虎諸符又以二器盛水浸神虎追魂符各一道安壇心牌下於未梘現形前一時以現形符三道同關引冥財數分燒一道又以一道沉水中又一道法師自服之左手托定符水右手仗劔念天一圵𧙓呪上遍吸鬼門氣入水中噀灑壇中餘水留几案上以簾幕遮護密封室門禁人來往如期召魂方開薕幕將幡安二壇左右用通現幽釋通語通目符焚水中灑之乃噀灑童子身上令童子指其端正良久髣佛窺其蹤跡若孝子忠臣義夫節婦孝義誠切必覩形神儼若生存可交言語若髙聲悲泣驚魂飛揚即逺此矣若志誠慈善即遂感通切忌嗔怒私心妄覷隂責非輕矣左手天皇訣右手玉清訣依壇式就土上畫陽耀通開壇式呪曰畫畢面鬼户取氣九口吹之彈訣五行所造兮戌復歸於五行玉皇訣四大假合兮復歸於太空午或隂或陽兮子文任天地之根宗天地冥兮萬鬼潜坤天地動兮萬鬼爽中指中隂陽運兮鬼神享二指甲下感此倣徨兮赴我壇賜汝靈書兮歸上清急急如太上玄冥律令攝隂靈攝魄壇式呪曰書畢面鬼户取氣九口吹之彈訣次仗劔面壇隂陽推運兮劫數更遷五指中生死周流兮孰愚孰賢輪轉無窮兮上玄造化未出三界兮拘於神變寅魁𩲃東斗兮酉𩳐魒西轉卯𩵄䰢南辰兮子魓罡圵面丈隂靈兮茫茫沒沒陽魂兮碌碌幽幽子天地冥兮萬鬼潜順至寅天地動兮萬鬼爽順至巳隂陽運兮鬼神享順至坤太乙召汝何遲遲先至後至律有常天一圵祚神虎勑卯太乙紫元魂魄彰感此倣徨兮赴我壇坤賜汝靈書兮歸上清急急如上清玄𡨋神虎律令引中至丑上出呪曰陽耀返魂不受死經隂靈攝魄回尸度厄次念三魂七魄名台光不昧爽靈魂營幽精復生尸狗去奸伏尸除邪雀隂無垢吞賊開明蜚毒無滯除穢非干臭肺閉塞陽魂復因天地正真氣再聚汝形神此是五行造化之真五臟百神永保安寧隂魄陽魂無逃避形一呼一攝速變真形靈符一攝壇現魂靈急急如太上玄冥神虎律令右依式安壇及諸符命閉神虎堂門逐日修誦發符檄催捉追魂到壇現跡墜幡通語明彰嘉應至建壇日開門就堂中攝召八門壇式師曰欲召魂現形於神虎堂中心立八門召魂壇相去八尺一仭地開八門以紅綵左紐長九尺或一丈五尺量地圍之八門用一十六鐵纂各長六尺下以白牌書八門名及分布八門符以淨盆盛仙藥湯浸鐵跡臺光寶章安中央古法以淨芻作人形依生門前服飾腹中安大梵隱語頭上戴生天大券釣於稱鈎上令芻人空立離地三五寸預於前期以白絹七尺二寸造召靈攝魂幡各長三尺六寸男一首女一首以竹竿八尺四寸繫幡於竿頭男幡立左女幡立右中心安攝召魂男幡書鐵跡臺三字女幡書寶光章三字如期行攝召之法令童男室女各執一幡立于法師左右依法召將行事茶酒供養如式道衆咏洞章焚催召牒焚燎錢馬然後召請亡人法師先右手執幡左手搯聚魂訣叩齒九通左嘯三聲右呼三聲次歌召魂呪隂陽斗章存用行持以幡蒙芻人隂魂來附其幡墜重竹竿曲勢與芻人稱重到地即灑淨迎魂赴幕拯療沐浴更衣朝真受食畢緣錬度日逺恐亡人怕生人陽氣散亂隂魄再以幡引歸聚魂堂壇開死門而入復閉之次取壇中水以灑之壇中十方蒙者生形全魄能令顯識示影現形引魂受錬時開生門引出入錬鐵跡臺光寶章右符章以碧𥿄牌髙三尺以泥金或雄黃書之置于八門壇中又以黃綃三寸丹砂書之用茯苓伏神天門冬人參地黃各一分煎湯置壇中召訖以楊枝灑壇十方蒙者生神全魄現形顯影左壇幡上符鐡跡臺字右壇幡上符寶光章字右二章符用雌黃和辰砂書于二幡上立于八門內並用天皇訣氣書之天皇訣印以二指搯大指根以大指搯中指中文餘三指開闊勢如屈曲向後如斗魒前如斗口中有尊帝二星之印呼雷役電召龍禁勑雷霆之怒收攝虎豹之獰役神攝鬼皆用此印太一召魂合符幡面上太一攝魂合符幡背右二符書于攝召幡肚上左手書三魂名右手書七魄名下腳書亡人姓名生死年甲背左手書遷神寶幡引導而行右手書合符附魂善念不更太上神虎追魂符頂中書散形東方追魂南方追魂兩方追魂攝魄大使攝魄大使攝魄大使北方追魂上方追魂攝魄大使左三魂攝魄大使下方追魂攝魄大使急降右七魄升天追魂入地追魂急降攝魄大使攝魄大使飛火追魂入水追魂陽間追魂間攝魄大使攝魄大使攝魄大使飛空追魂左三魂右七魄攝魄大使急降俱來順道者昌無所不收火光逆道者亡無所不攝萬丈准三天上萬里火雲差關九萬帝勑命飛空如箭疾準三尺上帝勑命火急攝魂赴壇聚形大煞文四門罡訣南氣祝發呪上清律令制召大神追魂攝魄速來現形承天帝命時刻無停太上玉符疾速奉行敢有不依上奏帝庭急急如上帝律令監魂童子符徐書符呪曰三清玉勑急降尋魂真都元陽紫微之童回光洞映無逺弗通出幽入冥齊契元宗急急如律令引魂童子符孔書符呪曰三清玉勑降下聚魂太上玄都始青之童幽微顯徹威鎮羅酆死戶閉塞九孔肅道四大九維三界咸從亡魂隨步躡景無蹤周旋生門與道日隆急急如律令神虎追魂符白地黑書大皇印玉清訣吹水中噴在攝魂壇內神虎火神虎神吏圵帝陷隅聖攝一十五人攝赴北獄化元聿追魂使者後魏張追攝魄飛睪魂神使者監獄劉令急急現形聚形神虎幽寂現形符十訣天門氣天皇印玉清訣神虎大聖神虎大聖何昌喬荀急雄左勑雌右攝速追魂神玉女七真使者劉急速附身神化元聿魄玄冥虎㦸飛運招搖一統隨呈飛睪聚形右符朱書黃𥿄沉圵流水中法師自服一道無亡人年月者可燒灰手擎之呪祝某人家先亡魂云次往東圵方通現使者符朱書燒淨水中泗隂獄神虎神左右追魂君攝衛靈神史引魂遵奉神急急如童子虎勑律令呪曰急刃神虎攝立付合身形急急如律令通幽釋變符聚東南氣繞符灑之神虎飛符攝北方陷魂魂吏十五貟攝付北獄左七轉云魂飛右七轉云靈飛玉律大力攝玉女天靈攝通語符東氣太一紫玄霄轉助精大神覆魂真君天一北祚元君上帝勑神虎現體露形急急令魂魄勿失如上帝勑攝右符燒灰入水噀人身令見亡魂及通言語在隂獄內呪曰上帝勑令神虎神將亡魂飲液急速通言急急如律令普現通目符神虎神虎神虎神虎大聖大將玉女功曹禀勑急召魂化元聿魄星魂急急現真形飛畢勑攝真神魄通達金靈玄冥呪曰太上降慈悲令救世間人獨隂與獨陽耳目有靈光速令現真形速令聽人言謹請護法靈童明彰報應封形閉債門夫精氣為物游魂為變者出機入機之謂也凡有形有質者生即有滅而無形無質者不生亦不滅也且夫人之神氣既散尸殼猶存及其蓋棺事竟或未擇吉地或未卜良辰以此因循遂成停殯然而孝子仁人之心固有所不忍者則必待修建善緣以表夫崇德報功愼終追遠之意而後舉喪此義往往有之若修崇之間寧無尸穢之妨是故靈寶大法有封形閉債之理實法乎尸解上仙之道也故以隱景遁形之訣而攝遁其未化之尸形以妙無清淨之光而超度其已散之游魄俾超神於無聲無臭之境證道於不生不滅之天則善果良因庶便其修奉矣非心空幻滅理悟神忘者疇克爾哉藏棺祝法師曰凡有尸殯之家欲修功果非持帝真弗格亦且存亡獲譴關繫非輕若須急欲薦拔者惟慿符法掩蔽尸棺師必凝神靜念先於淨室焚香奏啓玉皇上帝太乙慈尊三天八相救苦濟度諸大真人密露情悃請降正真靈氣灌注丹砂筆端然後依法書符以候將行建壇之時仍於道場奏告帝真關集本部天神將吏太歲甲子諸官君一合下臨壇所掩覆尸棺滌除穢氣使內外蠲潔壇場肅清方可修崇析恩超度也奉法之士可不愼之靈寶藏棺符棺前午文離氣呪曰離火焚蕩尸穢消除亡者受度上升帝君前右角坤文坤氣呪曰坤順內營天清地寧掃除尸穢超度亡靈棺右阿文西氣呪曰兊金生成白尸返生三錬九化升入太清棺後右角乾文氣呪曰乾尊耀靈蕩滌妖精氣分羅絡魂魄飛升榨後子文北氣呪曰坎水㳙潔穢氣氛葩亡靈獲度升入太霞後左角艮文氣呪曰艮興寅文人鬼殊途遵符掩惡魄返仙都棺左卯文東氣呪曰震木發生巳枯復榮藏尸掩穢魂升帝庭棺前左角寅文氣呪曰巽風飄蕩地户開張穢纍永滅魂度仙鄉總持符呪吾是太上真人九老道士好道樂仙身佩五氣玄黃紫庭消災散禍伏匿五形積歲八百不墜千齡運應度世受錬尸形永畢生命自保魂神太上有教天神師真蓋棺符呪曰玉訣祖氣天地洞清洗穢除氛鍊化九道返形太真百關納靈節節受新清虛鍳映內外敷陳日吉時良度命回靈玉童玉女侍衛我身玄靈紫蓋覆護尸形魂魄受度上升朱陵急急如上帝勑又法向北祝曰天靈節榮真人某人受鍊更生上帝所授太乙所尊某受三壽永得長存香餅甘果身歸蒿里氣歸五行託尸輪轉形同三元太上符命召地萬神遠召九天三五太山向有所犯勿得留停輒承太一無上元元制符定命徑入大玄七十二相金紫之精與俗殊途更受長生四時五行道氣合并急急如律令又法祝曰真人某一夀命不長老君神符進入玄黃左日右月消除禍殃六界父母六丁鎮形生死别異不得留停斷絶伏連逺離妖精某人身得度世祐利生人子孫承藉永保無傾急急如律令謹按上清青要紫虛金根經云凡修上道兆身父母伯叔兄弟於世上死亡兆身不得絶迹故在人中身履殗者當取清水一盆真珠一兩投在水中於中庭南面臨水上叩齒九通呪曰氣化成神尸變入玄三化九鍊升入九天九天之劫更度某身某身更化得為真人呪畢男死思玉童三人女死思玉女七人取盆水以灌死尸畢取水自洗手面仰天噴噀又隂呪曰天氣巳清人化巳生某乙上天九錬受形五苦三途斷落死名超度窮魂還返南庭如此行事則亡人即更生於九天之上九年得升玉清之宫或遇立壇度亡止書符九道仍告白亡者以蕩穢呪灑水旋繞尸棺依向背粘貼掩藏君穢修建畢起符焚之靈寶玉鑑卷之十
