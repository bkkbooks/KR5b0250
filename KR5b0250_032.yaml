front:
  text: 靈寶玉鑑卷之三十四方八
  hash: sha256:419553111357b85ed64d9de8a1861982da27d2bf47ffbc95d7967a91b9ac9ec0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_032-001a, image: hfl/0309/0309-077.png}
body:
  text: 列幕敷化門夫道體若虛空然無所不容無所不化也豈限以一隅而成哉且知月出于天凡有水處影無不在也雷震于地凡得聞處聲無不應也法性亦然靜虛則能應物也苟推常善救人救物之心而無所不被其化也故衆生障翳本來元明眼根依物乃轉種種染著造諸業緣生前為疾病所侵以至毀傷夭折形體不完皆不得其正命而死也身雖滅度妄念猶存故以靈寶大法敷化一科以元始妙化而復其本然之性天庶業識斷除善根滋長復何疾病困苦之有哉經不云乎吾有大患為吾有身及吾無身吾有何患今既身空幻滅雲散月明不著於色相之塵不落於萬緣之化豈語言文字所可議哉九天監生真文呪曰飛玄之氣結成真文死骸開度萬品生根右九天監生真文一十六字作真文立於監生司中鬼神見之自然百骸流光辟却尸穢血光之氣九天監生司謹請九天監生司馬大神衛房聖母元君天醫列職仙衆只今引過血湖未分娩産魂約入幕次俾令分娩托化人天召天醫符卯文東氣誦隱語書之呪曰太上九光真華之氣流光下臨洞徹九幽上帝有勑普救幽魂出離苦爽速離寒庭急急如律令天醫尚藥符斗叩天門氣呪曰天醫大聖地醫元神靈丹仙藥普救群生降臨真氣聞召速臨吾奉南極好生大帝律令又曰天醫天醫速降天門拯救群生治病消危上帝有勑風火急行急急如律令次想亡魂入幕分娩符中文靈寶氣謹請加保之母速賜真氣救死魂生天衆念靈書三遍東南氣想魂入幕念巳生未生皆得生成一法四句並誦又念三十二遍每三遍一取靈寶氣吹去亡魂母子分解又呪三遍呪曰元始洞玄靈寶本章胎化生根斷除邪穢百神定命離合自然雌一變魄雄一變魂混洞變化中有帝尊和陽召隂鍊精正胞升降明堂暉映景霄內結流珠融結萬方紫煙青雲玉嬰金光産亡之鬼胎根解散母子速分太素生五臟七魄入泥丸急急如上帝勑監生符卯文長生訣呪曰天帝合明下付幽𡨋真氣成象隂陽附行宿愆𡨚纏解結開明監生速降衛房急生玉真靈書救拔産清大道有令天醫全形急急如律令唵嗚輪尼哆嗏全形符呪曰太上大慈死者能完神形得妙上朝玉房急急如玉淸上帝勑出胎符二指下節蕩胎符二指中節呪曰元始符命時刻升遷胎根生化返靈向真斷除邪穢變化形營死魂受符仙化成人蓬丁中文黃確酉文天中之靈日月俱通甲乙氣令五行旺尅八景玉音守符真形招靈致真攝魔符使速降通靈承符奉令輒莫容情急急如律令回骸起死符衆誦靈書三遍存一氣金光洞徹十方永度三塗符卯文東氣蕩穢所謹召本司壇下官君將吏請同運穢神君收穢神君却穢神君除穢神君斷穢神君滅穢神君洗穢神君破穢神君蕩穢神君東西南北四靈解穢神君將見今巳産亡魂及幽魂中巳生未淨衆魂同入室中滌除穢氣使得受生汝等衆魂巳沐生成之恩仰再入室滌蕩穢氣元皇淨血尸沐浴真符呪曰天河神水洗滌凡軀普濯膻穢消罪蕩除玉籙符命徑上南都急急如元皇上帝勑元皇蕩血尸清神真符呪曰神淸氣化鍊質形軀內符所受保舉帝書經絡存布徑上南都急急如上帝勑元皇蕩血尸通靈淨魄呪五行之氣周流三光之氣飛浮神魂澄正歸上天㑹合萬神玉亰遊師為慈尊頂出震氣注血尸皆令淸淨托水孟掐卯文東氣入幕遍灑滌血穢通神淨魄符卯文東氣呪曰天帝有勑曲赦生靈蕩涂血穢舉令通真流光洞照體合自然急急如上帝勑又呪太華神水浩渺無窮能令穢濁悉變清涼玉華流注魂魄生光符與真人俱㑹玉房急急如律令子文北氣焚符入孟想內外光明解穢通真符呪曰天地成章光射三宫三魂守固七魄守中解穢除惡道氣無窮令魂通氣上逹陽光急急如上帝勑又曰隂尸九轉化成神尸水火之氣變入玄玄三化九鍊升入無為九天之劫鍊度身魂受化更生得為真人急急如上帝勑水鍊血尸符子文北氣呪曰元始符命拔度幽靈血尸臭穢凶惡潜寧七液得注五臟光生急急如上帝勑建天醫院臣謹䖍誠上啓聖祖神農皇帝天醫大聖九天髙明大使神功妙濟真君疹脉奠師尚藥靈童治病功曹握針童子盧扁神王五官醫吏六職治官五行典吏驗疾慱士審疾真人九天司馬衛房聖母監生大神胎生君護生君分生君速生君加保之母浣濯夫人靈寶局中主産功曹下死胎功曹天醫合屬仙㬰臣聞二氣運行尚有否終之理群生處世寧無故誤之愆疾恙既纏死生難愈臣今攝召六道四生孤魂滯魄等衆切慮生前妄想夙世貪求智巧紛紜利名纏縳神虧精散氣耗形凋生時為病苦所侵死後乃隨魂受疾復有一切傷亡及諸橫夭雖為鬼爽晝夜呻吟杳杳沉魂滔滔滯魄若非經由於拯濟亦難臨與於法筵仰體道慈依科拯療謹請天醫列職官君尚藥治病仙吏於鳯凰宫中取太清五色神藥散布亡魂拯療生前一切疾病分頭拯治木官散藥火官主灸金官持針水官主湯土官和劑五官醫吏協力同心全形復性如有拳攣跛躃病者請針灸神將治之或有瘡癤膿血病者請外科使者治之或瘖啞未疾死者請活人天醫治之或證候不明而死者請拯候功曹治之或胎産橫死者請玉仙聖母治之或驚悸霍亂而死者請安魂定魄童子治之或飲藥食毒而死者請續命放生真人治之或患傷寒時氣而死者請發汗神將治之或首體不完而死者請續頭功曹治之或身狀不完而死者請聚形功曹治之或肢體不具而死者請返魂功曹治之或喪亂真氣而死者請全形聚氣功曹治之其余該說不盡者請列職仙真察證候而治之俾令首斷為續筋斷為聮骨傷為𥙷身碎為全水腹為去縊縳為釋枷鎖為脫泥沙為除蠱癩為剝膿血為淨胎孕為下蓐損為育仇讎為解執對為和盲者開視聾者發聰啞者能言跛者能履攣者能伸悲辛惱亂者應時解釋飲渴焦勞者即得淸凉胞胎散滯者結節踈通氣體平安形神整具克期超化受鍊更生臣干冒聖威無任懇禱之至謹言五帝全形符青帝護魂符卯文紅杏九聲呪曰太華木司九氣元君閉固神氣青色周溢色自初胎息經千息青色俱充內自凝結急急如上帝勑右符東方青氣九道入口運肝氣相合自左目噓出彈訣存木官降藥拯療衆魂白帝侍魄符酉文磨真七勞呪曰金華金生七氣老君西方庚辛太微玄真內應六府化為肺神見於無上遊於丹田先護我命用之必仙急急如上帝勑右存西方白氣七道入口肺經白氣相交自鼻呬出彈訣金官持針療魂赤帝養氣符午文襪臘三聲呪曰衡霍火官三氣元君南方丙丁赤龍君停隂神避位陽官下迎思之必至用之必靈急急如上帝勑右存南方赤氣三道入口運心氣相交呵出彈訣火官灼艾拯療衆魂黑帝通血符千文墨黑五道呪曰恆山水帝五氣元君乾坤妙用隂陽降升周運昆崘氣返周天超凡入聖莫非氣神出入玄牝往來變形五藏欲見黑色通靈金木間隔隂陽混成急急如上帝勑右存北方黑氣五道入口運腎氣相交吹出彈訣水官煮湯拯療亡魂黃帝中主萬神無越符玉訣靈寶十二聲呪曰一氣天君嵩山土帝中央戊己內藏元氣黃色力堅運之可治丹陽莫辭朱書共儀得達四肢黃雲大起急急如上帝勑右符存中央黃氣十二道入口運脾氣相交呼出彈訣土官和劑拯療亡魂各方中金童玉女擁輔五帝握三塗五苦訣念後呪七遍金城孕秀玉洞凝神真氣內養以成真人今日受鍊上登朱陵魂魄受鍊與日同明急急如上帝勑五帝全形升度符聚魂復形全體呪興生卯獨𨽻辰可韓已興生轉下辰獨𨽻遷卯可韓明寅功都成切角正聚魂對魂攝寅至已出灌溉飛魂魄今復見全形急急如上帝勑太一返真符中文祖氣呪曰一生萬化運行不息玄機自然紀度潜歷虛景合明妙宗湛寂有無二致咸契中極急急如律令引五氣入符存五氣歸一作用玄元始氣呪玄元始氣孕育三元胚胎肇始二景回旋隂陽藴秀凝結胞元形容世壤積業無邊五宫六府結塞三田百關九竅纍滓成愆形消氣散魂繫九泉隨魂受疾求脫何緣天醫尚藥拯療痾纏首斷為續筋斷為䏈蠱癩為剝水腹為寬胎留為下孕育發生拳攣伸縮喑啞能言手足不具俱得完全盲聾視聽顛狂復完老者返壯執對和𡨚饑饉充實沉痾悉蠲風勞凍絶咸得醫痊魄户閉關魂門鍊仙與道合真靈寶聚形返真符日月五星五氣周流五行生成全其身形貪至破其冀秋冬閏覺長口誦手書斗至票觜參危室餘炎勑急急如五帝上帝勑聚形呪曰紅杏持到卯墨黑庚同子磨真計力酉襪臘聚成午靈寶萬物中消利六合正一成法知一可具取驛令下攝六合訣逐方氣吹彈通流五氣落滅惡根呪紅杏持左癱攣者伸震墨黑尚上耳目聰明坎磨真佑右緩廢者平兌臘襪下下跛痾起行離靈寶沖中身强體輕中青帝護魂肝木長榮卯赤帝養氣心火光亨午白帝侍魄肺金生成酉黑帝通血腎水淸停子黃帝中主脾土安寧中梵氣彌羅自然成真中指中午氣回尸起死白骨成人子至亥天門氣濟度垂死絶而得生坎至離火氣九和十合變化上淸急急如律令向來所召靈官功曹天醫聖衆奉為亡靈全形復體一一如法莫不體乾坤造化之功運隂陽和合之數密行匹配靡有乖違尚慮亡人相貌雖全形神未淨更為汝等念玉淸神霄太一含隂育陽神呪呪見科範門灑淨引魂赴室人間不潔世物膻腥仗此妙音悉令淸淨臣謹重誠上啓神農皇帝天醫聖賢列幕高真承行官吏仰蒙拯濟皆得生全無任瞻依謹當奉送如尋常齊醮止用前三幕拯療符法如普度大齊必須用後敷化門符法靈寶玉鑑卷之三十四
