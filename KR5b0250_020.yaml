front:
  text: 靈寶玉鑑卷之二十二萬六
  hash: sha256:310d8d05edb50ee4d85b75d72ac2692a94aac763efa3d87270d8196306ddcdb1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_020-001a, image: hfl/0307/0307-004.png}
body:
  text: 告給符籙門道一變而為法蓋法為道之用也然道為法之體者亦無在而不在也乃日用而不知耳經不云乎譬道之在天下猶川谷之與江海蓋祖氣亦然而萬法之中何莫由斯也是故靈寶大法有符籙簡誥者而義亦有所自來矣在昔皇人按筆八角垂芒曰鳯篆龍章曰金書玉字皆上古天人之法製也所謂符者以合其妙籙者以紀其功簡者以格其言誥者以出其令是皆法元始之祖氣合靈寶之妙光以㑹神著靈於竹帛金玉朱墨楮札之間而微顯闡幽開光長夜執符把籙監真度生亦體夫自然神化玄通之妙也宣行之士宜靜虛守一注念凝神洞徹幽明混融內外則我之法性元神即是本來真身元始其一㸃一畫悉是道氣金光誠如是則無所不通無所不度者矣道法體用豈有他哉請降諸符啓奏具仕臣恭焚寶香重誠上奏三清大道十極髙真啓教宗師三界官屬伏望道慈俯垂洞鋻伏以開壇蕆事聿嚴靈寶之科章濟苦度亡須假玄元之光氣臣退慚蒙昧未造精微然書篆恐未合於玄規故施用當力祈於真命伏望勑侍仙而啓藴付小兆以承宣普告萬方俾遵行而無滯開度群品即時刻以升遷臣干冒天威下情無任激切俟命之至稽首再拜謹言書符行持存用凡書篆諸品符須依法入靖香燈紙札筆硯之屬一一備具先行內錬十轉回靈之道法師靜座調息神氣澄虛存下丹田淵泉宫靈寶先天祖氣自中而歷二十四節直透泥丸頂門又復降下元宫復升周回十過畢次存三田中有三尊乘三色雲氣上升端坐泥丸之中次有天上三色雲氣中三尊降自泥丸混合為一如此分明自已丹元君上朝心奏所陳之事須㬰慈顔允奏勑命左右侍真金童玉女捧琅函玉笈在百寶光中降付容臣奉行即密謝畢自己真人頂出寶光混合神氣內外洞明鳯篆龍章徘徊于几案之上叩齒十二通執筆呪曰溟涬大梵寥廓無光赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存右玉訣天門氣布之念合明天帝日三遍勑朱墨呪玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成真右搯子丑順至亥歸中吸巽氣旺氣布其上玉清大梵呪三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清右玉文祖氣勑諸符等用押字呪疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷勑印呪億曽萬祖幽魂苦爽皆即受度上升南宫存太一天尊三十二天帝三光大聖並降金光道氣灌注無窮次取日精之光合東方生氣九息布于筆硯之上右執筆調朱左搯震文呪曰玉誕長桑柏空度仙丹華曜水度魂升天氣映白簡金光自然永劫長存安鎮寒泉幽魂開度長保劫年存我本來真性神光即是天尊運筆書篆救苦簡正面符書符呪帝真混合鍊神溉胞左右奉令司馬洞謡九壘土皇空洞九朝紫户定録神府升霄開度長夜隂貫陽標三張總御合慶幽寥六氣咸通明梵演招司命司録司功司殺總統三靈明示都府玉皇上帝降勑開幽中理五氣混合百神曇誦延越承命三清九陽司化百神應朝覆雲育靈拔度況冥太明合曰隂境承輝天覆之精下䕃地靈赫奕玉帝威振火鈴北酆受籙九幽齊升冥曹合同準勑遷神神筆一下明檢鬼營三官五帝放大光明牛頭獄卒咸皆聽命周回萬里罪苦咸停急急如律令勑呪元始上聖玉帝髙靈玉文告命濟死度生金籙妙戒拯護幽冥白簡寶文九真玄經解消罪咎𡨚債和平救苦真人削罪除刑察命童子注上生名護戒威神引詣福庭超離五苦乘戒雲駢轉輪得道飛升上清祝呪曰元始符命茭龍驛傳隂關夜府罪苦咸原通幽達信魚龍告宣魂魄受鍊永離鬼關乘功遷化上升三天一如告命下入重泉救苦符簡背告文元始符命金籙白簡救苦真符告下十方無極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔拔度某等魂出離地獄永辭長夜覩見光明萬罪消除𡨚仇和𥼶乘此九真妙戒拔度功德上生天堂一如告命年歲次月日於黃籙齊壇告下預修告文改曰元始符命金籙白簡救苦真符告下十方無極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔覆護預修弟子某隨所救度出離幽沉覩見光明因緣輪轉衣食自然得為初學天人一如告命年歲次月日於齊壇告下右符柏梓木長九寸闊二寸四分厚二分朱篆時如前符命作用面東長跪取生氣九口為日華之光吹布簡文用震文念後呪如普度亡魂於几上九吹於簡上存日華周圓無邉方始書之用玉帝訣簡袋式救告真符告下十方無極世界具位姓某謹封預修書符呪天寶君靈寶君神寶君朱明景化保素通真后𡈽九壘俱㑹帝庭五氣混合日月停輪魔王保舉諸天紀名三元合慶中監五嶽下統人倫注生注福司命司勳南辰北極陶魂鑄魄六紀齊并金輿玉輦朝謁三清九霄斡運紫户生神陀羅育邈渺氣合雲九府安鎮幽爽完形華都曲麗禀勑奉行長生簡正面符中訣祖氣仰首取南斗氣書符呪元始上帝氣灌胞元玉皇上帝玄化照臨左陽真神右隂靈神無上七元九幽罪魂神珠曜日晝夜華明天帝合明地神合精黃雲欎單氣象交并左司天府君形九隂右司天府上生君胎三元校録九夜升騰覃赦五嶽八獄惡根太一司命桃康奉令司録諦迎司非敬聽太極都治八天元君太玄司方召八靈君天合地合日月合明三元四始隂陽混凝朱陵火府王帝華京朱陵帝君爍煌炳煥煜𤊞煴上元天帝君命急行元皇下覆三官奉迎九地九水九隂關津道路開通送護神庭太上老君千真監臨泰山之府承命咸遵天勑宣行黃光洞明司命元一執符把籙尾毫為使飛逵帝宸度名南斗更生上清勑呪元始上帝赤書玉文解消隂結以證超真刀利南極浮閻之神流火受鍊禪猷保生婆泥靈童與滌隂穢表裏瑩徹玉嬰之形飛步禪黎洞陽之庭一如告命金龍驛傳祝呪日中赤帝號曰丹靈真符命仙玉籍保生虹映玉華焕落上清七世父母纍命重寧越此宿對禍滅幽冥公子執吾符太一居紫房三合地戶下拔命上玉宫急急如律令又呪司命受錬相火成罡梁為天牢同感陽光樞機輔弼星列玄章育精太明赤車凌芒鍊化神府表裏俱昌急急如上帝律令白簡總呪太上開明元始監真五老上帝赤書玉文拔贖一切宿對罪根皆蒙解脫考對俱停魂升九天魄度朱陵今日大願萬神咸聽龍負白簡關告真靈氣如所願風火驛傳長生符簡背告文元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司録延夀益算度厄尊神回骸起死監生大神超度某等靈魂上登朱宫流火之庭玉眸錬質黃華蕩形書名紫策受化更生乘此金籙度命功德時刻升遷一如告命年歲次月日於黃籙齊壇告下預修告文改曰元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司録延壽益算度厄尊神回骸起死監生大神覆護預修弟子某生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清一如告命年歲次月日於齊壇告下簡袋式長生靈符告下南方丹天世界具位姓某謹封金龍驛吏符掐玉訣西北望太微尊星引黃光內合布氣玄都金龍驛吏二人承誥頒符馳信天道達命朱宫鍊度亡魂受錬更生一如告命右符黃地丹書寫兩邉告文粘於長生符關中茭龍驛吏符北一星居斗中即北辰也在天皇之右引光書符玄都茭龍驛吏二人承誥傳命告下隂府泉宫開光赦罪拔度亡魂上生天堂一如告命右符青地朱書并寫兩邊告文玄都茭龍金龍驛吏傳命泉曲開光赦罪凡告頒救苦長生二符必須關聞驛吏以二符粘於關中救苦簡內符子文北氣紅素黑書入於簡袋內長生簡內符午文南氣黃素朱書入於簡袋內東極青玄救苦九龍符書符呪稽首三境尊紫陽開玉匱重昏遇朗日長樂天宫啓金光降仁惠大慈仁者勑九龍使者青玄童子救苦真人青玄靈官乘龍降世法雨慈雲吹灑地獄永除酸辛九幽罷對六道停輪承兹天澤幽魂飛升十方天尊應化沙塵隨念升降拯拔亡靈執符奉行上生福庭急急如青玄天尊勑右符再入大九龍符存太乙慈尊御九頭獅子金蓮之座真仙侍衛放百寶光洞照天地師即默奏請符仍念睿號八十一聲感天尊恩命左右侍真開紫陽九光寶藴出授前符師即拜授次執丹筆再念睿號九聲引東氣入筆然後書符訖再念睿號九聲取氣吹符用玉清訣九龍符告文用碧紙朱書東極青玄救苦九龍符命告下三官九署五嶽九州酆都六洞十宫九幽河源泉曲五道都府城隍社令冥關幽扃一切主者咸領符命拔度某神魂及九州分野病死橫亡沉魂滯魄囚苦罪魂徑出隂翳永離幽冥地獄消苦開泰泉扃火翳滅熖刃毒摧傾下明黑暗上生朱陵超度三塗宿對停輪一如告命風火驛傳年歲次月日時告下具法位臣姓某承誥奉行東極宫中大慈仁者尋聲赴感太一救苦天尊內封東極青玄救苦九龍符具法位臣姓某謹內封方函式東極青玄救苦九龍符命告下三界十方九野地司隂曹萬神具法位臣姓某謹重封東華青宫生德開光寶符告文簡髙一尺二寸闊三寸二分用粉粧朱書封題如常式上東青林太皇萬福道君生德開光寶符告下十方無極世界三宫九府百二十曹五帝考宫酆都嶽府泉曲九幽溟泠五道大神河源水官冥關主者拔度某出離冥府地獄解釋愆尤上生東方太皇之悟明正道逍遙自然一如告命年歲次月日時告下簡袋式生德開光寶符告下三官九府五嶽九州冥曹具位臣姓某謹封三氣流光救苦真符上帝訣東南氣書符呪元始上帝虛皇天尊無極大道太上老君玄元始氣九天真文鬱儀孕殊結璘合輝三光朗耀七元流珠恩覃泉曲澤流血湖胎元散結穢纍蕩除慧光接引上升天衢勑符呪靈寶玉書拔度真符流光普照蕩滌穢軀天符告下徑上南都急急如元皇上帝律令判符呪真符在手永救血湖巳往𡨚業一鍊消除急急如元皇上帝律令祝符都呪大慈二真人能救産死苦放光照世界地獄悉停住刀山髙巍巍鑊湯沸炎炎至心念真人罪緣宿𡨚解晝夜心不離解脫全爾身歸心發回向同上七寶林急急如元皇上帝律令三氣流光救苦符告文靈寶符命三氣流光救苦真符告下十方無極世界九幽地獄大小鐵圍有間無間溟泠北隂之府符光所照摧破幽隂火山息焰寒池摧冰刃為寶樹劒作騫林乘此符命拔度某洎血湖産死一切罪魂出離北府徑上南宫靈寶符命時刻升遷年歲次月日時告下簡袋式三氣流光救苦真符告下無間血湖諸大地獄主者具位臣姓某謹封蕩滌血湖符元皇淨尸符並見玉元追度門玉清寶籙拔幽魂真符西北氣吹筆東氣吹符上拔出羅酆九幽泉曲之府勑赦火鈴呪曰三天大羅髙上玉清元始靈書太上真文玄元天道勑降玉晨天洞天真主領魂神九幽主者六洞真靈禀受真符拔度沉淪天王律令隂曹奉行勑呪玉清布命普拔幽魂天光一照罪源蕩清急急如髙上神霄玉清真王律令書符呪元始符命總氣上元普告三界歷關諸天風澤洞虛萬氣齊仙元洞玉曆玄化重宣九泉幽爽斬絶地根回骸起死時刻升遷三官九署衆惡咸原拔出地户九祖升玄急急如靈寶天尊無量度人律令勑呪幽魂多悲苦當思神霄君玉清真金符煥赫破泉扃釋汝解幽閉拔度出沉淪上升刀利天錬化升丹庭急急如神霄玉清真王律令總勑符呪神霄符命勑下九幽諸天卒吏符到奉行一切罪魂