front:
  text: 靈寳玉鑑卷之十四及六
  hash: sha256:874108b17cecda7bd099f241f026f0d800d102e60d8625dac092b9dce56b867c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_014-001a, image: hfl/0305/0305-033.png}
body:
  text: 壇儀法式門夫建壇立幕列職分司崇徳報功慎終追逺實孝子仁人義夫節婦之盛意也是故法天像地列斗環星八卦九宫十方三界玉京金闕悉備于斯至如道德威儀進退禮樂運神㑹道躡景飛玄陟降有嚴對越無怠實由法性中運化出來則一一皆合其陽德隂功也古之泰畤與三壇同墠之義豈異此哉登斯壇也要在心隔玄妙神契虚皇故得三界尊崇萬神朝禮洋洋在上不顯亦臨一念苟差則千里懸隔矣是故靈寳大法自上古而降在人間秦漢以來至人乃出晋宋以後其道遂行陸簡寂倡其風於前張清都繼其列于後而杜廣成等次之師資授受代不乏人襲𣲖㝷源厥有端緒倘誠敬之不失則感應之自然此則今古攸遵天人同福及其九朝竣事告厥成功解壇散席傾光廻駕寂無遺響大量玄玄所謂一切天人莫不受慶無量之福生死蒙惠信斯言矣擧輦仙儀壇陛章皇人曰元始天尊演說靈寳玄妙超度法門㑹集群仙於虛皇天寳之臺諸天隊仗紛紜日月星辰璇璣玉衡鳥獸鸞鳳丹舉緑輦旛蓋霓旌並來朝尊夫行法之士開建壇陸亦遵上天之儀以度下世兆民者也飛空霓旌朝元朱幢含虛散絲珠妙寳翇五明羽扇仙境絳節眞境十絶靈旛皇人曰夫登壇行事以代元始應化先造威儀以制萬天於壇之四圍分布星宿嶽瀆坤輿之數立諸門炁各依大法不可輕慢威儀符章明蓋瓊輪之符呪曰玄元羽蓋祖炁結凝混沌之根十轉回靈丹舉緑輦之符呪曰絳實命華寳飾敷陳輝精交映舉輦風程朱鳳之符呪曰朱鳯驂轅辟穢振威四靈振伏飛舞華扉玄龍之符呪曰五色玄龍飛蹈太空交肇運始建禦奔衝九色之節符呪曰蕭仞寳光受化虚皇純陽結梵九色垂芒十絶靈旛符呪曰飈營欎勃寳光散施曜暉奪日萬聖瞻依九鳳齊唱符呪曰元炁散廓雲霞彩光結化九鳳飛蹈九芒八鸞同鳴符呪曰七炁氤氲旋繞崐崘八鸞同鳴歌無量音五色獅子符呪曰萬威摧伏萬獸瞻依獨布無畏無礙慧通巨力普施大布獰威端拱居中受道無爲急急如律令九光白鶴符曰道契玄光光映十方圓光項負羽鶴翺翔旋繞太虛嘯詠呈祥青龍侍衞符呪曰太上玄明演法騫林三界侍衛八方威神使我自然束縛魔靈神光内發與道合并青炁畢絡變易龍形朱雀陽精符呪曰仙道自吉髙上清靈明炁四騫結命朱陵日陽聚炁赫赫玄精朱雀擁護至道長存白虎衞守符呪曰七炁齊應大律合英大法玄象結炁聚形及六七五帝友觀圭鑿元純白虎鎭守壇殿華靈急急如律令玄武後擁符呪曰空中萬變玄炁嵯峨威伏萬天受命大阿玄玄豁落合形龜蛇祝呪曰虚皇勑命緫制四靈坎升離降木液金精變花自然隂陽混凝森列有象與符合井急急如律令右符版篆鎭於四方或以紙書焚之壇燈章壇外然燈緫十有六合一百五十九燈太歲燈隨年建本命行年大小墓燈隨齋主生屬安之本命行年燈隨十二支轉大小墓燈以五姓納音推十方九宫二十八宿五嶽燈並於逐方然之七祖九幽燈本法然於中庭恐妨行事可於西南然七祖燈於鬼戸然九幽燈壇圖又有六申十直諸燈無所經㨿金籙簡文亦無禮祝之法今故刪去壇席狹處不可鋪燈可於别處安之依儀禮呪此廣成先生之意也道戸燈二本命燈三隨生年行年燈七男一嵗起寅女一歳起申太歳燈一隨本年大墓燈三宫羽辰商丑角未徴戍小墓澄五宫羽戌商未角丑徵辰七祖燈七東北分八方中央寄西八卦燈八分八方各立牌九幽燈九南立牌云東方風書地獄之額夾門燈二與道户燈相對列子門之左右二十四炁燈二十四東南九宫燈九分八方安中安寄坤各立牌書某宫燈十方燈立牌二十八宿燈二十八匀布四方起角之軫立牌某宿燈三十六燈三十六天門五嶽燈五分四方安中央中燈寄西南各立牌四圍星宿分布圖乾大墓六甲坤八莭二十四炁三十二天巽十直月官本命西嶽五九幽北嶽七祖艮九宫日宫南嶽太歳東嶽行年中嶽緫星壇圖式壇前東三幕第一幕虚皇教主玄中大法師第二幕三天扶教輔元大於師第三幕經籍度三師眞君列三位壇前西三幕第一幕五方五老五炁天君列五位第二幕三元三官大帝列三位第三幕監齋大法師壇上門纂炁榜外壇用長纂八枚門榜八䄄𥱊十六副一纂上安一榜此乃十方之炁故不用𩀱纂成門止於離上開一門餘皆攔斷八門之炁正東卯地震宫洞青之炁東南巽上巽宫梵行之炁正南午地離宫洞陽之炁西南坤上坤宫梵陽之炁正西酉地兊宮少隂之炁西北乾上乾宮梵通之炁正北子地坎宫洞隂之炁東北艮上艮宫梵元之炁中壇用長纂八枚門榜四枚乃二纂中安一榜爲門也短纂二十枚䄄𥱊二十副古法定例於巽戶開一門徃來亥上天門巳上地户申上月門寅上日門四榜只開地戸徃來内亶用長纂一十八枚門榜十枚亦二纂中安一榜爲門短纂一十枚栶𥱊一十副内壇古法只留天門出入十方門榜東方卯地青華元陽之門東南辰地始陽生炁之門下方巳地九靈眞皇之門南方午地洞陽太光之門西南申地元皇髙晨之門西方酉地通隂金闕之門西北戌地九仙梵行之門上方亥地大羅飛梵之門北方子地隂生廣靈之門東北寅地靈通禁上之門右十榜當用長纂二十枚今用十八者以兩角有門毎二門共一柱故用長纂十八也皇壇制度右壇或壘以寳磚或砌以文石或竹木暫結或築土爲之務合䂓程以崇朝奏之禮或露於三光之下以達至誠或以天寳之臺取法上境建齋行道先於中列太上三尊之位如朝玉京山也壇之三級其法通用纂六十四枚長者三十四枚各長一丈二尺短纂三十枚各長一丈各纂頭作蓮蕋之狀門榜二十二枚七黑五黄三白三青四赤用五色裝之依前數分布三層壇纂上仍雕木爲額畫飛仙雲氣之形務取精巧壇三層之外邊各安欄楯植立長短纂三重用青繩絳繩各五百尺縻之護淨隔凡舊儀中壇廣三丈二尺内壇廣二丈四尺外壇又居中壇之外今之修建當隨地闊狹爲之列纂長者則可定如短纂則隨壇之大小施之外壇門榜式洞青之炁符上震宮洞音之榜黄榜青書東方九炁青靈始老青帝消魔眞文洞耀育元晶青華開太明布育九天炁始生存無英扶陽通攝御丹林合緫眞積霄始輝上欎壘明霞晨靈光煥羅絡衞育保形魂混合化玄景仁惠消魔群萬遍道巳超功當書上清梵行之炁符上巽宮梵行之榜黑榜黄書東南方梵炁消魔眞文至道趣蘭闕縹緲虚上生絶峰大渺觀光暉朗玉清精勤感太無誰測形與各待刼未終且倐忽召萬靈㝠運自有㑹安知天地傾靈風鼓妙化䇿景步北元流雲隨我回飛蓋䕃緑軿洞陽之炁符上離宫洞陽之榜白榜朱書南方三炁丹靈眞老赤帝消魔眞文三炁藹靈闕明虚煥玉丹朱陵有帝眞華雲飛絳軿統御萬靈中橅運超億千執䇿按簡録洞章敷神篇解結散禍根流金摧兇姦志能成此道魔試俱無前保度㝠刼津宴盻無窮年梵陽之炁符上坤宫梵陽之榜黑榜黄書西南方梵炁消魔眞文髙登四明闕華璚秀金門神輝洞蘭峰景煥巳紛紜結朗始生炁八㑹恤幽源髙髙玄漠初太陽協朝晨靈化四蓋庭眇暢法亦全運理自然道欎若髙上天人門轉地軸壓伏妖魔群少隂之炁符上兌宫少隂之榜青榜白書西方七炁皓靈皇老白帝消魔眞文西靈徊七度大眇欎明華白元維我神眞皇御景霞皎皎三素暉昭昭破百邪攝音延至炁金晶育三田鍊胎固玉質寳耀映瓊鮮魔精當滅試建地無沉連逸轡髙清舘齊輪太上仙梵通之炁符上乾宫梵通之榜黒榜黄書西北方梵炁消魔眞文仙道樂𠔃生鬼道樂𠔃凶但聞貴生道不聞死道隆瑤歌三天炁貴生元正章神惠命朱兵五帝符寒郷仗旛攝萬魔瓊文檢北酆體觧自然道妖滅非爾功汎景鼓長扇合虚慶霄峯洞隂之炁符上坎宫洞隂之榜赤榜黑書北方五炁五靈玄老黒帝消魔眞文北玄三秀藹太上紫皇君緫炁攝幽機造化敷靈綱下統虛危精保育天元房靈通大妙神纒羅衞百關豁落滅魔試㓙災永不干大道保自然壽命無𧇊殘萬刼享慶㑹白日登雲輪梵元之炁符上艮宫梵元之榜黑榜黄書東北方梵炁消魔眞文偶景䇿飛蓋迅轡浮八清整控啓丹衢流盻宴雲營恊晨飄津波騫趾多寒庭就翰曜玉質羽衣翠紫軿超清六嶺壺紛紅落鳳城提携神霄王髙遊太上京仰彼三素秀長烟灑八溟日門符上日門榜青榜黄書寅文日宫明輝太陽煉魂制魔寳章和陽煥明炁炎輝豁太虚十輪回天關八景朝紫微察制妖魔群邪試莫敢干超度五苦難太和升福堂月門符上月門榜白榜黄書中文月宫靈華太隂制魔寶章蒼霞浮緑輦稱慶拱天尊天統攝八難開濟九幽魂雲河擁玄皓育生天神君蘭宮貫隂房天機豈易明中壇門榜篆式天門符上天門榜黑榜青書亥文靈寳金書大有天門玉章太極建青䈁神暉布發生爽暉映空觀熈夷布玉嬰皇育旋景輿升度七祖魂彌梵流飛綱周摧天地根祥霞翳杳刼紫舘眞人君軒奕清元府滅試摧邪兇地户符上地户榜赤搒黄書巳大髙上大有雷文伏魔隱文靈寳貫黄雲雷威鎭此門妖惡至自屏魔試來消平靄欎祥光發瑶壇集帝眞人門符上人門搒青榜黄書鬼戸符上鬼户榜黄搒黑書内壇門榜篆式青華元陽之門符上青華无陽之榜青榜朱書元梵丹靈妙華九炁天文九炁洞耀三元流晶丹光煥映照欝南溟炎陽上徹赤霞氤氲神結紫房上升玉庭急急如律令始陽生炁之門符上始陽生炁之榜黄榜白書呪曰天地朗清幽虚啓眞流雲徘徊金華四騫丹皇散敷靈飛紫軿是夕開陳青金授仙九靈皇眞之門符上九靈皇眞之榜赤榜黄書元梵素靈皓華天文玄一天根金華皓英景虚含德素魄合眞南制九光北攝水精東開三道西鎭七門急急如律令洞陽太光之門符上洞陽木光之榜赤榜黄書元梵青靈玉華三炁天文青元流映光照八門中有帝子號曰玉靈煉魂化魄秀結紫英空常九道萬神齊并元皇髙晨之門符上元皇髙疊之榜黄榜白書元梵靈妙寳華天文寳華虚妙二炁交并含弘光大中有至靈北酆削籍南上生名光振九府禮乾順承急急如律令通隂金闕之門符上通隂金闕之榜白榜黑書元梵玉虛素華亡炁天文飛光七變皓日分晶金暉吐𤔵召陽攝隂藏天隱月衣裊素靈下降肺腑生我神君九仙梵行之門符上九仙梵行之榜黄榜白書元梵髙靈天文天元徘徊流景上清大有啓運八字高明飛天虚空洞陽自生眞炁綿綿即化爲仙急急如律令大羅飛梵之門符上大羅飛梵之榜黑榜青書元梵太靈眞華天文元青九天洞景八靈晨華徘徊變景化形手執隱書足躡丹雲流精𣡡勃保鎭天文隂生廣靈之門符上隂生廣靈之榜黑榜青書元梵上虚景華五炁天文中皇五炁緫統八靈神精錬魄安鎭朱陵執符把節藏景飛形回變景道遊宴玉京急急如律令靈通禁上之門符上靈通禁上之榜青榜白書大梵元靈紫華天文流精天谷一炁𥘉分紫華煥景元梵流形灌我靈府育我玄根內充外溢骨肉飛升齋壇鎭信科曰質信効心以財爲首財旣可捨心亦隨之聖道㝠通隨心意高天厚土玄聖上眞非信不通非心不感感通之至在乎信焉金龍一十三枚各重一兩長三寸六分以十枚鎭十方案餘十枚隨簡投科曰天子皇后用上金公卿用次金庶人用銀或銅塗以金夫龍上天之驛騎也傳逹感通龍騎爲先負簡即騰信三官效誓則告盟十極鎭信之法以龍爲首缺者考屬隂官曹鎭綵十方十段命信一東方青九南方絳三西方白七北方黑五上方碧三十二下方黄三十二四維黃各一十二緫十方之數共百三十六天子疋數諸侯丈數庶人尺數紋繒天子諸侯紫色士庶以本命納音色內命信疋丈尺數各隨年外加一以表延生之信綵置之中央案上科曰紋繒五色者五行之色象十方之炁降十天致五帝通眞效信請命祈靈不可缺也缺者考屬天官玄都曹鎭十方𥿄筆墨硯十副科曰建齋行道或救㧞億曽萬祖先後亡靈或請福祈恩消災謝過則四司五帝三界十方紀録善功校定罪名當以𥿄筆墨硯爲録功紀善之籍質信於十方不可缺也缺則十天不録其功九幽三官不除其考缺者考屬三官曹鎭十方香華十盤科曰香者以通感爲質隔氛去穢花者以鮮潔爲美表裏效珍請福祈眞花香爲本花可用五綵剪成以鎭十方不可缺也缺者考屬陽官曹鎭米二斛四斗科曰米以質信天官増加品禄缺者考屬天官曹鎭油二斗四升科曰油者隂𩔖也隂中生陽以油鎭之隂續陽景缺者考屬隂官曹鎭炭百二十斤科曰炭者陽類也陽中生隂以炭鎭陽官資隂炁缺者考屬陽官曹鎭錢二萬四千科曰金錢二萬四千以代上金之信質心三界告盟十天缺者考屬玄都曹槿水簡三面各長一尺二寸闊二寸四分厚二分科曰簡者記也告也記世之功告盟上眞上下正方天子以玉爲之玉有九徳禮天地之信也今用簡丹界五行丹書國號年月建齋所爲法師姓名各投於名山大洞靈泉龍穴及齋壇之中告天地水三官使證明齋功奏于上境人臣用槿木代玉缺者考屬地官九九都曹玉璧一十三枚内三枚三簡用十枚鎭十方各徑二寸四分厚二分圓形虚其中靈寳玉鑑巻之十四靈寳玉鑑巻之十五及七茭郭龍吏門夫道本一炁磅礴兩間形而上者無體無方形而下者有物有像是故靈寳度人上經大法有寒林茭郭龍吏之設亦莫非體物法像而然也蓋人生天地間或䧟溺其本然之良心者故不得全其天年者既死也滯而不化名之曰孤魂自非大道正法攝化其妄縁幻業俾各復其本然之性天則將何以返其魂魄耶故茭郭寒林者以像列九州分野之義而拘制死魂神龍驛吏者亦法升騰變化之義而超度神識以至窮碧落徹黄泉逹信馳誠無逺弗屇況本身龍虎練守成眞乗陽而舉矣所以一人度則衆魂皆度一性明則萬天圓明其斯之謂歟凡建大齋必當建立菱郭廣度亡魂或以茭草或以淨茅爲之如城郭之義分列八門各門有額列八門旛各按分野標九州社令旗中建大斛或列四十九小斛左右列甘露寳漿二旛前立水盆用鐵跡臺章符沉于水中又設臺章大牌并二篆旛見旛篕門建立之時師化爲救苦天尊化形十方接引諸有毎日輪道衆判施接濟法食正齋之時行香誦經皆濟度幽㝠之急務也不可缺焉茭郭式乾宫杜門符八門額符坎宫景門符艮宮死門符震官驚門符巽宮開門符離宮休門符坤宫生門符兊宫傷門符八符並八卦炁訣用黄素朱書粘於八門之上變茭郭符震文東炁呪曰靈眞變化萬象俱融幽㝠洞徹普度無窮急急如太上律令開度八門眞符八道天道開門符釋道休門符人道景門符鬼道死門符地道傷門符仙道生門符畜道驚門符業道杜門符八符玉文祖炁黄地朱書丘郭隨時焚之度化幽㝠緫呪曰三天妙化普濟沉魂廣徹十方上開八門慈光接引洞朗重昏即逹玄理咸悟道眞急急如元始上帝令十方救苦天尊符玉寳皇上天尊符震文東炁玄眞萬福天尊符太妙至極天尊符玄上玉晨天尊符度仙上聖天尊符好生度命天尊符太靈虛皇天尊符无量太華天尊符玉虚明皇天尊符眞皇洞神天尊符十符焚於茭郭中隨方焚之緫祝呪天尊妙惠化形十方普度萬品无極神鄕委炁聚功回隂啓陽空洞無跡幽夜開光三塗罷對五苦除殃俱承道力享福天堂急急如律令右十方符存天尊乗百寳之光化形沙界救度罪魂六道聖凡隨光度化祭祝龍吏論法由玄都茭龍驛吏一十二萬人傳命泉曲開光赦罪玄都金龍驛吏二十五萬人頒符度魂馳信天道凡告救苦長生二符必須關告祭祝龍吏變化形儀師當内運神龍以合外景宻施妙化升度亡魂厥有威儀豈爲虚設及生天儀像車府亭橋合用符文具録于左召玄都官吏符髙功存召玄都官吏知磬舉九幽㧞罪天尊表白宣祝龍呪師左手搯卯文鼻引東炁合自巳肝中青炁布出嘘於茭龍之身次搯子自玄回至巳文又搯至申復歸巳上剔于龍身化生甲鱗𤓰牙四體具備次以水灑之存其龍升騰變化之象搯午文取南炁呵于龍身存朱光燁燁見玉女手執符命乗雲駕龍下開幽壤祝金龍知磬舉朱陵度命天尊表白宣祝呪師左手搯巳午未歸申上剔東南炁吹龍身以水灑之存其龍運動變化於金光中有玉女衣丹衣執紅蓮在龍頭上祥雲捧擁于下次存變一亭如朱𨹧府下有金龍負之四驛神君引龍立於亭之四畔玉女金童各執本色蓮花列于左右至錬度畢運自已橋梁爲通天大度法橋一炁透關引領亡魂上升天境金龍驛神君茭龍驛風火驛金馬驛此爲四驛茭龍金龍驛吏二符貼關中見中牒連頭門茭龍符銜口中午文南炁呪曰北府幽深茭龍傳命追取亡魂出離隂境變化自然度命登眞急急如律令金龍符衘口中子文北炁呪曰火符金龍返隂升陽玄雲耀景三炁回光錬化成眞上生南昌急急如律令地府齎簡童子符火府齎簡童子符二符玉文祖炁呪曰洞逹逍遥奉命玉清下傳驛令攝魂鍊精普告三界時刻不停急急如律令茭龍吏符青地丹書金龍吏符二符玉文祖炁變法橋符玉清引魂登法橋昇眞大呪靈寳大法無量度人元始符命釋赦罪根返生回戸九錬生形妙景怡神三界超淩隨刼輪轉逍遥上清功滿德就上朝帝君福流後裔慶及生存好去好去勿忘道恩監橋大神符右符命召南宫流火之庭監橋超度大神周旬字日之身長八尺三梁冠緋袍仗劒立于橋西呪曰三炁之化一炁之靈魂魄清淨神精靈靈混沌之始人鬼分精大神聞召急至橋庭飛升鍊化引度朱陵急急如上帝勑引魂度橋符魂車上右符左手搯三指根右手執旙立橋前引魂度橋呪曰朱陵朱陵流火神庭天吏奉命執符而行接引魂魄上升南庭超淩三界逍遥上清急急如律令生天臺符呪曰蕭臺合神㝠虚凝眞光澄八極妙逹三晨登升自然萬炁回春身登大霞超跡無垠急急如律令朱陵火府符呪曰眞王有命合景太陽神融性會上朝帝郷證道無爲永契眞常急急如律令度魂車符右符運白炁自雙關而升透頂出化口投呪曰祖炁化生運動帝車三關直透萬炁咸虚魔王保舉天門無拘丹轝緑輦自有入無急急如律令神虎三使者眞形金龍童式茭龍童式朱陵府式生天寳臺式生天寳臺靈寳玉鑑巻之十五靈寳玉鑑巻之十六及八眞文玉字門原夫五太之先溟涬太梵寥廓無光凝妙炁於混茫藏眞機於杳黙二儀未始判也萬彚未始形也及其神風融蕩三炁開光聚炁成文凝雲作篆五文開廓八角垂芒以立三才以治人道或以爲河洛之書或倬彼雲漢之象世之所謂眞文靈書者是也然其大者以之判天地以之運隂陽山川之流峙人物之生成亦眞文玉字應運流光之妙也豈易傳於後世哉唯度人消災制魔之篆今見于斯奉行之士當明自己之神光脗合諸天之玉字使光芒煒燁內外混同一如元始安鎭之時敷落神眞開張萬範一切諸法運應自然三光五行並無差忒然後可以安鎮國祚保天長存又豈止敷壇列象而成哉敷露眞文啓奏具職臣焚香奏啓三清大道五老天君恭望睿慈俯垂洞鑒伏以空洞凝眞肇五刼而開化皇人按筆燦八角以垂芒普殖神靈廣度幽顯臣今肇開大教宿啓玄壇期鸞輅以垂臨請龍章而敷露昭回梵炁開泰重隂伏望元始開圖九陽啓運錫五方金光正眞生炁降諸天圡字無量内音鎭八極以迎祥天人交㑹俾群魔而東首功果有成臣干冐飛十天訣於額上次搯玉清訣叩齒七通運雙目之光上合日月自已頂中有一至尊金光萬道下注眞文光芒瑩徹内外合一咽液叩齒隨方安鎭之安東方眞文卯文存肝炁自左目出合東方青炁九道聚成碧玉宮殿空青之華化生天文玉字青靈始老天君主之東方八天星宿朝拱青帝神仙吏兵營衛玉文次引炁歸肝安南方午文存心炁自舌出合南方赤炁三道聚成丹霞宫殿炎景之華化生天文玉字丹靈眞老天君主之南方八天星宿朝拱赤帝神仙兵吏營衛玉文次引炁歸心安西方酉文存肺炁自右鼻出合面方白炁七道聚成瓊瑶宫殿素景之華化生天文玉字皓靈素老天君主之西方八天星宿朝拱白帝神仙吏兵營衛玉文次引炁歸肺安北方子文存賢炁自兩耳出合北方黒炁五道聚成水晶宫殿黒霧之華化生天文玉字五靈玄老天君主之圵方八天星宿朝拱黑帝神仙吏兵營衞玉文次引炁歸腎安中央中文運脾炁自臍出作黄雲出合中央黄炁一道聚成黃金宫殿内景金華化生天文玉字四方三十二天二十八宿朝拱黄帝神仙吏兵營衞玉文次引炁歸黄庭咽液而退東方眞文搯震文吸東方八天之炁搯玉文面東呪曰眩昺煥落耿蘭幽方澮蒲標豫竺載孔猷元皇九醜攝南方眞文搯午文吸南方八天之炁又搯玊文面南呪曰中寂虛一混華仙宗和暉陽堂赫胥耀同晶輝瞿容攝西方眞文攝兌文吸西方八天之炁次搯玊文面西呪曰㳺惠昭蘇陀伽含羅𡵨俱渺郁台映盧摩畢淑少都攝北方眞文搯坎文吸北方八天之炁次搯玉文面北呪曰元皇寳耀延靈欎單搏扶敬禦凝晨緫玄洞妙宗明攝中央眞文搯中文吸四方炁合中炁面西南呪混洞開明本固太靈起復四正天宗紀寧中黄五老攝東方太清九眞仁惠之符九陽天元梵華之炁背文九陽𢌞妙炁三景合元精碧靄浮靈篆青林粲淑英迢遥玉清府遼邈蓬萊瀛眞化通無間神風滋萬生南方交神生明玉化之符三陽天元梵靈之炁背文告劫開神運龍文泛赤霞八威奔電激九鳳破兇邪煉度丹皇室飛升元始家炎明常繼照靈慶襲晨華西方八威金龍飛玄之符七陽天元梵英之炁背文黄老儲靈粹金精耀斗威六天咸馘滅三寳復幽微爽氣浮髙闕寒光藹素輝空洞披玉篆華麗九霄飛北方明綱玄兆大明之符五陽天元梵寳之炁背文五炁符元妙諸天混太㝠辰精飛羽黒玉女散華青紫冊封天寳玄光凜帝庭群魔欽至化萬國保安寧中央眞皇混丹肅元之符一陽天元梵混之炁背文混黄生一炁威化結眞形上徳持柔順含光洞杳𡨋建中該九極執本統三晨煒燁天端上飛芒耀玉靈右敷落五篇上士用玉版中士用玉石版士庶人用漆版鏤金後刻背文列鎭於壇之五方並用五方呪祝之五方炁訣並見于後東方赤書玉字内音譯文歳星輔肝角亢鎮眞氐房心尾四景回旋箕主七宿正斗明輪承炁捕非掃除災群右三十二字紫微宫東華殿主召星宫正天分度東方呪曰叩齒九通想青炁入肝中生九重華光洞映内外元上青精九炁太靈神光遐散流映東青華景欎秀灌我身形宫府安鎭寳魂自生洞逹八朗飛升玉庭南方赤書玉字内音譯文熒惑輔心井鬼守房柳星張翼統禦田鄕軫緫七宿廻轉天常召運促㑹正道驛行右三十二字秘文書于三炁丹臺題于西南正陽主召星官明度數正天分南方呪曰叩齒三通想赤炁入心中三重華光洞映内外丹華流映寳芝生光神清徹幽散靈八方眞符攝炁嘯命朱童三精敷落注我絳宫赤神安鎭五香溢光洞映形外表裏𤼵光身生水火獨歩飛行西方赤書玉字内音譯文太白檢肺奎婁守魂胃昴畢觜主制七關參緫斗魁受符北元右二十田字書金闕元𤗉主攝白帝星宫正天分度西方呪曰叩齒七通想白炁入肺之中生七重華光用映内外金靈七炁素帶流芳金精童子首冠元巾佩符攝炁萬神㑹門寳光奕奕照我命根安鎭肺華萬刦長存北方赤書玉字内音譯文北辰輔賢斗牛衞扉女虚危室豁落四開璧緫七宿執凶紏非却邪掃穢明道動輝右三十二字乃天地玄元斗中書也主北方星宿正天之炁北方呪曰叩幽五通想黑炁入腎府之中生五重華光洞映内外北上太玄五炁徘徊寳華五重流光煥暉雲景鬰香洞映太微仰注我身賢府鮮開安鎭靈宅萬神緫歸身生羽服舉形自飛中央赤書玉字内音譯文鎭星輔脾廻度北元魁𩲃主非截邪斬奸𩵄䰢魓𩳐掃穢除氛魒正元斗明度天闗九天符命金馬驛傳右四十字書玄都玉臺主攝星宫正天分度中央呪曰叩幽一十二通思黄炁入脾中生十二重華光洞映内外緫玄髙靈四神回郷黄上散華五帝交芳流精散漫十二重光混合我形萬神相迎安鎭黄脾養炁中央保齡度刦永鎭無窮右五文開廓赤書玉字眞文用碧青𥿄篆文隨方安鎮散壇啓鎭焚於主爐中呪見後青天魔王制邪玉文欎藹芥精洞景開明始陽九炁停華育魂流英妙府靈真上神瓊宫雲冠飛光羽桾青腰玉女太上眞人保度仙籙消魔卸氣天篆卯文青炁存青帝吏兵營衛玉文赤天魔王制邪玉文昌陽眞老赤靈尊神統御丹天檢制魔群嚴駕朱鳳三角之麟上道太清玄元之根大熛三炁盤徊絳雲育養丹府保制長存天篆千文南炁存赤帝吏兵營衛玉文白天魔王制邪玉文七靈皓炁三素元眞中有黃老制攝魔精庾辛將吏七十萬兵羽旗龍節金虎雲奔斷除妖妄練育華英與道長存歷刦無傾天篆酉文白炁存西方吏兵營衛玉文黒天魔王制邪玉文北隂欎單玄炁之宫帝眞靈㑹驅神駕龍室有玉女夜光之童掌握圖録攝制魔蹤虛危合化紫烟激風寳晶練育後天無終天篆子文北炁存黑帝吏兵營衛玉文黃天魔王制邪玉文元皇上靈沖妙之尊混合眞樸造化元根感激幽微挺天大神攝召萬炁齊㑹華房消蕩百魔與道俱昌保度却災滅試除殃天篆玉文祖炁召中央史兵營衞玉文右五方制邪玉文如眞文式書篆鎮於五方淨壇時法師仗劔執水盂念前平文呪噀水隨方結界禁壇如法安鎮眞文告文式五方前後並同只換方所眞文玉篆維某年𡻕次某甲某月某朔某日某人伏爲某人謹齎法信請道士一壇就某處啓建元上黃籙大齋幾畫夜滿散修設清醮若干分位謹以本方鎭信請法施行東方太上靈寳東方八天自然玉字青帝九炁天文空書前東方玉字東方八天自然玉字安鎭齋壇盟露天地㧞贖罪苦開度超生一如太玄女青符命律令具法位姓某告行南方四方前後同前只換中問眞文玉篆太上靈寳南方八天自然玉字赤帝三炁天文中央太上靈寳中央大羅之天自然玉字黄帝一炁天文西方太上靈寳西方八天自然玉字白帝七炁天文北方太上靈寳北方八天自然玉字黑帝五炁天文右五方鎮文並用青𥿄朱書以鎭齋壇五方建壇時讀文訖以金龍鎭之散壇時起鎭隨表函焚之可漏式餘四方可漏各隨其方書之東方八天自然玉字青帝九炁天文具位臣姓名謹封敷五方眞文符逐方燒東方符卯文青炁九重燒符宻呪蒼天眞英宣布九重青童真衆䕶道興隆南方午文赤炁三重燒符宻呪丹天眞靈宣布三重赤童聚衆護法興隆西方符百文白炁七重燒符宻呪皓靈眞人宣布七重白童靈衆護戒興隆北方符子文黑炁五重燒符宻呪玄天眞聖宣布五重黒童威衆護我興隆中央符中大黄炁滿空燒符宻呪黄天眞炁宣布無窮黃童神衆護壇興隆起眞文呪無上至眞上聖髙尊布化運炁三十二天八會九光自然成文安鎭土地保制刦年元始符命普告三元下勑九地上關諸天中告海嶽名山大川今日上告萬神咸聽修齋行道㧞度幽魂三官九府削滅罪根永度三塗五苦之源世世受福紀石丹篇神生天堂鍊化自然生死開度億刧長存九天告命風火驛傳石隨方起鎭訖捧文香大上叩齒十二通念此呪畢隨表焚之靈寳玉鑑卷之十六
