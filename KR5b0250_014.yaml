front:
  text: 靈寶玉鑑卷之十四及六
  hash: sha256:771c37c1a2cfb4ed5ba7f9d15a3d9e7f6fbfd2ff8718d22edb57adfe16885651
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_014-001a, image: hfl/0305/0305-033.png}
body:
  text: 壇儀法式門夫建壇立幕列職分司崇德報功慎終追逺實孝子仁人義夫節婦之盛意也是故法天像地列斗環星八卦九宫十方三界玉京金闕悉備于斯至如道德威儀進退禮樂運神㑹道躡景飛玄陟降有嚴對越無怠實由法性中運化出來則一一皆合其陽德隂功也古之泰畤與三壇同墠之義豈異此哉登斯壇也要在心隔玄妙神契虛皇故得三界尊崇萬神朝禮洋洋在上不顯亦臨一念苟差則千里懸隔矣是故靈寶大法自上古而降在人間秦漢以來至人乃出晋宋以後其道遂行陸簡寂倡其風於前張清都繼其列于後而杜廣成等次之師資授受代不乏人襲𣲖尋源厥有端緒倘誠敬之不失則感應之自然此則今古攸遵天人同福及其九朝竣事告厥成功解壇散席傾光回駕寂無遺響大量玄玄所謂一切天人莫不受慶無量之福生死蒙惠信斯言矣舉輦仙儀壇陛章皇人曰元始天尊演說靈寶玄妙超度法門㑹集群仙於虛皇天寶之臺諸天隊仗紛紜日月星辰璇璣玉衡鳥獸鸞鳳丹舉緑輦幡蓋霓旌並來朝尊夫行法之士開建壇陸亦遵上天之儀以度下世兆民者也飛空霓旌朝元朱幢含虛散絲珠妙寶翇五明羽扇仙境絳節真境十絶靈幡皇人曰夫登壇行事以代元始應化先造威儀以制萬天於壇之四圍分布星宿嶽瀆坤輿之數立諸門氣各依大法不可輕慢威儀符章明蓋瓊輪之符呪曰玄元羽蓋祖氣結凝混沌之根十轉回靈丹舉緑輦之符呪曰絳實命華寶飾敷陳輝精交映舉輦風程朱鳳之符呪曰朱鳯驂轅辟穢振威四靈振伏飛舞華扉玄龍之符呪曰五色玄龍飛蹈太空交肇運始建禦奔衝九色之節符呪曰蕭仞寶光受化虛皇純陽結梵九色垂芒十絶靈幡符呪曰飈營欎勃寶光散施曜暉奪日萬聖瞻依九鳳齊唱符呪曰元氣散廓雲霞彩光結化九鳳飛蹈九芒八鸞同鳴符呪曰七氣氤氲旋繞昆崘八鸞同鳴歌無量音五色獅子符呪曰萬威摧伏萬獸瞻依獨布無畏無礙慧通巨力普施大布獰威端拱居中受道無為急急如律令九光白鶴符曰道契玄光光映十方圓光項負羽鶴翺翔旋繞太虛嘯詠呈祥青龍侍衛符呪曰太上玄明演法騫林三界侍衛八方威神使我自然束縛魔靈神光內發與道合并青氣畢絡變易龍形朱雀陽精符呪曰仙道自吉髙上清靈明氣四騫結命朱陵日陽聚氣赫赫玄精朱雀擁護至道長存白虎衛守符呪曰七氣齊應大律合英大法玄象結氣聚形及六七五帝友觀圭鑿元純白虎鎮守壇殿華靈急急如律令玄武後擁符呪曰空中萬變玄氣嵯峨威伏萬天受命大阿玄玄豁落合形龜蛇祝呪曰虛皇勑命總制四靈坎升離降木液金精變花自然隂陽混凝森列有象與符合井急急如律令右符版篆鎮於四方或以紙書焚之壇燈章壇外然燈總十有六合一百五十九燈太歲燈隨年建本命行年大小墓燈隨齊主生屬安之本命行年燈隨十二支轉大小墓燈以五姓納音推十方九宫二十八宿五嶽燈並於逐方然之七祖九幽燈本法然於中庭恐妨行事可於西南然七祖燈於鬼戶然九幽燈壇圖又有六申十直諸燈無所經據金籙簡文亦無禮祝之法今故刪去壇席狹處不可鋪燈可於别處安之依儀禮呪此廣成先生之意也道戶燈二本命燈三隨生年行年燈七男一嵗起寅女一歲起申太歲燈一隨本年大墓燈三宫羽辰商丑角未徴戍小墓澄五宫羽戌商未角丑徵辰七祖燈七東北分八方中央寄西八卦燈八分八方各立牌九幽燈九南立牌云東方風書地獄之額夾門燈二與道户燈相對列子門之左右二十四氣燈二十四東南九宫燈九分八方安中安寄坤各立牌書某宫燈十方燈立牌二十八宿燈二十八勻布四方起角之軫立牌某宿燈三十六燈三十六天門五嶽燈五分四方安中央中燈寄西南各立牌四圍星宿分布圖乾大墓六甲坤八莭二十四氣三十二天巽十直月官本命西嶽五九幽北嶽七祖艮九宫日宫南嶽太歲東嶽行年中嶽總星壇圖式壇前東三幕第一幕虛皇教主玄中大法師第二幕三天扶教輔元大於師第三幕經籍度三師真君列三位壇前西三幕第一幕五方五老五氣天君列五位第二幕三元三官大帝列三位第三幕監齊大法師壇上門纂氣榜外壇用長纂八枚門榜八䄄𥱊十六副一纂上安一榜此乃十方之氣故不用𩀱纂成門止於離上開一門餘皆攔斷八門之氣正東卯地震宫洞青之氣東南巽上巽宫梵行之氣正南午地離宫洞陽之氣西南坤上坤宫梵陽之氣正西酉地兊宮少隂之氣西北乾上乾宮梵通之氣正北子地坎宫洞隂之氣東北艮上艮宫梵元之氣中壇用長纂八枚門榜四枚乃二纂中安一榜為門也短纂二十枚䄄𥱊二十副古法定例於巽戶開一門往來亥上天門巳上地户申上月門寅上日門四榜只開地戶往來內亶用長纂一十八枚門榜十枚亦二纂中安一榜為門短纂一十枚栶𥱊一十副內壇古法只留天門出入十方門榜東方卯地青華元陽之門東南辰地始陽生氣之門下方巳地九靈真皇之門南方午地洞陽太光之門西南申地元皇髙晨之門西方酉地通隂金闕之門西北戌地九仙梵行之門上方亥地大羅飛梵之門北方子地隂生廣靈之門東北寅地靈通禁上之門右十榜當用長纂二十枚今用十八者以兩角有門每二門共一柱故用長纂十八也皇壇制度右壇或壘以寶磚或砌以文石或竹木暫結或築土為之務合規程以崇朝奏之禮或露於三光之下以達至誠或以天寶之臺取法上境建齊行道先於中列太上三尊之位如朝玉京山也壇之三級其法通用纂六十四枚長者三十四枚各長一丈二尺短纂三十枚各長一丈各纂頭作蓮蕊之狀門榜二十二枚七黑五黃三白三青四赤用五色裝之依前數分布三層壇纂上仍雕木為額畫飛仙雲氣之形務取精巧壇三層之外邊各安欄楯植立長短纂三重用青繩絳繩各五百尺縻之護淨隔凡舊儀中壇廣三丈二尺內壇廣二丈四尺外壇又居中壇之外今之修建當隨地闊狹為之列纂長者則可定如短纂則隨壇之大小施之外壇門榜式洞青之氣符上震宮洞音之榜黃榜青書東方九氣青靈始老青帝消魔真文洞耀育元晶青華開太明布育九天氣始生存無英扶陽通攝御丹林合總真積霄始輝上欎壘明霞晨靈光煥羅絡衛育保形魂混合化玄景仁惠消魔群萬遍道巳超功當書上清梵行之氣符上巽宮梵行之榜黑榜黃書東南方梵氣消魔真文至道趣蘭闕縹眇虛上生絶峰大渺觀光暉朗玉清精勤感太無誰測形與各待劫未終且倐忽召萬靈冥運自有㑹安知天地傾靈風鼓妙化䇿景步北元流雲隨我回飛蓋䕃緑軿洞陽之氣符上離宫洞陽之榜白榜朱書南方三氣丹靈真老赤帝消魔真文三氣藹靈闕明虛煥玉丹朱陵有帝真華雲飛絳軿統御萬靈中橅運超億千執䇿按簡録洞章敷神篇解結散禍根流金摧凶姦志能成此道魔試俱無前保度冥劫津宴盻無窮年梵陽之氣符上坤宫梵陽之榜黑榜黃書西南方梵氣消魔真文髙登四明闕華璚秀金門神輝洞蘭峰景煥巳紛紜結朗始生氣八㑹恤幽源髙髙玄漠初太陽協朝晨靈化四蓋庭眇暢法亦全運理自然道欎若髙上天人門轉地軸壓伏妖魔群少隂之氣符上兌宫少隂之榜青榜白書西方七氣皓靈皇老白帝消魔真文西靈徊七度大眇欎明華白元維我神真皇御景霞皎皎三素暉昭昭破百邪攝音延至氣金晶育三田鍊胎固玉質寶耀映瓊鮮魔精當滅試建地無沉連逸轡髙清館齊輪太上仙梵通之氣符上乾宫梵通之榜黑榜黃書西北方梵氣消魔真文仙道樂兮生鬼道樂兮凶但聞貴生道不聞死道隆瑤歌三天氣貴生元正章神惠命朱兵五帝符寒鄉仗幡攝萬魔瓊文檢北酆體解自然道妖滅非爾功泛景鼓長扇合虛慶霄峯洞隂之氣符上坎宫洞隂之榜赤榜黑書北方五氣五靈玄老黑帝消魔真文北玄三秀藹太上紫皇君總氣攝幽機造化敷靈綱下統虛危精保育天元房靈通大妙神纒羅衛百關豁落滅魔試凶災永不干大道保自然壽命無𧇊殘萬劫享慶㑹白日登雲輪梵元之氣符上艮宫梵元之榜黑榜黃書東北方梵氣消魔真文偶景䇿飛蓋迅轡浮八清整控啓丹衢流盻宴雲營協晨飄津波騫趾多寒庭就翰曜玉質羽衣翠紫軿超清六嶺壺紛紅落鳳城提携神霄王髙遊太上京仰彼三素秀長烟灑八溟日門符上日門榜青榜黃書寅文日宫明輝太陽煉魂制魔寶章和陽煥明氣炎輝豁太虛十輪回天關八景朝紫微察制妖魔群邪試莫敢干超度五苦難太和升福堂月門符上月門榜白榜黃書中文月宫靈華太隂制魔寶章蒼霞浮緑輦稱慶拱天尊天統攝八難開濟九幽魂雲河擁玄皓育生天神君蘭宮貫隂房天機豈易明中壇門榜篆式天門符上天門榜黑榜青書亥文靈寶金書大有天門玉章太極建青䈁神暉布發生爽暉映空觀熙夷布玉嬰皇育旋景輿升度七祖魂彌梵流飛綱周摧天地根祥霞翳杳劫紫館真人君軒奕清元府滅試摧邪凶地户符上地户榜赤搒黃書巳大髙上大有雷文伏魔隱文靈寶貫黃雲雷威鎮此門妖惡至自屏魔試來消平靄欎祥光發瑶壇集帝真人門符上人門搒青榜黃書鬼戶符上鬼户榜黃搒黑書內壇門榜篆式青華元陽之門符上青華無陽之榜青榜朱書元梵丹靈妙華九氣天文九氣洞耀三元流晶丹光煥映照鬱南溟炎陽上徹赤霞氤氲神結紫房上升玉庭急急如律令始陽生氣之門符上始陽生氣之榜黃榜白書呪曰天地朗清幽虛啓真流雲徘徊金華四騫丹皇散敷靈飛紫軿是夕開陳青金授仙九靈皇真之門符上九靈皇真之榜赤榜黃書元梵素靈皓華天文玄一天根金華皓英景虛含德素魄合真南制九光北攝水精東開三道西鎮七門急急如律令洞陽太光之門符上洞陽木光之榜赤榜黃書元梵青靈玉華三氣天文青元流映光照八門中有帝子號曰玉靈煉魂化魄秀結紫英空常九道萬神齊并元皇髙晨之門符上元皇髙疊之榜黃榜白書元梵靈妙寶華天文寶華虛妙二氣交并含弘光大中有至靈北酆削籍南上生名光振九府禮乾順承急急如律令通隂金闕之門符上通隂金闕之榜白榜黑書元梵玉虛素華亡氣天文飛光七變皓日分晶金暉吐𤔵召陽攝隂藏天隱月衣裊素靈下降肺腑生我神君九仙梵行之門符上九仙梵行之榜黃榜白書元梵髙靈天文天元徘徊流景上清大有啓運八字高明飛天虛空洞陽自生真氣綿綿即化為仙急急如律令大羅飛梵之門符上大羅飛梵之榜黑榜青書元梵太靈真華天文元青九天洞景八靈晨華徘徊變景化形手執隱書足躡丹雲流精𣡡勃保鎮天文隂生廣靈之門符上隂生廣靈之榜黑榜青書元梵上虛景華五氣天文中皇五氣總統八靈神精錬魄安鎮朱陵執符把節藏景飛形回變景道遊宴玉京急急如律令靈通禁上之門符上靈通禁上之榜青榜白書大梵元靈紫華天文流精天谷一氣𥘉分紫華煥景元梵流形灌我靈府育我玄根內充外溢骨肉飛升齊壇鎮信科曰質信效心以財為首財既可捨心亦隨之聖道冥通隨心意高天厚土玄聖上真非信不通非心不感感通之至在乎信焉金龍一十三枚各重一兩長三寸六分以十枚鎮十方案餘十枚隨簡投科曰天子皇后用上金公卿用次金庶人用銀或銅塗以金夫龍上天之驛騎也傳逹感通龍騎為先負簡即騰信三官效誓則告盟十極鎮信之法以龍為首缺者考屬隂官曹鎮綵十方十段命信一東方青九南方絳三西方白七北方黑五上方碧三十二下方黃三十二四維黃各一十二總十方之數共百三十六天子匹數諸侯丈數庶人尺數紋繒天子諸侯紫色士庶以本