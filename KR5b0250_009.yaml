body:
  text: 神虎追攝門夫升天入地通幽逹冥呼隂召陽追魂攝魄者其神矣乎故靈寶大法有神虎追攝者亦隂陽之至靈造化之樞機也以至雄左雌右三部七真運斗道以合明由大魁而總制吐納二氣混浹三光回紫戶以聚靈知白守黑法華京而煉景回黃命靈內而道氣金光外而玉札鐵劵皆神虎之體用也及其凝光神室合景玄關唯此一真本無諸法一有感發應念而生爾神爾靈斯性斯道以其㑹五行於虛谷明一氣於先天混合百神周旋萬化又豈止拘魂制魄而已哉玄範五斗論凡建神虎壇須用敷落五篇鎮五方乃上帝大浮黎土之圖立于中召之立至如無此文則神真無合契之光不能到矣行持時當誦魔王三章并焚赤書玉字八威龍文二章於內其神非天元祖氣真文玉字不能召之其章乃玄都至禁文也元始召諸天上界三界真靈亦用此章萬聖見之咸覩玉光而至夫行靈寶上道貴在煉氣存神一如元始天尊真身法性同此慧力方遂感應或昧此理則徒勞已形返遭冥譴凡召役時叩齒一十二通吸混元祖氣一十二口閉息少時存天門降紫雲入灌我頂中中宫有青黃白之氣纒繞而出與紫雲交接想為元始又存太乙自空中來再吸青玄之氣混浹祖氣化百寶光罩覆身形天門上有紫雲碧霞而至其氣到處見神吏虎賁童子符吏並執節捧符來列左右方彈訣通氣叩齒步罡丁步十二步旋身面北兩手小指二指相又二大指並搯中文唵賖魯祈容吒盧𠰢攝呪畢依法召將如後右五篇玉字等文並見真文玉字門召役式淨壇變神召役神虎官君嘯命靈罡祕訣呪曰天一北祚太乙紫元北魁玄範神虎玄冥斗中大聖玉女追魂十方精光隨我呼靈一呼一吸入我身中隨氣而出隨氣而行變化億千元亨利貞急急如中斗大魁攝左斗印按前左劔訣義腰化身為青玄玉相然後召將書符步神虎罡召將呪寅文北氣金門浩華太白七非庚辛祖氣化應自然召陽呼隂承飈素微神虎內諱返步幽冥萬神奉命急速星馳急急如內真夫人律令疾速奉行再召呪三官氣玉訣玄天玉札神虎符吏混元真晶與道合契太一玄冥通神逹意追攝魂靈隂陽開閉萬神敬聽孰敢不至急急如神虎大聖勑三召呪神虎印訣肘後氣上靈大魔大定神光三天降勑急急令行神虎一到速若電光急急如上帝勑神虎印訣文左手二指三指倒於大指却搯五指二節上右手垂地回頭取艮戶肘後氣嘯命風雷符右符發玉札時前書於扇上步前罡執扇搧之總召神虎呪玄天玉札神虎符文寅卯混元合氣辰太一玄冥己追魂攝魄午開陽召隂萬神敬聽敢不奉迎神虎玉女神虎大聖丙追魂使者戍攝魂吏兵亥一召速至子不得稽停丑禀受符命中中宣告寒庭追魂攝魄視影現形來臨法㑹功奏玉宸午謹請某將疾速降行嘯命之道三使者出自玄範北魁之府居法師大淵宫三隂之首府總分召隂之氣神虎居三焦之首七玉女在七竅之冗陽耀通關隂靈攝魄神虎官君在左右目下雄左雌右在雙鼻孔呼吸召集神虎使者俱在華池之內分氣散布升化而出統制百節清泠尋魂神將居兩長溪穴腎即運靈根七轉呼召而出齊赴玄壇混合內外想神虎官君森列于前如意指揮方行領命符接引追攝舉運神虎隂靈罡一十三跡倒步雙手執神虎提魂印布以華蓋靈根之氣拘十方之魂但以一氣引接亡魂亡魂皆隨氣而赴且亡幡則想如亡人在世之形作一體以接隂陽一水一噀無所不成且嘯命神虎之道當發心肺之氣結合在外飛發隂風玄霧騰騰之像呼召神虎則心感形適神將皆吟嘯面至次依法行持或發玉札或立神虎壇或召攝亡魂並如此行用神虎七真內經玉真萬華官髙上藏帝經主圖九天表洞觀元中尊七轉召萬神五嶽悉來迎青龍左顧衛朱雀奮幽冥三宫招魂至司録校所呈白虎右扶助玄武解纒縈拔度重泉曲記仙書上清𡨚仇釋報對夙愆靡不清七世解胎結精血失流零返復即嬰化更受洞中生百史衛神區今召保安寧右行持朝誦神虎內經一名赦罪魂都呪能解散𡨚業分離男女超度往生一誦七遍剔隂陽斗運呼神虎官將前奔而去次發文檄追取大魁總監符祖氣玉文三清玉勑中斗大魁玄氣日月合明總監衆靈所化元氣應變魂魄所運無窮澡練衆星飛天持驛所拱遵奉星馳勑呪曰三光水火神虎內諱玉字龍文勑制魂魄神乃返生紫變玄津濁穢消蕩魂神澄清急急如律令比帝呪上靈天蒼中有甲丁混芒一吸東有伏藏天帝所履玄跡天章令日書符作我天航急急如律令取東南氣引筆書符雄左大力追魂統制百節三魂符吏衆機玉曹主伯何雄左大力符呪曰覆天齊速震萬靈勑札一下鬼爽離營覆降真真氣所成急急如律令雌右武鸞提魂攝魄倒生玄司飛符玉札主吏喬雌右武鸞符呪曰北帝靈靈天齊噷唵石神虎豁落紛紜天飛羅明英明星營魂氣有成急急如律令右二符謂之神虎飛符覆者神虎之名天齊者北帝之諱也玉曹玄伯追魂符三清玉神伯金虎玉札勑召何昌前奔令下元君魁主勑破幽疊遵依都曹大令酆泉疾速奉行呪曰三清玉勑神虎元君受勑破幽玉札主吏攝魄符三皇君玉札魁司主吏勑召玄範覆喬荀受命勑取破制幽都禀令隂關亡魂酆都疾速奉行呪曰三皇勑玉札符吏受勑破幽右二符同前呪祝之二大聖古帝王相一貟有髭髯一貟美貌並服淡紅朝服朱履佩劔錦䄂執簿録三部追魂使者符上部天地合德乾以覆運日月合明坤以載形隂陽二氣追魂使者侯與符合并凖勑奉行右使者曲腳朝天幞頭紫繡衣紅抹額緑靴碧玉束帶腰懸魚尾刀中部隂陽合氣天垂玄象魂魄合形帝以運靈生關死戶追魂使者魏符廓通真準勑奉行右使者緑繡衣紅祙額緑靴碧玉東帶腰懸魚尾刀下部天日合氣陽帝炎精地月合氣隂以運靈飛符昭灼追魂使者張攝魂聚魄凖勑奉行右使者緑繡衣黃抹額緑靴碧玉束帶腰懸魚尾刀總勑呪念三遍並神虎訣祖氣太乙紫元君天一北祚勑神虎㦸飛運招搖一統隨玉札所到處十方精光都一吸急急如律令右三使者黃素繪之書名諱符中使者陽面左手執玉札右執骨垜駕雲走霧之勢其屬十五人本法用三人乃侯魏張是也神虎七真玉女符上元玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普救天人真元正氣豁落流鈴照徹幽冥攝魄提魂真符救者玄司火令蔣急召聚形仁貴速至呪曰上靈大魔太定神光神虎一到速若電光急急令行中元玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普敕天人真元正氣玄魁旋運照徹幽冥飛星致靈符命所攝去痾聚魄蔣正病之魂仁賢速至呪曰七飛元令聿魄天暉神虎令到昭令飛行元鞅奉勑下元玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普救天人真無正氣飛光一攝照徹幽冥瘟瘴解除蟲毒魂魄蟲蛀急攝赴聚形妖穢滅除壇王真卿速呈呪曰間殃魂魄亟領符命逐風隨氣勑速騰飛速速步攝伸虎玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普救天人真元正氣飛神玄運照徹幽冥靈寶通真調治瘵疾攝完魂魄火急赴惡患速痊壇黃文速呈呪曰天庭曹伯神虎符命不得留停逼合鬼群急速奉行龜真素裙玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普救天人真元正氣飛罡元化照徹幽冥運動天衝續形節骨追聚魂魄火急赴蕩滌囂內壇萇道仁速顯呪曰天中之靈太素玉律已生未生乘此符命急急到庭元靈隂臺玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元秉勑分形化身十方世界普救天人真元正氣飛光奔燌照徹幽冥蕩穢除腥六氣運度速攝赴壇董魂淨魄寧希卿來呈呪曰天魂犯戮未破胎靈禀此靈書死骸返生風火急行太上北斗正一元生六甲隱天玉女符三清告下七星念七真內勑命北辰諱並七轉圈之北元乘勑分形化身十方世界普救天人真元正氣飛星懴解照徹幽冥招搖夙愆符命所告速破幽隂火急到魂聚魄全壇翟普卿來呈呪曰太一玄生六甲先靈神虎符命魂返飛㗣吒吒急急如律今右七真玉女符各書名諱于下扶嬰𡉵盤蘭定淑運筆七轉塗之隂日用化元聿魄星飛睪運筆七轉塗之陽日用並靈寶祖氣玉清訣總勑呪七氣顯真斗之仙靈中天定極衆星拱真召之立應運之必行五嶽震動九地咸驚開關啓閉救度苦魂隨光到處冥路悉明上帝慈惠敬命奉行急急如玉清好生大帝律令右七真玉女並紫衣魚袂環髻鳯冠朱履羽裙珮手執生死簿本法既用隂陽斗諱作用故不取其别符矣神府七道功曹符天道功曹符勑呪五皇上帝勑靈寶祖氣勑郜天真急降天道貴生勑令飛龍光明煥映魄爽魂冲地道功曹符勑呪玉皇上帝勑靈寶祖氣勑冉文申急降坤以載運隂降陽升勑令不停束制土宫神火奔激真氣遍空仙道功曹符勑呪玉皇上帝勑靈寶祖氣勑索急降仙道莽莽以攝北酆仙道吊吉歌朗太空願仙道成我道興隆神道功曹符勑呪玉皇上帝勑靈寶祖氣勑祖公弼急降無量大神皆由我身變化飛空過之長存匡禦衆魔體入自然人道功曹符勑呪玉皇上帝勑靈寶祖氣勑胡急降人道渺渺當人生門髙清靈爽鬼道貴終鬼道功曹符勑呪玉皇上帝勑靈寶祖氣勑翟尚急降鬼道常凶諸天蕩蕩斬馘六鋒統乘玄都轉人道申業道功曹符勑呪玉皇上帝勑靈寶祖氣勑葛賦急降龍漢蕩蕩何能别真火司有令以發歌音令下停停薄由我恩總勑呪道本一氣變化自然隨業受對應念起緣輪轉無窮靜覺善遷一召立至無間人天急急如律令神虎大元追魂大將軍符王訣祖氣運筆塗之一氣左陽正五生成左召魂來一肇分右隂天地定位右攝魂至六丁六甲台光幽隨光合氣精爽靈呪曰七魄七情十方六合地府泉扃神霄天光追魂將軍張昌仁以類應類以神合神隨符通氣速召來臨受錬變化返胎更生如違符命永劫沉淪急急如上帝勑金闕玄都內臺追魂總攝符上元唐宏中元隂鬼飛魂幽幽冥冥葛雍下元周武天靈攝天地同生真光一攝非吾神化無路不通曷追爾魂呪曰奉玉皇上帝勑金闕玄都內臺追魂總攝林浩將軍天轟地轟林浩速行唵俱吒俱吒唵咭唎耶吾奉上帝勑勑曰天圓地方地隂鬼昌普天將軍河沙鬼形遵依法令速到壇場三天勑㫖風雷告行急急如女青詔書律令召內臺諸將總符呪曰唵烏輪屠義將流光徹混冥三魂同七魄合聚見全形唵烏輪屠義攝急急如內臺天省律令神虎玉札玄師曰夫混元玉札乃玉清神虎之合契三皇召靈之祕㫖有回骸起死度人之道凡告下隂曹以白素繒長三尺六寸或七尺髙一尺二寸以白紙表禙過朱書玉札於前墨書告文於後仍以黑書亡人姓名生死因依於所屬星下如名數多者止以首度一名添等字寫札下餘者類甲狀粘於前內皮以黃素為之方函以青素為之朱題其靣以總監鬼神印印之同三使者真形并關牒引等同時發遣焚於烈熖之中此札大齊普度餘者不可妄用矣書時焚香面東啓奏大道請降玄冥夫人左手搯神虎訣二指三指以大指壓掐倒小指二節叩齒九通依前法召將密呪存至祝事行持取西北氣入筆書札存神訣師宴坐澄思微引中天北斗之光歸中混合元氣上升泥丸一性真人上朝元始密奏事意畢蒙玉㫖垂允勑命侍仙開函啓藴降付混元玉札令兆奉行即鼻引元皇正氣隨札下降與案中之札合而為一臨目洞視七真內諱光明透徹普照重隂神虎將兵森列聽令玉札陽日吾奉北魁君雄左追魂吏急召六甲神統制百節君手持玉札符真精降一氣禀勑往幽冥善惡悉分明星光為鬼律不問有無罪萬神咸敬聽無間踈與親黑律夫人攝攝魄赴壇來魂魄返歸真主伯速施靈何喬受命火急施行急攝急攝玉札隂日勑玄冥夫人葛神咸敬命吾召六丁神死魂返故根雌右武鸞吏遵奉玉札劵倒生玄司君徑往幽關尋天一北祚氣三界何敢違生死路分明十方盡皆迎億劫受𡨚對攝魂魄赴壇符到悉皆停主吏速施靈何喬受命火速奉行急攝急攝每星呪曰隂陽二札各以北斗光氣訣合祖氣塗祝之天一北祚神太一紫光勑神虎㦸飛運招搖一統隨玉札所到處十方精光都一吸急急如律令上帝玉札勑文天篆隂陽日用譯文四丁一字太上混元玉札急追索劵內三界九州亡靈急急依帝勑命奉行母令怠慢神虎官吏火急捧符告下主司玉札式天一北祚太一紫光北斗玄冥混元神虎王札黃籙齊壇或九幽或普度為奉道某官入意得此除已依科具奏天廷申牒合屬照應外今依禀太上元降天乙北祚太一紫光混元追魂玉札仰神虎承行官將依律追取亡過某等魂赴壇受度須至頒告者按隂陽日布形於此并各星下符次細書亡人姓名年甲於符下如亡位多寫甲帳連粘在前斗形後書天篆四十一字次書後告文右奉天一北祚太一紫光北斗玄冥混元玉札神虎符命告下三界十方天曹地府山川海嶽泉曲冥關北都羅酆六洞十宫三元九府百二十曹鬱絶之鄉幽隂之境諸大地犾九州分野城隍杜令里域丘墟黃泉蒿里拘制魂魄應千去處追取亡某等魂徑離所部速到玄壇朝謁上帝領受殊恩神虎奉命萬神敬聽太歲年月日時告下具位行神虎太上混元玉札攝召事臣姓某奉行內封太上混元神虎玉札符命簽上寫具位臣姓某奉行謹封內封後書追取亡某等亡魂赴壇方函太上混元神虎玉札符命告下簽上寫十方三界九幽地獄主曹萬神具位臣姓某謹重封靈寶玉鑑卷之九
