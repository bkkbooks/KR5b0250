front:
  text: 靈寶玉鑑卷之十一及三
  hash: sha256:40ff315d78189f89757eba489fd17f40d3cd24a02baf641cab5651271d500361
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_011-001a, image: hfl/0304/0304-062.png}
body:
  text: 分燈制器門經曰開明三景是謂天根故玄元始三氣乃萬化之根宗天人之大本也由是溟涬大梵三氣開光而生天地日月星辰焉故靈寶大法開壇之初以法像乎洪濛初判之義故分燈列炬以開三氣之光而生三景鳴金根玉以和合隂陽而生萬化皆法其天運之自然也當知無形之氣為祖氣無色之光為慧光自一而三從三至九九九變化而生萬光煥映萬天照明九地內外朗徹以襲其明然後應無聲之聲於金玉之中運不化之化於隂陽之表與道為體則含靈蠢動永有依歸矣此造道通玄之妙而幽明髙厚豈有間哉分燈存用先以慧光符捲封為蠟炬候日中以取陽燧念陽暉呪明哉太陽暉神光洞三清氣散玄漠內靈煙生紫庭控御乘風霞飄飄淩無形急急如律令右一法取太陽正氣然一燈於元始上帝之前登壇時師存此燈金光如日流金之色混合兆身光結作日輪透明內外次運一氣自泥丸出上接元始寶光混同一體次以符炬自中燈分明自一生二由二生三三化萬光普明八極天真上聖三界衆聖皆合寶光同登壇陛陽庭幽治悉變天堂分燈畢以餘炬納於主爐中默呪曰太上降慧光華燈通精神諸天悉開耀地府皆朗明兆身亦光徹五藏生華榮炎景照太元遐想通玉京急急如三天道主律令分布慧光呪慈悲寶篆玉笈飛煙燈華散景煥映諸天朗明三界照徹重泉幽冥開悟惠及無邊今日大慶咸得升遷道生一氣萬化純全元始威章應度自然急急如律令玉清慧光符請光用書符呪曰玉訣根氣日月星光照破重泉元始一氣演化三元混合空洞梵氣之先玉帝有命告下十天陽暉烜赫隂景清圓虛明洞映朗照壇乾光澄萬慮景合妙玄廓清人極應化自然急急如元始上帝勑勑呪大道一氣肇生二儀五行之祖斡運璇幾三才並立陽耀分輝天尊惠澤蕆大慈悲今日稱慶三元録儀臣今上啓開發天機上生陽光下洞幽微普朗重隂幽魂永離急急如律令呪畢引玉清慧光與自己性光混合自一生二二生三三化萬光燈燈相續照微十方玄氣寶光符玉清燈青氣王清訣書符呪玉清無上大羅至尊玄氣初露化生諸天混合真一妙應自然勑令萬神齊到帝前勑呪玄元始青紫虛妙庭三十二天天帝帝君混合三氣流霞散晶真文到處萬神敬聽拱禮玄奧洞開天門上通八極下徹幽冥傳言引奏龍虎二君四司五帝俱妙神精急急如元始天尊勑元氣寶光符上清燈黃氣上清訣書符呪玄虛中澄三景開明無極大道太上道君真元布化品物流形三元合德九氣齊并勑呪玉晨道境虛皇昊天氣化成象妙合玄元龍翔鳳翥億萬雲軿無極衆聖護法真仙自然祖氣運合俱全中虛大聖三天洞玄引進天使玉女傳言天門開闢上升奏傳急急如靈寶天尊勑始氣寶光符太清燈白氣太清訣書符呪九陽開化八極生明左玄真人統御三靈右玄真人營衛萬神一氣普化萬物育形勑呪太清太極三景開明中理五氣混合百神道合德備萬行圓成玄元妙化洞朗八門日月普照下徹幽冥一切苦爽咸覩光明急急如道德天尊勑右三天三氣符自元始三氣開光化生天地日月星辰今以三氣混合三田由自巳性光發明外景次以後符分布混接三光森列燈炬使天地朗明隂陽開泰後舉明燈頌道衆各執燈炬繞壇分燈至然燈畢各歸班次髙功作用如法運燈分燈慧光符三光氣訣合祖氣書符呪九日之光停午朗照六隂之氣圓極回陽玉清上清太清慧光五星正氣列曜熒煌月為黃華氣貫七元日為鬱儀瑞應樞機玉虛玉晨玉皇之氣三台垂芒中天尊仰幽幽冥冥酆都沉淪零沒三途輪轉無停天尊慧光燭破重隂翳昏清廓如日光明沐此宸恩上生天堂急急如律令呪曰九陽至精三天道明日月晨華星光合明三華寶耀混合群精三寶發華慧光發神長虹飛空下燭幽冥慧光一遍照徹十方三途罷對五苦停輪火山息熖氷雪消扃刀化玉樹劒變騫林鐵城摧毀魂升玉清臣今上告願賜開澄日月靈妃星光真人一十二貟稽首奉行分燈散輝照徹寒庭急急如律令右符呪畢為紙撚道衆分燈餘炬焚於主爐中分燈儀明燈頌并諸呪見科教門制鐘磬論法曰以金鑄鐘擊其聲先當召陽神以玉造磬扣其韻先當召隂神此召合隂陽之良器也師當左叩齒以發金鐘二十五下可召威兵右叩齒以發玉磬三十下可集真靈中叩齒以鳴法鼓二十四通可聞上帝皆內按天地隂陽之數外敷九和十合之音必先關召辟非禁壇二將焚符宣牒扣玉鳴金然後可以格降於神明矣辟非大將軍楮飛卯文禁壇大將軍楊福酉文二神並天丁冠淡紅袍緑仙衣如虎龍狀陽神九和君盧會之字炎靈身長八尺戴三梁冠服赭紅袍左手仗劒能淨天地穢驅百木精自左目出立于左隂神十合君陸同字永夫身長八尺戴三梁冠服白花袍右手仗劒能絶隂府考掠塵世𡨚尤自右目出立于右次運耳鼻舌祥風瑞氣交接天景如月光吹布十方召辟非大將軍符玉訣祖氣召禁壇大將軍符玉訣祖氣呪曰虛皇勑命降自玄明召神攝鬼通真會靈合和二氣洞朗玉晨聞今令召速赴壇庭急急如律令召陽神九和君符慈玉文祖氣二符貼鍾磬架上召隂神十合君符以二道焚召二神呪曰隂神陽神急速通靈吾今朝真上謁帝君欲使神人閉債封形舉雲即去袐訣靈靈使我攝氣即得通神急急如律令又曰生神內列威兵外張二景八眸吐納靈芒頭戴七星足躡玄綱萬精永滅千妖自亡急急如律令王方壇令符東方卯文東氣呪曰九氣萌陽玉曆金章八卦外列一德中藏生化自我絶死為祥急急如青靈始老律令南方午文南氣呪曰南陵三氣陽光九芒以養以正邪莫能當朱炎外烈為吾所將急急如丹靈真老律令西方酉文西氣及三九呪曰太白流晶七星守靈乾德內養金光莫刑生無不化白元用明急急如皓靈素老律令北方子文北氣呪曰玄德五靈度命一元胞精命魔內七合乾洞化無礙真景洞然急急如五靈玄老律令中央中文祖氣呪曰中主萬神十二元真總統四大元始玉晨上天下地達貫無垠急急如黃靈皇老律令五方壇令背文式奉玄都省今月日據齋主投詞就某處祗建黃籙普度大齋道場幾晝夜伏乞開度某魂超升所合依律借地建壇右仰百神主者符到奉行太歲年月曰告下具位臣姓某承誥奉行右告文分作七行五方壇今用梓木或柏木作簡長九寸闕或寸四分厚二分書篆畢俟建壇之先到於壇之五方宣前呪安鎮如法五方借地符即玉字靈文右法用黃紙各一張篆符於前寫告于後隨方宣告粘於五方卓前今既有壇令止有篆符隨方焚之五方玉字靈文東方玉字靈文震文噓氣南方玉字靈文離文可氣西方玉字靈文兌文呬氣北方玉字靈文坎文吹氣中央玉字靈文中文嘻氣總祝曰元皇一氣肇應五方順天廣化流演元綱太玄妙感空洞凝常帝命所至冥合景光急急如五老天君律令十方鎮壇符東方南方西方北方東北東南西南西北上方下方右十符取各方氣內合入符念結空成梵呪用柏簡十片各長一尺二寸闊三寸厚一分朱篆符以紫羅囊袋之鎮於壇十方故能安鎮壇場辟除魔試也靈寶玉鑑卷之十一
