front:
  text: 靈寶玉鑑卷之十三及五
  hash: sha256:542d65e0913260a43bf4c2cac936f88e1663118d2561d6225e77667bab229f3f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_013-001a, image: hfl/0304/0304-122.png}
body:
  text: 宿啓朝醮門法曰天地之化聖人之道在乎無為自然而巳矣蓋無為自然者乃不勉不思之謂也其不勉不思之中淵乎似萬物之宗者實天人之大本也然而能體誠敬會天人而一致於道者故科教有朝修之道焉其朝修者日有三時建壇行道禮謝朝元以取夫畫夜三接日宣三德之義至於三日而九朝亦法其九陽之數則九頓九奏之誠備矣其旨有之曰寶珠神化太一含真五氣朝元三花聚頂此內景之謂也飛章列符行科演道謄詞進表懴謝禮方此外景之謂也故凡外景之設實本乎內景之妙自非深明夫內外之道者其孰能究其體用哉今以即夫道之體其小無內萬殊而一本也以極夫道之用其大無外一本而萬殊也然則又當明其所以為體者存於有而無迹其為用者本於無而有為由此觀之則將致廣大而盡精微合內外而兼體用而言之者亦莫非無為自然之妙矣則朝修祗對之際其可忽諸奚有間哉靈寶自然思神儀訣夫宿啓者正齋前一日取吉時建壇設席補職説戒宣科勵衆關聞三界即是啓告之夕非正齋行道之日也師曰明晨行道續更啓聞至日行道方入清旦初朝乃知宿啓關奏不在正齋行道之限應齋者並在前一日沐浴宿齋所至日吉時率衆具威儀引髙功法師詣師前立定請齋官燒香授齋詞與髙功然後髙功於師前關白齋意夫齋法精嚴諸天上聖並降監臨每事須合法度乃至都講讃唱詠誦亦須緩急得冝不得遲留稽延凡髙功啓奏之時東向平立執簡曲躬調聲正氣直詞小語朴略典素不得過有繁飾凡諸祈禱先有悔過然後請事凡髙功行道登壇皆香水盥漱名曰蕩穢出亦盥漱名曰閉真氣平旦寅時當思青氣從肝出如雲之升匝繞壇殿青龍獅子備守前後仙童玉女天仙地仙日月星宿五帝兵馬監齋直使三界官屬羅列左右即宣五星都呪正中午時當思赤氣從心出如雲之升匝繞壇殿朱雀鳳凰守備前後仙童玉女三界真仙日月星宿五帝大魔十方神仙兵馬監齋直事萬靈官屬羅列左右即宣命魔神呪人定亥時當思白氣從肺出如雲之升匝繞壇殿麒麟白虎備守四方仙童玉女天地真仙日月星宿五帝兵馬監齋香官三界官屬羅列左右再宣五星都呪閉目內思五嶽五真五帝備守身中金華映蓋一體作金色從肺出頂後圓光如日之像使照明十方內外玄同獅子鳯凰麒麟白鶴四靈八卦隨方列布祥雲瑞氣匝繞壇場諸天衆真森羅慶會仰觀太上三尊居天寶之臺左有三十六部尊經右有玄中大法師恍如黍米之天萬神備守次運自已一氣上朝泥九自一生三從三化九作九光圓像煥映萬天自已真人上朝至尊心奏所陳依科行事無不孚感者矣各朝行道俱用此法夜夜禮十方皆從北方而起次東北方東方南順至上下方蓋衆星拱北之義故先朝禮於北方也入壇淨穢符上帝訣天門氣勑蕩穢呪洞中玄虛晃朗太無三清下勑光映九衢八方威神使我自然靈寶符命普告九天乾羅答那洞罡太玄斬妖縳邪煞鬼萬千中山神呪元始玉文玄水洗穢郤鬼延年按行五嶽八海之文魔王束首侍衛我軒𠒋穢消蕩道氣長存捲簾髙功道衆詣簾前跪奏拜通真表次宣表焚化金樓玉陛符師存壇殿之中五色祥雲彌羅混合運自巳一氣上泥九化為元始乘百寶光須臾見天尊下降混合為一天真大聖日月星辰三界十方千真萬聖皆乘妙光俱會壇所兆自已元神如真人狀與三界衆真升壇朝謁隨事依科行事化金樓玉室符已文神霄氣呪曰合明天帝日月合明瑞氣氤氲祥雲密布三華離便五明豁開玉軒梵音瓊房妙韻森羅淨霐霐池無鏡金城環固玉洞回靈急急如律令告行金樓玉陛符式三天氣五文奏表後焚於簾前靈寶大法司今月日謹奉道旨頒降太上化境玉符須至告下者欎羅蕭臺玉山上京上極無上大羅玉清渺渺劫仞若亡若存金樓蒨偉玉殿森明光梵巍峨降真啓靈駐景龍輿玄晃仙居隂陽凝室萬氣齊居一如告命風火驛傳太歲年月日告下具法位臣姓某奉行玉清上相大羅無極神公在天祝呪三界之上渺渺大羅上無色根雲層峨峨唯有元始浩劫之家部制我界統乘玄都有過我界身入玉虛入户符上帝訣取天門氣髙功於地戶上存四明功曹一人通真使者一人傳言玉女二人侍靖玉女二人早午二朝念密呪曰四明功曹通真使者傳言玉女侍靖玉女道室正神為神通逹上元生氣入臣身中靜夜朝真密念呪曰四上功曹龍虎使者侍靖玉女開明童子上元少女夜有侍靖願得上聞正一生氣降入臣身都匠符五方氣訣合明符玉文祖氣十方謁簡燒香符東方震文東氣呪曰廣生髙映覺元洞虛應元九真化肇靈圖靈文運搆宗範元都感變總括威招自成緑岑遷景皇道合明天森耀權氣精育魂融羅負立圎映隱旻期臣神色洪綱告寧與道合真南方離文南氣呪曰章炎通泛堅敷澄榮虛象玄華龍陽儛穹微正霄艷太淵凝沖元關三紐大梵飛空隱覺隆蓋天倫慶呈神戶纒絡真元散精淨握明照徊合升玄導騫宴雲靈應騰天與道合真西方兊文西氣呪曰剛澤微控隂峻孤儀貫氣冥素宸洞開微周化幽應澄輝帝臺平遐挹虛恢茂童池結飈臨育麗無散開陽通百六沉芒隱階幽廓冥默真峰會靈堅丕順道告命騫林與道合真北方坎文北氣呪曰龍安洞變純陽隱玄返本還氣象伏髙圓神變惠允解鍊靈根赤精成道純號威尊利雲有常億刃中丘欎城瓊壘瑶音慶流受位王室大憲通幽玄章煥落綱輪乃周與道合真東北方艮文東北氣呪曰觀覺欎繿大明紫虛九神度魂開闢玉真阿奕煒燁飛天流音輪景帝常都靈頥臻豁落大宥慶雲啓靈七曜輝魔恬懀敷榮虛無上首天紀彌宸四吁育象濯耀清明與道合真東南方巽文東南氣呪曰煥赫洞陽淨景五光七靈謡歌世元紫堂羅英散景曜明玉房八晨總獸韶主攝精九都蹇欎飛生上靈密羅淨境馥育寶輪灌沃黃華霐運玄明神宮開廓延宛丹庭與道合真西南方坤文西南氣呪曰大猷浮景真定化元蜒蜿素眇玉梁澄煙蕭峙結隅景羅七纒秀盤三府流輝九玄寂然虛邈飛華拂軿晨濫録籍大漠由延阿丘九度六龍負轅蓊藹浮羅紫精復淵與道合真西北方乾文天門氣呪曰溟涬太育九機化乾覆形厚德元河淪精育英明陀景艮眇云大醜總監秀樂禁天紫虛陀丘劫量交前碧霞韻梵眇眇遊元元變運量馘絶惡𠎝恢冠玄漠萬度成仙與道合真上方亥文西北氣呪曰元始開運太玄肇靈虛極無象一氣流形化生二景五緯凝精混合自然坦除結嬰總真布景煥赫九清炎持廣變七紀齊并析師慮浩丹天耀精朱光鍊度赤藹散明三華𣡡秀輝映帝晨與道合真下方已文東南氣呪曰真陽開化梵氣流通金闕在上玉府居東欎結五文煥散九空妙氣自然藴奧難窮三靈共貫萬聖攸宗參稽學行摽紀真功以神俱契與道合同安鎮帝録億劫無終與道合真右十符當朝奏時髙功執謁簡詣各方默具職銜恭詣各方天尊侍從服色隨方存感氣訣各按方位降真召靈章師曰天皇降真靈符虛皇召靈真符乃三天飛玄正氣自然之章以召三元衆真萬靈兆司清宫仙階位治靈虛真品欲降百真後召千靈以青綺七尺二寸絶朱丹書降真靈符飛黃篆召靈符安於靖中以黃錦作席或黃繒亦得用醮禮祭之百神降真召靈使者玉女金童各十二人隨祭降下直衛真文所召千真萬靈立降于室學不篤信五嶽試人輕露祕密所召不神凡諸三天仙真靈神遵符而屇前無神文乃為妄召雖精思若徹萬無一報或有降者多作魔試受者依玄都憲格齎三素繒隨年尺詣有系之師以畫空而心記不載於文章恐鬼神禽畜竊視漏泄矣師曰仙曹玄司修用隨事並有髙聖真仙主宰曹局靈官典者一一治局無致妄召並隨虛皇萬應降真符元皇總章召靈符下降罡式上洞案香先進左足雙步星珠熠耀罡立主爐前行罡呪左手中文午出雙目微閉以存三境玉清赤素大梵分靈元綱流演星珠貫周急急如律令三上香呪臣今𥘉捻上香願逹玉清境供養元始天尊九聖之衆臣今二捻上香願逹上清境供養靈寶天尊九真之衆臣今三捻上香願逹太清境洪養道德天尊九仙之衆呪曰靈光梵氣下注臣身飛香進御合真帝庭急急如律令左手剔三官訣瞑目存壇墠上通天門黃雲紫氣日月光明星斗交映混浹玄壇左右芝蓋華幡森然列侍運心府作金蓮迸開一景居中金光獨懸次剔玉訣見七寶金臺玉殿內外瑩然中有至尊端坐其中兆以一氣引接祖氣次布十方仙凡交合上清靈寶玉虛召靈紫英符玉訣取天門氣呪曰開明三景是為天根玉山上京大羅玉清三華離便大有妙庭大行梵氣無無上真與道合真上清靈寶元皇降真青華符呪曰天中之天眇眇劫仞混沌之中無幽無冥無形無影無極無窮梵氣彌羅萬範開張泛景太霞十轉回靈契本合真二符總勑呪玉華散景九氣凝煙香雲密羅徑衝九天侍香金童傳言玉女為臣通奏上聞帝前今臣所啓咸賜如言急急如玉清靈寶無量度人律令存左右二君金童玉女自兩耳目出服色如常乘五素雲為我通誠逹意招真召靈赫奕仙曹章師曰此玉清天大將天神皆繞屬玉清神公太玄上相也與諸天大帥髙靈齊功自號玉清靈寶赫奕司輔翼玉清劫運改更滅魔掃災升度學仙之子檢校三界驅除妖惡嚴攝北酆制御鬼爽明檢鬼營肅清道境以備後世種民期見太平聖君皆符衛掃蕩之神也神公即地皇之臣馬祖太帝之嗣角龍辰宿之父位為玉清神公太玄上相號馬祖龍氏諱郭奕師左手玉文右手上清訣化身為玉清神公念後呪一遍目篆三天真符於天門上吸三色自頂門下注三田合青黃白三氣化為三尊上升泥丸與壇中三尊混接為一自已真人與十方三界一切神明總朝上帝次搯五方訣合五方氣內外相應以目左𣊬三周吹氣布滿十方揖禮歸拜壇三拜召仙曹呪髙天之上玉清為主元綱大魁太玄生府中有帝君靈虛王母繞制嘯咏玉文金符司制仙禁金童玉女校精辦魔總御百史上逹三天形成司舉傳奏教令蠲災救苦備衛護道囚縛鬼侮流浪諸天濟生度死解厄摧怪通逹紫府十方告命召其所主急急如上清靈命元始上帝勑右呪乃玉清靈寶宮靈寶天仙內院有仙曹分降以給宫中仙官凡招真召靈必資此呪也招真靈符玉帝訣祖氣呪曰玉清勑召千真萬神虛皇寶册宣告無停真靈遵誥奉命而行急急如律令降真靈符祖玉氣帝訣呪曰玉清聖命告下三界天皇之勑普告三元無極聖衆浮空而來急急如律令跪爐符玉帝訣天門氣呪曰道由心學信假香傳手執玉爐心存九天令臣所奏上聞帝前各禮師訣先存經師形相名諱心禮三拜呪曰願師得仙道上登髙靈為我超拔一切皆成道真我身升度次存籍師形相名諱心禮三拜呪曰願師得飛仙上登髙真為我開度七祖父母早生天堂我得真道升入無形存真師形相名諱心禮三拜呪曰願師得升度上登髙仙為我開度王苦八難名入仙籍永為真人師曰修行之道本在存師師之不存道從何得所為師者曰度師度師之師曰籍師籍師之師曰經師以上人間三師也别有天上三師者太上老君為度師虛皇大道君為籍師元始天尊為經師也次存天上三師乘青黃白三氣下降心禮三拜次五方衛靈訣隨方搯卯午酉子中內思五臟五嶽五星五帝各統從官兵馬備衛身中四靈列侍五色慶雲滿身直射五方罩覆壇所吻合內外之境無感不通五方衛靈東方衛靈叔英妙氣之符卯文東氣呪曰蕭仞扶桑方諸欎霞元皇列真凝雲芽明耀九芒合氣三華钁天振劒神虎辟邪安陽大帝攝禦群魔二升神霄濯形天河急急如律令南方衛靈洞惠妙梵之