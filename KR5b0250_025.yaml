front:
  text: 靈寶玉鑑卷之二十七
  hash: sha256:cc3ae34f6b84c57d4c954633f562f579a888183ca32035d163c1646e334c993a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_025-001a, image: hfl/0307/0307-156.png}
body:
  text: 告給符籙門長生度命金籙太上洞玄靈寶長生度命金籙維太歲某鄉貫住居某伏為某入意恭就黃籙齋壇奏授太上洞玄靈寶長生度命金籙一階付某收執過度三界超升九天謹按經云元始天尊昔在九清妙境三元宫中與諸大衆敷弘至妙開化人天摽紀善功注名黃籙金格玉簡陳列三清一一地獄之中皆見十方救苦天尊入於九幽拔度諸苦天尊普告四衆汝等若能受持金籙白簡九真妙戒長生靈符救苦真符當消九幽大罪摽名九宫察命童子護戒威神五帝直符六宫掾吏自當隨逐簡文覆護受戒弟子今當為汝顯説九真妙戒金籙白簡受持功德拔難濟苦神力難思衆靈稽首伏受教命天尊告曰一者敬讓孝養父母二者克勤忠於君主三者不殺慈救衆生四者不淫正身處物五者不盜推義損已六者不嗔凶怒凌人七者不詐諂賊害善八者不驕傲忽至真九者不二奉戒專一護戒威神察命童子元始符命金籙白簡救苦真符告下十方無極世界三官九府百二十曹五帝考官九幽地獄巨天力士執罰神兵司録司命司功司殺牛頭獄卒三界大魔拔度某神魂出離地獄永辭長夜覩見光明萬罪蕩除𡨚仇和釋乘此九真妙戒拔度功德上生天堂一如告命百二十曹官元始符命金籙白簡長生靈符告下南方丹天世界朱陵火府南昌上宫長生大君韓君司馬司命司録延壽益算度厄尊神回骸起死監生大神超度某靈魂上登朱宫流火之庭玉眸鋉質黃華蕩形書名紫䇿受化更生乘此金籙度命功德時刻升遷一如告命回骸起死之神監生大神帝君品命當願亡過某魂受度之後永充濟拔人間天上敬信奉行一如玄科律令年歲次月日黃籙齋壇給保舉師具法位姓某押監度師具法位姓某押度師具法位姓某押右長生度命金籙用青繒裱禙金錦表首軸頭長八尺一寸並泥金書篆人物等形亦用金畫外以經帶束之於錬度後宣給同升天大劵用之九天寶誥青素九尺製造成軸研朱書篆玉清神霄九天寶誥據鄉貫入意乞行科法錬度亡魂請頒神霄九天寶誥給付正度某魂遵守奉行永為身寶者上帝玉符九天紫府內音宣告三官九府百二十曹天牢地獄主司大神拔度亡過某統領符命部衛形魂上朝帝庭罪仇和釋與道合并神登玉闕受錬長存一如告命亡過某魂受度之後當願手持紫誥魂錬丹天正性成真永脫輪回之數超凡入聖常資快樂之遊庶顯靈寶度人一如洞淵誥命年歲次月日時給真師髙上丹霄太清韓王朱陵大帝宗師髙上碧霄上清華王青玄上帝祖師髙上神霄玉清真王長生大帝升天左劵劵篆文書作一面後項背文作一面并二邊告文升天左劵式靈寶升天左劵告下三界天門守衛諸神諸天隱諱諸天隱名敷落成真普度天人今日亡過某神魂欣慶受度歷關諸天請滅三惡斬絶地根飛度五户名列太玄魔王監舉無拘天門一如告命年歲次月日時告下具法位臣姓某奉行具法位臣姓某奉行年歲次月日時告下告命天門一如太玄魔王監舉無拘諸天請滅三惡斬絶地根飛度五户名列今日某神魂欣慶受度歷關諸天隱諱諸天隱名敷落成真普度天人靈寶升天左劵告下三界天門守衛諸神升天右劵劵篆文書作一面後背文作一面寫併書二邊告文升天右劵式靈寶升天右劵告下天門守衛諸神諸天中大梵隱語旡量之音普度某神魂上登道境大勳魔王保舉遊行三界升入金門一如告命年歲次月日時告下具法位臣姓某奉行具法位臣姓某奉行年歲次月日時告下天門一如告命三界升入道境大勳魔王保舉遊行神魂上登諸天中大梵隱語旡量之音普度亡過某靈寶升天右劵告下天門守衛諸神凡諸劵文並於説戒傳符之後一一宣告依式分裂左手一邊同四保舉符命焚於鍊度壇右手一邊給付亡者證應升天者二劵分開每一邊繫於幡左右手九錬天尊符見幡蓋門書符呪九氣鍊神三景合成生神火錬返復人形急奉玉清勑玉清靈寶普度萬靈呪金闕上帝授許旌陽超度玄祖呪唵吽吒唎唵元始生天唵元始生地唵元始生人二才備化萬物紛紜人不保全化為隂神神之不全流為下鬼唵下鬼聞我玉音鬼形即滅捨彼鬼形上生天宅唵人道聞我玉音頓捨人業長生神仙與天地同壽與日月同明一身被恩七祖蒙榮既度七祖身居玉清唵天道聞我王音天福頓增宿業永盡不墜下天常居玉清急急如元始上帝普度萬靈律令右呪平日行持可以呪普度諸真籙靈寶玉鑑卷之二十七
