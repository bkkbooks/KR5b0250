front:
  text: 靈寳玉鑑卷之二十八方二
  hash: sha256:d0a7c03504d4c97250654022eafce78124fcf63ff08983911f0e040aaf591a08
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_026-001a, image: hfl/0308/0308-004.png}
body:
  text: 投龍進簡門山簡告文共五行今謹有畧節意於某處修建黄籙大齋幾書夜以今滿散投簡名山願神願仙長生度世飛行上清五嶽眞人至聖至靈乞削罪簿上名九天謹詣名山金龍驛傳年歳次月日具位臣姓某於某處告下右山簡製式在前用金龍一枚金鈕九隻青絲纏之齋事畢卜良辰法師同衆官詣名山洞府依式設醮法事關告投龍進簡若路逺師衆不可拘選委二三人去亦可水簡如山簡式詣靈泉海瀆等處投之告文今謹有畧節意於某處修建黄籙大齋幾晝夜以今滿散投簡水府願神願仙九府水帝十二河源江河淮濟溟泠大神乞削罪簿上名九天謹詣水府金龍驛傳年歳次月日具位臣姓某於處告下土簡如山簡式埋於壇所中庭土官告文今謹有畧節意於某處修建黄籙大齋幾晝夜以今滿散投簡靈壇中黄九地戊已黄神土府五帝乞削罪名請詣中宫一切靈神削除罪薄注名九天謹詣土府金龍驛傳年歳次月日具位臣姓某於某處告下投山簡符書符呪太上三天天帝玉眞三光監暎威制群靈五常回度山嶽藏煙眞炁結實應化自然急急如天皇上帝律令投水簡符書符呪太上沖玄勑制河源九江水瀆河海瀰洋天運回度開釋九玄急急如律令投土簡符書符呪太上三晨大羅之中九地厚德合妙元宫萬神宗集福慶彌隆急急如上帝律令四季投簡符右符立春甲寅日書之右符立夏甲午日書之右符立秋甲申日書之右符立冬甲子日書之簡内告文元始符命玉清眞文告下諸天丞相度人不死之神長生大神司馬大神韓君丈人南斗六司權機省署太玄神庭嚴校三界无極神郷泉曲之府北都羅酆三官九署十二河源普度苦爽億萬幽魂疾除罪簿落滅惡根不得拘留部衞形魂速滅三惡斬絶地根飛度五戶名列太玄魔王保舉度上南宫朱陵受錬仙化成人永度三塗五苦八難天門無拘五帝侍迎超凌三界逍遥上清今日受命萬神咸聽一如契令年歳次月日時某處告下玉璧三枚投進龍簡天官用蒼璧圓形地官用黄璧方形水官用玄璧六出形皆虚其中各徑三寸科曰玉以貞潔之德可以盟感上眞故以爲信若投龍簡當以青絲紐纏而副之青絲以代割髮金紐以代㰱血上告三官也缺者考屬地官九都曹金紐二十七枚徑九分如環之狀每簡用九枚天子用金餘用銀塗金以青絲纒之同龍簡投之山簡璧式青色土簡璧式黄色水簡璧式黒色右簡三式君主用玉王侯用璧玉士庶用玉石爲之其次許以梓木代之並長一尺二寸闊三寸六分厚三分以金泥篆之加木簡以粉刷簡以雌黄界邊朱書符墨書告文黄羅爲袋各以金龍一條金紐十二枚玉璧一事散壇各詣逐處設醮依科投之書時用靈寳炁訣投山簡宣呪玄上開明元始監眞上帝五色赤書丹文天地本始緫領三光攝氣召會催促舉仙髙上符命普告十方日月星宿五嶽靈山天上地下𡨋靈大神監生主録南上三門關領玉簡勒名丹篇削落罪目上𥙷帝臣齋主某人皈憑至道建立齋功拔贖九祖一切罪魂行道事竟俓詣靈山請投玉簡乞削罪名皆蒙解脫無有𡨚親去離三惡魂升九天生死開度億劫長存今日上告萬神咸聞請以金紐開盟眞官乞如所告金馬驛傳投水簡宣呪元始五老上帝髙尊十方至眞太華靈仙赤文告命無幽不聞上御九天請下玉文日月五星北斗七元中告五嶽四方靈山下告河海十二泉源九府水帝溟泠大神今日上告萬願開陳齋主某人建齋行道普爲存亡請贖九祖宿對罪根謹投玉簡乞得上聞記名水府過去升天生死開度萬神咸聞謹以金紐告盟水帝請如所陳金龍驛傳投土簡宣呪天地開張萬炁分靈三元同符十方朗清五老上帝主領死生丹書赤文元始上清普告天下九地皇靈今日上告萬仙定生齋主某人建齋行道普爲存亡我願我身即得飛仙謹投玉簡土府太皇削除罪刑奏名上宫刋籍華清早得成仙天地同靈九祖種親腐骸更榮魂生南官受化仙庭今日告命萬神咸聽謹以金紐表盟至誠請如斯言金龍驛傳靈寳玉鑑卷之二十八
