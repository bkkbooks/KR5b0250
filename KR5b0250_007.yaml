front:
  text: 靈寶玉鑑卷之七賴八
  hash: sha256:235b2bb8856eafadd2383811500b771ec8bbcce5e38b8417b0bf980fc2f298ed
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_007-001a, image: hfl/0303/0303-094.png}
body:
  text: 申牒頭連門夫靈寶度人上經大法凡肇修齊紀關行之𥘉則必以靈寶妙光元始符命託諸毫楮間連粘於申牒之前先行普告三界旡極神鄉開化九幽垂光長夜亦法像於人天合契於幽冥也苟非明自本之本開天之天者其孰能混融無間洞徹幽深也哉大頭連符式靈寶大法司檢照今月日奉為齊官投詞伏乞開度某魂超升得此恭依大法飛奏天廷頒降元始拔度諸真符命合行翻録行下者右奉王符普告三界十方地府𡨋曹拘魂制魄應干去處一依元降勑命如律釋放罪魂出離隂境受化更生一如靈寶無量度人律令符到奉行年月日告下具法位臣姓某承誥奉行小頭連符式二符作二版刋黃紙朱即連粘申牒前元始開化符命右符普告三界十方地府𡨋曹拘魂制魄應干去處一依元降勑命如律釋放玄壇該度亡魂出離隂境受化更生一如靈寶無量度人律令符到奉行年月日告下具法位臣姓某承誥奉行九鳯破穢符貼牒前符用九鳯破穢訣祖氣呪曰九鳯真官破穢鳯凰朱衣仗劒立于上方九首吐火當空飛行炎炎匝地萬丈火光建壇符貼牒前呪曰青龍在左孟草敬聽白虎在右監兵通靈朱雀導前靈光下臨玄武從後執明速呈各顯威德衛護壇庭上帝有𠡠總召四靈急急如律令四靈訣氣辟非符二符粘於鐘磬牒前禁壇符追母喪子存符出紫英隱書追攝産亡用並玉文祖氣追母存子喪符追母子俱亡符追未産俱亡符祝呪玉清降寶籙開度産亡魂普照長夜府起化上生門解除纍劫罪削落北都名受鍊得更生乘符度朱陵急急如律令血湖符貼合屬右符用上帝訣中黃氣圊䄛使者符取東南氣辰文貼在關前呪曰太上炎鈴流火之精上帝勑下不得久停左驅六甲右使六丁手持玉𠡠追攝産魂圊樓使者急攝急尋火光圓化亡魂返形左右將軍白虎青龍眼光萬丈鑠散魔精乘符度化上升朱陵急急如律令符形祝呪左德右輔圊樓衆神吾行蘇魯化濁為清蠲除邪黨急速著靈急急如律令淨血湖追魂符呪曰諦讜諦讜法水洗蕩圊樓有將攝赴壇前急救産苦獲證真常急急如律令五道大神符貼牒前用五氣訣呪曰三氣陽光日月並照玉𠡠告下元始玄冥三官北酆明檢鬼營巨天力士普度泉扃眇莽九醜天道貴生元覺洞虛辭參髙真真士清爽分配五行七政均施萬氣齊仙明氣四騫上元侍軿三官九府咸聽玉文神虎玉札五道奉迎攝魂速正風火無停急急如律令神虎六神內篆判斛符貼六道追攝牒前天道尚真地道尚德人道尚靈鬼道尚景業道尚綸六符存辨冠緋衣玉文東氣隱語祝之神道尚定追魂符書於神虎追攝牒前並斗訣元皇氣攝魂符引魂符聚魂符取魂符驅魂符右符是清泠大將精光太史統制百節大神用攝召一切沉陷鬼魂應如影響作一紙書召魂附幡符散形開天門照地户通人門留鬼路攝魂攝魄倒生催魂丑文東北氣大力速攝魂神將速降臨三魂火急附疾速現真形急急魁至魒出筆神虎提魂攝神虎不離魄使者劉青一斬滅亡萬千形影飛急十左行三尸萬精光都一吸不得住右治七魄天印勑下火急奉行神虎之獨飛行令急急如律令唵吽吒唎亡靈速附內書準至尊勑將名呪曰上帝有勑速附亡靈五方童子引魂將軍金闕律令某魂立到壇附體通靈急急奉太一至尊律令神將趙公明疾速現形召役發遣門夫召役發遣者自非明其先天大道玄通之妙以合夫神明變化之靈者其誰能與於此哉夫何故蓋無極而太極者虛化神也太極動而陽靜而隂者神化氣也自此氣彌綸於天地之間然後有人焉有物焉唯人為物之最靈性分之中能具衆理故參天地贊化育心知意發神動而天隨矣況鬼神者乃二氣之良能造化之功用也以其旁日月挾宇宙乘雲氣馭飛龍者得非神化歟然而萬化之中亦必有主宰之神焉原其所以主宰之神者無在不在非色非空其用無方其體無跡而能統萬氣合百神則將有以不言而善應不召而自來者矣是故靈寶大法所以統攝萬司者蓋由此也然而將恐事物日膠人欲滋深未能達本曷遂通玄則必假想念存思運神㑹道以氣合氣以神合神交神明格兵誠敬庶幾髙厚無間遐邇不殊達悃通誠濟生度死十變萬化應念而通則亦莫非先大大道流行之妙矣其召役發遣者實道法之綱領也可不真諸存用先入精思堂凝神定志臨目存天上元始天尊乘寶光真氣下入泥丸宫宴坐兆引一氣自下田上升混接為一雙手玉清訣交指自巳丹元君上朝元始密奏齊意存天地萬神俱來聽令倐見天尊慈㫖允俞勑命金童玉女捧出寶珠一顆光明煥照十方兆以鼻微引咽下元宫代天行事次化四驛官吏並在壇前受事行持次道衆具威儀演出齊所登壇召將行持師作用淨水右手執水盂左手剔訣呪入水上台一黃去却不祥寅至巳中台二白護身鎮宅丑至午下台三青去病除精子至未台星到處大賜威靈右鼻引三台六星之光入水次搯隂陽二斗光氣入水貪巨祿文廉武破魁𩲃𩵄䰢魓𩳐魒次搯三光呪訣日君呪陽日掐酉自戌兌坤離巽至卯出降日搯卯至酉出每一節一呪唵嚩𠯐囉喗呶唎娑訶引日光九芒內合布出水中月君呪陽曰搯卯至酉出隂日搯酉至卯出每節一呪唵縛月羅發羅婆薩訶引月光十華內合布出水中天罡呪搯子午斗每一節一呪唵吽吽喗噠唎娑訶𩳀攝鼻引天罡氣合內布出水中次搯卯午中酉子文鼻引五方氣內合布出水中搯九鳯破穢罡訣師以目光書霐三字光氣入水默呪曰謹請日君月皇三台北斗二十八宿五行生旺之氣九鳯破穢將軍九鳯破穢真官解穢官衆本法籙中將吏並降真氣入此水中次書唵吽吒唎四字運金光入水清明符呪謹召破穢大神宋迪運玉池神水淨天地萬穢皆清合明天帝日洞映自然霐疊書此三字于下目注青黃白三氣三官混合運筆作用勑兄天地開明四大為常玄水洗穢辟除不祥雙童守門七靈安房雲津灌錬萬氣混康內外利貞保兹黃裳急急如律令勑天地自然穢氣分散洞中玄虛云灑淨右法存九鳯破穢真官騎九首鳯凰左執碧霞琉璃寶鐘右執楊枝在吾前遍灑神水清肅氛葩鳯口吐炎炎之焰燒蕩隂邪氛穢內外潔清灑淨畢呪曰吾以月華蕩形以日精錬神真人附已玉女侍真二十八宿與吾合并千厭萬穢逐水而清急急如律令師上三捻香次變神師瞑目存神虛寂於一呼一吸之中水火升降交媾黃庭一氣混合為嬰兒倐然長大隨念所化四靈森列默呪掐五方訣合五方氣青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越急急如元始上帝勑右存挺神於金光梵氣之中步豁落斗冬至後圖訣曰斗道妙兮十二辰靈光明兮威武陳氣髣佛兮如浮雲七變動兮上應天知變化兮有吉凶入斗宿兮過天關步六律兮持甲乙履天英兮登天任清泠淵兮可陸沉抱天柱兮擁天心從此度兮登天禽倚天輔兮傍天衝入天內兮出天蓬斗道通兮剛柔制𣸸福祿兮留後世入窈𡨋兮千萬歲一陽之後步相隨豁落神兮除百魅入在斗中萬邪避夏至後圖訣曰日月明乾坤配吾從天蓬入天內略過天衝逢輔退却歸天禽與心對抱天柱任英㑹人道興鬼道廢如召將發遣拜表謄詞諸項發用除九靈飛步之外餘用此罡交泰罡訣曰巽雙離隻坤單步兌上雙行震亦雙鬼户獨行坎一步乾宫雙立望天罡交泰罡轉步訣曰坎雙艮隻步交乾震上雙行兊亦然坤隻離單雙步巽三台歸去便朝天右罡如行持發遣則於上台定立執簡朝天祝奏若上詞表奏則於此處存謁拜伏若破地召雷則於朝天祝奏後放簡仗劒方轉身步北斗自子至午訣曰白氣混沌灌我形禹步相隨登陽明天回地轉步七星躡罡履斗躋九靈衆神助我斬妖精凶惡潜伏邪魔傾萬災消滅我長生我得長生朝上清訣曰北斗天關正八方攝氣召神除萬殃日月回環星辰光四景明度轉天常赤天行道回紫黃輪㑹明達激災祥九靈制命升玉堂訣曰上台一黃去却不祥中台二白護身鎮宅下台三青治病除精台星到處大賜威靈右隂陽二斗三台如遇告斗朝真止步此罡若召役發遣步至下台以劒破地召雷先以劒劃一巽卦即運真氣一口隨劒布於地上存巽戶裂開雲霧擁騰雷神將吏無鞅數衆隨雲而出師吸氣一口吹布壇前衆將聽令䇿役右前罡共計三十六步曰破地召雷外加二十八宿共六十四步名大破地召雷二十八宿罡訣曰二十八宿隨吾指陳北斗七星挾輔靈真願行萬方百福同臻神威到處永保長存總罡呪乾尊耀靈坤順內明二儀交泰六合利貞振天響地永寧肅清應感元皇上衣下裳震登艮興坎順離明巽旺兊生虎步龍翔天門地户人門鬼路為我者誰昊穹旻蒼今日禹步上應魁罡鬼神賔伏永辟不祥所求如願應時靈光違吾令者返受其殃急急如律令師步罡訖左右手飛二斗於兩邊師左手飛南斗於前右手擊令一下呪曰帝廷出令天省頒符諸司官將聽吾指呼以今焚符關召日直功曹使者聞今符召疾速到來有事指揮書日直功曹符呪神霄令下韓君降臨日遊神吏疾應十方部令兵甲統攝四靈執持符命徑造玉晨曰直功曹符用辰文巽氣召呪曰古曹玉文立功之官主持有職奏報三天上帝勑下速降神光天地合氣日月合明謹召日直功曹吏者疾速赴壇依律奉行直日功曹直日符使神霄法召一如所至急急如髙上神霄玉清真王律令勑靈寶玉鑑卷之七
