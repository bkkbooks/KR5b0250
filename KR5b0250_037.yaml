front:
  text: 靈寳玉鑑卷之三十九盖五
  hash: sha256:1d3e6462b29db7cd1b041a6e33f4ea3596294cc55453f4e5f7ee0fd794951987
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_037-001a, image: hfl/0310/0310-134.png}
body:
  text: 錬度更生門召主水大將軍内錬符子文北炁知磬舉黄華蕩形天尊髙功入科水錬嗚召謹召主水大將軍王燕速至壇所合炁錬魂右神皂袍金介胄緑仙帶自北方乗雲而至師吸炁歸中化作金介字以隂斗訣發此字於水池光明瑩徹内如碧天皓月之狀受錬衆魂俱入月中黃華蕩形呪曰玄象晶明内陽外隂隨光降炁濯錬亡魂知磬舉黃華蕩形天尊髙功鳴召謹召主水大將軍立降眞水錬度亡魂立降眞水符右符申加酉酉加申天水降子文出北炁五息存月華神水化爲大池錬浴亡魂宣主水呪北方主水神含耀育元晶養炁淨泓泉交姤結胎津玄炁霞采纒旋飛衝朱陵逆奔朝南昌灌濯穢尸形自生百寳光返復有玄英悟此理玄玄脫彼苦濁身萬眞俱來會妙炁自然靈玉符召主將急急至壇門禀炁玄幽集徹斗流交浹天河運轉崐丘造化渠潭自魂導浮主將奉令錬魄南樓急急如律令入水池正錬移旙於水池邊水錬正符子文北炁呪曰霐池無鏡神龍之淵運東井華以濯幽魂攬兹運容太和之津玄和玉女濯之于神魂神澄正萬炁長存急急如律令太隂水錬符子文北炁三炁尊神太隂純化錬形返質育胎結形魁𩲃旋輪九炁齊幷龍漢瑛鮮幽塊開度應咸無礙枯朽發烟育邈令廷錬化自然呪曰北方之君黒炁之精辰星使者壬癸將軍玄武靈神沈沈隂精造化萬𩔖五行生成天帝有勑使者須聽洗穢除惡濯錬眞形急急如太隂水帝律令水錬血尸符子文北炁呪曰元始符命㧞度爽靈血尸臭穢凶惡潛寧七液得注五臟光生急急如律令黄華蕩形符酉文月光呪曰黃炁隂華陽精固僊沐浴九魂冠帶金晨圓明啓告玉胎錬仙華光交映流芳陶津九陽齊化玄霞散烟元景回靈曲映我身飛昇上宫洞觀自然急急如律令月華錬形符太隂炁訣即合前月光少女叩齒二十四通呪曰黃炁流晶三合凝光玄輝返正冠帶八芒錬度東井受明飛光金華散靈五君流芳夫人降醴遍滿十方洪芳下注六府溢光靈精九化易景反容急急如太隂皇君律令水九錬返生符九道一符子文月炁呪曰太隂眞炁圓光自生濯錬亡魂髙奔上玄普錬萬化咸得成眞急急如太隂皇君勑二符丑文月光呪曰水源出眞北子元神普錬普度蛻形無形坎止眞化長爲上賔急急如律令三符寅文月光呪曰天一運化妙景飛空元君恊順天地同宗玄理應妙周流合同魂魄受錬年劫無終急急如律令四符卯文月光呪曰太隂眞炁普錬亡魂返形復質度命登眞四象合會元亨利貞急急如律令五符辰文月光呪曰虛皇緫炁錬化男魂眞光流布五炁中存出入太玄得覩慈尊急急如律令六符巳文月炁呪曰六陽純化内體生靈死塊返生超跡北扃靈寳符命錬魄朱陵急急如律令七符午文月光呪曰天神示靈昭眞蕩清水火合應七炁陶成魂魄合會同昇帝庭急急如律令八符未文月光呪曰水資天化物受生成魂魄受錬體洞金眞運紀理明炁與神并急急如律令九符中文月光呪曰水錬毓質魂魄返生運符生藉轉隂成陽天河隱月中含九光急急如太隂皇君律令知磬舉黄華蕩形天尊衆和次舉偈云東井黄華沼石景水母精黄華蕩形質魂魄除垢塵和黄華蕩形天尊上清石景水母玉晶符酉文五炁冠帶石景玄華玉英圓耀九錬日月乗光登昇吐輝上清呪曰東井黃華石景玉晶飛玄水母金醴玉津滔滔源源不竭流盈九龍灌錬三光垂精仙人吐潤錬度亡靈胞胎結節隨水開扃死炁斷絶惡尸況零我今錬化死骸生魂反故易貌玉體金容變化玄景飛昇紫庭右符太隂流輝灌注亡魂内合水錬合同符右符左手自申逆廵至子蓋水錬九符自旺處子位至長生申位今自申位長生歸於子水旺處合同錬魂故得返生永錬返生符禹餘天清微玉皇紫微上元中元天大赤天上帝大帝天官地官下元削名合炁天眞日月内運水官黑籍黃寧洞映隂陽混凝化元返胎衆眞監度度命復嬰九炁返生搯申至子引光滿口吹布亡人體貌㳙㓗呪曰太隂流煥合炁辰星三光交映四象合并一炁返生七魄俱昇急急如律令宣呪東井灌黄華石景水毋晶浣魄淨隂質蕩形成玉嬰表裏瑩通徹内外光華清靈元神不邁正炁合仙眞金童散紫烟玉女麾瓊英五芽分五炁三素耀三雲欎儀纒結璘飲之復完形本化返生景錬形朝玉京和與道合眞玉液錬形符玉訣呪曰玉液錬形金馬驛程上下水火森羅淨霐元範恢漠幽寂度人受錬無窮爲道至眞三光降合五炁會神太上符命六丁潛靈紫虛欎秀行符玉京急急如律令咽液一口入玉堂宫存體生玉光照明内外洞陽丹錬飛神八景之道毎日六陽時入室端坐叩齒三通閉息靜坐存下丹田火如彈丸左右各九轉升絳宫漸升十二重樓登玉房泥丸宫化爲一天尊左手執日右手執月號大洞帝一呪曰魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清右呪三遍咽液三過良乆項生圓象光映十方祝曰无上玄元太上道君當召臣身三炁正神太乙司命桃康合延無英公子白元尊神臣今内錬眞元光映九天豁蕩陽精洞映九門即使死魂受錬返胎更生形神俱妙與道合眞引火炁九口嚥之則神光自見洞照幽㝠右前工夫存用平日圓熟臨錬度時以青碧紙闊四寸五分髙五寸五分用雄黃朱砂調匀篆後符一道至水錬内沉於水池中至火錬後將此符於水中移過火沼中燒衆念龍漢蕩蕩呪髙功灑水作用黄炁陽晶符太陽炁訣吸紫黃炁書符扶桑炎帝光布天帝合形精晶三景四傾混玄中藏日耀陽炁元始陽晶光精炎升精炁兇轉日有赤童神會五行二炁交并東井黄華金醒玉津浴魂錬魄日月高奔宻呪曰陽藏隂生二炁交周天地混合三五應符服御黄華靈降我軀長享景炁與神同符沐浴九玄驂駕飛浮急急如元始上帝𠡠平坐定息行回紫抱黄之道如天地未分之前用時鼻引清炁合泥丸青炁次下合黄庭金色次入下丹田聚白炁混三色爲神丹透尾閭過夾脊升泥丸自頂門迸出金光道炁遍滿太虚中有元始天尊在空玄之中日月星辰洞明天地右符作用引左腎炁過肺自右目出合天中太隂白光十芒照耀洞明吸入符寫朒字於西邊月上引筆下天字上化作流汨池内寫字本呪引右䁂炁過肝自左目出合天中太陽紫光九芒照耀洞明吸入符寫晅字於東邊日上引筆下天字上化爲流火庭内寫字本呪引心炁混黄歸下丹田過尾閭穴透上泥丸宫自頂門出合天中圵斗柄前星紅光紫炁一團照耀洞明吸入符寫炓字於日月之中念本呪金光呪一遍存三十二天十方天尊監度衆眞俱乗金光列侍元始蓋我之本來眞性即是法身中間書取五方炁五帝諱蓋之次書唵吽吒唎以勑字蓋之先念无上玄元太上道君呪在前䢫意祝事攝亡姓名於内運筆想天男天女形神俱妙次念以神合炁以炁錬身五臟六腑眞炁自生吾今錬汝𨑰胎育嬰急急如律令欎儀結璘水火合形隂陽孕結速覩光明存主水大將軍引魂入池受錬即左天字中曳筆過於此中念北方之君呪在前水錬符復右吸月華光炁於水中如瑠璃映出嬰兒數念龍漢蕩蕩呪其魂漸漸塋潔髙功再祝將吏引魂火錬存主火大將軍引魂入火沼受錬即引右天字中曵筆過於此中念南方之君呪在火錬符復左手卯文日光炁引吹火中魂神澄正念龍漢蕩蕩呪存衆魂冉冉長大具足形相天衣飛墜衆魂皆得服著次舌柱上腭化爲法橋引魂䢫筆上昇至天罡字塗上念元始符命時刻昇遷亡魂受度立便生天及三天諱四字存金光中有朱陵火府衆魂皆昇其中咸得超生靈寳玉鑑卷之三十九
