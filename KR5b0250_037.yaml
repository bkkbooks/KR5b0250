front:
  text: 靈寶玉鑑卷之三十九蓋五
  hash: sha256:4cc07c5903c19582d2f1454e50bc0939d18f3a221ca0d7b9755d001d75dad37a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_037-001a, image: hfl/0310/0310-134.png}
body:
  text: 錬度更生門召主水大將軍內錬符子文北氣知磬舉黃華蕩形天尊髙功入科水錬嗚召謹召主水大將軍王燕速至壇所合氣錬魂右神皂袍金介胄緑仙帶自北方乘雲而至師吸氣歸中化作金介字以隂斗訣發此字於水池光明瑩徹內如碧天皓月之狀受錬衆魂俱入月中黃華蕩形呪曰玄象晶明內陽外隂隨光降氣濯錬亡魂知磬舉黃華蕩形天尊髙功鳴召謹召主水大將軍立降真水錬度亡魂立降真水符右符申加酉酉加申天水降子文出北氣五息存月華神水化為大池錬浴亡魂宣主水呪北方主水神含耀育元晶養氣淨泓泉交姤結胎津玄氣霞采纒旋飛衝朱陵逆奔朝南昌灌濯穢尸形自生百寶光返復有玄英悟此理玄玄脫彼苦濁身萬真俱來會妙氣自然靈玉符召主將急急至壇門稟氣玄幽集徹斗流交浹天河運轉昆丘造化渠潭自魂導浮主將奉令錬魄南樓急急如律令入水池正錬移旙於水池邊水錬正符子文北氣呪曰霐池無鏡神龍之淵運東井華以濯幽魂攬兹運容太和之津玄和玉女濯之于神魂神澄正萬氣長存急急如律令太隂水錬符子文北氣三氣尊神太隂純化錬形返質育胎結形魁𩲃旋輪九氣齊並龍漢瑛鮮幽塊開度應咸無礙枯朽發煙育邈令廷錬化自然呪曰北方之君黑氣之精辰星使者壬癸將軍玄武靈神沈沈隂精造化萬類五行生成天帝有勑使者須聽洗穢除惡濯錬真形急急如太隂水帝律令水錬血尸符子文北氣呪曰元始符命拔度爽靈血尸臭穢凶惡潛寧七液得注五臟光生急急如律令黃華蕩形符酉文月光呪曰黃氣隂華陽精固仙沐浴九魂冠帶金晨圓明啓告玉胎錬仙華光交映流芳陶津九陽齊化玄霞散煙元景回靈曲映我身飛升上宫洞觀自然急急如律令月華錬形符太隂氣訣即合前月光少女叩齒二十四通呪曰黃氣流晶三合凝光玄輝返正冠帶八芒錬度東井受明飛光金華散靈五君流芳夫人降醴遍滿十方洪芳下注六府溢光靈精九化易景反容急急如太隂皇君律令水九錬返生符九道一符子文月氣呪曰太隂真氣圓光自生濯錬亡魂髙奔上玄普錬萬化咸得成真急急如太隂皇君勑二符丑文月光呪曰水源出真北子元神普錬普度蛻形無形坎止真化長為上賔急急如律令三符寅文月光呪曰天一運化妙景飛空元君協順天地同宗玄理應妙周流合同魂魄受錬年劫無終急急如律令四符卯文月光呪曰太隂真氣普錬亡魂返形復質度命登真四象合會元亨利貞急急如律令五符辰文月光呪曰虛皇總氣錬化男魂真光流布五氣中存出入太玄得覩慈尊急急如律令六符巳文月氣呪曰六陽純化內體生靈死塊返生超迹北扃靈寶符命錬魄朱陵急急如律令七符午文月光呪曰天神示靈昭真蕩清水火合應七氣陶成魂魄合會同升帝庭急急如律令八符未文月光呪曰水資天化物受生成魂魄受錬體洞金真運紀理明氣與神并急急如律令九符中文月光呪曰水錬育質魂魄返生運符生藉轉隂成陽天河隱月中含九光急急如太隂皇君律令知磬舉黃華蕩形天尊衆和次舉偈云東井黃華沼石景水母精黃華蕩形質魂魄除垢塵和黃華蕩形天尊上清石景水母玉晶符酉文五氣冠帶石景玄華玉英圓耀九錬日月乘光登升吐輝上清呪曰東井黃華石景玉晶飛玄水母金醴玉津滔滔源源不竭流盈九龍灌錬三光垂精仙人吐潤錬度亡靈胞胎結節隨水開扃死氣斷絶惡尸況零我今錬化死骸生魂反故易貌玉體金容變化玄景飛升紫庭右符太隂流輝灌注亡魂內合水錬合同符右符左手自申逆巡至子蓋水錬九符自旺處子位至長生申位今自申位長生歸於子水旺處合同錬魂故得返生永錬返生符禹餘天清微玉皇紫微上元中元天大赤天上帝大帝天官地官下元削名合氣天真日月內運水官黑籍黃寧洞映隂陽混凝化元返胎衆真監度度命復嬰九氣返生搯申至子引光滿口吹布亡人體貌涓潔呪曰太隂流煥合氣辰星三光交映四象合并一氣返生七魄俱升急急如律令宣呪東井灌黃華石景水毋晶浣魄淨隂質蕩形成玉嬰表裏瑩通徹內外光華清靈元神不邁正氣合仙真金童散紫煙玉女麾瓊英五芽分五氣三素耀三雲欎儀纒結璘飲之復完形本化返生景錬形朝玉京和與道合真玉液錬形符玉訣呪曰玉液錬形金馬驛程上下水火森羅淨霐元範恢漠幽寂度人受錬無窮為道至真三光降合五氣會神太上符命六丁潛靈紫虛欎秀行符玉京急急如律令咽液一口入玉堂宫存體生玉光照明內外洞陽丹錬飛神八景之道每日六陽時入室端坐叩齒三通閉息靜坐存下丹田火如彈丸左右各九轉升絳宫漸升十二重樓登玉房泥丸宫化為一天尊左手執日右手執月號大洞帝一呪曰魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清右呪三遍咽液三過良久項生圓象光映十方祝曰無上玄元太上道君當召臣身三氣正神太乙司命桃康合延無英公子白元尊神臣今內錬真元光映九天豁蕩陽精洞映九門即使死魂受錬返胎更生形神俱妙與道合真引火氣九口咽之則神光自見洞照幽冥右前工夫存用平日圓熟臨錬度時以青碧紙闊四寸五分髙五寸五分用雄黃朱砂調勻篆後符一道至水錬內沉於水池中至火錬後將此符於水中移過火沼中燒衆念龍漢蕩蕩呪髙功灑水作用黃氣陽晶符太陽氣訣吸紫黃氣書符扶桑炎帝光布天帝合形精晶三景四傾混玄中藏日耀陽氣元始陽晶光精炎升精氣凶轉日有赤童神會五行二氣交并東井黃華金醒玉津浴魂錬魄日月高奔密呪曰陽藏隂生二氣交周天地混合三五應符服御黃華靈降我軀長享景氣與神同符沐浴九玄驂駕飛浮急急如元始上帝敕平坐定息行回紫抱黃之道如天地未分之前用時鼻引清氣合泥丸青氣次下合黃庭金色次入下丹田聚白氣混三色為神丹透尾閭過夾脊升泥丸自頂門迸出金光道氣遍滿太虛中有元始天尊在空玄之中日月星辰洞明天地右符作用引左腎氣過肺自右目出合天中太隂白光十芒照耀洞明吸入符寫朒字於西邊月上引筆下天字上化作流汨池內寫字本呪引右䁂氣過肝自左目出合天中太陽紫光九芒照耀洞明吸入符寫烜字於東邊日上引筆下天字上化為流火庭內寫字本呪引心氣混黃歸下丹田過尾閭穴透上泥丸宫自頂門出合天中圵斗柄前星紅光紫氣一團照耀洞明吸入符寫炓字於日月之中念本呪金光呪一遍存三十二天十方天尊監度衆真俱乘金光列侍元始蓋我之本來真性即是法身中間書取五方氣五帝諱蓋之次書唵吽吒唎以勑字蓋之先念無上玄元太上道君呪在前隨意祝事攝亡姓名於內運筆想天男天女形神俱妙次念以神合氣以氣錬身五臟六腑真氣自生吾今錬汝𨑰胎育嬰急急如律令欎儀結璘水火合形隂陽孕結速覩光明存主水大將軍引魂入池受錬即左天字中曳筆過於此中念北方之君呪在前水錬符復右吸月華光氣於水中如琉璃映出嬰兒數念龍漢蕩蕩呪其魂漸漸塋潔髙功再祝將吏引魂火錬存主火大將軍引魂入火沼受錬即引右天字中曵筆過於此中念南方之君呪在火錬符復左手卯文日光氣引吹火中魂神澄正念龍漢蕩蕩呪存衆魂冉冉長大具足形相天衣飛墜衆魂皆得服著次舌柱上腭化為法橋引魂隨筆上升至天罡字塗上念元始符命時刻升遷亡魂受度立便生天及三天諱四字存金光中有朱陵火府衆魂皆升其中咸得超生靈寶玉鑑卷之三十九
