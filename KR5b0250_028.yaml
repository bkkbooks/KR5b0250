front:
  text: 靈寶玉鑑卷之三十方四
  hash: sha256:fb1dc0b7ab0ad39a687c5c298ee69e599589a7c49bde1de45ed563e3e918a264
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_028-001a, image: hfl/0308/0308-066.png}
body:
  text: 開明幽暗門九幽地獄燈元始威章拔魂籙符玉文祖氣呪曰大明東出浮羅陽光紫氣鬱霄變化黃老九陽真氣龍篆成章天寶靈寶神寶天君太一青宫東華生氣破獄滅考覃宥罪魂十方天尊混合成形上有三十六天下有三十六泉分形散影變化億千玉圭所指鐵城摧毁魂神受度罪業俱消九光圓像普照十方元始開化勑降青玄急急如律令告文玉清寶光梵真元始威章拔魂寶籙今月日恭奉道㫖告下元始威章覃宥罪魂出離幽獄回集善因專伸正度某魂上生仙界須至告下者符道君有命勑付昆崘破毀鐵圍羅酆幽隂十方三界無極神鄉三官九暑十二河源解釋亡過某魂洎億劫種親疾除罪簿落滅惡根不得拘留時刻升遷萬神護送徑詣人天隨品受化更生福鄉一如告命年歲次月日告下具法位臣姓某承誥奉行方函式元始威章拔魂寶籙告下十方三界酆都幽獄𡨋官具法位臣姓某謹封九獄燈三晨慧光破獄真符三光氣訣呪曰赤明開圖運度自然開明三景億劫之先今日大慶沉魂受鍊重昏幽暗永夜寒泉欲請慧光照破𡨋關冰池溫和爐炭息煙刀山劒樹永斷攀緣回光十方照耀諸天魂消五纍業除勾連三晨同輝永劫除愆玄元開光承恩上願三光玉女請如斯言一如告命右符各獄焚之能通光隂境覃宥罪魂然㸃諸燈不可缺此執策杖呪天地交光日月合明上沖牛斗下徹幽冥左扶六甲右衛六丁神杖破獄萬彚超升急急如律令毀鎖符五文祖氣呪曰太上符命普度幽魂出離苦趣徑超生門急急如律令張門符呪曰三清玉勑光耀九衢神燈破獄吏卒準符鐵城摧毀銅柱清虛威靈猛將六道啓逯釋放罪魂咸升玉都急急如律令焚九獄符呪玉清祖氣罷對幽堂三星煌煌元始開光有罪無罪得赦某方寶光煥映普登天堂急急如律令又呪太上道君勑付昆崘神符一下拔度死魂勑赦呪無上玄元太上道君教臣行符照破幽獄死魂出離急急如太上律令右存自己為元始天尊執策杖於各獄勑破之念前呪存地獄化為坦途衆魂乘此寶光皆得度化次度杖與符侍燈執水盂灑淨念茫茫酆都中重重金剛山靈寶無量光洞照炎池煩七祖諸幽魂身隨香雲幡定慧青蓮花上生神永安功德金色光暉輝開暗幽華池流真香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寶㫖自在天堂遊破獄祕呪玉訣祖氣唵俱祇知帝阿勒薩曇婆伽婁伐耶婆叱吒吽訶九真梵氣破獄真符東方玉真梵氣之符卯文東氣呪曰三陽之光妙氣纏結九壘禀令永破風雷又呪九氣生煙玉寶慈尊皇上正氣流降真空雷電息威偃消迅風劒㦸摧折罪業消融元始符命升濟魂宗急急如律令南方玄真梵氣之符午文南氣呪曰六陽之光照煥隂獄火翳清涼焦肌完復幽夜開明乾和妙育又呪三氣丹華萬福玄真吹噓陽光拔度苦魂火翳滅燼炎息威風炮奂塗炭法兩慈雲惠光普化罪苦消蠲一如告命群靈敬聽急急如律令西方太真梵氣之符酉文西氣呪曰四氣合陽分隂感化金剛摧毀𡨋曹奉行又呪七氣素英太妙至極金光寶耀煥映千億鐡杖考掠永使蠲釋金捶刀義應時消釋天慈赦宥削名黑簿魂登太素逍遙自適急急如律令北方上真梵氣之符子文北氣呪曰五氣順度玄光合真溟泠變溫寒池生春又呪五氣玄精玄上玉晨九和陽光普濟罪魂清香周布穢惡除氛冰戈霜刃悉除其根九天道氣噓寒為溫罪考解脫升度沉魂急急如律令東北仙真梵氣之符寅文艮氣呪曰梵氣定極斗運旋衡鑊湯停沸死魂更生又呪鎮劫保運晨景慈尊化形救苦度仙上聖惠澤流布鑊湯滅釁沸煮火爛復形端正湯化甘涼蓮生青柄永出苦爽普登元應一如靈命鬼官敬聽急急如律令東南度真梵氣之符巳文巽氣呪曰魁魒回度真氣混康銅柱摧折隂府消殃又呪先化梵陽一氣好生度命大聖普濟無窮焦爛生肌熱腦散沖炎然銅柱永滅無熒苦除罪考上升仙宫急急如律令西南寶𡨋梵氣之符申文坤氣呪曰六真分治回尸返生屠割停考刀劒消洋又呪坤氣虛皇太靈髙尊景色元輝下照幽宫風刀割切霜刃摧鋒罪魂零落肌體復充永免茶毒克證先宗急急如律令西北命真梵氣之符亥文乾氣呪曰九氣肇運萬靈振降火車俱滅咸覩慈光又呪乾靈玉真無量太華天元正氛廓照無涯火車停輪消弭蹤瑕潰爛肢體變生玉葩神與魂升上登仙界急急如律令中央真陽梵氣之符玉文祖氣呪曰四氣四正四真四明隂尸九鍊返朴如真萬氣凝混普停幽刑上元玉虛明皇紫宸下洞九淵真皇洞神慧慈二光普度亡魂刀山劒樹立化騫林考掠苦毒徑除酸辛鋸解倒懸永不由經鐵城破散鬼官遷真億劫罪爽普度朱陵十天誥命群靈奉迎敢不從命列奏玉宸元始回光化形符玉訣祖氣右符於九獄畢次作用於中央呪曰元始一氣散耀諸天靈寶陽晶鬱儀之君光回九地輝破八𡨋太玄隂景結璘之神炎炎熱惱廓照生清引日月星合照氣神六合內外破暗生明化形呪吾師天中救苦尊常善化形十方界以此威神成大慈救彼衆生無量苦九夜重泉幽暗鄉普令廓然生光明牛頭獄卒盡升仙一切沉魂俱解釋三途五苦諸囚繫考對停間上紫清見聞有識及有情感此皆成無上道唵吽吒唎遍光明師先以回光化形符元始威章酆都真形共三道作一沓懷於胸前至破中央獄時焚此符兩手玉清訣擎灰於手中自已即本來元始性光化為百寶祥光內外洞明上逹三天下通九地天尊化形十方救度苦魂諸獄幽牢悉為樂土衆魂咸乘妙光上升天境吹灰于燈壇中念前呪三遍次納策杖元始符命制魔奉行保舉酆都山亡魂度品南宫酆都消燼三官解刑赦縛間業受化真形更生隨品受錬上登福庭右山形連上題下呪共作一板刋之應用九獄牌符九道東方獄牌符呪曰青陽青帝震宫之精流光下照洞徹杳𡨋摧破地獄風雷悉停急急如上帝律令南方獄牌符呪曰南方赤帝離宫耀明下照萬重無幽無冥火翳停𤔵除熱得清西方獄牌符呪曰白帝剛騎誅斬妖魁乘氣驅馳飛戈走騎下破幽牢救度一切北方獄牌符呪曰重隂冥冥黑龍馳符徑達重泉罪無久拘北帝有令違者速誅東北獄牌符呪曰重隂之境罪業之門鑊湯煮潰考掠罪魂符命一下善惡悉分東南獄牌符呪曰九龍符命下入重泉積劫滯魄無路可宣銅柱之苦咸賜赦原西南獄牌符呪曰三光普照幽冥易開積釁不原萬劫可哀免罹屠割獲登天堂西北獄牌符呪曰炎炎之心重重之罪火車輪轉受此苦㑹符命下頒九幽罷對中央獄牌符呪曰乾坤交泰二氣感通元始符命萬聖咸從一切地獄永扇慈風右符呪書于牌上九幽獄圖師曰按法天象地方圓為式九幽曹主罪憲職任羅酆東南巳地是其所也按太一聖真之科以砂土作壇九方闊二寸九壇一同總方六尺以法地之隂極二六之象每壇四角三曲如獄之形每獄明燈三炬九獄共二十七炬九獄之心隨方立牌牌之上書破地獄符見齊法門背寫獄名上懸九幡見幡蓋門至破九獄燒九幡了却以此幡掛其位仍先立遷神回黃幡使幽魂覩之萬罪皆滅也夫九幽者八卦中宫按九州分野各係社令主守在天為九霄在地於九宫化形為九幽獄其名又九皆一氣所化一念所感凡亡人一念之惡其獄即現其報隨之故大上垂慈拯濟立此齊法超拔幽爽當知其所出也九幽名者一曰幽冥二曰幽隂三曰幽夜四曰幽酆五曰幽都六曰幽治七曰幽關八曰幽府九曰幽光大凡建九獄本為普度沉淪之設若是建小緣上不禮君王而及寰區下不度九祖而及六道區區只度一二之魂則上帝豈特為一人而能頒曲赦悉開九獄必無是理地獄未必皆可破幽魂未必皆可度而我之立意無一毫及物之功豈本科之意也倘或專薦止可然燈祝譛或建九危燈之類足矣破獄之科不必舉行庶免僣瀆然孝子報親無非盡誠懴罪足矣豈可以我祖必墮地獄而行此科理之所在也若果欲行之却當隨宜設斛食度沉魂不拘多寡隨力建功則破嶽一節行之無兼矣蓋無量苦爽沉迷有無一念既差終墮其獄若非祈天請命行符破幽何由解脫故當按法行之九獄牌東方幽冥風雷地獄南方幽隂火翳地獄西方幽夜金剛地獄北方幽酆溟泠地獄東北幽都鑊湯地獄東南幽治銅柱地獄西南幽關屠割地獄西北幽府火車地獄中央幽光普掠地獄總九獄圖玉清蕩滌血湖大符告文靈寶玄壇令月日恭奉元皇勑命頒降玉清蕩滌血湖大符覃宥罪魂須至告下者符右奉靈寶符命普濟幽塗告下翻體大神擲尸神王食心啖腦神王牛頭獄卒牢檻冥官仰遵符命拔度某亡魂洎無間血湖産亡罪衆出離幽暗覩見光明免滯血湖錬質澄神徑上南宫仙化成人一如告命年歲次月日時告下具法位臣姓某承誥奉行方函式玉清靈寶蕩滌血湖符命告下無間血湖大小鐵圍諸獄冥官具法位臣某謹封勑呪元始符命普濟幽塗靈寶內篆度脫血湖神清保護徑上南都急急如元皇上帝律令髙功執符宣祝呪大慈二真人能救産死苦放光照世間地獄悉停住刀山髙巍巍鑊湯飛炎炎至心念真文罪魂宿𡨚解晝夜心不離解脫全爾身歸心發回向同上七寶林急急如元皇上帝律令師澄心存一氣透玄關上升泥九為元始天尊頂出寶光流布符篆照破幽獄拔度苦魂書符行持不出於此救軍陳傷亡之符九符並中黃氣玉文救遭刑犯法之符救劫盜傷殘之符救墮胎落子之符救惡疾血光之符救母喪子存之符救子喪母存之符救已産俱亡之符救未産俱亡之符總祝呪靈寶玉書拔度真符流光普照蕩滌穢軀天符告下徑上南都急急如元始上帝律令右九符兼流光符九道各獄焚之血湖圖師曰大鐵圍山之南有硤山石獄其形皆黑旁有火焰下有血湖在東南一石問上大下尖中間一縫罪人皆出入自有百藥毒汁灌其身心獄號血湖産罪婦人億劫沉墮苦不可勝穢惡之甚獄中有百萬鬼卒晝夜拷掠乃翻體大神擲尸大神食心啖腦鬼王之類也血湖圖産死獄法以前血湖九獄形鋪之燈幡見橋蓋門靈寶玉鑑卷之三十
