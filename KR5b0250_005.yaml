front:
  text: 靈寶玉鑑卷之五賴六
  hash: sha256:db664bf474590a2c2e904d984784f67b4344df43d76717cd7fa3a81d6de87a71
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_005-001a, image: hfl/0303/0303-004.png}
body:
  text: 靈幡寶篕門命魔靈幡告文元始玉勑真符命魔奔火前道通開合虛三皇欽從威制群魔告命篆文右用綵製幡長七尺立於壇中遇命魔之時令一童子執幡引導法師旋繞行道或有寶幢相對以全幡幢導引之義也鍊度水池幡背書譯文天河東井君右皂絹為幡長七尺粉書符立于水盆側錬度火沼幡背書譯文朱陵火府君右用緋絹為之立於火沼之側披黃受道幡幡背書後符前符下書受度某人成真右幡用黃絹製造長七尺凡於鍊度之時於文錬既濟之後焚去魂幡易以此幡即披黃受適也火鍊變仙幡符右幡如前式用紅絹七尺造之書前符于肚中下半截寫錬度某人魂神成仙兩手分書死魂受鍊仙化成人生身受度劫劫長存開導幡符譯文六甲使者持幡開導空洞通幽呪符幡每首分書二句譯文靈音振空洞九玄離幽裔感爽無凝滯去留如解帶右幡用黃絹七尺製之斛前救苦幡四首如前式金書度魂呪每首幡書一句譯文妙戒怡五靈金書警萬神察命定録籍靈符度苦魂右幡黃絹製四首各長三尺度橋陽暉幡如前陽暉符呪譯文明哉太陽暉神光洞三清氣散玄漠內靈煙生紫庭控御乘風霞飄飄凌無形返根呪符譯文明梵飛玄景開度長夜魂遊爽赴期歸氣氣這故根右幡用黃絹長二丈四尺幡身書陽暉呪兩手分書故根呪背書飛升太空天尊號立於升仙橋前九錬天尊幡符幡如前式錬度壇中用十方救苦天尊符九幽拔罪天尊符朱陵度命天尊符轉輪聖王天尊符法橋大度天尊符火鍊丹界天尊符金闕化身天尊符逍遙快樂天尊符寶華圓滿天尊符玉文祖氣呪曰九氣錬神三景合成生神火鍊返復歸真急急奉玉清勑右九幡用黃絹製之篆符于中一面書天尊號於錬度壇上列之五方五靈童子幡東方幡身符東方青靈童子南方符南方丹靈童子西方符西方浩靈童子北方符北方五靈童子中央符中央黃靈童子右幡用黃絹製五首書各方符於肚中符下書各方童子燈幡一宗諸獄燈符並見朋明幽暗門幡如前式開通五路燈幡符東方符卯文青氣南方符午文紅氣西方符酉文白氣北方符子文黑氣中央符中文祖氣右符篆於幡上下截書天尊號大慈接引天尊開通道路天尊靈光普化天尊神威廣攝天尊隨方救苦天尊九天燈幡一陽混溟𤥭瑝之氣符子文北氣右誦鬱單旡量天生神章祝之呪曰一陽生形幽壑開明四象合體分配五行急急如律令二陽泛華紫微之氣符丑文艮氣右誦上上禪善旡量壽天生神章祝之呪曰二陽育質會合五神靈帝合輝玉女侍形三陽天婁鳯車之氣符寅文震氣右誦梵監須延天生神章祝之呪曰三陽受仙受福東華金門離合披闡四和紫戶胎光三秀鬱羅四陽中女辟邪之氣符卯文巽氣右誦寂然兜術天生神章祝之呪曰四陽蒼臺赤帝丹靈葆仙虹影勑拔命神五陽太至微延之氣符辰文南氣右誦波羅尼密不驕樂天生神章祝之呪曰五陽玉華太皇重寧公子執符太乙命靈金童鼓吹鳯嘯龍吟六陽化真白灝之氣符已文坤氣右誦洞玄化應聲天生神章祝之呪曰六陽鍊真造化玄元白氣灌溉死户生根七陽絳實紫光之氣符北文午氣右誦靈化梵輔天生神章祝之呪曰七陽運布平會百川身度始青返胎朱庭急急如律令八陽天真命仙之氣符未文北氣右誦髙虛清明天生神章祝之呪曰八陽爍爏形合精延內外瑩潔外身身存九陽太皇寂玄之氣符五指甲太陽氣右誦旡想旡結旡愛天生神章祝之呪曰九陽九氣雲騰露凝結秀黃華冠帶流金帝霄玄玄離合上清急急如九天上帝律令右幡如式造九首幡身書各天符符下書九天寶號九巵燈幡天尊聖號三光錬度天尊太光廣照天尊重光返照天尊寶光虛靖天尊流光梵現天尊三光朗元天尊道光智神天尊金光玉華天尊慈光普施天尊九獄幡符東方華林淨境之符用卯文東氣呪曰九氣青華光耀風雷玉寶慈尊戟毀戈摧扶晨通照魂升太微神識受度享福無期南方丹天真老之符用午文南氣呪曰三氣丹華光徹火翳萬福慈尊蠲消火池化成青圃甘涼瑩肌苦魂承思逍遙無為西方金光法寶之符用酉文西氣呪曰七氣素華照耀金剛太妙慈尊摧鋒毀芒刀化騫林劔變扶桑魂魄受錬與日同光北方定真救苦之符用子文北氣呪曰五氣蒼華光徹溟泠王晨慈尊冰消雪城溫生寒廓毒汁清澄魂獲妙果飛升王京東北方長樂妙音之符呪曰梵氣晨華徹照鑊湯度仙慈尊威感無方沸湧停息化為寶漿亡爽生神徑升天堂東南方碧霞真寂之符呪曰生氣之華下照幽關好生慈尊普濟無門沛灑法兩銅柱停酸苦魂解脫升度南丹西南方耀真瓊光之符呪曰黃華月耀透降坤維盧皇慈尊保度浮黎靈晶洞徹屠割停威罪魂登蘇劫仞携持西北方妙道濟苦之符呪曰天光景色祥華敷光無量慈尊除釋鋒芒火車摧毀塗炭消亡亡魂快樂上生福堂中央無欲妙行之符呪曰名光金真流精降輝真皇慈尊廣度無遺普掠幽牢悉變成灰魂升仙都受福巍巍總勑呪三晨慧光錬魄度魂幽𡨋夜壑咸覩光輝鐵城摧毀獄卒停刑陽精赫赫隂翳煥明隂陽交會空洞混元三清玉勑曲赦苦因一如告命曲水重泉急急如律令右符下各按方位書十方救苦天尊號王寶皇上天尊玄真萬福天尊太妙至極天尊玄上玉晨天尊賴六十八度仙上聖天尊好生度命天尊太靈虛皇天尊無量太華天尊玉虛明皇天尊真皇洞神天尊靈寶玉鑑卷之五
