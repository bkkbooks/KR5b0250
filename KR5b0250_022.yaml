front:
  text: 靈寶玉鑑卷之二十四萬八
  hash: sha256:b6501e75e45a4f38268bb5bb7ed316567188f004f5f331b5a7dcb5381a49230c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_022-001a, image: hfl/0307/0307-072.png}
body:
  text: 告給符籙門太上混洞赤文寶章呪曰元始開運太玄肇靈虛極無象一氣流形化生二景五緯凝精混合自然怛除結嬰總真布氣煥赫九清炎持廓奕七紀齊并祈師盧浩丹天耀晶朱火錬度赤靄散明三華鬱秀輝映帝晨告混洞赤文式靈寶大法司令月日恭奉道旨頒降赤文超度亡魂上生天堂者書天篆混沌赤文右奉太上混洞赤文寶章普告十方三界五嶽九幽開光長夜超度亡魂徑升梵行之天不墮重隂之地赤文煥發風火無停一如告命年歲次月日告下具法位臣姓某承誥奉行玉清上相大羅無極神公在天右三誥並用方封於三日午朝各告一道依典告下亦可給付玄師曰太極妙化神靈混洞赤文章書天真皇人降玉隆騰勝天授虛皇天尊靈寶大法謂東華上卿洞神大夫領下元生籍左官及諸仙官曰九霄總梵八帝治天非混洞赤文不能攝化九陽而明天度是以神霄玉清虛皇天泛上靈景華九陽清真虛梵之氣而成天境丹霄南極玉文天泛丹靈妙宰洞陽景真元梵之氣而成天境碧霄太虛真極天泛廣靈太華上陽元真靈一之氣而成天境玉霄玉靈素華天泛玉靈素華純陽至真元一之氣而成天境太霄太虛真元天泛太靈洞華三陽九真太一之氣而成天境琅霄素靈皓元天泛素靈皓華六陽洞真至一之氣而成天境紫霄玄靈上極天泛元靈紫華清陽妙真天一之氣而成天境景霄妙靈寶華天泛妙靈寶華景陽精真虛一之氣而成天境青霄玉華無極天泛青靈玉華元陽天真純一之氣而成天境赤文化混洞混洞化彌羅總天元九氣之道下復九因至八梵真言亦此文之化也是以大丹田內有帝宫宛利城棄賢世界梵寶丹靈赤帝君所治中有朱陵之府流火之庭火炎之宫赤明之館丹丘火池元始天尊錬真文之所化梵也天中中下二真由不能得此吾以此文混沌梵元圖並付之於汝此去六天運亨壬辰合度庚子政化自然敷露其諸祕妙符文應皆莫可測矣天官玉簡亥文西北氣書符呪玉虛九天九日道乾九霄祖氣萬範開張明氣四騫緑羅大千洞妙自然罪爽咸原執符把籙總監上天普受開度死魂生身告文靈寶符命天官玉簡告下天官三府曹局主罪録仙官天帝北獄考吏執罰神祇救度某神魂出離天獄赦除大罪得升梵氣之天不墮重隂之地主者敬聽一如告命年歲次月日時告下簡袋式地官玉簡已文東南氣書符呪風澤洞虛金剛乘天羅酆九地罪爽咸原太上勑命解釋𡨚愆斬絶地根時刻升遷拔出地户名列太玄根原本始一時生神告文靈寶符命地官玉簡告下中元清泠三府洞陽左宗天宫九幽泉曲嶽獄冥司主生死罪録靈官四十二曹考司典吏案掾尊神拔度某神魂拔出地户永免幽囚乘沐陽光徑生妙樂承此靈寶符命拔度功德上生天堂一如告命年歲次月日時告下簡袋式水官玉簡申文西南氣書符呪華陽真一太和妙慧天河東井靈泉蕩穢北都泉曲九幽主吏咸承勑赦開關啓閉告文靈寶符命水官玉簡告下下元暘谷洞源三府清泠左南水官酆都劫掠泉曲河伯水獄冥司主生死罪録靈官四十二曹考司典吏案掾尊神拔度某神魂永辭北都寒池泉曲苦海溟波沐覩恩光徑生陽界乘此靈寶符命功德上生玄天一如告命年歲次月日時告下簡袋式九幽白簡子文南氣書符呪靈寶大法洞真九元梵陽之氣赤明之天始青碧落離合自然六陽純化九日道乾元始真王降勑咸原九壘遵承察命定仙九真妙應歸命天尊靈寶度命時刻升遷告文靈寶符命九幽白簡告下羅酆北府嶽瀆九幽長夜冥曹土皇九壘十宫案掾獄吏考官六洞隂魔九宫主者溟泠大神拔度某神魂銷平𡨚對洗滌深愆得離三塗永辭五苦身超丹闕得覩陽光悟道聞經逍遙真境乘此白簡救度功德上生天堂一如告命年歲次月日時告下簡袋式九幽玉簡玉文中氣書符呪日慧之光月慧之光星慧之光三光之氣錬魄度魂幽冥夜壑咸覩輝光鐵城摧毀獄卒停刑陽精烜赫隂翳煥明隂陽合會空洞混元三清上帝九幽咸原曲赦苦囚速出重泉告文太上玉簡九幽符命告下羅酆九壘五嶽重幽掾吏考官冥司典吏牛頭獄卒監牢大神拔度某神魂永辭長夜出離九幽得覩慈光心神明了證品仙階𡨚仇和釋上生大有之天一如告命年歲次月日時告下簡袋式神霄金簡兊文西北氣書符曰明梵玄景開度窮魂隂陽交象火鍊成人大帝陽堂號八靈君魂生攝氣九轉成仙天氣歸身混合百神九門祿道胎氣上玄得證無為身騰紫雲告文神霄金簡宣告獄官司禁執法典録刑司開度某神魂錬魄澄神升入玄關削落罪書道備功圓上生神霄髙上之天真境無為逍遙自然一如告命年歲次月日告下簡袋式神霄玉簡辰文東南氣書符呪玉簡金書普告幽冥苦魂滯魄即得更生八門通關無影無形三景自然敷落成真魂升金闕遊冥玉京幽關治獄咸沐光明告文神霄玉簡三天符命上開八門三十六獄執法治官徑詣帝軒解宥宿罪開度某神魂上升神霄玉闕之天復還治職悟入玄玄一如告命年歲次月日時告下簡袋式上元三天玉簡玉清訣上天氣書符呪三氣凝煙明氣四騫億曽萬祖苦爽幽魂運應滅度身經太隂普受開度便得神仙罪福禁戒宿命因緣魂神超度徑上丹天疾除罪簿時刻升遷鍊魂九陽與天齊年告文三天白簡玉清玉符告聞神霄髙上之天左右獄卒案掾尊神天獄主者執罰治官超度某神魂消滅大罪遏塞邪源形神升度謁帝天關福智自生𩥵侍龍轅真道長存一如告命年歲次月日時告下簡袋式中元九天寶誥金書丹篆中文神霄氣告文上帝玉府九天紫府內音宣告三官九府百二十曹天牢地獄主司大神超度某神魂咸領符命部衛形魂上朝帝庭罪愆和釋𡨚債消沉與道合真神登金闕受錬長存一如告命年歲次月日時告下簡袋式下元登真度命出離生死真符神霄氣訣書符呪赤文命靈度命幽冥三天赦宥遍告幽扃死魂乘化出離死生斬絶死户東井錬形天慈玉勑罔不欽承三台炳耀六氣齊并九幽隂翳盡覩光明得離五道風火無停超登天堂得證仙真呪曰結空成梵真氣自生赤書玉字八威龍文保制劫運使天長存真符告下滯魄超升告文下元登真度命出離生死真符玉清赤書上通紫庭天慈赦宥三界冥獄九幽罪魂超度亡過某神魂億曽萬祖苦爽幽精消除罪籍落滅惡根速赴生方氣識間寧上登天堂澄質錬真心神洞明蕩除隂翳入道登真一如告命年歲次月日時告下簡袋式元始上帝削死上生真符書符呪元始上帝降勑玉晨罪消北府名上南宫死魂受錬仙化成人生身受度仙道潛通上生削死升入無形告文元始符命赦罪宥愆亡過某神魂解仇釋結削死上生刋名金簡位列玉階真光接引慈惠敷開金蓮捧步紫氣開關三變九錬易容反顔三天魔王保舉制仙真心洞明福慧自生驂侍龍轅受氣長存一如告命年歲次月日時告下簡袋式神霄玉篆雷文神霄氣訣告文髙上真王玉清寶籙玉篆雷文普告南昌上宫韓君丈人注算真君酆都冥關諸治典吏錬度某神魂消滅罪戾開泰泉扃蕩除塵翳調理隂陽制魔保舉度品南宫死魂受錬仙化成人永離三塗五苦八難超淩三界逍遙上清一如告命年歲次月日時告下簡袋式靈寶玉鑑卷之二十四
