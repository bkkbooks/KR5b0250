front:
  text: 靈寶玉鑑卷之十八萬二
  hash: sha256:d893d4b67cf38c41daf37e4ec76d540089800bc5ccac0a87561a6071cdb2a2c6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_016-001a, image: hfl/0305/0305-223.png}
body:
  text: 飛神謁帝門九靈飛步章奏法謹按南極司命上真元君魏夫人傳晉代前女官祭酒正一天師張君受太清請官儀及入靖法又自漢世流傳千二百官儀事目相應宜當承用及琅函所載正一章科赤松寶籙玉曆表裏符契為於成法自唐朝廣成子杜先生集次宣慈章本之後兵火散失鮮有完本今應有所上章表並無定式近緣末學庸妄虛加損益不堪承用況官曹差舛格式非真奏御失於所詣存拜不合玄理非慮齊官心不正誠最苦上士難得設或拜章猶如投空招譴獲考盡可嘆傷是故探頥索隱參考靈文刪繁取要約省歸源集次成文輔翼五元玉册贊化訓教學真濟度存亡其九靈之㫖别受真儀如太清入靖口啓之類非凡材所能究也其式通真逹靈神飛玉陛仙官未必範用然三洞道士祭酒學子豈可忽諸玄奧祕筌覩文心悟切宜詳悉愼勿輕泄授受之者當奏三天以金環九雙青羅九十尺告誓以付一生不得三傳違者身死家亡可不戒之三洞玄科三十條師為百姓上章不得放縱文書留滯人間悉收斂録一年之事皆應對道民不合録也章案長一尺五寸闊一尺髙八寸曲腳柏木造之章函長一尺二寸方闊四寸閏月加一寸用法師中指中節為度不可用膠函下開竅上章别取香火不得用竈中柴炭火灰也上仰謝章法北向舉家大小散髮交手請乞章也奏章應用曲腳案過餘凳不合用上章則不神御奏章函應印封題是法過餘不合奏也上章之時醮官家不得歷亂髙聲雞犬驚吠使神氣不安章不上御師為醮官上章宜有法信併功德𧵥物功德惟願疾病損瘥所事解散觸徒蒙恩之日可受儀信𧵥物犯者比竊盜同坐六刑科論責輪瓦三千合師執事上章救病百姓度厄若人民急疾來告安然在家詐為不在或許者不赴急病犯者考病十日香火應有凳檠長二尺四寸廣一尺六寸髙二尺四寸庶過章案也書章紙皆當精潔不得穿破裁截後餘無三三行如不及者以全紙集之不爾合止章上細字長寸二分出四分亦不合上細字謂太清銜上章為醮官首罪或有隂私密事上章乞便於靖中對燒章詞不得後日宣傳罪事告於他人發人隂司罪莫大也上章不問大小露章及室中者皆三日停章不得即舉案毀座席急章有所疑者即燒也上章靖中上者東向若有應露者皆北向三㑹日社日不得上章奏啓常行書有急疾三八謝太陽者不禁冬至前三日後三日不得上常行文書章書有急切者不禁戊戌戊辰二日不得妄入靖若是月半三㑹皆不朝三㑹别有遷日章是詞節社曰合上不合三㑹三日應言功其日有事故不得上者後日追上不闕也籙生自拜章口啓有所說者受恩自言功德輔送本師留也本師逺輔送常為所近也師上章不得食羊飲酒口臭入靖奪功三千等吏兵還天曹百曰汝曹空奏御不聞進不得於病人家飲酒百鬼藏入人身救病不瘥拜奏不御上章之師見之疾病當救濟其命或先於與讎恨願其死者返受其殃弟子為師奏上章頭此日是言臣所奉法師某甲也弟子為師奏章家有疾病急疾者當退席請乞勿顧耳便止無有急疾不用也書章清淨筆硯以章案擎儀然後可治勿以羅身及放著牀上章奏不聞勞損失功也醮官上章法皆燒香入齊室禮拜請之乞自陳不得徑持章入靖無所關啓如投水也太上露星章法皆燒香入靖請香官使者香爐出庭不得便徑入靖取出無所關啓真官故在靖中空持香爐出永無侍衛魔鬼干章萬神勞損徒失紙墨别無請迎儀也上露章有燈燈皆有斗斗並有魁罡交罡時愼當罡破星不當之不易教人始學愼之醮官對章皆北向有急疾者徒步散髮自摶無者不用也玄都皆有宫曹各各有典者道士章奏脫有達聞者而所作錯越迷失道真領次謬誤不合天科則為典曹所却事不上御肉人無知空心相委㑹言巳達事敗之後謂道之無靈不言所失在於道士者真為痛哉若合科令不犯者所治無不愈所救無不活也書章法則章紙髙準一尺九分或小尺一尺二寸或一尺四寸為則每幅一十二行或云九行每行一十七字或云過幅亦一行每行闊一寸二分或二寸四分正一法止讓八字泰玄都銜位前控一字約兩行古法不挂或三行上合三才陽數第一行書盡法位至再拜上言上控八分下通走蟻法位髙上言一字書言語契勘下語簡正姓名只作一字書不許折破如雙名某氏幾娘之類臣字不為頭鬼字不首不得懸生露死魂魄之字喪亡之類並須回避不令上頭以聞去再拜下一寸書下窮者别作一行修真旨要同此蔡致虛儀以聞低告報二字書以聞後控三行書臣姓臣姓後控三行書太清階太清階後控三行書太歲臣姓名與太歲平頭低上言下二寸四分書太歲一行隨字均書令到行末首尾約控紙行少則添紙一幅太清階五十六字緊疊細字上度三寸六分中度四寸五分下度五寸不得過此此乃出赤松子歷古科四十八字三寸書之若修真㫖要只去金闕七寶四字亦是五十四字既不同宜考寫章不隔日填陛下不隔時古法填太清不隔時陛下二字如太清階一同細書直作一行或云細書陛下二字然玉陛下本是義不可分拆若獨細書此二字頗似未穩且五鍊生尸經黃繒章法及張杜二儀亦不論此今只作一行細書書心章式科曰凡心章止許奏啓事不得繁語務有詞達正奏虛無自然玉闕法以黃素長一尺二寸髙三寸六分研朱密字細書上約控三分下控一分行數不拘章前虛紙用黃神印後用越章印以可漏封之不用方函拜時存用依朝元法第一次奏有章欲拜第二次奉捧章口述內意第三次存天尊處分章意事焚時以靈寶心呪燒大香爐中此章急切奏告不及一時立有玄報非功之士不可拜奏某年某月某朔某日某時謹齊沐誠惶誠恐再拜上言臣伏據入事謹用左右龍虎君侍香金童傳言玉女香官使者三氣正神促氣功曹飛章從事又法式科曰心章皆依太清章式長五寸六分高三寸二分此以隂陽中指中節一行一十七字一張不得一十二行玉清上清並黃素朱書惟太清以墨書急速朱書其事並以三等玉清用飛玄三氣玉章印上清用太上三天印九靈飛步奏印太清印黃神越章印不以是何急速但實封不用方函其上章片時立有玄報具位臣姓某誠惶誠恐稽首再拜上言臣伏據入事謹為伏地拜急速飛玄三氣心章一通上詣三天某天曹謹為上請甲乙云次為謹因二官直使正一功曹左右官使者隂陽神決吏科車赤符吏剛風騎置吏驛馬上章吏飛龍驛吏五帝玉童玉女五帝飛天神王三十二天傳言奏事吏十天承受玉女三五功曹侍香金童傳言玉矣玉帝直符直日香宫各二人出臣為弟子某上章上詣某天曹宫伏須告報以聞臣某告報之下去以聞三行太歲某云正一章用印式科曰太清正一之道乃玄元後聖付正一天師有拜章之儀用九老仙都印以太清同生八老尊是太上為師故弟子上聞於師故用九老仙都印又用十二小印自太玄都至太歲後背皆印之有一家有沿如印式有一家不用沿如符式所當推考洞真章科曰洞真之品玉清之道出於晉永和間三茅二許楊郭七真傳降無章奏之格洞玄章用印式科曰洞玄之道靈寶之教自三皇之世其教已出元有章奏之格出五錬生尸經五老本行經與正章法不同若行洞玄之科則章中前後皆空紙悉依式書符只於年月日上用通章印而巳以玉晨為元始天尊弟子故以此印通誠祖師也非此法籙不得僣用其印文神霄籙亦有之或者謂此印𨽻玉清屬洞真部殊不知神霄教未興而洞玄章法自五代以前並用此印也所通章印乃升天大劵但去其下文耳生人用之以為升章入天廷之質證也如給付亡魂則下召魂等事怛升天大劵自古及今昭然屬洞玄部豈𨽻得於洞真今洞玄章法用通章印是靈寶本科或應用而易以他印並考於三官矣黃素朱表式科曰以黃絹一丈二尺輕黃函背過裁髙一尺二寸每行二十四字行闊一寸二分或九分為則若依古法二寸四分為一行恐寫不過量詞多寡為行可也表稱黃素則用生黃絹田先生以柔軟不堪操露令以薄紙背過為妙却朱書髙下尺寸大概皆同章法圓封內外方函亦以黃絹為之亦與章同只不同太清階及逐日官曹治别有成規表後聖位二十四字臨時法師自書約二十四分取盡或作一行細書亦得聖位中無玉字見靈寶真百然經訣書青詞式科曰應青詞須用上等青紙勿令㸃汚穿破如紙薄只以兩幅背之髙一尺二寸只用一幅通前後不過一十七行行密不妨當令後空紙半幅自維字起平頭寫之上控八分下通走蟻研朱細書每行不拘字數但真謹少楷為妙如啓聖後下文不得過一十六句當真述其事務在簡而不華實而不蕪切不見眩文瞻飾繁藻惟質朴為上不得令詞紙飛洛牀席及地上仍不得令衣神等拈拂書詞之時入淨空几案淨巾朱筆口含妙香閉氣書之愼勿口氣衝於詞上寫未畢不得落筆及與人言語仍不許隔日書下臣字不得在頭行內不得拆破人姓名此為書詞之格書畢不用印只以黃紙三寸腰封仍以引進狀褁青詞入方函內發狀紙與詞狀髙低相似可也或稍有違不惟不達返招譴爾此出任仲升齊儀中皇壇節目頗多文亦難省𣸸數行蓋亦無妨但要行密空紙多爾章信論科曰凡奏章先須備信冀質誠心若無信則神功不納責子有慳鄙不捨之心又曰章無的信富者增之貧者添之富貴之家心希功德而慳惜財物只效貧者出信如此無益於事貧寒之士求請章醮師為代出法信舊章雖合所用大抵有之天子王公庶人尊卑不同品名各異不得混亂而無分别科云章信之物散施貧窮宜行隂德師不可全十分為率師可用三分而天條嚴峻可不謹之章一通合用法信物儀紙一百張筆墨硯各一副龍頭書刀一柄刀以古鐵為之柄以銀六錢為之可長六寸柄作龍形科曰削治名籍輒惡奉萬落死上生拜表章用不可缺金魚一放玉鴈一隻朱礎各半兩副章紙一百二十張硾碧紙十二張三官貴青命信綵天子用匹數紫色王公文數本命色士庶尺數用錢繪鎮錢一貫二伯文天子金錢王公銀錢庶人銅錢祿米天子三石六斗王公二石四斗庶人一石二斗鎮油天子一石二斗王公六斗四升庶人一斗二升信香天子全斤王公半斤庶人三兩用沉菚腦子一錢重淨巾二條柴十一束炭五十斤鹽一斤豉一斤青絲三線重黃蠟半斤章函槿木或柏木律木為之長一尺二寸八分方闊二寸八分面上作曲池函面上中下開三印池章案赤松曆云長二尺二寸高八寸曲腳造以柏楠梓木案衣護章綵半天章袱黃道絹金人身代形或銀亦得章架正一書章四十五條令令曰章法前勿留牘便泰玄都第一泰玄都正一平氣係天師某治正一臣某稽首再拜第二上言謹按文書某郡縣鄉里男女年甲紀户名第三思惟太上分别求哀臣愚誠惶誠恐第四安以聞與再拜相去一寸下窮者别牘臣姓平頭第五北牘安臣姓與太歲平頭第六北牘安太清四十八字三寸書之第七北牘安太歲月日時於某郡鄉里中拜上第八後讓三牘三師靈讃若不滿三牘以令紙按之第九書章界紙上讓八分正書中界亦分為法則第十書章法依如上法不妄讓牘界令曰正一道士書章威儀法則當如上件十條令不得妄開讓界造為任意以惑後學品則凡違令者但是自作一法坐此正一道士五刑科論五刑論天治覆屋茆三千束第十一書章以巾於下不得令紙著牀紙亦如法勿令衣拂章書謹之第十二紙墨筆硯必使潔淨不得穢汚雜用第十三書章磨墨左右各四十九回止第十四染筆墨左右轉各七回不得口含筆毫第十五書章不得間論他事交接言語則顯於章第十六硯水當令清澄第十七不得以筆㸃水滴於硯上第十八書章閉口不得有所飲食第十九身經穢汚不得書章第二十當選手中洗手每於清淨第二十一書章不得敗字不成不合者止第二十二章紙不使破裂漏筆第二十三不得令章紙飛落地不堪復用第二十四書章不得仍書飲食葷穢第二十五不得仍書穢汚之事令曰一十五條門下科令書章作令當如其科若觸慢不依令者坐正一道士三刑科論三刑者掃道路橋梁三十日第二十六書章當整理衣服不得祼露第二十七書章當匍匐恭敬不得蹲踞第二十八書章畢先隂讀校一遍第二十九書章脫字皆用白墨雄黃治定之第三十書章不得攙案書字第三十一不得令他人盜讀章文第三十二書章不得預下太清日時臨奏安之第三十三書章道士書細字醮官束帶請章第三十四醮官請章三叩頭三摶頰三起三下合九第三十五醮官對章叩頭至竟當自祝願隨心所道乞病瘥隨事所速第三十六道士奏章竟醮官謝竟叩頭摶頰如初第三十七醮官有病厄急迎師到師前叩摶各三十二止第三十八章書醮官叩頭竟立道士前說疾病急事狀勿坐而言第三十九師至醮官家醮官男女大小並叩摶不得安然第四十醮官請師上章齎信香紙不得就師陳乞第四十一師到醮官家當盡心營治章事不得誤托懈怠第四十二醮官重病當依科列詞𧵥願多少隨貧富第四十三醮官重厄乞𧵥信仰荷蒙恩日即輸送不得逋延第四十四師當隨醮官心依科𧵥願不得副别以輕作重第四十五師奏章當清明不得雜亂穢濁言詞謬錯右二十條違錯謬請者不敬為師不恭致使奏文不達疾病不愈受災不免主人與師並坐三刑科論三刑者掃道路橋梁三十日巳上四十五條出正一書章品門下科令正一書章法式師凡書章表先齊戒沐浴與漱洗滌手面整理衣冠入靖室向天門設座焚香叩齒咽液心無外想以淨中敷案上存青龍白虎朱雀玄武侍衛前後左右次燒香磨墨四十九匝以筆香上熏呪曰叱咄神筆靈靈書章通達臣身長生啓奏玉清衆邪消滅妖精斷絶干犯章者北帝治罪急急如律令以下手寫章上香呪曰臣請天師嗣師系師女師夫人經師籍師功曹使者將軍吏兵隨臣今為某書寫奏章令使上御不得去離母令錯悮急急如律令次下筆念前法則條令至誠書之不得與人言語須當閉氣書未了不得放筆不可令脫落揩改塗注如誤則換紙不得令外人覷視及雞犬等入室對章不得勵聲讀章未畢不得離坐不得令香烟中絶臨書太清細銜控陛下二字遇拜時填之書章之士當須明察勿使筆畫滅裂仍勿擅攺章文凡入齊意取令理順不致斷續書畢勿留穢處當置師前書章之時靈官功曹十二書佐監臨左右功過必録纎悉無遺禁戒威嚴莫越於此愼也封章式科曰凡拜章主人當束帶請章一如正一條令法師臨壇拜章出官畢取章書朝上帝取龍刀開函舒章於案上宣章畢長露太清階封上帝正中以龍刀安太清陛下以金魚玉鴈置太清左右以新筆朱墨硯等置于前置畢存靈官書佐考校章文存畢填陛下二字於香上緊捲套以圓封圓封用全幅𥿄為之併腦子內方函次入木函以青絲三節繫之杭絲頭於池內以蠟滴池中用𥿄印掩之印乃九老仙都印或不用蠟用糊亦得外以青𥿄函重封黃羅袋袋之上方角大書封字次用黃羅袱褁章於案上拜訖焚於章爐中臨壇拜伏行持節次具拜章科書符式玄師曰夫拜章之法乃明皇道君受靈寶天尊祕法默朝三天口奏所告之文非凡人之所聞得遇之者皆三天有名真人之位出入金闕非一品仙官不得行靈寶大法皆不能拜伏章表其罡風世界非靈寶真慧之光不能破之其法當擇庚子之日天色晴爽備香案朝天門雙手搯上帝訣變神為真人之狀先步五行超脫罡用黃羅以雌雄黃和朱砂研書符入於冠履之內并書沐浴解穢吞服諸符書符執筆叩齒存玄元始氣降筆中書畢置於靖室中并章印皆供設於聖前臨事依法用之須先書畫章圖逐日焚香誦呪依朝元法存想令熟第一欲界紫微星天文乃今仰視周天星文霄漢之間也門曰陽精天門神將唐將軍賜名靈君字洞常管一天門奏章上表神吏穆虛巳功曹天輔英童子楊伯華引進丹元輝此皆職於天官之名惟唐將軍守一萬年余職皆舊亦有一萬年一替又太極經云一劫一替也第二色界紫微垣玉晨天乃紫微寶境禹餘七寶紫微宫殿門也門曰洞華天門神曰葛將軍上帝賜名曰靈侯字洞良管二天門奏章上表神將韓全林功曹幽界童子鄧方華引進靈苑道三將軍皆上帝令守之有績者一劫一替第三無色界金闕寥陽天正陽門此上帝之居玉晨大道君治化之别境也太極經云元始化身也玉皇上帝也玉晨亦元始一身化故三境髙晨皆元始一身而分三也所以妙化道推應身萬變非諸人天真所知豈容人心而洞察也天門將軍周將軍上帝賜名靈武字洞景管三天門下曰紫微府呈進詞章上表神將李機青功曹洞清臣童子曹景華引進阮子卿掌上帝符命通違章表遇有功一萬劫一替第一天門天洞靈符契第二天門玉光符契第三天門沖神符契此三天契當以刋而佩之王者金石為之道士木為之以盛絳囊盛之繫於左肘後并印表章之上道士正一盟威科受籙弟子或拜章祈禳國土並當佩三天符契預當存想吞五神符并百靈湯沐浴入室東向誦靈寶上清呪於七日前申狀三天請神將官吏進表上章庶合同得入三天門下至期伏章方獲報應太清號太清玄元無上三天無極大道太上老君太上丈人天帝君九老仙都君九氣丈人百千萬重道氣千二百官君太清金闕玉陛下上清號玉晨道境禹餘天宫元皇髙聖三十二天混沌元祖九天天帝宗師太上玉晨大道君靈寶天尊上清金闕玉陛下玉清號無上大羅天清微宫虛旡自然玄穹至聖萬道之祖五老帝君祖師金闕虛皇上帝元始天尊玉清金闕玉陛下三清總號太上無形無名虛無自然無極大道至真無上玄尊金闕七寶玉陛下章函案封皮等式圓封式用全幅紙不許摺內方函式木函用柏木或梓木長一尺二寸闊四寸閏年加一寸用法師中指中節為度不可用膠函下開函章函底一版分上中下函上函中森羅淨霐函下木函之內合用三函外第三函白函內中第二黃函內第一青函章案式章案用柏木或梓木髙一尺二寸長一尺八寸闊一尺二寸每一邊用足六隻共十二隻閏月加一足案上開北斗七星竅上章沐浴法凡為國為民上章拜表非一日一時所可行之事須於日前調運身心令神氣泰定沐浴七日服五神符誦五神呪七日服太平符七日服通神符遇立夏日伐棗木造丹元君一身如真人狀長三寸廣七分同沐浴入室行持四十九日次服心章符庶通達誠意上合天心元氣自升矣煎浴湯桃皮八兩乳香一兩竹葉一兩茅香一兩柏香四兩木香一兩安息香五錢右銼細以新水五斗五升日日午時吞五神符一道化沐浴淨穢符一道於湯內想太玄玉女乘龍吐水入室沐浴呪曰天地開朗四大為常玄水澡穢辟除不祥雙童守門七真衛房靈津錬濯萬氣混康內外利貞保真上皇五神符上清訣五方氣沉香𣕤湯化服呪曰上元太乙守居泥丸中元司命安坐絳官下元桃康生宫把籍元英公子白元尊神玉符一召五神合并沐浴淨穢符右符念前沐浴𠃔想天漿下注兆身涵錬澡錬體生金光朱書太隂氣訣沐浴畢服太平符右符以燈心棗湯化服想丹元君冥坐絳宮默念三天隱諱泓澄明入十一遍乘三素雲上升玉堂玉帝訣呵氣于身次調息咽津九過五神呪曰餐服神符通達真靈百神混合洞達𠂻情六甲宿衛淵淵澄澄五行元氣杳杳冥冥混沌未始萬物無形性真所覺聞聲知名天地神經號曰開心玄理開悟服之太平達之自然飛升紫庭急急如律令師人室行持焚香面東存五色雲氣之中青龍白虎朱雀玄武中黃頭上左右日月雷霆海嶽六甲六丁市澆內外次凝神泰定諸緣皆盡表裏洞明叩齒錬津三十六度精思妙化心合太虛一念所通上朝三境一切事理隨意感孚次服通神符朱書黃上玉清訣天門氣想五氣上朝三境一靈洞照十方丹元君呪曰心中神丹元君長三寸廣七分著朱衣繫絳裙秉威德顯至靈通造化逹玄真下心中莫離身外有急事疾來告人急急如紫庭帝君律令造丹元君如前法同沐洛人室師服心章符心章符西北氣玉清訣右符作小樣以春青夏紅秋白冬黑𥿄書之向旺方以香火化含於舌上仰面於東方引青氣九息次仰看天上引紅光三息次俯伏地上引黃氣五息三色混同在口成燦爛之光如日次以香湯吞下與丹元君混合為一祭丹元君乃自己之元神元皇分身降氣下入身中即為本命主用素食茶酒果於元辰本命之日置於淨室存三人揖讓坐呪曰丹元守虛內外俱真左右三七助吾身形急急如元陽主者律令呪畢收坐金錢仙鶴各一分祭訖想自巳左右帶劒持斧或流金火鈴法師行則見其在前止即在後坐則在左右百日中可見赤子侍衛于左右如怒則逺於人也合明符書符呪心與神合神與氣合氣與真合隂與陽合陽同日耀隂同月曜三天運明斡旋造化帝真合靈洞逹杳冥如日之升回轉無垠呪曰合明天帝日月光明攝神收鬼真氣流行五神持劒六甲隨行童子引導玉女通靈神仙輔佐所作皆成敢有不至上奏帝君天帝使者出幽入冥攝神召鬼速使現形天帝護我不恐不驚三台照耀魂魄安寧玉皇有勑賜我長生急急如律令格曰此合明符可役使百神拘魂制魄朝謁帝真拜章時出官了行持捧章步罡了誦前呪焚於主爐中靈寶玉鑑卷之十八
