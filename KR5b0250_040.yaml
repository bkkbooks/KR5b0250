front:
  text: 靈寶玉鑑卷之四十二蓋八
  hash: sha256:c493c0de171e458500913bd1baabe9bf14bdb9ef54868f13dd2cb102aba5c1d8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_040-001a, image: hfl/0311/0311-049.png}
body:
  text: 鍊度更生門隂尸九錬生神玉符師曰此符乃髙上空洞混沌九天元父道君降而結為雲篆付九天金籙無量壽生神尊君行之以鍊隂尸也此符九氣齊并日月合明百骸流火更無隂滓自然仙化成人矣此符用黃素朱書粘於表前上奏九天故得九天稱慶太一執符帝君品命主録勒籍司命定算五帝監生欎單無量天符子文掐九霄訣取九霄正氣書符呪三才肇分九曜順行心王虛寂陽滿隂盈神光下映救苦幽隂自然合道日月同明右符存帝真胞命無元一黃演之氣蒼色下入胞元使胞元宣通帝諱𩃇上上禪善無量壽天符丑之書符呪道本澄廓運化隂陽合真悟道了心無心右符存洞冥紫户之氣下入胎元使胎結解根帝諱𩃇梵監須延天符寅文書符呪等觀應化靈寶玄光照徹諸天三十二帝興隆教化救度存亡丹禁靈符盡獲更生右符存長靈明仙之氣青色下繼三魂使魂門鍊仙以逹靈帝諱寂然兜術天符卯文書符呪靈符火鍊百骸自飛氣變明陽神造玄微九天化度天地皆歸右符存魄命元碭尸冥演由之氣緑色下纒七魄使魄尸開關天王降仙以安寧帝諱波羅尼密不驕樂天符辰文書符呪三氣勃煙日中真精魄返魂超天清地寧右符存五仙中靈之氣黃色下纒五臟使臟腑淸涼帝諱𩅺霍洞玄化應聲天符巳文書符呪三變九鍊易容返顔體合玄光永享長生右符存髙真沖融之氣白色下纒六府使胃管生津帝諱靈化梵輔天符午大書符呪梵上玄邈幽微禦金飛步雲霄逹爽倩存受氣玄玄俱守黃庭右符存髙仙洞笈之氣紫色下纒七竅使七竅開聰帝諱霧𩅺髙虛淸明天符未文書符呪三陽煥發七氣成真五行俱備合鎮丹臺日月同輝包光芒垂右符存真靈化凝之氣碧色下纒三部使三部八景整具形神帝諱霐無想元結無愛天符中文書符呪玄黃應運氣貫天中至妙真靈匹配元宗右符存自然玄照之氣黑色下纒三關五臟六腑九官根原本始一時生神帝諱靈生神九章符止是口誦九章手攥九符自然合妙不必泥於旁曲欎單無量天魂精祕音內諱玉佩開明上符混合空洞氣飛爽浮幽寥延康無期劫渺渺離本條苦魂沉九夜乘晨希陽翹大有通玄户欎單降神霄黃雲凝靈府隂陽氣象交胞元結長命惡根應化消桃康合精延二帝秀玉飄灌溉胞命門精練神不凋九天命靈章生神神自超元君遏死路司馬誦洞謡一唱萬真和九遍諸天朝稽首恭劫年慶此榮舊苖右謹上請帝真胞命元元一黃演之氣九重為亡過某纒其胞元宣通上徹於天以生成一如告命風火驛傳年歲次月日時告下具法位臣姓某告行上上禪善無量壽天魂精祕音內諱玉佩開明上符無量結紫户氣尊天中王開度飛玄爽凝化輪空洞故根離昔愛緣本思舊宗幽夜淪遐劫對盡大運通帝真始明精號曰字元陽嬰兒史伯華結胎守黃房斬根斷死户熙頥養嬰童禪善導靈氣玄哺飛天芳華景秀玉質精練自成容務玄育尚生羅列備明堂太虛感靈會命我生神章一唱動九玄二誦天地通混合自相和九遍成人功大聖慶元吉散花禮太空諸天並歡恱一切稽首恭右謹上請帝真胎命元洞冥紫户之氣九重為亡過某纒其胎使胎結解根下響於地以固靈一如告命風火驛傳年歲次月日時告下具法位臣姓某告行梵監須延天魂精祕音內諱玉佩開明上符須延總三雲玄元始氣分落落大梵布華景翠玉尊明梵飛玄景開度長夜魂遊爽赴期歸氣氣返故根大帝號陽堂字曰八靈君九關回祿道胎氣生上元陵梵度命籍太一輔精延泥丸敷帝席三部八景分魂生攝遊氣九轉自成仙琅琅九天音玉章生萬神三遍列正位氣參八辰門玄關遏死户靈鎮津液源應會感靈數明道潛回輪慶此嬰兒蛻稽首讃洞文右謹上請帝真魂命元長靈明仙之氣九重為亡過某纒其三魂使魂門通神以達靈一如告命風火驛傳年歲次月日時告下具法位臣姓某告行寂然兜術天魂精祕音內諱玉佩開明上符寂然無色宗兜術抗大羅靈化四景分萬條翠朱霞遊魄不顧反一逝洞群魔神公攝遊氣飄飄練素華榮秀椿劫期乘運應靈圖空洞生神章瓊音逸九霞一唱萬真會騫爽合成家九轉景靈備𣡡欎曜玉葩兜術開大有一慶享祚多上聖回帝駕嬰兒歘以歌不勝良晨會一切稽首和右謹上請帝真魄命元碭尸冥演由之氣九重為亡過某纒其七魄使魄户閉關天王降仙以安寧一如告命風火驛傳年歲次月日時告下具法位臣姓某告行波羅尼密不驕樂天魂精祕音內諱玉佩開明上符翻翻五帝駕飄飄玄上門遊步黃華野回靈驕樂端採集飛空景舊爽多不存太微回黃旗無英命靈幡攝召長夜府開度受生魂公子輔黃寧總録具形神玉章洞幽虛五轉天地分氣練元臟腑紫户自生仙數周衆真會啓陽應感繁玉女灌五香聖母慶萬年三界並歡樂稽首禮天尊右謹上請帝真臟腑命元五仙中靈之氣九重奉為亡過某纒其五臟使五臟清和五帝朝真以存神一如告命風火驛傳年歲次月日時告下具法位臣姓某告行洞元化應聲天魂精袐音內諱玉佩開明上符應聲無色界霄映冠十方回化輪無影冥期趣道場靈駕不待轡朗然生神章空洞諒無崖玄爽亦為強練胎返本𥘉長乘飛玄梁蘄畜喪天真散思候履常斬伐胞樹滯心遊超上京願會既玄玄悟我理兼忘介福九天端交禮地辰良混化歸元一髙結元始正稽首儔靈運長謝囂塵張右謹上請帝真靈府命元高真沖融之氣九重奉為亡過某纒其六腑使胃脘生津以納靈一如告命風火驛傳年歲次月日時告下具法位臣姓某告行靈化梵輔天魂精祕音內諱玉佩開明上符玄會統無崖混氣歸梵輔務猷運靈化潛推無寒暑乘數構貞條振袂拂輕羽瓊房有妙韻泛登高神所圓輪無停映真仙參列序上上霄衢邈洞元深萬巨秀葉翳翠霞停蔭清泠渚遨玩怡五神繁想嘯明侣五難緣理去沖心自怡處爽魂隨本根亹亹空中佇七誦重關開豁滯非神武運通由中發髙唱稽首舉右謹上請帝真元府命元髙仙洞笈之氣九重奉為亡過某纒其七竅使孔竅開聰星辰朗明以開通一如告命風火驛傳年歲次月日時告下具法位臣姓某告行髙虛清明天魂精祕音內諱玉佩開明上符清明重霄上合期慶雲際玉章散沖心孤景要靈會煥落景霞布神襟靡不邁玉條流逸響從容虛妙話靈音振空洞九玄離幽裔感爽無凝滯去留如解帶明識生神章髙遊無終敗玄景曜雲衢迹超神方外應感無方圓聊以運四大研心稽首誦衆聖共稱快右謹上請帝真華府命元真靈化凝之氣九重奉為亡過某纒其八景使三部八景整具形神幽夜開光以防身一如告命風火驛傳年歲次月日時告下具法位臣姓某告行無想無結無愛天魂精祕音內諱玉佩開明上符無結固無情玄玄虛中澄輪化無方序數來亦巨乘誰云無色平峩峩多立陵冥心縱一往髙期淸神徵良遇非年歲劫數安可稱浮爽緣故條返胎自有恆靈感洞太虛飛步霄上冰津趣鼓萬流潛凝真神登無愛故無憂髙觀稽首升右謹上請帝真神府命元自然玄照之氣九重奉為亡過某纒其身使三關五臟六腑九宮金樓玉室十二重門紫户玉閣三萬六千關節根源本始一時生神令神布氣滿聲尚神具三界舉名五帝友别諸天下臨以得其生一如告命風火驛傳年歲次月日時告下具法位臣姓某告行九氣生神符九道並神霄文祖氣九章函上用混元生胞符並用青紙朱書勑呪真王大帝勑下九天火錬胞神天一含生太光俱照滯魄易形急急如九天帝君勑錬胎成形符勑呪九天真宰元符錬胎火降帝勑鬼群出離天真皇人速降威靈生尸生影觸向利貞魂門錬仙符勑呪司馬聖真帝命光靈上皇有命錬魄錬魂度死度生北都落名三氣始分陽氣生津魄户閉關符勑呪九天大玄帝都運旋陽明錬魄尸濯成形四氣隂布錬度神庭保命生根符勑呪南閻浮土流火大神玉輝尊星八威洞明魂魄保命死返成真五氣普化自得長生靈氣守堅符勑呪皇天真帝九度九明上覆玄育陽和大通錬魄度魂與道合真六氣普化靈氣生根元氣自分符勑呪九天符命普錬魂魄隂尸上度超脫北扃七氣元化幽滯咸升華景聚一符勑呪靈寶符命普攝魂靈天真化道救濟無邊酆都開釋六道咸臻八氣普錬魂魄返生急急如律令嶽結體全符勑呪九玄統攝八威吐精元靈降氣並度罪魂北都咸赦滯爽無停急急如九天好生帝君勑總勑符呪日景耀羅綺合玄阿流火洋洋萬津滹波空林欎青金趐婆娑八錬朱丹芝房栝和金闕四張皇人之家雲輝吐精仰啜飛華左攀玄上右䇿命魔身登髙臺遊盻緑羅八景翼霄紫瓊丹霞氣聞玉真命齊靈柯長晏九玄路無傾嗟九錬生化玉真寶符八生自然靈空飛符第一天章祝之九符並祖氣玉文至真虛生混成靈仙符第二天章祝之三氣龍胎玉寶神水化生自然符第三天章祝之道真虛無九微鳴水素元符第四天章祝之九靈玄生天水飛空玄精玉符第五天章祝之玉寶洞微左契理命保真玉符第六天章祝之靈明三洞古契神化通真玉符第七天章祝之上玄三氣化生自然玉符第八天章祝之五元化身二景精微飛空玉符第九天章祝之玉清神霄九陽真符一陽混溟𤥭瑝之氣真符子文北氣呪曰一陽生形幽壑開明四象合體分配五行二陽泛華紫微之氣真符丑文艮氣呪曰二陽育質會合五神靈帝含輝玉女侍形三陽天婁鳳車之氣真符寅文震氣呪曰三陽受仙受福東華金門離合披闡四和四陽中女辟邪之氣真符卯文巽氣呪曰四陽蒼臺赤帝丹靈保生虹映敕拔命神五陽太皇微延之氣真符辰文南氣呪曰五陽玉華太皇重寧公子執符太一會靈金童鼓鳴鳯嘯龍吟六陽化真白灝之氣真符巳文坤氣呪曰六陽錬真造化玄元白氣灌溉死户生根七陽絳實紫光之氣真符午文北氣呪曰七陽運布平會百川身度始青返胎朱庭八陽天真命仙之氣真符未文北氣呪曰八陽爍爏形合精延內外瑩潔身外身內九陽太皇寂玄之氣真符五指甲木陽氣呪曰九陽九氣雲騰雨凝結秀黃華冠帶流金青雲玄玄離合上清靈寶玉鑑卷之四十二
