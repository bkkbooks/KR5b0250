front:
  text: 靈寶玉鑑卷之三十三方七
  hash: sha256:75791d69353209beffa4f30f399d80865a2b1f63bbfb733ea0c5a68c49a972fd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_031-001a, image: hfl/0309/0309-055.png}
body:
  text: 召攝幽靈門夫法性平等廣大無礙增之不益損之不𧇊近之不邇逺之不遐聚而為一不為不足散而為萬不為有餘曰天曰人曰聖曰凡𥘉未嘗有以異也奈何衆生業識漸染離本去原毫釐之差千里之謬是以崇卑頓異凡聖逈殊彼此相速億萬有間是故靈寶犬法有召攝幽靈之旨蓋以神通威力普度天人猶恐諸趣尚或沉滯未究法性之玄故以清淨自然靈寶妙光普攝普度使十方無礙萬境圓融則心內聖凡性中天地洪纎一致無欠無餘此真一不二之妙義也豈易異哉淨穢天目符子文北氣呪曰天目神君急速降臨流布真氣助吾眼明立見神鬼役召六丁鬼神受命不得隱形右符焚於水盂中以太玄神水頌灑之不可念淨天地等呪天地尚淨何鬼敢當切宜愼之呪食夜齋香符上天氣玉缺呪曰食滿十方通開百飽食之無盡飛升玉都急急如上帝律令攝見爽靈符卯文青玄氣吹壇下祝曰謹請無上救苦真人左玄真人右玄真人搖金精動玉户照見天上天下攝見亡某及六道四生幽靈滯爽速現大身急急如玉帝勑開通道路符散形天門地戶人門鬼路天地清寧開扄長生和平所生日月角至十方太乙九幽所成軫救苦天尊拔罪天玉皇上帝勑開天門通地戶留人尊門容鬼路攝召亡某幽靈等衆來詣壇所以受生九幽八獄天曹吏方不得久停五道開通兵送某魂天網開通日月星到死魂釋脫三景明呪曰元始登引天真大神上聖髙尊妙行真人十方無極至真大神傾光回駕監真度生諸天丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷急急如元始無量度人律令右符焚存灰於手中合玉訣念前呪吹灰於壇之座下存大行梵氣周回十方遍滿壇場內外洞明並無遮礙左手艮文右手劒訣面鬼戶丁罡三步以劒訣虛書攝召長夜府五字祝曰引領鬼魂使者地道鬼道當界土地五道神祇疾速與吾監引所薦亡魂及六道幽爽赴壇受度吾奉玉清勑再以劒訣向鬼户畫開字存黍珠妙光照破黑暗左瞬目三次定神覺悲風悽慘髣佛見幽魂自艮户出俱集壇前召六道二十四類孤魂等文並見科範門召六道訣天仙道子文存自天門乘寶光飛雲而至于上神明道丑文存自地户乘梵氣駕風馬至于左人倫道寅文存自人門乘寶光而至于右地獄道申文餓鬼道酉文畜生道戌文念三官北酆呪運目出慧光飛斗雙手搯玉清訣引氣如河路鼻出二氣融合運太一圓象之光自天而下燭破幽隂衆魂皆隨光赴壇召六道符天仙道符子文寶光氣呪曰元始攝召汝符命告十方咸聞大法音天道應福堂急急如律令又呪玉清梵氣普告天仙參馭飛雲咸赴法筵急急如上帝勑神道符丑文梵氣呪曰功成利萬物妙化應諸天含符攝召汝方七五神道合自然急急如律令又呪玉清大獻廣布酥酡髙際九霄香環十極咸令度化普受法食急急如上帝勑人道符寅文白光氣呪曰三界法元主應物享無邊聞會上真語人道俱成仙急急如上帝勑又呪玉清大化梵氣氤氲普遍攝召接引人倫急急如上帝令地道符申文玄氣呪曰符命應三界攝召萬靈分法音弘妙旨地獄開光明急急如上帝勑又呪玉清大化洞徹幽都地獄開泰罪魂無拘急急如上帝令鬼道符酉文空氣呪曰飢渴由念業罪纍分重輕元始告符命鬼道成仙形急急如上帝勑又呪玉清大化慈悲生神飢虛焦枯咸享豐珍急急如上帝令業道符戍文濁氣呪曰浩劫迷本真苦汨於四生東華垂惠力業報獲淸寧急急如上帝勑又呪玉淸大化普濟含靈四生情類來赴壇庭急急如上帝令召四生符胎生符子文乾氣卵生符酉文兌氣濕生符坎文艮氣化生符亥文巽氣呪曰太素玉神駕車赤龍上通無極下入幽冥追攝三界十方六道四生男女千品萬類滯魄孤魂等衆疾速降臨化形𠷑吒吒普急急如上帝勑召孤魂符卯文東北氣召祖先符玉文祖氣普攝符卯文東氣追攝赴斛就食現形符玉訣祖氣呪曰元始符命速現真形朱陵度命孰敢隱形急急如律令右念呪七次焚於斛前總祝呪玉清大梵輝耀三塗提濟六道陶育萬殊雲章寶篆紫府丹書咸承拔度上生清都急急如元始上帝律令靈寶玉鑑卷之三十三
