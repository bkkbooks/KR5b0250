front:
  text: 靈寶玉鑑卷之三十一方五
  hash: sha256:d5493b3688f0f034e8564ff63bcb5e410f885b716a6c2167e958c5f153607463
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_029-001a, image: hfl/0308/0308-112.png}
body:
  text: 開明幽暗門三十二天燈告行符命歷關諸天符呪曰元始帝尊諸天總靈三天正氣九化成人真氣混合歷關群真上通天關諸天齊臨保度亡魂一如告命告文靈寶玄壇今月日恭奉道㫖頒降歷關諸天符命開光長夜覃宥罪魂須至告下者符右奉太上玉勑歷關諸天告行三十二天三十二帝天真三界魔王天門正者神司今日欣慶受度亡某等魂開通幽暗咸覩慧光請滅三惡斬絶地根飛度五戶名列太玄魔王監舉無拘天門一如告命年歲次月日告下具法位臣姓某承誥奉行方函歷關諸天符命告下諸天天帝天門諸神具法位臣姓某謹封右符宣呪畢召天道功曹宣關焚之三十二天燈符太皇黃曽天符艮文祖氣太明玉完天符丑文清明何童天符中文玄胎平育天符卯文元明文舉天符辰文上明七曜摩夷天符巳文虛無越衡天符午文太極濛翳天符離文赤明和陽天符已文玄明恭華天符辰文曜明宗飄天符離文竺落皇笳天符午文虛明堂曜天符未文觀明端靖天符申文玄明恭慶天符酉文太煥極瑶天符坤文元載孔升天符申文太安皇崖天符未文顯定極風天符坤文始皇孝芒天符酉文太皇翁重浮容天符戍文無思江由天符亥文上揲阮樂天符子文無極曇誓天符兊文皓庭霄度天符亥文淵通元洞天符戍文太文翰寵妙成天符兊文太素秀樂禁上天符子文太虛無上常容天符丑文太釋玉龍騰勝天符龍變梵度天符卯文太極平育賈奕天符申文右符先誦靈寶至經存降輪三十二帝訣取靈寶祖氣入符懴燈時逐一焚之三十二天燈圖師曰燈壇作三層上層為無色界四天立魔王位懸十方飛天神王幡中層一十八天立色界魔王位下層十方天尊立欲界魔王位壇心立一幡幡上三界大魔王號師曰此圖按元綱流演之像上懸三十二天幡外開八門四圍立二十八宿牌三十二天宫名燈牌用自太皇黃曾天為始次第而去紫微宫紫房宫九晨宫元景宫廣寒宫太隂宫太玄宫玄都宫長明宫東華宫昊元宫青玄宫重華宫光華宫開合宫帝康宫延命宫開明宫大赤宫太丹宫華蓋宫明堂宫靈連宫中元宫瓊瑶宫真元宫靈幽宫天寶宫化靈宫萬福宫白蓋宫雲和宫二十四獄燈告元始覃宥罪魂符呪曰五星炳煥始青碧霞元經回度灌沐黃華魂魄返生玉瑩無瑕靈光虛映寂照三花飛神南宫嘯朗空歌一如告命告文靈寶玄壇今月日恭奉道㫖頒降元始符命覃宥罪魂須至告下者符右奉元始符命告下三官九府天牢地獄主職神司超度亡過某神魂上升清微之天百神混合變化成仙永離死戶體生玉光乘此玉符𩥵侍帝軒一如告命年嵗次月日告下具法位臣姓某承誥奉行方函元始符命告下十方無極世界具法位臣姓某謹封右宣符畢召天道功曹讀關焚八懴燈科二十四獄燈如九獄燈行持破釘身地獄符玉訣祖氣破鎖身地獄符破銅柱地獄符破鎔銅地獄符破毒蛇地獄符破銼身地獄符破鋸解地獄符破鐵犂地獄符破鐵杖地獄符破刀山地獄符破寒冰地獄符破鑊湯地獄符破鐵輪地獄符破爐炭地獄符破鐵丸地獄符破劔林地獄符破惡汁地獄符破食炭地獄符破石壓地獄符破鐵錐地獄符破鐵牀地獄符破碎形地獄符破拔舌地獄符破培山地獄符右符法作用對獄焚之獄牌燈圖並載回耀燈後即八難燈三塗五苦輪燈告普告三界符呪曰虛明紫蘭太素髙虛太真元晨三氣淳于玉清八觀朗映九衢妙覺變化始青肇圖應感輪回消魔瓊都紫晶煉質逍遙帝輿三清曲赦原照夜圖九幽五嶽無間酆都波羅摩辱下救三途五苦八難苦厄俱除冥官禀命元始真符急如靈命違者速誅急急如靈寶無量度人律令告文靈寶玄壇令月日恭奉道㫖頒降太上玉勑普告三界符命覃宥罪魂須至告下者符右奉太上玉勑普告三界十方主者無極神鄉泉曲之府北都羅酆三官九署十二河源上解亡過某祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群一如告命年歲次月日告下具法位臣姓承誥奉行方函太上普告三界符命告下十方三界無極神鄉至宰具法位臣姓某謹封宣符畢召功曹宣關焚之八難燈符解祛雷役電之難符解擔砂負石之難符解摙汲溟波之難符解刀山地獄之難符解劔樹地獄之難符解鑊湯地獄之難符解爐炭地獄之難符解寒冰地獄之難符總勑符呪天尊救群迷超度離八難慶㑹人道中五苦一齊併永滅三途津煥輪發周範希夷守真常浩劫無期限急急如律令右存引金光萬丈綿綿一氣成符然發本性慧光照破隂獄如法行持則冥有所濟矣其符如關燈時逐一焚之永度三途五苦八難符玉文祖氣呪曰靈寶玉符超度八難一切幽魂得登彼岸大道幽微陽光燦爛獲生人天興善贊嘆元始符命至逍遙上清木軸撲內圍燈牌九幡睿號色欲門元靈隱耀天尊上尸道威光寶際天尊天塗門普照幽明天尊愛欲門隨機赴感天尊中尸道虛皇普濟天尊人塗界大慈救苦天尊貪欲門慈悲救苦天尊下尸道無邊普度天尊地塗界法力超升天尊中圍燈牌十五并十五幡號人道元洞玉晨天尊色纍苦心門普光弘濟天尊神道通光普濟天尊愛纍苦神門法輪開化天尊風刀地獄苦靈源普潤天尊鬼道慈悲惠愛天尊貪纍苦形門神光廣被天尊摙山負石苦道玄上玉華天尊地獄道寶光通照天尊華競苦精門玉清玄上天尊作江河苦道慈恩萬善天尊旁生道金華慈惠天尊身纍苦魂門玄明梵行天尊吞火食炭道玉真隱韻天尊外圍燈牌二十四并二十四睿號監天地獄廣常慈愛天尊玄天地獄普垂妙澤天尊元上地獄開度無量天尊太真地獄光華寶華天尊虛天地獄隨劫救苦天尊火庭地獄尋聲救苦天尊毒刃地獄無邊普濟天尊寒夜地獄九幽拔罪天尊律令地獄妙化無邊天尊風刀地獄廣常覆護天尊九幽地獄金華廣耀天尊刑正地獄聖力無邊天尊太平地獄廣大慈悲天尊清沼地獄無極快樂天尊玄隂地獄輪轉萬變天尊天玄地獄廣度沉淪天尊天一北獄髙皇玉晨天尊三十六天獄髙靈最妙天尊無正地獄慈教廣度天尊河伯地獄普垂惠澤天尊禁罰地獄廣大無邊天尊黃天地獄大弘普濟天尊纍劫地獄隨念往生天尊女青地獄開度宿障天尊回耀輪燈師曰按真人二十四戒經凡人生前造二十四種罪惡死後歷二十四報化為二十四獄三途五苦八難之場八獄共二十四獄按人身中三部八景二十四神之數多因在世貪著情欲設心邪境結節凝滓不能開通故盟真科典有回耀之格假陽光燭破昏衢使鬼官罷對囚苦出離二十四獄牌并三途五苦第一鑊湯獄第二刀山獄第三銅柱獄第四鐵犂耕舌獄第五銼身獄第六毒蛇食身獄第七鎔銅獄第八爐炭獄第九鐵輪獄第十運身獄十一鐵牀獄十二劒林獄十三寒冰獄十四鐵丁釘身獄十五亂考獄十六大石壓身獄十七針錐獄十八鐵丸獄十九食炭獄二十磑磨碓搗獄二十一惡汁灌身獄二十二拔舌獄二十三鐵鎖銷身獄二十四鋸解獄天塗上尸死道色欲之門地塗中尸邪道愛欲之門水塗下尸惡道貪欲之門色纍苦心門愛纍苦神門貪纍苦形門華競苦精門身纍苦魂門十方聖境燈告開化妙靈聖境符告文太上洞玄開化妙靈聖境真符今月日恭奉道㫖頒降玉符覃宥罪魂洎諸幽爽上生天堂者符右奉玉符普告十方聖境合屬攸司救度某等魂洎諸幽爽出離隂境覩見光明玄明紫簡太素髙虛至真元晨三氣停于玉清八觀朗映九衢妙覺變化始青華圖應感輪回消魔瓊都芝精煉質逍遙帝輿三清曲赦光映夜塗五嶽九州無間酆都波羅尼辱下救三途五苦八難罪厄俱除冥官禀命元始真符急速奉行違勑者誅一如告命年歲次月日告下具位職臣姓某承誥奉行符方函內套於燈壇告焚十方天尊聖境真符東方安寶華林真境玉符震文東氣南方梵寶昌陽真境玉符離文午氣西方金華洞妙真境玉符兊文西氣北方玄英度化真境玉符坎文北氣東北長樂妙音真境玉符艮文北氣東南碧霞明寂真境玉符巽八文東南氣西南耀靈瓊光真境玉符坤文西南氣西北妙道沖虛真境玉符乾文西北氣上方玉光普照真境玉符亥文上天氣下方寶林洞煥真境玉符巳文中黃氣右符於各燈前焚之燈牌寫十方聖境名燈旙寫十方救苦天尊號右請光與九巵燈同行持十方聖境燈圖靈寶玉鑑卷之三十一
