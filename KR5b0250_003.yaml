body:
  text: 靈旛寳蓋門攝召拯療資次浴沐化衣朝叅呪食道衆雲集神虎壇知磬舉歩虛法事髙功齋官上香髙功作用灑淨次變神歩神虎罡號召宫將表白攝三獻文次髙功發三元都部符次引旛至攝召所知磬舉大慈接引天尊衆和髙功灑淨行開通道路法次白齋意表白舉香水頌次歌斗章表白吟太微回黄旗偈和不可思議功德吟九天命靈章偈次吟符命通㝠漢偈表白三召請正度亡位次召附薦亡位次召請普度六位次召請六道次召請二十四類孤魂知磬舉天尊說經教頌引旛至監生司知磬舉法事表白請本幕聖位直壇酌獻恭酒知磬舉法事髙功啓聖入科作用行持道衆宣五帝歌章依式焚符行持畢知磬舉大慈接引天尊引旛玉清蕩穢所表白請本幕聖位酌獻茶酒法事髙功入科行持作用衆宣龍漢蕩蕩呪依式焚符行持畢知磬舉大慈接引天尊引旙至天醫院表白請本幕聖位酌獻茶酒舉法事髙功入科行待作用道衆誦靈書中篇本幕用十全飲一貼先煎下俟過幕時髙功焚符於内灑之拯療亡魂次髙功作用五府行事之法五帝全形符五方炁訣合炁依法作用畢知磬舉大慈接引天尊引旙至沐浴所宣太玄神水頌詞懴一員宣沐浴科道衆誦沐浴呪並見科教門知磬舉大慈接引天尊引旙至化衣所次舉神功變化天尊道衆一員白化衣文知磬舉神通自在天尊次宣化衣呪道衆誦中篇知磬舉天尊說經教頌引至三寳前知磬舉三清三寳天尊表白念朝三寳文知磬舉朝三寳頌次舉大慈接引天尊引旙至正度幕次引旙至附度幕次引至普度幕次道衆引班分至各魂幕呪獻法食次引孤魂旙至茭郭判斛接濟髙功毎夜行五廚經呪九食符法判施法食祭錬孤魂資次道衆雲集判筵知磬舉廣度沉淪天尊衆和髙功陞座祝香啓聖入意入科知磬舉日月普明天尊髙功云仰啓北極紫微大帝云降水次發建水池符太隂含化呪請降眞水符隂炁錬化呪月魄符月中方盈呪十二河源符黄精啓輝呪知磬舉日月普明天尊髙功云仰啓南極長生大帝君云降火次發建火沼符南方之君呪降眞火符陽炁濯魂呪擲火萬里符日中接生呪日魂符赤爐丹景呪知磬舉度人旡量天尊髙功入判斛科行二十四敷化符解𡨚符道衆依敷化科和天尊號髙功再入科道衆遶斛誦呪變食髙功再用存變髙功又入科道衆諷經法語警策九眞戒文給付符籙宣功德牒髙功祝符知磬舉九光鍊度天尊焚符召功曹入主水將符入水鍊符霐持無鏡呪北方之君呪蕩形符黄炁隂華呪水鍊血尸符元始符命抜度爽靈呪巳枯復榮呪知磬舉火鍊丹界天尊召主火將符髙功白文知磬舉玉眸鍊質天尊火鍊符南閻洞浮呪南方之君呪鍊質符太上鍊形呪火鍊血尸符玉眸鍊質呪炁化成人呪金液鍊形呪陽晶符行丹四符法陽藏隂生呪合炁廻骸起死符心誦靈書梵炁符大行梵炁至旡量度人返質符甲乙丙丁呪五神混合符七炁成眞呪仙化成人符死魂受鍊呪髙功召護送將表白宣帖次知磬舉金闕化身天尊髙功入科次下座送魂焚燎知磬舉向來表白回向念善正齋節次第一日早朝行道道衆雲集師堂掌禮請齋官上香三拜知磬舉香林說法天尊髙功上香陞座祝香演道次敘謝下座知磬舉玉清蕩穢天尊和一聲都講舉蕩穢呪衆和知磬舉金眞演教天尊和三聲知磬舉華夏清道執水盂前行灑淨侍爐引班至正度亡幕前法師一員致法語請靈朝謁直壇道士執旛隨班次詣主教幕前掌禮引齋官上列幕香三拜髙功上香啓奏知磬舉唱道次華夏侍爐引班旋遶燒香至帝前捲簾知磬舉玉京煥景天尊和一聲次表白宣捲簾文髙功跪符作用知磬舉捲簾法事次舉緫朝上帝天尊次舉信禮玉清號髙功上玉清爐香次舉信禮上清號上上清爐香次舉信禮太清號上太清爐香知磬次接舉華夏燒香侍爐知磬引髙功前行次都講至都門入地户髙功入户呪次第至壇上序立髙功上東方香下東方謁簡餘方並同知磬舉信禮髙上九炁天和東方太上靈寳天尊南方三㤅天西方七炁天北方五炁天東北方梵炁天東南梵炁天西南梵炁天西北梵炁天上方一十二炁天下方九壘重隂知磬舉啓堂頌髙功至洞案上香黙呪髙功存用復位跪爐請齋官上香三拜都講舉各禮師髙功宣衞靈呪都講舉鳴法鼓次髙功發爐都講舉重鳴法鼓髙功出官或止於第一朝出官終於第九朝出官都講舉各稱法位髙功眞位啓聖入科道衆二人詣帝前㸃酌詞懺三人宣詞掌禮請齋官上香三拜跪髙功再入科至初捻上香侍香先出班上東南西北四方香都講次出班上玉清御爐香髙功至洞案上香次焚初捻香符存用知磬舉初捻香頌衆和掌禮請齋官上香髙功舉魔王章人道渺渺衆和髙功再入科至二捻上香侍香上東北東南西南西北四方香都講上上清御爐香髙功上洞案香焚二捻香符知磬舉二捻香頌衆和掌禮請齋官再上香髙功舉落落髙張髙功再入科至三捻上香次侍香上上方下方香都講上太清御爐香髙功上洞案香焚三捻香符存用知磬舉三捻香頌掌禮請齋官三上香髙功舉三界之上髙功入科至和與道合眞知磬舉東方靈寳天尊衆和次掌禮請齋官詣東方天尊前上香一拜跪侍爐知磬引髙功至東方上香拜跪次知磬舉東方都唱詞懴跪念東方懴悔和諸靈官與道合眞先四方從東始次四維東北始上方下方並如式知磬舉三清三寳天尊和髙功左行至鬼户面西立都講右行至天門面東立舉各思九色圓象光映十方嚥液命魔宻呪次髙功誦宻呪都講舉按歩虛旋遶或止於毎日午朝命魔亦可知磬舉陽歌九章和舉華夏歸班或散花如一日三朝旋遶第一帀舉稽首禮太上吟𧧷至未句同唱善聲第二帀舉旋行躡雲罡連過嵯峨玄都山通作一首第三帀舉俯仰存太上餘六首分在午晚二朝則一日足十首矣次都講舉唱經題知磬舉一啓頌都講舉志心稽首禮太上無極大道知磬舉二啓頌次舉志心稽首禮三十六部尊經知磬舉三啓頌次舉志心稽首禮玄中大法師知磬舉玉符赦罪天尊次髙功跪奏請告天官玉簡地官王簡水官玉簡詞懴宣簡髙功宣各簡祝呪召將詞懴讀關知磬舉遣符呪功德金色光知磬舉太一救苦天尊和一聲髙功跪奏請拜太乙天尊表表白宣表知磬舉焚表頌詞懺讀關次都講舉再稱法位髙功入科代謝知磬知鍾交振金玉都講舉十二願次舉存神燒香髙功復爐舉出堂頌次侍爐引班旋遶出壇髙功收謁簡下壇入壇則髙功在前出壇則侍爐在前依序至主教幕髙功上香跪謝掌禮請齋官上香三拜知磬舉向來表白回向都講舉監齋彈糾監齋詣師幕上香奏直壇引旛歸列幕道衆諷經回向侍爐引班詣師堂髙功齋官上香次知磬舉皈依至道頌次舉朝奏事畢衆官復位第一日午朝節次朝儀並如早朝式髙功宣科至初捻上香侍香上香從南方西方北方東方二捻香從東南西南西北東北三捻香從上方下方髙功宣科至與道合眞知磬舉東華上相天尊次舉東嶽都唱詞懴跪念東嶽懴悔舉南官治鍊天尊次舉南嶽都唱詞懴跪宣南嶽懴悔知磬舉西靈保德天尊次舉西嶽都唱詞懴跪念西嶽懴悔次舉北元緫校天尊次舉北嶽都唱詞懺跪宣北嶽懴悔知磬舉中黃帝一天尊次舉中嶽都唱詞懴跪宣中嶽懴悔知磬舉五靈安鎭天尊歸位都講舉制魔法事次舉三清三寳天尊次舉玉京歩虛十首如三日九朝於知磬舉三清三寳天尊之時次第出班帀繞停匀立定次都講舉按歩虛旋繞次知磬舉稽首禮太上至末句和唱善聲各一拜次舉旋行躡雲罡壇衆方起丁罡歩徐行毎首至末句同唱善聲一拜如一日三朝午朝則舉控轡適十方大道師玄寂騫林圓景園三首毎歸班用華夏至立定方住餘如式至三啓三禮後髙功告九幽白簡符命九幽玉簡符命髙功拜九幽挾罪天尊表並如早朝式第一日晚朝節次髙功宣科至初捻香侍香上香從北方東方南方西方二捻香從西北東北東南西南三捻香從上方下方次五星懺知磬舉眞光洞照天尊次舉日宫都唱詞懴宣日宫懴悔次舉慧光朗照天尊知磬舉月官都唱詞懴宣月宮懴悔次舉流光輝照天尊次舉星宫都唱詞懴宣星懴悔次知磬舉洞淵三昧天尊知磬舉水府都唱詞懴宣水府懺悔次舉至眞經寳天尊次舉經寳都唱詞懺宣經寳懴悔知磬舉玉京无上天尊歸位都講舉消魔法事知磬舉三清三寳天尊次舉隂歌九章如三日九朝則於毎日早朝舉九陽歌章晚朝舉九隂歌章毎日午朝舉十大歩虛其早晚起末之節並同十大歩虛如止一日三朝則晚舉天眞帝一宫嚴我九龍駕至眞無所待早午晩足十首矣髙功告行神霄金簡神霄玉簡拜廣度沉淪天尊表餘並如式第二日早朝節次侍香燒香詞懴懺方並與第一日早朝同髙功吿行上元三天君玉簡符命請拜朱陵度命天尊表第二日午朝節次並同第一日午朝髙功告行中无九天寳誥金書丹篆請拜法橋大度天尊表第二日晩朝節次並同第一日晚朝髙功告行下元登眞人命出離生死眞符請拜轉輪聖王天尊表第三日早朝節次皆並同前髙功告行太陽錬形寳誥請拜火鍊丹界天尊表第三日午朝節次皆並同前髙功告行玉篆雷文長生簡文請拜金闕化身天尊表水火鍊度表第三日晚朝節次皆並同前於三啓三禮後髙功告行太隂鍊形寳誥削死上生眞符右九朝節次除懴符表章外其餘並同初朝至三日毎日晚朝後侍經攝禮燈儀於第三日早朝後都講道衆至供天所進供三寳九天諸天聖齋進供法事如儀至第八朝後髙功道衆如儀啓發謝恩醮文字次上晚朝或三日毎早朝後進御饍有科文别載散壇朝資次雲集師堂髙功上香掌禮請齋官上香三拜知磬舉玉清蕩穢天尊都講舉蕩穢呪知磬舉金眞演教天尊衆和三聲次侍爐引班出壇所旋繞燒香詣主教幕前髙功啓奏知磬舉唱道侍爐宋華夏引班燒香登壇知磬舉啓堂頌都講舉各禮師髙功宣衞靈呪都講舉嗚法鼓髙功發爐次唱重鳴法鼓次出官舉各稱法位髙功入科啓聖至以聞知磬舉信禮十方天尊號知磬次舉禮足各䖍誠懴悔都講攝十方坐懴知磬舉三啓三禮知磬舉青靈始老天髙功詣東方掌禮引齋官詣東方二拜執爐就跪知磬舉東方眞文請師禮謝髙功祝謝眞文次至南西北中同東方髙功次於緫爐中宣祝眞文呪焚眞文道衆舉和金龍起鎭四聲各歸班序都講舉再稱法位髙功再入科詞懴宣解壇詞表白讀關知磬舉焚詞頌髙功遣伏如法道衆伺髙功伏起和青詞以聞知磬舉旋歩雲罡上髙功入科至以聞掌禮請齋官上香三拜知磬舉還功報德天尊四聲髙功致詞請拜言功表文表白宣表髙功熏表次伏表表白宣關焚表知磬舉焚表頌道衆和表書以聞知磬舉三清三寳天尊髙功致詞請告三簡表白宣山簡髙功祝簡呪宣水簡祝簡呪宣土簡祝簡呪次禮謝三寳髙功宣時流迅速日影潜移道契先天恩覃大地皇圖地乆聖壽天長和稽首拜辤十方道寳瓊鍾息響寳篆消煙師返太清光開長夜三途罷對六道停輪和稽首拜辤十方經寳當願衆生諸惡莫作衆善奉行不墮劫緑常居盛世有情含識用證無爲和稽首拜辤十方師寳知磬舉回軿頌髙功下八門牓知磬舉下壇頌知磬舉十二願次都講舉存神燒香髙功復爐知磬舉出堂頌舉滅燈頌直壇滅燈侍爐引班下壇至六幕序立髙功齋官上香知磬舉按人各恭信髙功致詞奏謝表白宣謝玄表六幕同髙功再致詞普謝都講舉監齋普罰監齋跪奏普罰都講舉衆官各長跪還戒如法髙功致詞還戒知磬舉還戒頌都講舉衆官納職表白収職簡知磬舉修齋送六