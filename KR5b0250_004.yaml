front:
  text: 靈寶玉鑑卷之四賴五
  hash: sha256:ca85c0746a8d4b6655a80e702c05336e80fdbe3e6066ec74cb38569680bf4b12
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_004-001a, image: hfl/0302/0302-125.png}
body:
  text: 靈幡寶蓋門夫盟天告地招真召靈耀景命魔九光十絶皆所以按儀立像具體肖形傑立虛空耀靈法界開通冥漠化度天人者也以至裁雲揚錦展綺明霞䇿景乘虛凝神合氣故得諸天遙唱萬聖臨軒長夜開光九幽罷對功赤宏矣故我靈寶大法幡節幢蓋具有成儀九當運祖氣而合神光盡精微而致廣大隨機變現應念感通作生死之津共具顯幽之標凖及其結空成梵雲篆太虛化形十方超神八極普資有識廣度沉淪實道法之指歸齊修之儀矩也洋洋在上其可忽諸存用凡立幡蓋當凝神存此方如大海水府銀波湛天了無翳礙化所立之幡為絳節霓旌芝幢寶蓋日月星光煥明其上祥風鼓舞影泛金蓮梵氣彌羅勢崇臺閣次存自己元官一氣混接內外玄同天寶乘百寶光引照十方普濟諸有天真大聖三十二天上聖髙尊俱來慶㑹此乃崇德建功招真召靈之實效也四境幡右幡四首黃絹為之各長四十九尺於預告時立於郡城四門或離城一里十里為則朱書玉皇寶號于幡肚中篆文見頒告符簡門告盟幡右幡以黃絹四十九尺造幡一首頂書臣謹謹上奏幡身書太上旡極大道至真旡上三十六部尊經真文寶符太上三尊十方衆聖玄中大法師三界官屬一切威靈伏望恩光鑒臨齊事幡兩手足分書法師職銜臣姓某今據鄉貫入意臣領詞難抑謹集道士一壇依下元黃籙簡文真仙品格建立靈幡擇日修崇旡上黃籙大齊幾晝夜某時行道謹依次第宣演沖科拜奏章書頒行符命遷拔罪爽開赦幽沉然燈續明請光破暗普施斛食攝召亡魂沐浴更衣朝真聽法傳符授戒鍊度起生滿散拜表言功投龍進簡祗設清醮一座上謝洪恩所集善功總資升度仰祈睿澤普濟存亡謹露齊誠遍申奏告建壇幡右用緋絹四十九尺制造於建壇之日標於壇前故得告盟三界開度九幽標紀善功注名黃籙至夜於幡竿上懸綵毬燈一碗使光徹十方幽冥開泰依科修舉庶合古儀九天寶蓋右以九色綵幡九首各長九尺肚中篆九氣符各一道背面書九天帝號手足句書各天生神章八角垂八首中央懸一首寶蓋中層間垂九色綵帶九條以像九氣登齊之始立於壇左幡中九氣符此符九巵燈牌并錬度九天幡通用右九符搯九天訣合九天氣用九天生神章祝之九天寶蓋者三天開化九氣生神萬聖瞻依百神敬仰故可慎終追逺崇德建功關啓之初依科懸立精誠不怠感應自然大齊中不可缺此青玄寶蓋式一名寶憧幡肚九龍符右幡用碧綵製之大幡一首用白粉篆九龍符于幡肚中符下篆太乙號手足或書齊意主寫符誥上以寶蓋十角每垂角卦小幡一首各長四尺並用碧綵為之中間大幡長二丈四尺有一法作綵幢模樣製之亦通此義小幡十首寫十方救苦天尊號東方玉寶皇上天尊南方玄真福福天尊西方太妙至極天尊北方玄上玉晨天尊東北方度仙上聖天尊東南方好生度命天尊西南方太靈虛皇天尊西北方無量大華天尊上方玉虛明皇天尊下方真皇洞神天尊右青玄寶幢於正奏時髙懸空際故太上慈悲闡教化形十方罷對停因尋聲救苦遷拔亡爽招真召靈無間邇遐同沾妙果回耀幡式正面背面右幡用絳綵四十九尺製之以朱砂雄黃合色書篆於開啓時立於壇前故能回景曜於重昏度神魂於霄極聞見之者俱沐善恩大慈寶幡式用黃絹四十幡肚中書後十字一本書九龍符譯文太一大慈命開度長夜魂幡左手書茫茫酆都中重重金剛山靈寶無量光洞照炎池煩七祖諸幽魂身隨香雲翻定慧青蓮花上生神永安幡右手書功德金色光暉輝開暗幽華池流真香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寶㫖自在天堂遊幡左腳書元始符命時刻升遷北都寒池部衛形魂幡右腳書制魔保舉度品南宫死魂受鍊仙化成人太乙救苦靈幡式幡肚中篆金闕梵行王字譯文東極宫中大慈仁者尋聲赴感太乙救苦天尊青玄上帝幡兩手書十方救苦天尊名號見前每首書五名幡兩足書大慈大慈救苦真人大慈大悲救度真人大慈大悲大惠真人大慈大悲妙行真人右用青繒四十九尺變之此幡乃三天自然內音金闕梵行玉字隨方救苦應念垂慈開化南宫遷神北府幡形指處幽滯俱超度品之功莫先於此遷神寶幡式右用絳綵製造長四十九尺以睢黃書篆兩手篆文譯文符命通溟漠靈幡揚曉風遷神超北府飛舄上南宫幡髙懸空中使亡者削名北府遷神南宫回黃寶幡式即命靈幡兩手篆文譯文太微回黃旗無英命靈幡攝召長夜府開度受主魂右以黃絹製造長四十九尺以朱書篆文與遷神幡相合凡建齊當須兩首前後懸掛不可有彼而無此别法有以無英命靈幡為標目者然玉章故有太微回黃旗無英命靈幡之句殊不知無英乃神名也命靈者召用之義也靈幡者乃神靈之幡也謂無英之神命此幡以攝召長夜之魂也却以命靈為幡之名大失本㫖若以度人經云天丁前驅大帥仗幡言之終不有大帥幡也理宜究之龍童幡符火府齎簡童子通天玉符地府齎簡童子啓地王符二符並玉文祖氣火府童幡背書元始符命時刻升遷地府童幡背書元始符命下達重泉鐵跡臺字幡符寶光章字幡符右二幡用雄黃和朱砂書之同亡人幡等立於八門之內如陽人以鐵跡幡召之隂人以寶光幡召之並搯玉皇訣招真幡召靈幡以上二符並見升壇朝奏門茭郭八門幡符人道幡符釋道幡符仙道幡符地獄道幡符業道幡符神道幡符鬼道幡符畜生道幡符已上八門報應靈符並用和釋罪魂上生仙境右存神搯太上升天普度訣祖氣靈書篆之卯午酉子中剔上出鐵跡臺光牌符見神虎門甘露幡符二符並文祖氣寶漿幡符念甘露通真呪祝之即啓請頌見施食門右二幡用黃絹各長六尺造之篆符于中立於斛前普召亡魂幡式幡頂符太一召魂幡面符幡背符太乙召魂幡式右幡頂上書人形召魂符符見神虎門幡後書前背符兩手書三魂七魄名二足書生死年甲又一法以白繒七尺二寸作夾幡長三尺六寸以新竹長五尺五寸繫幡於竿梢一面上書玄冥太乙召魂符下書亡人名字生死年甲三魂七魄名分書兩手一面書玄冥七真內諱用神虎印印之令親人執之召魂立至也五方五氣衛靈幡式東方衛靈幡符青地朱書南方衛靈紅地黃書西方衛靈白地黑書北方衛靈黑地白書中央衛靈黃地青書此五幡符即五靈五氣之文於建壇之時隨方懸於壇上故能感召諸天降伏魔試壇場內外二十四幡篆文每首幡六符譯文每幡六字符引魂明光之幡威靈㧋度之幡垂光慈䕃之幡梵氣彌羅之幡明霞通智之幡法燈朗照之幡靈曜八景之幡玄明定真之幡慧日流光之幡金映洞神之幡惠覃幽顯之幡流輝素景之幡五劫開化之幡通光普照之幡混化辨生之幡靈光皓映之幡垂芒流照之幡神光廣被之幡度名玉簡之幡思神玄感之幡龍威梵度之幡霞光朗映之幡育魄洞照之幡玉皇赦罪之幡五方壇幡如前幡式五方玉字篆文譯文東方九氣天君九陽梵華之氣譯文南方三氣天君三陽梵靈之氣譯文西方七氣天君七陽梵英之氣譯文北方五氣天君五陽梵寶之氣譯文中央一氣天君一陽梵混之氣右五方王字篆文各方一十二字於幡身上作一行書下書符用各方氣訣綵用各方顔色繒帛製造各長七尺㸃筆取顔色相稱者不拘方位靈寶玉鑑卷之四
