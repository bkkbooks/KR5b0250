front:
  text: 靈寳玉鑑卷之三十八盖四
  hash: sha256:97aa2355c1a531fe20f2a480673663d0d4eb06640ba66f90569f4dbdc7211891
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_036-001a, image: hfl/0310/0310-094.png}
body:
  text: 錬度更生門先天地生至虛無體虛極而化神神化氣氣聚而形矣原其始也無一不資於氣要其終也無一不變於形是故萬化本形氣也形氣本神明也神明本虛無也天所賦爲命物所受爲性命氣也性神也神凝氣化道在其中矣氣化故有生有生則有死理之常也神化故無生無生則無死亦理之常也故氣化有物神化無方反其死者形氣旣散四大歸空其湛然若存者自若也其或未明是故靈寳大法有受錬更生之道外則置設水火内則交媾坎離九炁以生其神五芽以寓其炁合三光而明景周十轉以回靈亦各依其本法而然耳然必以妙無眞陽之氣以具無質之質以全眞中之眞成此聖胎法身蛻然神化超出於二炁五行之外不生不滅之表者實由夫即身之妙也苟逹即身之妙則自然成眞矣在得魚而後忘筌可也況道者神之主神者氣之主氣者形之主故錬形合炁錬炁合神錬神合虛則唯道爲神形同太虛矣所謂金液錬形玉符保神形神俱妙與道合眞者是也其錬度更生之道確乎無以議焉靈寳九錬返生符法設錬度醮道衆雲集齋壇知磬舉蕩穢呪髙功遍壇灑淨知磬舉歩虛法事都講舉各稱法位法服一貟攝三獻科知磬舉三獻法事詞懴宣䟽次焚燎次舉九光錬度天尊衆和道衆序立髙功上香跪奏拜錬度表表白宣讀焚燎知磬舉焚表頌次舉日月普明天尊道衆序立錬度壇知磬舉志心皈依信禮和月府太隂皇君宣仰望顧八表呪髙功跪告太隂寳誥太隂寳誥右搯太隂訣引天中太隂白光十芒自右鼻入嚥下元宫次合左賢運轉上透崐崘從右目出去面一尺内外混合爲一吸黄華素輝下入符中呪曰月魄藹蕭芬𤔵翳寥宛虛靈蘭欎華結翹淳金精瑩炅容臺颷結亨坎宣太隂誥告文太隂錬形寳誥告下月宫夫人月中黃華石景水母太光童子散輝玉女月宫司命神仙諸靈官奉爲某錬度形神金液玉英神氣芳馨羽衣飛歩上升帝庭一如告命年月日時告下髙功執誥宣祝呪曰紫微黃書名曰太玄致月華水養魄和魂方中嚴淨發自玄門藏天隱月五靈夫人飛光九道映明泥九一如告命與道合眞知磬舉玃無自育衆宣至幽寂度人髙功歩罡剔訣降炁入水池内應投建水池符碧紙朱書子文北炁呪曰太隂舍化八景齊臨五老祕諱太隂通明璇璣運轉招靈致眞隂陽降炁變錬鬼魂天漿下注流濯利貞急急如太隂皇君勑以目光虚書坎卦入池念宻呪十遍嗚嚧知磬舉日月普明天尊次舉志心皈依信禮衆和日宫太陽帝君衆宣東望扶桑宫呪髙功跪奏吿行太陽錬形寳誥太陽寳誥古搯太陽訣引天中太陽赤光九芒自左鼻入嚥下元宫次合古賢運轉上透崐崘從左目出去面九寸内外混合爲一吸丹華紫輝下入符中呪曰日魂朱景照韜緑映回霞赤童玄炎颷象欎貞離宣太陽誥告文太陽錬形寳誥告下日宫帝君日中朱景童子散輝仙吏日宫司命神仙諸靈官奉爲某錬度形神金液玉英神炁芳馨羽衣飛歩上升帝庭一如告命年月日時告下髙功執誥宣祝呪曰太微丹書名曰開陽致日上魂來合我身平旦嚴裝發自圓庭飛華水毋日根隂晶紫英流光號曰五靈一如告命與道合眞知磬舉南閻洞浮衆寅至神嬰自宫髙功歩罡剔訣降炁入火沼内應投建火沼符紅紙墨書午文南炁呪曰南方之君火府之神降炁變易流火神庭亡魂錬質逍遥太清金光煥落玉眸易形急急如太陽帝君勑次以目光虚書離卦入沼中念宻呪九遍𠸄吸㕭呪𠵇知磬舉度人無量天尊髙功詣座陞座三上祝香具位啓聖入齋意宣科至稽首再拜謹言知磬舉敷坐讃髙功白云臣仰啓九光青金西漢夫人太眞金母元君願降眞炁流注華池澡錬亡魂滌除昏翳臣干冒威嚴不勝俟命之至舉妙果素月天尊降眞水符碧紙朱書子文北炁内合太上神水五炁混凝天元流布廣化池亭天地宣變水沼澄清廣曠萬丈濯質蕩形化元廣度天沼寒池攝魂攝魄齊入天亭普度上願觸向利貞呪曰隂炁錬化景物詵詵壬癸濯質月魄度形大道宣炁天地合并水錬上玄魂淨魄澄十二河源符碧紙朱書斗訣北炁呪曰十二河源念三十二遍搯坎文順至未想月華滿口以舌攪華池十二作引光炁入水月魄符碧紙朱書百文黄帝中主太乙司命萬神無越桃康合延受命神公升遷三界白帝侍魄逍遙自然呪曰月中方盈月帝元君八景羅列寳光負形身生玉液内灌外清急急如律令右存西方月中五色流晶射下池中中有黄炁大如目瞳煥爛黄光之内有月中娥景少女長三寸五分七賢冠衣黄華素衣與自己眼中眞精少女合而爲一隨光擲入池中内外朗明化作森羅淨霐宣月華呪黃精啓輝元隂上炁散蔚寒颷條靈歛胃虛波瀾頴挺耀淳器月精夜景玄宫上貴五君夫人各保母位赤子飛入嬰兒續至又呪回隂三合光玄萬方和魂制魄五炁流通乗霞飛晶逸虛於東首結靈雲景華招風左挾靈符右帶虎章鳯衣羽帔玉佩金璫騫𣗳結柯號曰木王神蟆控根有舒明光黄晶内映玄水吐梁賜書玉札刻名金房服食月華與眞合同飛仙紫霞上朝太皇與道合眞太隂玉字符碧紙朱書酉文月光炁呪曰素華玉光飛玄結璘輝混隂晶浣魄蕩形宣太隂飛玄呪晏景大寂郷回風迅瓊輪丹霄翼緑輿神翁輔帝尊翳翳九玄景離離開趣門徘徊金羅上嘯歌慶靈雲三唱朗玄覺五回道乃分金房煥嵯峨流晶何紛紜左顧見無英右盻觀白元履昌執黃録太一度命根爲我紀仙籍受以度命文清唱運天眞靜思理百關帝一鎭靈宫法服飛青裙相與契何計會合九天垠有日若無期皇華正四圓至感棄餘念道從玄中傳靈感各有運至學故無全與道合眞臣仰啓元陽慈父扶桑丹林大帝木公尊神道君願降眞炁流煥神庭冶錬隂魂返生易質臣干冐天威下情無任激切俟命之至謹言知磬舉慈光朱日天尊變火沼符午文南炁呪曰南方之君火府之神降炁變易流火神庭亡魂錬質逍遥太清金光煥落玉眸易形急急如律令降眞火符黃紙朱書千文三炁內合南昌上府廣化火庭司録司命炁錬神眞普度鬼爽咸得錬形丙丁大道熒惑降臨南昌眞火攝降不停火池宣布冶錬亡魂勑攝諸鬼魂咸得錬其眞天火降錬魂勑呪曰陽炁錬魂金晶通明四象咸蓋丙丁二神日魂普照廣度亡靈景都宣化與道合眞金液上錬仙化成人擲火萬里符黃紙朱書呪曰擲火萬里念三十二遍搯離文逆至卯存日光滿口閉火氣三息引光氣入火池日魂符黃紙來書中理五炁九和十合炎象玄飈朱景日魂出入華房變化上清下鎭人身陽光運化真景内錬泥九絳宫十轉回靈仙化成人呪曰日中接生司命元君九帝齊景三光同斬與我俱升髙奔三天急急如律令右存東方日中五色流霞射入池中中有紫炁大如目瞳内有日中童陽君長七寸飛天冠衣朱陵丹衣與自已眼中眞精童陽君合而爲一隨光擲入沼中内外煥爛化作流火神庭宣日精呪赤爐丹景圓天育精剛以受桑炎火隂英日辰元景號曰太明九陽齊化二婣俱生凝魂和魄五行之精中生玉帝垂光御形採英以虛掇根以盈首巾龍華披朱帶青轡烏飛玄霞映上清賜書玉闕金簡刻名服食朝華與眞合靈飛仙太微上升紫庭急急如律令太陽玉字符紅紙墨書卯文日建炁呪曰赫赫太霞暉曜欎儀眞陽精炁滌滓華池宣呪玄靈秀空洞凝彩結朱烟握節回九霄飄飄天帝眞瓊臺耀巖阿紫鳯𣡡五璘雲歌逸幽宫蕭條雲上人契合七玄房合羅煥中田天王正有九飛仙兆億千洞陽欎雲炁爲世度命年丹華耀朱日流芳映化身仰吸日中景九源降液津永觀不終劫内外洞虛鮮積感思太空洞得無極淵道與混合同遊宴無窮年與道合眞髙功入科至保舉四符謹當宣告四保舉式各用三尺黃紙朱書並祖炁玉訣以束腰入方封内靈寳玄壇今月日奉爲齋主某就某處祇建無上盟眞玉匱黃籙普度大齋幾晝夜以今恭依大法冶錬亡魂所有元始符命合行保舉某魂超升須至告下者右奉靈寳度人上經大法元始符命時刻升遷某神魂北都寒池部衞形魂制魔保舉度品南宫死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遥上清一如告命太嵗年月日告下具法位臣姓某奉行歷關諸天靈寳玄壇今月日奉爲齋主某就某處祇建無上盟眞玉匱黃籙普度大齋幾畫夜以今恭依大法冶錬亡魂所有歷關諸天合行保舉某魂超升須至告下者右奉靈寳度人上經大法歷關諸天請滅某魂三惡斬絶地根飛度五户名列太玄魔王監舉無拘天門一如告命太歳年月日告下具法位臣姓某奉行普告三界靈寳玄壇今月日奉爲齋主某就某處祇建無上盟眞玉匱黃籙普度大齋幾晝夜以今恭依大法冶錬亡魂所有普告三界合行保舉某魂超升須至告下者右奉靈寳度人上經大法普告三界無極神鄕泉曲之府北都羅酆三官九署十二河源上解某瑰祖考億劫種親疾除罪簿落滅惡根不得拘留時刻升遷北都寒池部衛形魂制魔保舉度品南宫一如告命太歳年月日告下具法位臣姓某奉行勑制地祇靈寳玄壇今月日奉爲齋主某就某處祗建無上盟眞玉匱黃籙普度大齋幾畫夜以今恭依大法冶錬亡魂所有勑制地祇合行保舉某魂超升須至告下者右奉靈寳度人上經大法勑制地祇侍衞送迎某魂㧞出地户五苦八難七祖升遷永離鬼官魂度朱陵受錬更生一如告命太歳年月日告下具法位臣姓某奉行四鎭合同劵式右劵依法書篆開作四角認號粘於四保舉方函内封之三十二天劵弍並載給付符籙門又將三十二天等劵分裂爲二將左邊同入歷關諸天方函内右邊繫於正度旙右手升度天門合契也四方函式碧紙作方封右四函於錬度壇前燓就焚十方使者關召召十方飛天神王符大梵億劫星宿元始無上化身停關演化無量勑召十方无極度人飛天神王速降奉元始勑召十方無極飛天神王長生大聖无量度人君傾光回駕監眞度生呪曰洞玄宗元靈芝之先太一左史潔氣飛烟雍雍侃侃褒服飛仙一瞬十極緫統萬天阿繿那易婆歩曇延逹落那顧厥綸孛連乗命玉晨付令侍壇爲宣化度如律如編急急如律令召神虎功曹諸將符見神虎追攝門知磬舉自在神通天尊靈寳玉鑑卷之三十八
