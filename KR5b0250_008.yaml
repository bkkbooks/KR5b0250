front:
  text: 靈寶玉鑑卷之八賴九
  hash: sha256:a10159a4382c583a6b0fa6567599a655b16d3da2cd60649e0ee2d6d9c48042cc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_008-001a, image: hfl/0303/0303-140.png}
body:
  text: 申牒頭連門玉清總召萬靈符師凝虛守一目篆三天諱於空中倐見霐三字分明以鼻引歸三宫為青黃白三氣內外混合為一至下丹田上透泥丸化為嬰兒左有日光徑九分右有月光徑一寸洞煥六合之中內誦結空成梵真氣自生赤書玉字八威龍文保制劫運使天長存金符玉篆普召萬靈唵吽唎吽唎吽唎吒誦畢存嬰兒化為元始懸一寶珠三十二天諸天諸帝俱會寶珠之中次存二神自兩目出如龍虎君之狀默呪謹請元始殿前招真召靈大夫武卿崔文子發放三界功曹所金闕上佐史圭璋急奉元始上帝勑臣身中官童將吏星飛電轉風激火馳金龍驛傳不得稽遲違令者斬疾速奉行忽見寶珠化金符䚴金光燦爛洞照十方帝降此符吸入歸元宫合氣書符凡召役諸神崔君捧此金符史君執節普召萬靈無所不至如坐召策役止用寶珠妙光行持發遣用金符玉字金光梵氣交映無窮一念所通萬天感應矣散形上三星即玄元始三氣奉三清四方刀利玉帝上帝勑拱極尊天臨御日月皇天降命太上治職詔光全玉璽急宣召萬神靈官玉女輒萬神萬鬼敢稽延符到擎拳日字內念日君呪訣運筆九轉書烜字蓋之出筆月字內念月君呪訣運筆十轉書朒字蓋之出筆中央玉字內念結空成梵呪唵吽唎吽唎吽唎吒搯玉訣運筆十二轉書䚴字蓋之出筆向下次書勑字於鬼字下念玉清始青呪運筆召將至仰行萬程急急如玉清總召靈符命律令隨事祝之次念唵咮咈囉唎娑哆薩訶勑符呪玉清寶璽勑付仙卿秉符執節召集天真三界齊到萬神同欽天皇上帝梵氣流晶金光四集曷敢不臨違符逆命上有憲刑速奉元始勑女青詔書律令聚形焚符存用帥握固凝神天地未分萬有俱空惟存一點先天元陽祖氣在空玄之中即本來元始黍珠妙光良久自一生三三生萬化混合萬神總朝元始也遣符呪玉皇勑命急召萬靈上窮大羅下徹泉冥應時感召速詣玉庭一切靈府不得留停急急如律令符檄式玉清總召萬靈符命空符玉清始青玉符告盟告命三界統攝萬靈符到速追符到速行女青詔書如玉帝親行上元天魔中元地妖下元水怪三界神真敢有不順拒逆張鱗萬神斬首不得留停符召入將位速隨符來立現真形玉帝勑書仰行萬程玉帝勑命守待報應急急如元始勑女青詔書律令太歲年月日告行具法位臣臣姓某奉行右符以束腰封之於召功曹後發此符檄勑遣呪在前宣畢焚之依本法存召諸將存召靈寶萬司如意大將軍符先布祖氣一口在頭上化為金光次用玉訣剔上見元帥分明勑呪靈寶赫奕統攝萬司帝君有令威掌群都飛攝神吏衛護玄爐守精定志校定圖書老君預勑道君後除元始主者道氣之餘帝命一下萬司咸符唵勑宣尼吒嚄唵哆唎吒萬司如意大將軍溫仲宣紺髮童顔金介胄仙帶左手玉清訣右手仗劒朱履立黑雲中若行靈寶法用此將後可檄召諸神內祕下圈中先書溫某次加𡙎泓澄衆明祖氣玉訣入符召役行持存上三字化為寶珠在我手中運轉心誦三字萬天皆聞䇿役遣將以此寶珠與天君乘雲去隨事指揮一將靈則百神皆靈召靈寶天君諸將總符呪曰空洞靈章變化無量歷關普告諸神咸仰隨符所召立至壇場急急如上帝律令召赫奕仙曹總符呪曰髙天之上玉清為主元綱大魁太玄生府中有帝君靈虛玉母統制嘯咏玉文金符司制仙禁金童玉女校精辨魔總御百史上逹三天形成司舉傳奏教令蠲災救苦備衛護道囚縛鬼侮流浪諸天濟生度死解厄摧怪通達紫府十方告命召其所主急急如上清靈命元始上帝勑右符師化身為神公左手玉文右手上清訣存祖氣歸中混合百神運目吹布十方諸將乘金光道氣森列于前召流金火鈴大將軍符午文南氣呪曰謹召流金火鈴大將宋某晶氣靈靈迅雷烈風炎火真氣燒滅鬼形急急如律令法曰凡發遣章奏有一等六天妖魔山靈鬼魅於半空中攔截奏文不能上達者神霄霹靂摧魔部流金火鈴大將軍其司一百二十人金甲頭兜鍪緑靴丹袍左手仗劒右手火鈴面赤怒色圓眼威猛相又有殺伐大將軍一百二十人服相一同執戟仗劒此二將善禦魔試大祟等邪用此防護即章奏上達也召殺伐大將軍符已文巽氣呪曰通化靈章丹天真陽萬生祖氣見化真王統御神霄掌握雷光飛擲火鈴伐惡除殃天丁斬尸收付魁罡煞伐將軍急急奉行急急如律令召六丁大將符本氣訣召六甲大將符本氣訣二符祝曰六甲六丁隂陽之神天符急召速降威靈急急如上帝律令召神霄總監大將軍符三符並辰文巽氣文宣召神霄統兵大將軍符丁仲圭召神霄發放大將軍符焉溫總召呪神霄玉府霹靂總真結氣之真九陽成文上領雷將下攝吏兵無幽不伏無成不遵驅雷役電總制萬神駕車萬乘從法天丁玉清雷長左右統兵火豬黑犬四聖四神尋龍捉魔聞召降臨急急如律令召上奏靈官符卯文東氣呪曰靈寶大法氣化生神勑命靈官飛奏帝庭承符奉令徑升玉清急急如上帝律令召承受玉女符酉文西氣呪曰柔和之隂九靈九氣命曰玉女鳯衣龍裙真王有令召赴神庭急急如律令召諸天承受玉女符玉文天門氣呪曰諸天之上隂精聚陽霞明玉潔真洞流光急急如上帝律令召天界直符亥文天門氣驛馬驛吏星奔火衝謹召天界直符焦公奴急至召地界直符玉文東南氣呪曰翻山撼地直符威兵謹召地界直符鄭元喜急至召水界直符子文北氣呪曰帝靈勑命神靈捷水謹召水界直符張元伯急至召年直功曹飛天將李煥本年訣氣召月直功曹震天將郭炬本月訣氣召日直功曹驅雷將趙濛本日訣氣召時直功曹炎搯將張炳本時訣氣勑四直符呪炎帝勑行玄君稟令急降聖力合氣四正李煥郭炬趙濛張炳允契真符翕然奉令急急如律令召風神威毒天君符寅辰文隂陽氣召雲神猛烈天君符已文巽氣召氣神變化天君符卯文東氣召雨神迅速天君符坎文北氣四直袖符總呪太蒼光芒威臨十方風氣雲雨逐念而生隂陽濟合正直感降急急如上帝律令召三界十方嶽瀆吏兵總符玉文中氣呪曰玉清有命告下三元十方曹治稟命所宣各統部屬立至壇前轉揚大化開濟人天急急如律令召神虎諸司將符進初虎門召社令土地總符已文中氣呪曰靈寶符命立召無停社令里域土地等神急速奉令鎮衛壇庭剪伐不祥延格正真急急如律令存神念總召呪三清三境統神上元八景冥合萬神侍軒中有五靈輔贊太玄總制火兵八萬四千神變莫測威鎮羅天聞令關召速赴壇前急急如律令師存諸將俱會金光道氣之中聽令誓將呪吾奉真玉勑命玉帝金符告天立壇法像驅神遣鬼左契龍文豁落右佩神霄玉律夕誦玉清羽章朝謁大帝下統山川洞淵水陸神秪上列神霄真卿誦詠大洞玄機一勑召九天司命七轉召九天真仙吾為仙王太上丈人五嶽主者受命在吾心呼風吸雨布電驅雲大怒雷部前行威鎮霹靂崩摧元天有令風火四維天地萬神並令知委急急泰髙上神霄玉清真王律令勑次入三獻白文見科儀門飛章火鈴符午文南氣緋紙朱齒師左手執筆奏右手執符想心火從頂門出內有流金火鈴大將赤髮天丁冠金甲緋衣手執流金火鈴直衝罡風至天門呪曰炎神炎神火鈴金精通天開道速逹帝庭六天九醜斬馘滅形上帝勑命風火不停急急如律令開天符散形三天帝勑天洞火真上開八門速降威靈上通天闕三部使者隂陽決吏開道無窮王女靈童持火蕩冗衝除浩氣大破罡風䚴奉王皇上帝勑符下作用塗呪一轉六神藏二轉四殺沒三轉動魁罡四轉雷火騰五轉霹靂發六轉山鬼死七轉收攝罡風浩氣六天外魔無道之鬼攝付都雷之下受死無動無作四縱五橫天賜吾行順為正道逆為背亡違勑者滅奉勑者亨急急如律令入祝貪巨祿文廉武破魁𩲃𩵄䰢魓𩳐魒中宫大聖飛天捷疾聚形玉文天門氣呪曰玉皇有命勑下罡風萬仞摧毀九天潛通承符奉令黃道無窮天門四明黃道正卑承符奉令敢有稽停符中將吏速逞威靈罡風浩氣金馬驛程急急奉玉皇上帝勑黃中理氣馘滅邪宗罡風九醜浩氣群凶開天符命九天徑衝倘道章奏束送羅酆流金火鈴照徹黃中龍虎騎更執奏雲官普天同慶萬劫無終一如告命風火驛傳符檄式套封束之太上開天符命符右仰歘火律令開道鄧天君流金火鈴宋元帥通真使者玉女靈官齎捧章詞表奏文徑詣天廷所過罡風浩氣母致攔截速達御前急急如律令太歲年月日時檄具法位臣姓某奉行三天大聖師泰玄上相真君在天上達符上更氣開天訣右符念合明天帝日不拘遍數而成符升真度火符午文南氣下三火作用呪曰一火傳音擲火流金寅二火勝光八門飛世午二火從魁轉刀破骸戌天火雷神地火雷神五雷降臨鎖鬼關精樞機二星猛將速臨三千六百雷公部從一齊發聲雷震雷局呪曰符使升真速降威靈擲火萬里使我通真升霞散空五雷備鳴前行大道掃穢除氛急急如律令師噀水步斗一座兩手握雷局運五轉存流金火鈴大將歘火大將開道前行左手剔斗一座其咢天丁飛雲芳存諸將乘金光道氣捧奏右手別斗一座靈素天丁空降京遣將呪吾奉皇天睿命玉帝金符賜吾九錫十八威之䇿丹霄之輿流金鳯輦紫素之書千靈萬神孰敢干吾五嶽四瀆隨吾指呼謹勑上奏靈官承受玉女諸司雷將當處土地里域等神齎持奏申速逹天廷所過雲路之中或有六天妖魔妄來攔截即便攝付近司依律治罪以明玄憲須仰奔風火急不得停車千妖萬魅違命速誅明回報應言功玉虛三界之內孰敢干吾五嶽四瀆隨吾指呼威劒屠戮神兵疾驅吾在壇前早劒相待急急奉髙上神霄玉清真王律令勑靈寶玉鑑卷之八
