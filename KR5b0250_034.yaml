front:
  text: 靈寶玉鑑卷之三十六蓋二
  hash: sha256:75cf212c9a1bcb862e437851268c05ff2efbb6e5b35e7b4fe7a1eb012319f031
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_034-001a, image: hfl/0310/0310-024.png}
body:
  text: 變化法食門夫一切萬法皆從心起亦從心滅所謂生我者神殺我者心故嘗詳味妙義然後知心之為用其為利與害殆有不可勝言者也原夫人生之𥘉特一神之寓耳未嘗有此心也及其四大假合神凝為心心以神寓則漸離其本矣心為離本而念即隨起一念既著則百為以生百為既生則萬緣由是萌矣是以斯念之起適於善者則為天仙人倫神只適於不善者則為地獄餓鬼畜生此無他良由一念之所致也況茫茫大塊中凡有形有相者莫不皆以飢寒之念為切至死亦不能忘也是以靈寶大法有濟度幽冥之科仰體道慈開悟諸有所以因食施法因法明心心法既明飢渴何有故令滿足此念捨妄歸真所謂八會五厨醍醐甘露蘭肴珍饌玉液瓊槳皆法身中固有之物也此性具足奚假外求外或可求皆是虛妄所冝灼識大本深味無為永出輪回證無上道倘明此理豈止超度幽冥而巳哉變食存用變食之法師存為救苦天尊壇衆為諸大真人法筵為三層寶壇解中紅光紫氣上衝天際三寶上帝太一慈尊十方救苦真人日月星斗三界真宰在空玄之中為作證明天門金光道氣百千萬重綿綿而降灌注已身及斛食水盂之中內外映徹次存五色光明現於東十圓象如月暈之狀遍照天上地下十方世界無不洞明中有太一天尊俯仰碧玉冠衣飛青翠羽離羅之帔左手擎碧霞琉璃鍾右手執空青羽枝坐九頭獅子金色蓮花之座獅子口中各吐火𤔵圍繞慈尊天尊於光𤔵中别有九色圓象如日頂出白毫光光芒外射如千萬鎗劒蓮花座上又有三十六小蓮花乘天尊二足金容玉相慈尊慧日左有救苦真人右有大惠真人侍從天尊八十一位神君五方太一吏兵青玄功曹黃籙童子玉女金童神王力士現於東方五色靈光天尊光明遍照天上地下十方世界無不洞明天尊灑甘露灌注法食光明瑞氣流注無窮天尊同兆真人及官君等皆誦甘露真言其斛攝化無礙香氣馥郁充塞虛空廣大無量靈書存變一遍結三途五苦印每一方畢存本方氣東九南三西七北五灌注法食及吸吹水盂中再一遍存黃氣自五方來日月星光上引三十二天之氣交映羅絡灌注法食再誦三遍存四方紅光罩壇良久混成五色虹霓下注兆身口五臟之間混為大圓象廣覆遍滿虛空兆身如在日宫其斛自一生二二生三三生九九九之數攝化無窮自地至天十方遍滿廣大無量天神地祗六道四生無不歆享充滿飽足也斛盤供養諸符東方斛盤符卯文東氣南方斛面符午文南氣西方斛盤符酉文西氣北方斛盤符子文北氣上方斛盤符亥文西北氣下方斛盤符巳文東南氣攝魂享斛符右念唵吽吒唎一氣三十六遍吸五方氣合自巳金光玉訣寶漿瓊瑛符呪曰中虛無迹應化有常金漿玉液充溢生光形神合妙與道俱昌急急如上帝律令存七寶芝英之液流注焚符於水盂內供養召享之啓請通真符合明天帝日呪曰稽首明慧虛無尊稽首皈命重玄主裁成天地無德稱悉為衆生作恃怙慈悲五道轉輪回哀救三途地獄苦歸命金闕天中尊歸命六道慈悲父歸命玉清元始尊巳離生死長綿綿出有入虛無所待能令枯朽變成仙千劫萬劫難一遇為衆廣説業因緣回骸起死永長存使其形神無變遷淨酆都破獄符呪曰茫茫酆都中重重金剛山靈寶無量光洞照炎池煩七祖諸幽魂身隨香雲旙定慧清蓮花上生神永安念唵俱知只帝阿勒薩曇婆伽婁代耶婆叱吒吽呵開業道通真符呪曰功德金色光微微開幽關華池流真香蓮蓋隨雲浮千靈重元和常居十二樓急宣靈寶旨自在天堂遊唵縳羅拱帝三縛達多縳羅馱吽吽娑訶離寒庭符呪曰寒庭多悲苦回首禮元皇女青靈寶符中山真帝書一念升太清默誦觀太無功歸九幽下旋旋生紫虛唵吒唎娑訶唵吽唎吟唎吒唎娑訶離怖畏符呪曰自從多劫來出沒不暫停一入地獄內舉動心飛驚當令離怖畏隨聲誦仙經共乘無上道同班朝玉清急急如律令唵離息吒謾多喃娑訶生魂育魄符呪曰靈芝無根衆妙之原中凝七魄上結三魂二十四真出入無門杳冥之內恍愡元精隨劫存亡逐氣而生外凝混朴內養七真五神植華三台敷榮紫闕素童反胎歸嬰騰雲而升跨霧浮空中有玉真號曰神公左挾無英右衛白元玄獸遏後丹禽擁前工浮翠蓋下擁金蓮香雲凝空甘露無窮用之無盡尋源不終唵吽縳襪囉薩娑訶灑甘露符呪曰悲夫長夜苦熱惱三塗中猛火出咽喉長生飢渴念一灑甘露兩如熱得清涼幽魂生大羅潤及於一切唵酥酥𠷑㖡酥娑訶甘露玉符呪曰泠泠甘露漿法味難思議騫香流七真冥冥何生疑受此法食者生天登紫微自然天厨食普及於一切沉魂飢渴者盡沾甘露味化為靈寶漿返隂生陽氣惟願沉滯魂上升清都治唵吽吒唎㗩縳羅娑加持法食符呪曰回首仰元羅合景挹靈芒拘魂制七魄思臍定中央行住履虛無寢息宴玄房飢餐黃碧華渴飲瓊林漿神旌命太魔合體錬真光復照觀太空長在空中遊圓通泯波際真花靡終期杳杳無終始行者當明知寂寥空裏散應運藏弘規降道不自超要當先所施會歸無二處隨心自合離唵噠唎摩尼吽吹耶帝呵娑薩娑訶變香糜符呪曰酆都夜壑忽以光輝照燭幽魂來沾香糜靈寶錬符百骸自飛得見妙會仙歧知歸急急如上帝律令唵吒唎吒唎哆唎哆唎娑訶濟慧法食符呪曰萬劫難遇功德可崇開闢幽趣全假真風梯航彼岸濟慧無窮念念生因駕景飛空急急如上帝律令酆都羅嚮離羅涅多迓多同登上清溟涬大梵符呪曰玉山金闕上元天一化生靈泉六龍負軿七真珍果妙絶芳馨上靈火鈴變神仙火鈴變大行梵氣周回十方唵嗡囉哩長參陀尼尼陀耶多伽耶彌羅多伽耶彌陀九變法食符右符用九天生神章作用又於符內一字上存帝尊自頂門出現太空面部三竅出霐三字作玉金銀三光吸歸三田合青黃白三氣混一升泥丸化為本末元始內外合一內誦結空成梵呪誦畢布氣入符倐見天上珍饈充滿法界諸天諸地一切真仙歡喜享食運筆書勑字蓋之三字上存玉帝儼然口吐金符調引氣入中成合上升與外一同內誦玉皇誥金光呪誦畢布氣入符存化金飯玉漿十方法界一切鬼神咸來享受運筆以書勑字蓋之九字上存日月星書日月天罡諱訣念日月天罡呪混合三光正氣歸合元宫入下丹田合景過尾閭上透頂門迸出分為青黃赤白黑五氣漫空各分方所變化法食為滿空白雪之狀十方三界六道四生享之無盡內誦天然真味妙用難量食之一粒變化無方誦畢吸氣入符運筆以勑字蓋之又於符下魅字上作用東方南方西方北方廣度玉寶玄真太妙玄上況淪九幽太上變化無窮急如拔罪符命太一天尊律令言魁至金木水火土壘魒書取五方氣入唵吽吒唎勑召黃某加合明天帝日呪曰九天勑命東極頒符下臨壇所廣濟群苦稽首玉晨尊存太一在頭元皇大敕主存我身有百寶光密念玉清書梵竒玉訣唵嘸呔咄咄呟𠮵嚇吙嗔嚌噧嘸㖟吣喠嗿吩一統急如元始上帝律令又曰結空成梵真氣自生赤書玉字八威龍文制魔宣化雲上九昌玄皇帝命立降壇場上帝有勑太陽威光急急疾疾謹請大變神王大梵靈官法力無窮充滿法界唵吽吒唎勑召黃某願汝不思議神功妙濟力變比清淨食化為甘露漿二甘露味三甘露食變食呪隂陽氣助彚物于靈變化多方普變法界急急如五方真老律令密呪嗉嚧嗉噓哆婆耶噠多耶嗉噓𠷑囉嗉嚧嘙呵芒角森龍鳯威光叱十方太清傳密勑離旨化元光唵吽吒唎娑訶唵叶嚩囉娑訶唵𠯜㖿啼娑訶唵嗡囉哩陀他呢陀野他彌囉哩囉哩嚮囉哩逹多拽多同登太清一二三四五老君來救苦東王公西王母太一天尊降甘露次念太上神光九變無方上窮大羅下極泉鄉無窮法味甘露難量變千億萬上朝玉皇女青書正文道一法二妙隱之玄天書八角光芒九天律召三界上中下元河沙十類罷對消愆三塗五夜女青詔前巳托未化承命太玄元皇之一光現無邊一三成氣四八合全氣合成玄玉景飛仙玄玄之一一一之玄祕書一召萬神奉宣急急如玉清元始女青詔書律令無量法食符呪曰三天無量食充滿法界中濟汝飢渴者清淨無極身三麼三麼雷麼帝麼帝叱帝叱無極三天叱叱麼叱麼三天咈三天咈唵勑吽功德不思議行者因福報施汝法食饌永生安樂處普變法食符諸符並玉清訣天門氣呪曰元皇玉清尊太極金帝令九丹無量味八瓊神溢津餌之至不死飢渴長冥冥此食變恆沙飫飽及有情仗此加持力共成無上道唵呼噣囉娑訶自然八會靈章三光流晶法食符呪曰妙道生一氣氣中分隂陽凝化日月星燦然流三光九華合九道八色怡八房煥爛洞真體流晶歸大芒下生淵泉宫上列無何鄉縱體復非迹歘然都相忘七寶流精結混沌雜華房咽服九霞散安和樂未央三光澤嬰法食符呪曰玄絶九氣中澤嬰生太無欎儀煥暘谷結璘耀天衢五星流寶光斗極回乾樞飛氣欎勃散燕御方踟蹰超迹天寶階煉芝服華敷氣布萬真備舉形升太虛三光法氣法食符呪曰浩晶生法氣氤氲凝天中兩曜共澄徹五緯交相通三光煥巳明寶氣盈三宫帝鄉會九老咽服百骸豐金華照光景身與日月同念道上帝前億劫壽無窮三光玉陽法食符呪曰玉陽正真氣妙道三景分玄和唱靈音八會敷瓊文五老冥丹宅飄飄乘景雲大聖諸天衆駕龍飲玉津三五定生籍遊戲太上賔華景朗無際携手朝玉宸三氣雲華法食符呪曰引氣欎羅外九芒結雲華七神髙上道三景耀朱霞捧香服晨精功滿解世羅煉化塵劫盡億齡不為多落籍三界庭結友太上家御景控玄斗八極何足賖三光導仙法食符呪曰自然至真道妙極玄中玄萬天朝玉陸九老參華軒三光有靈氣取度惟聖賢勤行導仙業咽御吞華房神形合三象渺渺歸本元皇鳥翔十天飛舉不顧還三光瑶氣法食符呪曰迢迢三天上落落九玄臺金童採芝集玉女持花回天賔挹仙客俯仰升瑶階天河灌東井寶氣縈空來咽納嗽瓊津兆劫不復衰矯首三清路振衣何樂哉三光定光法食符呪曰至哉上真道妙哉靈寶章吸景導五星咽御存華芒流精灌百體皎晶凝雪霜洞達照內外塵滓都消亡豐肌不復老契此名定光永宴太平館斯為不夜鄉攝迹歸本根九轉凝玄常靈寶玉鑑卷之三十六
