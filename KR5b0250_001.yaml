front:
  text: 靈寳玉鑑卷之一頼二
  hash: sha256:da86d49647affe0422188cffbcf50065970c24db385bb65a5e4fe612d03b50b1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_001-001a, image: hfl/0302/0302-005.png}
body:
  text: 道法𥼶疑門靈寳齋法釋疑靈寳經法之卷首有四譯八明七經八緯巳備諸家之說姑摭其大綱如左四譯靈寳經法自玉宸道君得黍珠所授赤書玉字八威龍文上天所寳不傳下世此譯之一也道君敘其神通變化冠之經首叮嚀學者篤信力行於經之後此譯之二也道君撰靈書中篇而天眞皇人昔書以爲正音者此譯之三也西漢元封中西王母以是經授之武帝遂譯大梵之言爲神州之語天篆之字爲同文之書此譯之四也其後老君歴代降世其傳浸廣漢天師諸仙遞相授受漢光和二年太極眞人徐君來勒以授太極左仙翁葛眞君玄仙翁授之上清眞人楊君皆漢元封巳譯無所再譯其有五譯之說者皆贅言也八明一當明靈寳者即元始祖炁其初溟涬大梵眞炁自無而有一切有象有形皆由是氣而生成所謂成象成形者又各有是氣也亦儒家所謂一物一太極也故人受中以生則亦各有是氣焉祖之爲言先吾父母而生者也於我身求之則父母未生之前此氣在何處我身内之父母復是何物我由而生所謂無相之我又在何處當如此究竟然後入無出有與道合眞二當明元始敷落五篇赤書玉字八威龍文經法中一應符篆皆始於此學者當究其妙則其功用如經所云三當明靈寳經法皆出於混洞赤文混者二五合凝之未兆也洞者無色無淵之謂也由是而化生諸天開明三景五文開廓普植神靈變化無窮矣四當明靈寳經法乃萬法之宗自五劫開化之後三洞四輔諸經諸籙緫而三十六部支而萬八千篇故自老君流傳於世靈寳之品獨多五當明人之有生無極太極吾其性二氣五行吾其體一㸃靈明烱然不昧者則合性與知覺謂之心也學者當常常存其心養其性明則爲命世之聖賢幽則爲遺世之神仙濟利幽明特其餘事耳六當明靈寳妙用如太極眞人曰常於太極握樞機動靜神珠照幌帷就裏分明靈寳現如懸黍米在浮黎然後隨所運用變化無窮矣七當明省身悔過念道思一眞毫髮邪念不留於心視聽言動常如對越八當明眞修實踐日積隂功凡遇日月失昏星宿錯度四時失序隂陽不調疫毒流行兵革四興水旱蟲蝗等皆當依經㫖修禳以母負玉宸道君之垂訓自然優入道域與道合眞身得神仙亦分内事七經一曰大定神光一㸃靈明如如不動大而六合微而秋毫皆在吾神光中二曰洞觀微視聖日聖月照曜金庭光映十方無隂不燭三曰内服玉札金書皆諸天日月星斗天眞大神𨼆諱𨼆名有諸中則神凝炁充施諸用則神動天隨矣四曰採鍊祖氣以生聖胎法身夫謂祖氣者人人具足不假外求學者當朝夕存思守而勿失眞積旣乆乃成聖胎然後見所謂法身出有入無神功妙用與造化同流矣五曰五行内鍊訣曰五行順則生人逆則生丹一豪情慾之萌即耗眞氣學者常當吐濁納清収視返聽使五行眞氣攅簇於神室之中無頃刻間斷可以長生乆視可以濟顯度幽神動則氣隨無施不可也六曰𥞫珠神化吾身自有始青天浮黎土𥞫珠一顆不用外求當知此理散之則彌滿六合歛之則不盈一握七曰中理五炁混合百神學者當常常持其志以養其氣使之歸於元海聽命於我之元神則隨所設施混合百神也八緯一曰流精玉光乃上天精粹剛正之氣天之靈寳也學者當於身求之存養之乆必見所謂五色鬱勃洞煥太空施之於用則無所不辟無所不禳無所不度無所不成矣二曰洞陽符火按靈書中篇六十四卦之炁運以混合三十二天之眞炁行之積乆與道合眞三曰大行梵氣一切眞仙莫不由此超度經曰大行梵氣周回十方學者能使身中梵炁周流無一息間斷則度人之功誠爲無量生身受度亦餘事也四曰三宫修誦三宫即三田也先當持戒制情正心誠意眞炁内固然後誦經則嬰兒升降三田隨聲念誦其功德力亦如經㫖矣五曰報本返始學者必於三元八節五臘諸先亡諱日依教誦經以盡報本返始之道春秋祭祀亦當隨家豐儉爲之庶幾爲人行報本之道無愧也六曰九品隂功經曰星宿錯度日月失昏亦當修齋行香誦經四時失序隂陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經師友命過亦當修齋行香誦經學者當於此力行以積隂功功德積累則諸天書名鬼神敬服濟生度死隨念皆符身得神仙皆不外此七曰玄靈濟度學者當於清夜朝禮北斗依法咽服元皇正炁求所謂太玄之一守其眞形然後身有光明魔無千犯運神㑹道隨念感通八曰濟度無間經曰常行善心又曰齊同慈愛凡見鰥寡孤獨疾病飢寒便當思以濟之若已乏財力則廣行勸化如凶年饑歳溝壑死亡兵戈擾攘僵尸暴骨吊祭不至精魂無依當依經法隨力拯救則亦功霑先逺慶及見存太極仙翁薩眞人路眞官歷代祖師皆於此用心以不負經㫖也奏申關牒文字論齋法之設必有奏申關牒悉如陽世之官府者以事人之道事天地神祇也所以寓誠也是假我之有以感通寂然不動之無也然後見其洋洋乎如在其上如在其左右以明其不敢以上下神祇爲無也所以盡事人之道以事天地神祇也故闡事之先必請命於上天之主宰與夫三界分治之眞靈曰府曰司曰宫曰院几有關世人死生罪福之所必一一謄誠以聞或奏或申或關或牒又當隨其尊卑等第爲之或者謂天者積氣之蒼蒼耳安得有所謂宫庭官府列職分司如人世之多應之曰子徒知積氣蒼蒼中之不有宫庭官府之如人間世者而樂言之試觀日月星辰之分布晝夜寒暑之推遷非各有主宰之神乎經曰三華離便大有妙庭金闕玉房森羅淨泓者皆是也三華者日月星也離便者離便宫殿之謂也森羅者森布羅列也淨泓者言金闕玉房之清虚洞徹也且古先聖王有爲泰壇以祭天者有所謂敢昭告于皇皇后帝者果謂積氣蒼蒼所無知乎況禮之月令必曰其帝某其神某是非各有主宰者乎經中之有宫府司院之者名由漢武帝元封中受經於西王母母以漢制官府職名譯經之所云以授於帝故爾此奏申關牒文字之所以立也建虚皇壇論虚皇壇之建齋法中之不可缺者綿蕝朝儀於此乎展也每一登壇俯仰具瞻則洞然八荒誠如見所謂洋洋乎在上在其左右也其儀亦頗合古古之王者祭天必爲泰壇吾教之虚皇壇亦其遺儀也故中設三寳尊位之外則四方四維止設十方靈寳天尊位與五方五帝位此外一應神祇之位不列於此是亦祭天之義也三日九朝登壇朝謁拜表上章皆於此以致誠也壇上鎭信玉帛物儀論齋壇之必用金玉幣帛諸物於十方者備物陳儀之謂也所以將恭敬之實也古者以蒼璧禮天簧琮禮地青圭禮東方赤璋禮南方白琥禮西方玄璜禮北方亦各有牲帛皆倣其氣之色齋壇之用鎭信亦古之遺儀也倘廢此禮則是以上下神祇爲無知也則恭敬之實安在獨吾教中所用多寡之不同者按五子歸庚之數也故用之東九西七南三北五中一以爲數也乃若玉帛物儀之色則與前之所云不異也至如禮之隆殺則自天子以至於庶人所謂名位不同禮亦異數也進拜章表論拜章一法莫不宗九靈飛歩之說蓋九者陽數也陽數始於一而究於九也故易之爻於陽則必曰九也天者陽氣之上積也故亦曰九天法曰拜章須出陽神者法師當運自身九陽之炁出身中之神乗是氣以達乎天境求其所謂主宰之帝而進達之雖曰霄壤勢異然一念精專則神與道俱神動氣隨則寂感虚應豈可以色象求之也一念精專即是陽神一毫雜念即屬隂矣愼之哉凡所謂上帝宫闕曹治皆昔天尊神通變化之使然非如人世之有一定帝王之居也至於黄道黒道之分又出於暦象家立之以測天運耳亦非截然如人間道路之有分别也行者切不須泥諸家有以天地日月五星爲九靈者最爲穿鑿今不取惟一家以北斗七元與輔弼二星謂之九靈者以存思罡訣不離乎斗故也用印論靈寳之妙化具乎兩儀未判之先靈寳之經教闡於三炁旣分之後上天所寳下世罕聞漢元封中武帝得西王母之授而後其教方傳世逺人亡經殘教弛自非聖哲無不䧟溺其良心故生則災害臻身死則沉淪長夜其有執而不化者則未散之氣或依草附木或爲厲爲妖從迷入迷無有超度故經教支而爲法所以輔正除邪濟生度死也此又巳得道宗師不得巳而爲之也法之爲言正也正其邪也亦猶德禮之有政刑以道之齋之也故章表奏申關牒符檄又必假天府之印以示信也印則各有師傳者欲天地神祇人鬼知所行之法有所受之也道法之分門别𣲖不知幾也獨靈寳爲萬法之樞紐其爲印也無施而不可也如上章一事在靈寳法中雖有通章印然其印文本是三天合同契劵專爲升度亡魂不知原於何代宗師乃於印文中除去召魂升天眞子佩法八字遂用爲通章之印故祖師紫極田眞君辯之詳矣由是觀之不若只用靈寳印爲無可瑕疵也又如正一教法上章則有九老仙都印及十二小印若專行正一天心可也施之靈寳齋醮中不爲無礙且如人世諸官府自一品至五品皆得而上章表於朝廷除止用本衙門公印外不聞别有上章表之印也據此而論凡行靈寳之齋一應文字止用靈寳一印爲的當也若必有分司而用則神虎之印施之追攝可也南昌之印用之鍊度可也至於隨籙之印却在法官臨事審權宜而用之也存神召將論諸品道法行持之時皆以存神召將爲首其爲運念呼吸呪訣罡歩固各有其說若專用一法則儘可自依本法作用如行齋醮則不可爲也蓋法官所有諸法之將吏悉皆召之以佐助行持惟當存自巳靈寳祖炁以爲之主次則中理五炁以混合百神存召役遣無所不可蓋靈寳爲萬法之樞紐也若必逐一依各法存召非惟自取多事於靈寳之功用爲斘謬矣告行符簡說追度法中之有諸符諸籙諸簡以布三界十方九幽曹治拔度亡魂者乃黍珠傳經之後赤書玉字聖聖相傳流行人間作幽㝠之日月蓋由上帝憫念群靈生前肆情慾䧟溺良心死則業識沉淪執而不化隨其惡念以有地獄以拘其魂使受報對謂非有符頒天恩莫能超脫故設此符籙簡文以開宥之其孝子慈孫義夫節婦當竭其哀誠以代死者乞憐首謝法師謄誠天府祈請再三方依下元黃籙品格一一頒降亦猶陽世朝廷之有特㫖以赦宥罪也神虎追攝論神虎玄㝠玉札者其法甚祕札中乃運北斗玉諱請降瑶光洞照幽夜三界十方無所不攝其文乃西山劉眞人諱根得於太乙玉女之親授眞人仙去之日祕以石匣藏之龍虎璧魯洞中世所罕傳正一教闡此文亦再出世歷代宗師授受然後盛行故追攝之法必遵用之訣曰神虎者乃北斗玄司北魁所制也其司分三一曰玄靈屬貪狼星所治中有雄左雌右二神即擎羊陀羅二神所化二曰玄㝠屬巨門星所治中有三部使者即斗中河魁天罡斗擊之神所化三曰玄範屬破寕星所治中有追魂玉女功曹各七員即七元星宫隂陽之神所化人之死也隂魄皆屬北斗所攝或存日稔惡皆禁斗獄其獄分布九所故謂之九幽獄緫名曰天一獄天一者北方之生數也生前積善者斗宫紀名死則攝魂生於南昌火府受鍊更生惟積惡者拘魂此獄報對滿足異類托生自非混元玄㝠玉札莫能超脫此玉札所以不可無也又當知所謂獄者皆隨死者所積之惡以有其獄爲之報對也非直截如陽世官府有一定之囹圄也醮壇請光分燈說齋法中每以然燈爲首所以法天象地故每遇建齋必於宿建之夕請光分燈以法日月星斗之懸象令壇所内外洞明上下交映庶乎可以擬大浮黎土之流精玉光洞煥太空七寳林中之無極光明照無極世界凡所謂上聖髙尊妙行眞人天眞大神無極聖衆皆傾光迴駕矣然燈造化豈小補哉請光破幽說然燈破暗之法蓋爲死魂一墮重隂漫漫長夜非有陽光照燭超出良難故必法天象地然燈告符夫謂法天象地者上法日月星辰之懸象下布八卦九宫之方隅以交接陽光開明幽暗使亡魂乗光得度也非直藉此燈熖熖熒煌爲觀美也存念精專此作則彼應也謂之破獄者全在法師運自己之陽光以混合燈光上接九天之陽光以遍照三界九幽使亘天徹地皆有光明凡墮幽㝠皆得乗光而超出一時神通變化凡所謂獄皆無有矣九幽地獄論九幽獄者上屬北斗所治即天一北獄也雖分布九方各有其名然後隨死魂生平惡念以見其獄非直如陽世官府之有一定之囹圄也所謂破獄者亦非誠實斧其門戸碎其杻械以出罪魂無非假太上敕命符籙簡文之玄化以開宥之也凡欲報親亦須行普度之道親親仁民愛物之道兼行可也則隂功自鍾於正薦之魂矣若止爲正薦而設吾恐上帝不私於一二死魂也其法必請命三天㝠心東極假天尊慧光照燭所作符籙簡文以寄吾之運神㑹道處所謂誠於彼則感於此也專度血湖論血湖地獄者由幽㝠之宰物者隨死者之𡨚結而化見也人莫不由父生母養以成幻質惟婦人自妊娠以至㝃乳苦厄良多有懷胎而死有旣産而亡或母死而子存或母存而子死或子母俱殞於臨蓐之頃亦有俱喪於旣産之餘是皆其前生仇讎托胎報復至有以藥毒自墮其所孕亦有以多子而不育其所生彼安身立命之念旣孤則負屈㗸𡨚之心莫釋死則魂系血湖以受報對動經億劫無有出期非建大齋莫能超度故靈寳大法中有玉光一品專一拔度血湖拜表上章行符告簡次第有科旣以天將攝其魂復以天醫療其疾神水滌其腥穢法食消其飢渴然後釋其執著之想開其超度之方妙用神功盡在行持之士也儒家每謂人死則游魂爲變體魄不能生將與草木同一腐壞尚奚腥穢飢渴之爲害哉又曰縱令㝠府誠有牢獄枷鎖一如陽世官府亦將何所設施殊不知其身雖死覺性尚昏故口體之念不能遽忘又況抱屈㗸𡨚者每思報復其不平之氣不能自散必質之於司幽㝠造化者以求直焉其仇家生前果有其惡自亦不能釋然于懷其魂氣隨其念而有其獄焉故不可謂之無也揚旛招魂行天醫論招魂一事自古有之人之初死升屋而號者是也人之生也能常常存其心養其性不爲事物侵亂死則魄歸于地魂歸于天矣奚幽㝠之能沉淪哉惟其生死良心善性汩於情慾執而不化死則不能反其委順於天地不免魂氣飄蕩從迷入迷故先之以神虎追攝次之以神旛攝召又有存日形體毀傷惡疾困苦者不悟形體雖有傷殘元神本無欠缺先則有身以有患今則身滅而疾復何存妄念不除尚若形之有𧇊病之在體故又須内運玄化以聚其陽精消其隂累然後使就冶鍊受化更生即經所謂皆成自然人自然有别體也非直如以土木偶人而逐一成其幻體也爲亡魂沐浴更衣加持法食論衣食之計皆由有身飢寒迫身則衣食是念身旣不能有生衣食又將焉用教之有此者蓋恐死者存日業想障其良知不能自悟猶忉忉然衣食是求故首之以黄華神水滌其舊染之汚次則以㝠衣法食消其飢渴之害然後使之聞經聽法受鍊更生凡所謂沐浴更衣加持法食乃爲死者妄念設也度三塗五苦後先辯超度法中度三塗五苦一節即經中請滅三惡飛度五户之㫖諸家多用之傳符受戒之後無乃未善蓋鍊度旣畢亡魂巳得仙化成人繼以傳符受戒使之盡空諸有而一眞澄湛超入無爲胡乃却於傳符授戒之後纔度三塗五苦此理之未順處惟當於錬度之先爲其滅三惡以永離三塗絶五累以永除五苦然後使之受鍊更生爲是切詳祖師立設教之初必本於度人本章永度三塗五苦八難之句在死魂受鍊仙化成人之後故也然經㫖蓋謂死魂受鍊生身受度之後自然永永超脫三塗五苦八難矣非謂死魂受鍊生身受度之後却方使之度脫三塗五苦八難也水火鍊度說靈寳濟度一法水火鍊度其至要也人生清明在躬氣完理具此心眞體妙用與造化者游生則爲聖爲賢死則魄降于地魂升于天由其良心善性不爲事物侵亂故一氣之聚散皆順乎自然之理其有至人髙士鋉眞陽合沖氣存無守有體玄入虚道備功成則髙超物表奚有於幽㝠之沉淪惟昧者感於情役於氣梏於有已肆慾𢦤眞執而不化則其死也業識不免沉滯幽㝠此鍊度之法所以施也鍊度者以我身中之隂陽造化混合天地隂陽之造化爲淪於幽㝠者復其一初之隂陽造化也夫謂我身之隂陽造化者神與氣也神爲氣之母神動則氣隨也所設有形之水火者假天之象地之形日精月華之眞炁又假諸符篆以神其變化使死魂復得眞精合凝之妙而仙化成人也然後以我之知覺彼之知以我之覺覺彼之覺則死魂自然一眞澄湛與道合眞天上人間無徃不可鍊之而後度之故緫謂之鍊度也設醮辯大齋之格其品有三一曰上元金籙可以清寧兩儀叅賛天地祈天永命致國休徵衍百世之本支培萬年之社稷皆天子事非有朝㫖不可爲也二曰中元玉籙諸王公侯爲之可以固本寧邦藩屏王室大臣將相爲之可以歛福錫民安鎭寰宇或資以調和鼎鼐或藉以爕理隂陽非庶人所可爲也三曰下元黄籙星宿錯度日月失昏雨暘愆期寒燠失序兵戈不息疫癘盛行饑饉荐臻死亡無告孤魂流落新鬼煩𡨚若能依式修崇即可消弭災變生靈蒙福幽壤沾恩自天子至於庶人皆可建也其有孝子順孫義夫節婦報親追逺錫類推恩倘竭一誠如谷答響故申之以三日正齋九時朝奏天威咫尺是宜簡在帝然猶終之以設醮之儀者所以將恭敬之實也且以答上下神祇之陟降也亦以謝旣徃之咎也蓋自建齋以來雖曰對越之誠拳拳靡替然主事者或心爲形役執事者或情隨事遷旣不能知始而愼終且更多因陋以就簡蘋蘩不足昭明信綿蕝不足盡朝儀是不容無此醮以致悔罪之私也又其爲齋也始於預告終於九朝執職諸神効勞曰乆得以善終迺事未必非神之功是又不容無此醮以𥙷報也乃若分位之爲數或三千六百或二千四百或一千二百以三百六十二百四十一百二十則金籙玉籙黃籙之品格自有等差自天子以至於庶人又各禮有異數也靈寳玉鑑卷之一
