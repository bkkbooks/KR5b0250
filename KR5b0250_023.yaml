front:
  text: 靈寳玉鑑卷之二十五萬九
  hash: sha256:1af114de844e983eaaa5c24a3f014dcbb02e9bad4b71ec2d98c10b47627288e5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_023-001a, image: hfl/0307/0307-106.png}
body:
  text: 告給符籙門太陽錬形寳誥念日君呪卯文東炁呪曰太微丹書名曰開明致日上魂來化身形平旦嚴裝發自圓庭飛華小母日根陽精紫映流光號曰五靈急急如上帝勑告文太陽錬形寳誥告下日宫帝君日宫朱景童子散輝仙吏日宫司命神仙諸靈官奉爲某神魂錬度形神金液玉英神炁芳馨羽衣飛歩上升帝庭一如告命年歳次月日時告下簡袋式太隂錬形寳誥念月君呪酉文西炁呪曰紫微黄書名曰太玄致月華水養魄和魂方中嚴淨發自玄門藏天隱月五靈夫人飛光九道映明泥丸急急如上帝勑告文太隂錬形寳誥告下月中夫人月中黄華石景水母太光童子散花玉女月宫司命神仙諸靈官奉爲某神魂錬度形神金液玉英神炁芳馨羽衣飛歩上升帝庭一如告命年歳次月日時告下簡袋式上清靈寶金籙兊文中炁告文元始玄慈廣度迷津開釋罪縁救抜衆生永滅辛酸地獄虚閑勑勒酆都左右隂司考官典吏咸禀玉文超度亡過某神魂錬形易質盡獲更生度命金籙證果大乗一如告命年歳次月日時告下方函式上清靈寳玉籙亥文酉炁告文元始威神妙力眞舉等觀大無廣布慈兩地獄停𡨚㝷聲救苦回隂返陽眞道爲主玉籙靈文開通五户永罷酆都咸乗超度亡過某神魂上登紫府自在怡神祕眞子午復命歸根萬靈共會保天無傾一如告命年歳次月日時告下方函式上清靈寳黄籙中文黄炁告文元始黄籙告下南昌上開八門普受開度諸天諸地隂獄㝠官五嶽𡨚牢羅酆寒庭咸臻黄籙勾落死名亡過某魂神澄正萬炁長存不經苦惱身有光明永契眞道逍遥上清一如告命年歳次月日時告下方函式右三籙簡文分於三朝告行用栢木簡以綵裝三色金書碧袋如常式生天寳籙法曰凡書寳籙面東焚香存玉晨上帝如法陳意次誦寳號研朱左右八十一轉次取青玄炁灌砂中至書籙時先誦靈寳經一過然後長跪啓白具位臣姓某謹誠惶誠恐稽首頓首再拜奏啓三清三境大道慈尊中天上帝臣今奏爲入意投叩向臣乞行開度臣今依式書篆寳籙乞賜天恩下濟眞炁流通啓藴開函降下寳籙付臣書篆依式頒行庶使幽獄停酸死魂受度臣下情不勝激切懇禱之至謹言次九拜存天門開天門乃金門三重其中金光煥然内有金闕寳殿見玉宸上帝端坐其中左右侍眞羅列御座奏前事理上帝慈顔懽恱勑命金童玉女捧寳匣在百寳光中下降几案前與所造之籙合而爲一光明徘徊於上無極無盡次面南九拜黙奏南斗存見六星每星大如日輪初出之狀一合降下與籙中六星合而爲一每一星各有一字在内分明盡皆透底光明如一次上香叩齒十二通呪曰中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神廻骸起死无量度人急急如上帝律令呪畢面天門長跪存官童將吏圍繞左右左手都監訣右手執筆念勑赦宻呪五十遍呪曰無上玄元太上道君教臣行符照破幽獄罪魂出離急急如律令次取天門青黄白三炁入筆依式書篆運處明同宰御稟質離宫日曜火帝隂陽位尊陶魂鑄魄天府天相南極威勝萬方君度君度天梁天同天樞天機曲赦九君度君度君度君度幽魂上四字玉宸祕諱沓書六星下隨書隨念呪曰元始符命時刻昇遷亡魂受度立便生天急急如元始上帝律令十二遍取天門炁出筆發訣再運呪曰太上道君勑付崐崘神符一下拔度死魂急急如律令天地吾奉太一救覆載苦天尊勑行九挿筆右天門金光炁搯玉清訣布籙上六星唯第三魁星虚運筆不可實塗蓋火空則明勑符呪南斗六眞出幽入㝠吾奉帝勑速監生靈南昌上籍即得返魂急急如上帝勑如前存用南斗炁訣透徹光明再用勑呪緫勑之又上帝訣三天炁蓋下四字小寳籙式太上勑赦生天寶籙亡魂受度錬化更生人倫不墜福報轉増度人不死之神度南極長生之君度度世司馬大神度好生韓君丈人度右奉寳籙告下十方三界㝠官主者拔度三界十類六道四生九州五姓男女幽魂上生天堂一如告命年歳次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應眞君在天泰玄知省天君在天天樞右相在天天樞左相在天天樞上相在天天機内相在天天機上相在天玉清神公無極上相在天大寶籙式無上隱諱生天寳籙度人不死之神度南極長生之君度度世司馬大神度好生韓君丈人度南上司命司録君度延壽益筭度厄尊神度迴骸起死君度无量度人君度右準勑普告三界無極神郷泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衞形魂制魔保舉度品南宫死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清合給付亡過某魂執詣黄籙院生天案照會超升一如元始符命年歳次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應眞君在天泰玄知省天君在天天樞右相在天天樞左相在天天樞上相在天天機内相在天天機上相在天玉清神公無極上相在天靈寳解𡨚釋結昇度眞符書符呪解𡨚訣大指搯三根以三指倒入乎心中三天炁符上三天上帝三天大法主太上解𡨚眞人慈風蕩翳萬業消鎔宿𡨚枉咎應念冰清急急如太上律令念解𡨚釋結天尊祝符呪大上眞符濟拔幽沉解消罪累𡨚債和平出離地獄上升朱陵錬魂易質黄籙書名過度三界逍遥上清提魂呪汝等諸罪魂宿業深厚故常懷忿怒心念念無休息我今稽首无上尊願汝𡨚仇俱解釋焚符時想太一救苦天尊即解𡨚釋結天尊也頂上放三色光明洞照道場内外照徹十方一切𡨚魂並皆和釋各生懽恱瞻仰慈尊上朝天境解𡨚符式靈寳解𡨚結升度眞符符右符給付某魂神符告下解𡨚釋結永脫仇讎執對分别釁縁俱盡不生惡業出離寒庭罪根消滅一如告命年歳次月日時告下具法位臣姓某承誥奉行東極宫中太一救苦天尊青玄上帝東華修錬玄㫖朱陵符用師平坐定息研澄百慮存自己頭上泥丸中乃太淵天谷宫光照内外中有太乙天尊御金玉寶座青服朱履雲冠玉圭項負圓光金蓮捧足須㬰天尊放百寳慧光洞明八極又以自己一性上朝天尊心禮聖號忽見宫中紫炁如絲降下丹田凝結光明如彈子大紫金色常以一性居頂中天谷之宫勿令散亂於眞想處倐然忌形靜定廓然上下澄徹行住坐卧皆可修持此乃修錬形神得一之道也其紫炁八丹田自然生眞火毫光元炁純陽之所致也所謂太一在頭萬神朝焉神明森衞有太威力降伏邪妖衆惡不敢當矣精神炁旺疾病永消所爲所作叩之立應蓋以炁錬神以神錬形形神俱妙體入自然聚萬法而歸一眞散一眞而化萬景不滯有無永絶生滅是爲眞人矣得法之士當焚香東望拜跪存眞首露前世今生故誤罪業解釋九玄七祖師資同學隂陽過愆普及六道四生飛走沉潜咸蒙度化伏望天尊垂憫應念感通庶令臣心安炁旺神室光明克就玄勲永無魔試同昇長樂境界與道合眞然後書符勑筆呪元始玉命敷法布靈道法施惠受符超生如有愆罪悉以除蠲汝見玉言萬神咸聽勑朱呪玉音攝炁靈風聚煙紫虚鬱秀輔翼萬仙千和萬合自然成眞急急如靈寳度人律令祝呪接以法門導以法路沃以神泉灑以甘露心潔形完聲尚神具未聞天尊法音者今皆得使得聞未蒙天尊睿澤者令皆使得遇得爲人天隨符超度急急如律令右符玉清訣天門炁吹筆上次搯巽文念太一救苦天尊八十一聲取青玄炁吹筆再念奉太一救苦天尊勑行八十一聲取青玄炁入筆再念八十一聲再取炁入筆隨炁書符朱陵符誥文太上救生救死救苦超度朱陵眞符右符給付某魂天尊救苦仙道貴生上開八門飛天法輪普受開度死魂生身上詣丹霞丹天炎光世界朱明國土重陽宫中朝謁天君超度朱陵流火神庭火錬池中火膏冶錬蕩除塵垢受化更生紅蓮花上得爲初學天人一如告命年歳次月日時告下具法位臣姓某承誥奉行東極宫中大慈仁者㝷聲赴感太一救苦天尊朱陵府散形黄籙中用天地混洞炁分隂陽中黄承承合其明神貫精集萬神四大主張上接元和四明運換全其眞火錬眞齊其靈左日右月黄旛召登鍾甲丁熒煌庭天上三竒地下三竒人有三竒日月星乙丙丁神氣精台光爽靈幽精祝曰上帝訣南炁存升度法玉眸太靈分天地精一炁混合隂陽佐成司命合德四齊生靈火鈴錬度左右靈眞急如律令九炁生神靈寳玉鑑卷之二十五
