front:
  text: 靈寶玉鑑卷之二十五萬九
  hash: sha256:b94d7641ba83a1e1aa56cf686237aff7f2816bb01a344a9e33b56a5139df7f1c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_023-001a, image: hfl/0307/0307-106.png}
body:
  text: 告給符籙門太陽錬形寶誥念日君呪卯文東氣呪曰太微丹書名曰開明致日上魂來化身形平旦嚴裝發自圓庭飛華小母日根陽精紫映流光號曰五靈急急如上帝勑告文太陽錬形寶誥告下日宫帝君日宫朱景童子散輝仙吏日宫司命神仙諸靈官奉為某神魂錬度形神金液玉英神氣芳馨羽衣飛步上升帝庭一如告命年歲次月日時告下簡袋式太隂錬形寶誥念月君呪酉文西氣呪曰紫微黃書名曰太玄致月華水養魄和魂方中嚴淨發自玄門藏天隱月五靈夫人飛光九道映明泥丸急急如上帝勑告文太隂錬形寶誥告下月中夫人月中黃華石景水母太光童子散花玉女月宫司命神仙諸靈官奉為某神魂錬度形神金液玉英神氣芳馨羽衣飛步上升帝庭一如告命年歲次月日時告下簡袋式上清靈寶金籙兊文中氣告文元始玄慈廣度迷津開釋罪緣救拔衆生永滅辛酸地獄虛間勑勒酆都左右隂司考官典吏咸稟玉文超度亡過某神魂錬形易質盡獲更生度命金籙證果大乘一如告命年歲次月日時告下方函式上清靈寶玉籙亥文酉氣告文元始威神妙力真舉等觀大無廣布慈兩地獄停𡨚尋聲救苦回隂返陽真道為主玉籙靈文開通五户永罷酆都咸乘超度亡過某神魂上登紫府自在怡神祕真子午復命歸根萬靈共會保天無傾一如告命年歲次月日時告下方函式上清靈寶黃籙中文黃氣告文元始黃籙告下南昌上開八門普受開度諸天諸地隂獄冥官五嶽𡨚牢羅酆寒庭咸臻黃籙勾落死名亡過某魂神澄正萬氣長存不經苦惱身有光明永契真道逍遙上清一如告命年歲次月日時告下方函式右三籙簡文分於三朝告行用柏木簡以綵裝三色金書碧袋如常式生天寶籙法曰凡書寶籙面東焚香存玉晨上帝如法陳意次誦寶號研朱左右八十一轉次取青玄氣灌砂中至書籙時先誦靈寶經一過然後長跪啓白具位臣姓某謹誠惶誠恐稽首頓首再拜奏啓三清三境大道慈尊中天上帝臣今奏為入意投叩向臣乞行開度臣今依式書篆寶籙乞賜天恩下濟真氣流通啓藴開函降下寶籙付臣書篆依式頒行庶使幽獄停酸死魂受度臣下情不勝激切懇禱之至謹言次九拜存天門開天門乃金門三重其中金光煥然內有金闕寶殿見玉宸上帝端坐其中左右侍真羅列御座奏前事理上帝慈顔歡恱勑命金童玉女捧寶匣在百寶光中下降几案前與所造之籙合而為一光明徘徊於上無極無盡次面南九拜默奏南斗存見六星每星大如日輪初出之狀一合降下與籙中六星合而為一每一星各有一字在內分明盡皆透底光明如一次上香叩齒十二通呪曰中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人急急如上帝律令呪畢面天門長跪存官童將吏圍繞左右左手都監訣右手執筆念勑赦密呪五十遍呪曰無上玄元太上道君教臣行符照破幽獄罪魂出離急急如律令次取天門青黃白三氣入筆依式書篆運處明同宰御稟質離宫日曜火帝隂陽位尊陶魂鑄魄天府天相南極威勝萬方君度君度天梁天同天樞天機曲赦九君度君度君度君度幽魂上四字玉宸祕諱沓書六星下隨書隨念呪曰元始符命時刻升遷亡魂受度立便生天急急如元始上帝律令十二遍取天門氣出筆發訣再運呪曰太上道君勑付昆崘神符一下拔度死魂急急如律令天地吾奉太一救覆載苦天尊勑行九插筆右天門金光氣搯玉清訣布籙上六星唯第三魁星虛運筆不可實塗蓋火空則明勑符呪南斗六真出幽入冥吾奉帝勑速監生靈南昌上籍即得返魂急急如上帝勑如前存用南斗氣訣透徹光明再用勑呪總勑之又上帝訣三天氣蓋下四字小寶籙式太上勑赦生天寶籙亡魂受度錬化更生人倫不墜福報轉增度人不死之神度南極長生之君度度世司馬大神度好生韓君丈人度右奉寶籙告下十方三界冥官主者拔度三界十類六道四生九州五姓男女幽魂上生天堂一如告命年歲次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應真君在天泰玄知省天君在天天樞右相在天天樞左相在天天樞上相在天天機內相在天天機上相在天玉清神公無極上相在天大寶籙式無上隱諱生天寶籙度人不死之神度南極長生之君度度世司馬大神度好生韓君丈人度南上司命司録君度延壽益算度厄尊神度回骸起死君度無量度人君度右準勑普告三界無極神鄉泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清合給付亡過某魂執詣黃籙院生天案照會超升一如元始符命年歲次月日時告下具法位臣姓某承誥奉行泰玄省主正一靜應真君在天泰玄知省天君在天天樞右相在天天樞左相在天天樞上相在天天機內相在天天機上相在天玉清神公無極上相在天靈寶解𡨚釋結升度真符書符呪解𡨚訣大指搯三根以三指倒入乎心中三天氣符上三天上帝三天大法主太上解𡨚真人慈風蕩翳萬業消鎔宿𡨚枉咎應念冰清急急如太上律令念解𡨚釋結天尊祝符呪大上真符濟拔幽沉解消罪纍𡨚債和平出離地獄上升朱陵錬魂易質黃籙書名過度三界逍遙上清提魂呪汝等諸罪魂宿業深厚故常懷忿怒心念念無休息我今稽首無上尊願汝𡨚仇俱解釋焚符時想太一救苦天尊即解𡨚釋結天尊也頂上放三色光明洞照道場內外照徹十方一切𡨚魂並皆和釋各生歡恱瞻仰慈尊上朝天境解𡨚符式靈寶解𡨚結升度真符符右符給付某魂神符告下解𡨚釋結永脫仇讎執對分别釁緣俱盡不生惡業出離寒庭罪根消滅一如告命年歲次月日時告下具法位臣姓某承誥奉行東極宫中太一救苦天尊青玄上帝東華修錬玄旨朱陵符用師平坐定息研澄百慮存自己頭上泥丸中乃太淵天谷宫光照內外中有太乙天尊御金玉寶座青服朱履雲冠玉圭項負圓光金蓮捧足須臾天尊放百寶慧光洞明八極又以自己一性上朝天尊心禮聖號忽見宫中紫氣如絲降下丹田凝結光明如彈子大紫金色常以一性居頂中天谷之宫勿令散亂於真想處倐然忌形靜定廓然上下澄徹行住坐卧皆可修持此乃修錬形神得一之道也其紫氣八丹田自然生真火毫光元氣純陽之所致也所謂太一在頭萬神朝焉神明森衛有太威力降伏邪妖衆惡不敢當矣精神氣旺疾病永消所為所作叩之立應蓋以氣錬神以神錬形形神俱妙體入自然聚萬法而歸一真散一真而化萬景不滯有無永絶生滅是為真人矣得法之士當焚香東望拜跪存真首露前世今生故誤罪業解釋九玄七祖師資同學隂陽過愆普及六道四生飛走沉潛咸蒙度化伏望天尊垂憫應念感通庶令臣心安氣旺神室光明克就玄勳永無魔試同升長樂境界與道合真然後書符勑筆呪元始玉命敷法布靈道法施惠受符超生如有愆罪悉以除蠲汝見玉言萬神咸聽勑朱呪玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成真急急如靈寶度人律令祝呪接以法門導以法路沃以神泉灑以甘露心潔形完聲尚神具未聞天尊法音者今皆得使得聞未蒙天尊睿澤者令皆使得遇得為人天隨符超度急急如律令右符玉清訣天門氣吹筆上次搯巽文念太一救苦天尊八十一聲取青玄氣吹筆再念奉太一救苦天尊勑行八十一聲取青玄氣入筆再念八十一聲再取氣入筆隨氣書符朱陵符誥文太上救生救死救苦超度朱陵真符右符給付某魂天尊救苦仙道貴生上開八門飛天法輪普受開度死魂生身上詣丹霞丹天炎光世界朱明國土重陽宫中朝謁天君超度朱陵流火神庭火錬池中火膏冶錬蕩除塵垢受化更生紅蓮花上得為初學天人一如告命年歲次月日時告下具法位臣姓某承誥奉行東極宫中大慈仁者尋聲赴感太一救苦天尊朱陵府散形黃籙中用天地混洞氣分隂陽中黃承承合其明神貫精集萬神四大主張上接元和四明運換全其真火錬真齊其靈左日右月黃幡召登鍾甲丁熒煌庭天上三竒地下三竒人有三竒日月星乙丙丁神氣精台光爽靈幽精祝曰上帝訣南氣存升度法玉眸太靈分天地精一氣混合隂陽佐成司命合德四齊生靈火鈴錬度左右靈真急如律令九氣生神靈寶玉鑑卷之二十五
