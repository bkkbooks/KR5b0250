front:
  text: 靈寶玉鑑卷之三十七蓋三
  hash: sha256:742cfed79669a357f01aad7a50929525275e857bb7cf55600f7b731ec3256c9f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_035-001a, image: hfl/0310/0310-066.png}
body:
  text: 斬尸度户門夫靈寶大法有斬尸度户天神納庫之道故經云請滅三惡斬絶地根飛度五户名列太玄蓋三惡五苦之類皆原於習而此心實諸惡衆業之端始也原夫人之稟生皆從二氣五行中來本自圓明無有染著漸因人心離本就末逐妄迷真苦報惡緣轉回不息滔滔陷溺而忘返耳欲復其初終不可得則必假我以清靜無為自然妙道以覺其未覺之性無壞無雜堅固利劒以斷其未斷之緣俾其泝流尋源歸真悟本所謂空其五藴則五苦自消證妙三元則三惡自滅矣然後以中斗大魁之形而合夫二氣五行之真以天地生成之數而回其本然大洞之靈曰天曰神皆得入夫本來元始光明之藏復歸於無極也故曰納庫復何以致思焉存用兆以一氣周歷三關五臟使內外瑩潔次引氣自下丹田上升泥丸化為元始天尊頂出食光道氣下注亡魂次以一念堅剛之性為利劒斬絶三尸左手搯玉文右手仗劒存三官五帝斬尸度户靈官森列于前令齋主執旙以𥿄錢三堆布三台形每堆焚符一道以劒斬滅三尸次噀水存亡人心生善念三惡永消次以一氣金光引接七魂飛度五戶臨事之際一念不生則諸緣自滅矣先告行勑制地祗符呪曰靈寶祖氣肇化諸天魂離北岱魄度南天九壘九地秉勑三天九皇開光赤字元言無量度人大量玄玄急急如上帝勑告文太上勑制地祇符命符右奉太上符命勑制地祇告下北都羅酆嶽瀆冥關主者一切神司侍衛送迎亡過某出離地戶五苦八難七祖升遷永離鬼官魂度朱陵受錬更生一如告命太歲年月日告下具法位臣姓某奉行封式太上勑制地祇符命告下北都三塗五苦冥官主者具法位臣姓某謹封次於三堆紙錢上逐堆焚符髙功仗劒運神斬滅三尸引魂度三塗界次第舉斷絶天塗界符辰文東氣呪曰三氣陽光定慧靈樞窮魂冠帶德契玄無混生變化善寂凝虛法輪運轉永免天塗急急如律令又呪上尸青欲字號彭踞變化九種鳥頭蛇軀混沌無心或沉或浮貪欲滋味華色自居走作人魂魄司過咎斷人命根氣散人遊放蕩三宫小蟲無拘今日煉度書篆靈符色欲巳斷死路巳除元始符命請斷尸頭三台監形速出無留滅根絶種勿使餘遺亡者煉真三宫清虛五帝監映太一定書吉日沐浴冠帶行疇飛度天界流景玉輿逐景上清乘空遨遊右呪於斬尸之時宣呪祝之告文玉清靈寶開光玉符符右符告下落滅色根惡道靈官奉為亡過某斷絶天塗界上尸道色欲門免天官奔雷逐電之役一如告命太歲年月日告下具位職臣姓某承誥奉行斷絶地塗界符寅文東氣呪曰三陽兆交九地肇圖光顯開度梵氣彌羅六字澄瀾脫彼地塗急急如律令又呪中尸彭躓號曰中黃愛欲自居倚伏逃藏沉浮變化形無常方執人魂魄走作三宫赤子馳騁使人發狂欲性喪人罪由小蟲今日煉度上帝巳微身佩金符玉文金章列名玄圖三欲巳忘元始符命斬滅尸形斷根絶種勿使飛揚亡魂受煉五府清涼真仙安鎮藏內生光五帝監映太一列行中元沐浴冠帶衣裳解形變景流景玉光飛升上清食息太空長保自然天地無窮告文玉清靈寶開苦玉符符右符告下落滅愛根惡道靈官奉為亡過某斷絶地塗界中尸道愛欲門免地官擔石負山之役一如告命太歲年月日告下具法位臣姓某承誥奉行斷絶水塗界符卯文東氣呪曰祕景長生內氣合和通真解滯善破四魔幽關朗徹凝默玄阿水塗開泰永出愛河急急如律令又呪下尸彭蹻貪欲自榮白色混沌體無常形依人兩足恱動人情言我得失走作魂靈三宫擾亂赤子不寧貪欲小蟲假備幽冥今日受度三煉巳清欲門閉塞不受邪精元始急令三台臨庭速出無隱及汝弟兄九種子孫一時斬形五帝度真太乙記名下元沐浴冠帶羽青玄度三界上領元精解形逐變流景上清飛玄步虛三界齊明告文玉清靈寶開明玉符符右符告下落滅貪根惡道靈官奉為亡過某斷絶水塗界下尸道貪欲門免水官漣汲溟波之役一如告命太歲年月日告下具法位臣姓某承誥奉行飛度色纍户符卯文東氣呪曰妙哉元始傾光紫微曲映九幽性悟神飛慈悲法兩沛然普施急急如律令又呪解形逐變落尸五門三欲巳清脫故煉新神津內灌體香氣蘭玉符滅迹地無拘戀飛度天界超凌雲端魔王保真氣合自然七祖同升飛步天門五帝監映萬神咸聞告文玉清靈寶開景玉符符右符告下飛度色纍户靈官奉為亡過某斷除色纍苦心門免泰山地獄苦道一如告命太歲年月日告下具法位臣姓某承誥奉行飛度愛纍户符卯文東氣呪曰陽氣上升二氣即交出死入生合慶幽寥煉化成真二帝秀飄道契靈章生神自超急急如律令又呪雲行飛步逐變玉光解形脫迹散髮翺翔人界無拘乘虛空行天魔巳除五道開通超度風刀形升上官告文玉清靈寶開化玉符符右符告下飛度愛纍户靈官奉為亡過某斷絶愛纍苦神門免風刀地獄苦道一如告命風火驛傳太歲年月日告下具法位臣姓某承誥奉行飛度貪纍户符卯文東氣呪曰阿那瞿曇光明混淪玄景耀衢制會酆山龍漢梵氣玄上虛間勿涉苦津玄滅凶殘急急如律令又呪解形神變割截貪癡超出銅柱越過愛津幽魂受度苦爽咸遷七祖解脫九玄生天愛纍永脫神飛上仙告文玉清靈寶開生玉符符右符告下飛度貪纍戶靈官奉為亡過某斷除貪纍苦形門免擔砂負石地獄苦道一如告命風火驛傳太歲年月日告下具法位臣姓某承誥奉行飛度華競户符卯文東氣呪曰破暗燭幽雲輝九丘斷除華競駕景飛雲急急如律令又呪落尸解罪神超鑊湯剪除華競滅落形聲神津內灌魔王保迎洞達無礙與道同情逍遙自然升宴紫庭告文玉清靈寶開靈玉符符右符告下飛度華競户靈官奉為亡過某斷除華競苦精門免填河灌漬地獄苦道一如告命風火驛傳太歲年月日告下具法位臣姓某承誥奉行飛度身纍户符卯文東氣呪曰八芒敷榮刀山摧殂身纍斷滅永度幽苦急急如律令又呪玉符解罪神脫冥波蕩除業障割切戀根幽司罷對寒鄉停刑出離北府神得受生快樂無為逍遙太空告文玉清靈寶開真玉符符右符告下飛度身纍户靈官奉為亡過某斷除身纍苦魂門免吞火食炭鑊湯地獄苦道一如告命風火驛傳太歲年月日告下具法位臣姓某承誥奉行總勑八符呪玉清寶符元始妙章隱玄幽篆妙逹群陽變隂作晝廓醫停殃消除罪纍飛度南宫以上八符黃素朱書後用檄文於煉度之前如法奉行斬滅三尸斷絶五纍然後入壇受煉凡修真之士能以庚申甲子之日書而服之可以斷絶三尸落滅惡根也解𡨚符玉訣祖氣告文靈寶解𡨚釋結升度真符符神符告下解𡨚釋結永脫仇讎執對分别釁緣俱盡不生惡業出離寒庭罪根消滅一如告命太歲年月日告下具法位臣姓某承誥奉行天神納庫旙式右旙依式刋版印之於斬尸度户畢布紙錢七堆列北斗形每堆用此旙七道共四十九道自杓至魁以火焚之髙功作用造化道衆同聲宣誦大洞回靈玉章髙功內誦次宣解𡨚符一道入壇煉度靈寶玉鑑卷之三十七
