front:
  text: 靈寶玉鑑卷之十二及四
  hash: sha256:681b25a5b8b734a81aea5c6b4c8472d411ab9ede5f72af5d681648815df710f5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_012-001a, image: hfl/0304/0304-096.png}
body:
  text: 勑水禁壇門法曰道體至虛非虛則不能應物也人性至善非善則不能明道也水性亦然故善則能利於物靈寶大法有勑水禁壇之科引三光之正氣運九鳳之真精䇿役萬神吐納二氣躡罡履斗結界禁壇小則清肅方隅大則淨明天地飾嚴內外之儀則格降上下之神祇是以齋潔為先誠明為本蓋邪則能干正非正氣則不能辟其非穢則能敗真非真氣則無以滌其穢故正真生氣變化流行之妙也今既內外貞白性道兼明萬境俱清一塵不染非集虛凝神之效歟勑壇思存章夫勑壇之法先以水劒安地戶上選有威儀道士具壇簡詣劒水處地户者天地之氣所以𥘉生凡物之類所出入也是以東南為極陽而生隂故東南為地戶西北為極隂而生陽故西北為天門故修行朝真之法皆去隂而就陽者矣先瞑目存經籍度三師在西面次存上仙蔽身大將軍姓唐名宏字文明戴朱陽赤幘通天大冠絳章丹衣帶龍頭玉劒左手持金符次存上仙隱影大將軍姓葛名雍字文度戴朱陽青幘通天之冠絳紈丹衣手持玉載次存上神藏形大將軍姓周名武字文剛戴朱陽赤幘通天之冠絳章丹衣手執玉陽之節次存有真官絳衣乘九鳳次步破穢斗存北斗七星覆巳頭上斗柄指前不得遮耳目次方稱法位關白齋意畢三禮收壇簡垂手握固召四靈四靈者青龍白虎朱雀玄武四靈神也左手搯十二訣存肝心二氣化形出立於前左次右手搯酉子二訣肺腎二氣化形出立於後右次兩手捧心足履丁字立誦召三官呪次步三官丁罡三步向劒水所然後搯五方訣召五龍畢執劒水相向持呪次臨壇灑淨畢即於人門步禹步罡至鬼户煞劔退次三拜却搯中指中存諸神復化真氣再還兆身中勑水禁壇文見科範門九鳳破穢罡淨穢符破穢訣罡氣呪曰天玄地黃六律九章焚蕩厭穢辟邪不祥急急如律令依式勑水淨壇宣解穢牒總召四靈符用四訣合氣出四靈于左右前後呪曰吾召四靈君四靈畢集臨辟除諸厭穢並引降真靈萬神俱侍衛八卦護吾身承今符命召火急赴壇庭急急如律令讀借地牒即建壇牒開壇符玉文祖氣呪曰大明洞煥三氣開光彌羅𣑽氣金闕玉房體仁合化合景中黃入極所致即道真常急急如律令勑壇四靈符東方卯文千氣謹召東方青龍角亢之精吐霧鬱氣雷發聲飛騰八極周遊四溟有大威德來侍于左西方酉文肺氣謹召西方白虎上應觜參英英素質肅肅清音威攝衆獸嘯動山林有大威德來侍于右南方午文心氣謹召南方朱雀衆禽之長丹穴化生碧霄流響其彩五色神儀六象有大威德來導于前北方子文腎氣謹召北方玄武太隂化生虛危應質龜蛇合形蟠遊九地威攝衆靈有大威德來從于後召三元唐葛周三將軍符上元唐宏卯文用左腎氣中元葛雍酉文用右腎氣下元周武中文用元黃氣總勑呪混合三氣上中下元神超無象道運先天應體常寂變化自然聞召立至默契壇乾急急如三天元降律令召監壇符呪曰三天有命四聖咸欽威鎮壇陛內外輯寧仗衛森列神祗效靈王符一召與道合并急急如律令洞逹神靈符斗訣用元皇氣呪曰神景合成萬氣齊并洞逹無礙變化窅冥飛行十天逍遙紫清倐忽隱景真陽混凝急急如元始上帝律令六府鎮壇符師曰六府真符可召役諸天從官兵馬凡行科誦呪存金光道氣洞煥太空天帝髙真乘空而降或以版篆鎮挂齋壇或用黃素朱書於禁壇之時隨方焚召始陽元精九靈妙景真符卯文震氣召東方諸天從官兵吏丹靈炎上洞靈大梵真符午文離氣名南方諸天從官兵吏皓靈靜陽七氣素靈真符酉文兊氣召西方諸天從官兵吏玄光靜景妙寶虛梵真符子文坎氣召北方諸天從官兵吏虛皇洞真梵氣寶光真符王文中氣召五方天帝從官兵吏髙晨太一妙極無上真符天皇訣震氣召十方天帝從官兵吏總祝呪太虛溟涬寥廓無光大梵流布六氣生陽飛雲結篆赤書垂芒諸天應感萬象咸彰急急如元始上帝勑天皇君召十方飛天神王符王文祖氣召六甲符呪曰玉清大將六甲宣行真符速召往赴壇埸召六丁符呪曰九天召命六丁奉行玉女神化速降神光三天減魔祕章北帝大魔王受事帝君前泉曲之鬼四明酆山千妖混形九首同身神虎放毒馘滅雷震神公吐呪所戮無親太微有命攝録山川鳴鈴交擲流煥九天風火征伐神鋒十陳凶穢伏滅萬精梟殘妖毒敢起受閉亡關請依洞法莫不如言大洞滅魔神惠玉清隱書玄景散天湄清漢薄雲回妙氣煥三晨丹霞耀紫微諸天舒靈彩流霄何霏霏神燈朗長夜離羅吐明輝回嶺帶髙雲懸精蔭八垂三素啓髙虛蘭蘭披重扉金墉映玉清靈秀表天畿風生八會宫猛獸騁雲馳紛紛三洞府真人互參差上有千景精冥德髙巍巍太一務猷收執命握神麾正一履昌靈攝召萬神歸公子翼寂轅洞陽衛玄機明初合道康龍輿正徘徊七景協神王飈輪萬杪階矯首玄津上飛步絶嶺梯紋錦入神丘燦爛振羽衣冥攄交雲會飛景承靈通清峰無毫薈綺合生絶空金華帶靈軒翼翼髙仙翁萬轡乘虛散蓊藹玄上窗中生合景君九帝昌上皇明輪映黃寧羽珠曜玄陽天晶元素氣中五號養光結朗始生章九真合成雙妙景啓冥敷順感摽神宗泥丸洞元先運珠正絳官元陽部命門三神携紫童拘制召上歸夾闕侍明窗翳鬱對啓明圓華煥三沖方盈引接生返老回嬰蒙飈粲麗九天緑轅繞丹房蕭蕭纒藹表曲降寢華堂遊宴盻萬劫歸會神霄王仙道樂子生鬼道樂子凶但聞貴生道不聞鬼道隆遙歌參天氣賈生元正章神惠命朱兵五帝符寒鄉仗旙攝萬魔瓊文檢北酆體解自然道妖滅非爾功泛景鼓長扇合虛慶霄峰俯盻回謝飛天劫永難終妙中生真景回輦若遲遲意合在冥感提携髙上崎翔翅期妙會洞觀情轉悲嘯吒咄嗟頃倐忽歷九圍攝氣反交初併景幽玄棲於是七星停矅重關洞開石陽激電五星奔移握節命靈是氣悉追鐵羆羅遮猛虎變威六師斬妖銅頭捕非玃天啖毒晶消摧萬精滅種六天崩頺三道正行何氣不回山河為之傾倒日月為之掩暉靈獸為之墮領金翅為之落飛五帝束帶於神宇萬靈受封於太微髙上泛蓋於丹崖八景策駕於霄扉洞觀元之妙化欣我道以坦懷右二章於禁壇之時宣白此呪繞壇三匝畢次結界行事各方結界用五方制邪玉文見建壇安鎮門靈寶王鑑卷之十二
