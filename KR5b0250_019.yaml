front:
  text: 靈寶玉鑑卷之二十一萬五
  hash: sha256:b0bc12de06339e1ba76ec0f5fbb5fd611a1e2168063177abc876cf34feb36c16
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0250_HFL_019-001a, image: hfl/0306/0306-106.png}
body:
  text: 飛神謁帝門罡法甲日罡步自子位起青龍即本日活天門方甲日起罡圖甲日合呼天門地户神玉女姓名天門神天可地户神公孫齊丁玉女順氣庚玉女拜精神將𡊮威令功曹杜文華童子楊精香官桂清史右八位前四位於步罡呪內呼之其餘並寫於關牒內己日罡步自戌上起青龍即本日活天門方己日起罡圖己日合呼天門地户神玉女姓名天門神徐義地户神徐可丁玉女足日之庚玉女絳宫神將蕭子元功曹孑惠機童子隂精香官從長卿右八位前四位於步罡呪內呼之其餘並寫於關牒內乙庚日罡步自申位起青龍即日活天門方乙庚日起罡啚乙庚日合呼天門地户神玉女姓名天門神司馬光地户神石戰丁玉女曹漂之庚玉女青腰乙日將季仲文功曹唐元化童子震精香官留伯牙庚日將俟道靜功曹鄧康寧童子金精香官辛飛鳴右前四位步罡召之後將入關牒丙辛日罡步自午起青龍即本日活天門方丙辛日起罡圖丙辛日合呼天門地户神玉女姓名天門神石衆地户神于可丁玉女得善庚玉女太玄丙日將蘇恭明功曹炎在精童子赤精香官虛日應辛日將金湯侯功曹安伯虎童子光精香官雷景右前四位丙辛二日同後將各直本日丁壬日罡步自辰位起青龍即本日天門方丁壬日起罡圖丁壬日天門地户神玉女姓名天門神公孫錯地户神馬勝丁玉女寄房庚玉女黃素丁日將潜嶽靈功曹丘庭西童子流精香官魯子愚壬日將季永福功曹劉斗峯童子水精香官揆子華右前四位將丁壬二日同後將各直本日戊癸日罡步自寅位起青龍即本日活天門方戊癸日起罡圖戊癸日合呼天門地户神玉女姓名天門神公孫光地户神司馬强丁玉女問心之庚玉女太素戊日將全混成功曹閭多性童子土精香官風束化癸日將洮朱文功曹星漢先童子乾精香官深開通右前四位戊癸二日同後將各直本日外壇呪神霄氣訣神霄玉清興衛中朝今日勑下降自九霄命神召神攝掌功曹玉文敷告立應天條吾行真籙適我參調通天呪天輔無私乾象通微無幽無冥無感不知佩帶符圖神兵任呼我位上王位登天都左手紫微印右同秉圭步入壇飛步接本日青龍位自甲上起步呪至丁止三天朝元符呪曰北帝玄黃天地寧日月明登紫府謁天庭披三台躡七星入天蓬召子京向天衝紫氣停呼北斗振火鈴踏璇璣履玉衡覩真人拜皇星受玉籙萬神驚知生死洞杳冥預知吉凶近知人情五行侍從六甲相迎北斗天師與我同行人道興鬼道滅下鬼妖魔北斗然骨聞吾呪勑頭破腦裂急急如律令步至丁上並足立呼玉女名想至召真玉符呪曰玉女玉女天神至矣丁上玉女來護我身無令百鬼中持傷我莫使人見我見我者以為束薪不見我者以為非人獨開我門以閉他人急急如律令左足三蹴於天門呼本日神名通神寶符呪曰天門天門今日為良玉女侍我左右遊傍往來出入不達禍殃天神一見喜恱非常欲求如意萬事吉昌急急如律令次入步右足三蹴於地户呼本日神名開靈玉符呪曰諾諾譯譯行不擇日返不擇時隨斗所指與神俱移天地覆載心有所欲皆得如意急急如律令次步至天藏位符焚於地户上遁景玉符吾是天因與道相逐睛如雷電光耀八極徹視表裏無物不伏急急如律令次回步天庭位召庚玉女名變化玉符呪曰玉女玉女天神至矣庚上玉女來護我身母令百鬼中持傷我莫使人見我見我者以為束薪不見我者以為非人獨我開門而閉他人急急如律令次步入內天門立焚符通天玉符次自斗柄步至魁星七步呪曰元始太真五靈髙尊太帝皓映洞朗八門五老誥命無幽不聞上御九天中制酆山下鎮江海十二泉源八威神呪靈册玉文召龍負水收氣聚雲束魔送鬼掃蕩妖群萬精摧落所誅無蠲日月五星北斗七元合明天帝勑下太玄諸天諸地諸水諸山玉真所部溟泠大神天王遊宴五帝仗幡天丁前驅金虎後奔钁天猛獸羅閉四門所呼立至所召趨前赤書豁落風火無間有所攝言金龍驛傳入聖景玉符呪曰北斗天關正八方攝氣召神除萬殃日月回環星辰光四景明度轉天常七天行道尊帝王輪㑹明達激災殃九靈制命升玉堂次出斗步三台望文昌心禮三拜回身入斗口實禮天皇三拜轉步次存橫列五星煥明如日天一太一天門天樞天機次飛步三台上台一黃保我千齡中台六淳衛我魂神下台曲生上謁三清次飛步九靈每步念靈遊光靈天路靈玉堂靈虛梵靈元皇靈紫光靈榮神靈天幽靈神全靈髙功三拜就伏焚章符火鈴訣天罡氣念合明天帝日呪開天符玉文祖氣書符呪三清降勑日月合明太上治命統制萬靈天洞天真速降威靈上通天闕開道玄穹三部使者玉女靈童隂陽決吏持火當凶衝除浩氣大破罡風又呪靈寶玉符金房秀英剛風洞煥通真達靈萬神侍送五帝伺迎朝謁三境與道合并勑呪玉皇有命勑下剛風萬仭摧毀九天潜通承符奉令黃道無窮又呪天門四開黃道正平承符奉令敢有稽停符中將吏速逞威靈罡風浩氣金馬驛程保章上達符上天氣開天訣升真度火符勑呪符使升真速降威靈擲火萬里使我通真升霞散彩五雷備鳴前行大道掃穢除氛髙功遣將噀水行持運神㑹道剔隂陽十於前後左右先從地步九步入章壇中此法九萬里之義也運神㑹道符伏章口訣師屏息令神泰定倐然忘形體合太虛了無所有神性所往即見天真意感誠通自然報應者也髙功拜伏侍職焚諸符并八卦符靈風聚煙符五道並玉清訣上天氣一符二符三符四符五符伏章符祝曰乾元之氣太上之符告天法象攝氣騰虛神風靜默山嶽河圖翊衛真人徑逹玄都急急如律令帝車符本命訣元氣呪曰羊車鹿車急急如老君大牛之車攝唵急車操伏出神符辰文天罡氣呪曰九天命降六丁上祛行符速達保我乘車三天通帝符徑逹帝前通章符玉皇訣天罡氣呪曰鬱鬱大羅飛躡九靈靄然雲邈流景順真烜赫洞陽玉澄淸泠誠香啓奏徑達帝庭上天官屬驛馬吏兵飛章進呈三五將軍罡風速達不得稽停急急如律令存金光明徹三天門名第一欲界紫微星文天乃是仰觀天文霄漢紫微星文之天也門曰陽精之門守門唐將軍名宏第二色界紫微垣玉晨天乃紫霄寶境神禹餘之室紫微之宫也門曰洞華之門守門葛將軍名雍第三無色界金闕寥陽天乃上帝之所居玉晨大道君治化別境也門曰正陽之門守門周將軍名武右三天門與直日神將係本法要法處宜熟詳之八卦大神符八道乾坎艮震巽離坤兊審章符三道一符二符三符呪曰太上帝君仙都大人今日告曰八門開張欲求上法度世長生敢告靈源右符朱書法師服之三道候審覆焚於室中卧斗待報應巳上並用玉清訣先默朝次以大經請降元始寶光布於符上焚於壇中即逹三天妙境矣復爐符中文玉訣呪曰我身面奉玉宸真奉勑回生起死身三魂同下虛無路上帝頒符召北辰左右衛靈還玉户隨吾呼吸逹靈真魔凶敢犯吾旌節東縳遊魂付大神審章呪天地洞開我道奉行神隨氣有應金玉京速召玉女斬絶三彭靜寧血氣使我聰明天心靈官符寶仙卿速降速現知死知生急急如律令審章呪畢如有報應稱以聞告諸符伏章法師定息舌柱上腭存壇下有紫雲車將吏兵馬各從十方而來兆登車而上存天上地下四方空寂無有訣曰紫雲車乃轉地軸令白氣自下丹田上升泥丸須曳見金門而入惟見金光萬道照映兆身內外瑩徹匆見寶珠懸於空中乃心禮默奏所事畢須㬰珠有萬道金玉之光遍照十方世界一時明了見一真人就兆手接章而上人奏太上少頃一玉童傳言密報次以聞兆三禮而退却存自天門而下至壇覺真氣盈溢以意納下丹田默念審章呪而興三禮納官師次復官復爐引道衆下壇出户符上帝訣天門氣早午出户呪出隂入陽萬神開張開啓事畢請閉黃房侍靖玉女明備神宫急急如律令晚出户呪玄上太隂八窗開明向有所啓少女通靈事畢復位萬神潜寧急急如律令出堂向來回向四結願敘謝護章法存玉女童君靈官將吏羅列於天門方上左右呪曰某事拜某章一通請汝等火急為吾齎詣三天門下急急奉行呪曰搯玉清訣唵毗呢吒摩呢尼意薩訶呪畢燔楊紫取天罡氣吹天中散妖穢之氣次搯五雷印閃目為電耳發雷鼻出風存靈官玉女功曹吏兵擎捧章函擁衛上升霄漢口中噀水授章以烈火焚之存童去時愼勿慢易伏地平坐舌柱上腭則自已真人於玉女手中接章入絳宫見太乙司命君乃三一也如蓮實大陳詞竟閉氣自腭登金房玉室入見於洞房謁太清奏畢入太清次入上清次入玉清帝闕一一奏畢即存九宫出三色氣混合一室結化三尊為一自巳真人具法服如常儀出泥丸依九靈經㫖行飛步九靈登三天門云章存歷奏恭俟玄應太清可上清依玉清允玉帝下畢却存自已依舊回入丹宫卧息太一前對三尊到此忘形聼於剋應方興身以聞進章訣凡為國家生靈大事須謁三天門下省內朝畢存五方大靈洞陽五色在五方結為五方光暈三天太一紫雲懸䕃一身其光下入泥丸右九轉心中右九轉混合帝宅上下三次即存心出赤氣上升于天如長虹之狀自已如常法存儀入赤氣運轉上行數百里見日月黃道橫截乃星界次過西北行又千里遙見紫雲隱隱乃三天門先詣青龍宫啓太一元生帝君次南詣鳯凰闕閣下白道德衆尊次西過少昊金樓闕下啓正一天師三師君次回還中宫便徑詣玄冥宫中北極太真門下上白太一大帝君次升金闕崇樓寶殿朝拜上帝至玉陛下章奏付玉案上傳與左右靈妃太玄陽青腰承翼白素玉女朱雀童子即使達御伏俟玄恩到此非存想矣有心合於無為可得自非陽神地仙役御靈妃六甲不得見帝苟內朝太一命神三尊入道化元不在霄漢得之於自巳可以坐致十天矣回存如初內朝上帝占開門法眉間左右入三分曰金臺玉闕左眉曰黃闕神師右眉曰紫户將軍入一寸曰明堂入三寸曰泥丸太一君如帝王狀入二寸曰洞房太清宫次四寸曰太極宫見黃老君入三寸玄丹宫太一丹田宫上一赤子五寸曰太上宫見王晨君次上三寸曰玉清宫見帝一玉帝居之面天門心九拜一一具奏云云默朝畢出堂至洞案前心拜存念遐想在地一意宗朝謁於太清之下先班開外八門得時入靖椎太陽月將在宫以將加正時起剋賊刑衝比害日辰隂陽四位神用為巳造算惡中取見今受報未下乃上天㫖命役於天星用於天將隨其所主集詣威詞盡情參妙言之以得昭報如泄之則三官考罰三掠三原凡欲傳受當盟天立誓剌五心之血齎紫金九兩詣宗師審察其人而傳之不誓不信罪同輕泄其內朝之旨上帝形儀大洞玉房九宫口傳入定審章先焚香收神端坐以子守母神為氣子氣為神母一呼一吸以神御之上下循環出入綿綿晝則開耳閉目夕則開目閉耳凡有心動一念內外以心遏之曰我為某事不為此念念數息時第一心動多靜少思衆緣萬境第二心靜少動多攝心入靜第三動靜相半漸次第四心則靜多動少直至一向神與氣合息與胎交心靜一向純靜方起一念為某事仍先習默朝默朝一純熟乃可默朝是拜章時也服了心章亦默朝審章入定時默朝即見景乃章中取承帝意所謂自巳天尊何勞上皇是也口傳魑𩴝急管送言來𩲃𩵄䰢魓𩳐魒急管送言來𩴑𩲙急管送言來魈急管送言來審章訣入靖存九宫明朗內朝三尊晝則閉曰專耳夜則塞耳瞑目外存章中官吏羅列面前紙筆安几案上心目相望中一上宫相通息靜氣勻忘形離染心有所起目有所見耳有所聞或功曹玉女或功曹天官所言天神告示丹元顯悟靈妃語報可以書之習真人定訣道無為無不為可澄心非智知何為知何為正智遣智證虛應應無從虛乃通通于一萬事畢一為根事無門事歸一一常存存莫有假言守守虛無自長久悟無常道可久淡居內德彌長內韜煞外威德忘形想泯心誠色無塵心自真聲處靜心益定香臭同心合空甘苦一心轉實體如遺心不墮意不亂心不散常凝然正氣全用無垠為忘筌審章例一切圓物不妨也一切不圓物妨也一切生育青物生也一切乾枯陳物死也一切五榖有穗皆未遂也一切殘缺不成皆不遂也一切棺槨丘墓皆凶也多吉喜也一切窗槅碗盞皆口也拳即格也一切樓閣踏道階臺皆增也一切竹篠皆算也折則折也不要皆除也手則守也馬上鏡一切紅赤緋綵皆罪也鈴即齡也水一火二木三金四土五皆生也水六火七木八金九土十乃成也髙木曰髙也箆卑也女人錦衣安也鞍安也右法當觸類以長之或形之於象或物之於氣應之於心覺之於念悟之於意神感告情曲通玄解不離我神矣酒不宜多飲辛不宜食念不宜二意不宜亂可通天機剋應例聞呼呌號哭怒震凶聞金玉簫角絲竹聲吉聞水火打磕崩倒聲不吉聞血腥臭穢大凶聞異香神人告言吉見血光黑氣凶見存不明再三神不現凶象不允如祈雨見水生物聞水聲吉治病見架屋斫木圓物開門得籌青物東風吉如薦亡甘雨黃光天門梯航橋之類右法更祝更審更實萬化千端審問閉說神人皆告人矣玉京寶臺懸一層不可階而升吾今來演教一層上一層性天無滓翳中存戒定慧一㸃最圓明皎月中秋夜靈寶玉鑑卷之二十一
